<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Вход — Hakumo</title>
  <meta name="description" content="Вход в панель модерации Hakumo.">
  <link rel="stylesheet" href="{{ url_for('static', filename='auth-new.css') }}">
</head>
<body class="gate-body">
  <div class="gate-plane" aria-hidden="true">
    <div class="gate-plane__mesh"></div>
    <div class="gate-plane__slash"></div>
    <div class="gate-plane__grain"></div>
  </div>

  <main class="login">
    <div class="login-shell">
      <a class="login-back" href="{{ url_for('welcome') }}">
        <svg viewBox="0 0 16 16" fill="none" aria-hidden="true">
          <path d="M13 8H3M7 4L3 8l4 4" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
        На главную
      </a>

      <h1 class="login-mark">Haku<em>mo</em></h1>
      <p class="login-hint">Вход для модераторов и владельца.</p>

      <form class="login-form" method="post" autocomplete="on">
        {% if error %}<div class="login-flash" role="alert">{{ error }}</div>{% endif %}
        {% if hint %}<div class="login-flash" role="alert">{{ hint }}</div>{% endif %}

        <label>Логин
          <input name="username" autocomplete="username" required autofocus>
        </label>
        <label>Пароль
          <input type="password" name="password" autocomplete="current-password" required>
        </label>
        <button class="login-submit" type="submit">Войти</button>
      </form>

      <p class="login-note">Логин из .env или выданный на странице Доступ</p>
    </div>
  </main>
</body>
</html>
