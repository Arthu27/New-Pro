<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aether — Вход в панель управления</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
        html, body {
            min-height: 100%;
            background: #0a0907;
            color: #f5ecd2;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            position: relative;
            overflow-x: hidden;
        }

        /* Animated aurora background */
        .aurora {
            position: fixed;
            inset: 0;
            z-index: 0;
            overflow: hidden;
            pointer-events: none;
        }
        .aurora::before, .aurora::after {
            content: '';
            position: absolute;
            border-radius: 50%;
            filter: blur(120px);
            opacity: 0.4;
            animation: auroraFloat 18s var(--ease, cubic-bezier(0.4, 0, 0.2, 1)) infinite;
        }
        .aurora::before {
            width: 600px; height: 600px;
            background: radial-gradient(circle, #8b5cf6 0%, transparent 70%);
            top: -150px; left: 10%;
            animation-delay: 0s;
        }
        .aurora::after {
            width: 700px; height: 700px;
            background: radial-gradient(circle, #ec4899 0%, transparent 70%);
            bottom: -200px; right: 5%;
            animation-delay: -6s;
        }
        .aurora-extra {
            position: fixed;
            width: 500px; height: 500px;
            background: radial-gradient(circle, #06b6d4 0%, transparent 70%);
            border-radius: 50%;
            filter: blur(100px);
            opacity: 0.25;
            top: 40%; left: 50%;
            transform: translate(-50%, -50%);
            z-index: 0;
            pointer-events: none;
            animation: auroraFloat 22s ease infinite;
        }
        @keyframes auroraFloat {
            0%, 100% { transform: translate(0, 0) scale(1); }
            33% { transform: translate(80px, -60px) scale(1.15); }
            66% { transform: translate(-60px, 60px) scale(0.9); }
        }

        /* Grid overlay */
        body::before {
            content: '';
            position: fixed;
            inset: 0;
            background-image:
                linear-gradient(rgba(212, 168, 67, 0.04) 1px, transparent 1px),
                linear-gradient(90deg, rgba(212, 168, 67, 0.04) 1px, transparent 1px);
            background-size: 60px 60px;
            pointer-events: none;
            z-index: 1;
            mask-image: radial-gradient(ellipse at center, black 30%, transparent 75%);
            -webkit-mask-image: radial-gradient(ellipse at center, black 30%, transparent 75%);
        }

        /* Floating particles */
        .particles {
            position: fixed;
            inset: 0;
            z-index: 1;
            pointer-events: none;
            overflow: hidden;
        }
        .particle {
            position: absolute;
            width: 3px; height: 3px;
            background: rgba(212, 168, 67, 0.6);
            border-radius: 50%;
            box-shadow: 0 0 6px rgba(212, 168, 67, 0.5);
            animation: particleRise linear infinite;
        }
        @keyframes particleRise {
            0% { transform: translateY(100vh) scale(0); opacity: 0; }
            10% { opacity: 1; }
            90% { opacity: 1; }
            100% { transform: translateY(-100px) scale(1); opacity: 0; }
        }

        .login-wrapper {
            position: relative;
            z-index: 10;
            width: 100%;
            max-width: 460px;
        }

        /* Hero / brand */
        .hero {
            margin-bottom: 24px;
            animation: fadeDown 0.6s cubic-bezier(0.16, 1, 0.3, 1) both;
        }
        @keyframes fadeDown {
            from { opacity: 0; transform: translateY(-16px); }
            to   { opacity: 1; transform: translateY(0); }
        }
        @keyframes fadeUp {
            from { opacity: 0; transform: translateY(16px); }
            to   { opacity: 1; transform: translateY(0); }
        }
        @keyframes scaleIn {
            from { opacity: 0; transform: scale(0.94); }
            to   { opacity: 1; transform: scale(1); }
        }
        .hero-logo {
            width: 68px; height: 68px;
            margin: 0 auto 16px;
            border-radius: 20px;
            background: linear-gradient(135deg, #d4a843, #b88728);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 28px;
            color: #0a0907;
            box-shadow: 0 12px 40px rgba(212, 168, 67, 0.35), inset 0 1px 0 rgba(255,255,255,0.2);
            position: relative;
            animation: float 4s ease-in-out infinite;
        }
        .hero-logo::before {
            content: '';
            position: absolute;
            inset: -3px;
            border-radius: 23px;
            background: linear-gradient(135deg, #d4a843, #ec4899, #06b6d4, #d4a843);
            background-size: 300% 300%;
            z-index: -1;
            animation: gradientShift 6s ease infinite;
            opacity: 0.6;
            filter: blur(10px);
        }
        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-6px); }
        }
        @keyframes gradientShift {
            0%   { background-position: 0% 50%; }
            50%  { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }
        .hero h1 {
            font-size: 28px;
            color: #f5ecd2;
            letter-spacing: -0.025em;
            margin: 0 0 6px 0;
            background: linear-gradient(135deg, #f0c75e 0%, #d4a843 50%, #b88728 100%);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .hero p {
            font-size: 13.5px;
            color: #b6a47b;
            }

        /* Auth card */
        .auth-card {
            background: rgba(26, 22, 16, 0.85);
            border: 1px solid rgba(212, 168, 67, 0.22);
            border-radius: 24px;
            padding: 32px;
            box-shadow: 0 24px 60px rgba(0, 0, 0, 0.65), inset 0 1px 0 rgba(255, 255, 255, 0.04);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            position: relative;
            animation: scaleIn 0.5s cubic-bezier(0.16, 1, 0.3, 1) both;
        }
        .auth-card::before {
            content: '';
            position: absolute;
            top: -1px; left: 25%; right: 25%;
            height: 2px;
            background: linear-gradient(90deg, transparent, #d4a843, transparent);
            border-radius: 2px;
        }
        .auth-card::after {
            content: '';
            position: absolute;
            top: 0; right: 0;
            width: 180px; height: 180px;
            background: radial-gradient(circle at top right, rgba(212, 168, 67, 0.08), transparent 70%);
            pointer-events: none;
            border-radius: 24px;
        }

        /* Tab switcher */
        .tab-switcher {
            display: flex;
            background: rgba(10, 9, 7, 0.7);
            border: 1px solid rgba(212, 168, 67, 0.18);
            border-radius: 14px;
            padding: 5px;
            margin-bottom: 26px;
            position: relative;
        }
        .tab-btn {
            flex: 1;
            padding: 11px 14px;
            background: transparent;
            border: none;
            border-radius: 10px;
            color: #b6a47b;
            font-size: 13px;
            cursor: pointer;
            transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 7px;
            position: relative;
            z-index: 1;
        }
        .tab-btn.active {
            background: linear-gradient(135deg, rgba(212, 168, 67, 0.22), rgba(212, 168, 67, 0.10));
            color: #f5ecd2;
            box-shadow: 0 4px 14px rgba(212, 168, 67, 0.18);
        }
        .tab-btn i { font-size: 14px; }

        /* Form */
        .form-group { margin-bottom: 18px; position: relative; }
        .form-label {
            display: block;
            font-size: 11.5px;
            color: #b6a47b;
            margin-bottom: 8px;
            text-transform: uppercase;
            letter-spacing: 0.08em;
        }
        .form-input-wrap { position: relative; }
        .form-input-wrap > i {
            position: absolute;
            left: 16px;
            top: 50%;
            transform: translateY(-50%);
            color: #7a6a48;
            font-size: 15px;
            pointer-events: none;
            transition: color 0.2s;
        }
        .form-input {
            width: 100%;
            padding: 13px 14px 13px 44px;
            background: rgba(10, 9, 7, 0.85);
            border: 1px solid rgba(212, 168, 67, 0.25);
            border-radius: 12px;
            color: #f5ecd2;
            font-size: 14px;
            transition: all 0.2s;
        }
        .form-input:hover { border-color: rgba(212, 168, 67, 0.40); }
        .form-input:focus {
            outline: none;
            border-color: #d4a843;
            background: rgba(22, 18, 11, 1);
            box-shadow: 0 0 0 4px rgba(212, 168, 67, 0.12);
        }
        .form-input:focus + i,
        .form-input-wrap:focus-within > i { color: #d4a843; }

        /* Autocomplete dropdown */
        .autocomplete-popup {
            position: absolute;
            top: 100%;
            left: 0; right: 0;
            background: rgba(20, 17, 12, 0.98);
            border: 1px solid rgba(212, 168, 67, 0.35);
            border-radius: 12px;
            box-shadow: 0 12px 36px rgba(0, 0, 0, 0.85);
            margin-top: 6px;
            max-height: 220px;
            overflow-y: auto;
            z-index: 1000;
            backdrop-filter: blur(20px);
        }
        .suggest-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 11px 14px;
            cursor: pointer;
            border-bottom: 1px solid rgba(255, 255, 255, 0.04);
            transition: background 0.15s;
        }
        .suggest-item:last-child { border-bottom: none; }
        .suggest-item:hover { background: rgba(212, 168, 67, 0.18); }
        .suggest-avatar {
            width: 32px; height: 32px;
            border-radius: 50%;
            border: 2px solid #c8922a;
            object-fit: cover;
        }
        .suggest-name { font-size: 13.5px; color: #f5ecd2; }
        .suggest-id   { font-size: 11px;   color: #8c7b58; margin-top: 1px; }

        /* Submit button */
        .btn-submit {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #d4a843, #b88728);
            color: #0a0907;
            border: none;
            border-radius: 12px;
            font-size: 14px;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            margin-top: 6px;
            box-shadow: 0 6px 20px rgba(212, 168, 67, 0.30);
            position: relative;
            overflow: hidden;
        }
        .btn-submit::before {
            content: '';
            position: absolute;
            top: 0; left: -100%;
            width: 100%; height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.25), transparent);
            transition: left 0.5s;
        }
        .btn-submit:hover::before { left: 100%; }
        .btn-submit:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 28px rgba(212, 168, 67, 0.45);
            filter: brightness(1.05);
        }
        .btn-submit:active { transform: translateY(0); }
        .btn-submit:disabled { opacity: 0.55; cursor: not-allowed; transform: none; }

        .btn-ghost {
            width: 100%;
            padding: 12px;
            background: transparent;
            color: #b6a47b;
            border: 1px solid rgba(212, 168, 67, 0.20);
            border-radius: 12px;
            font-size: 13.5px;
            cursor: pointer;
            transition: all 0.2s;
            margin-top: 10px;
        }
        .btn-ghost:hover {
            color: #f5ecd2;
            background: rgba(212, 168, 67, 0.08);
            border-color: rgba(212, 168, 67, 0.35);
        }

        /* Alert */
        .alert {
            padding: 12px 14px;
            border-radius: 10px;
            margin-bottom: 18px;
            font-size: 13px;
            display: flex;
            align-items: center;
            gap: 10px;
            animation: fadeUp 0.3s ease-out both;
        }
        .alert-err {
            background: rgba(248, 113, 113, 0.10);
            border: 1px solid rgba(248, 113, 113, 0.30);
            color: #fca5a5;
        }
        .alert-ok {
            background: rgba(52, 211, 153, 0.10);
            border: 1px solid rgba(52, 211, 153, 0.30);
            color: #6ee7b7;
        }

        /* Helper note */
        .helper-note {
            margin-top: 22px;
            padding: 12px 14px;
            background: rgba(212, 168, 67, 0.06);
            border: 1px dashed rgba(212, 168, 67, 0.25);
            border-radius: 12px;
            font-size: 12px;
            color: #a09068;
            }
        .helper-note code {
            color: #f5ecd2;
            background: rgba(0,0,0,0.4);
            padding: 2px 7px;
            border-radius: 5px;
            border: 1px solid rgba(212, 168, 67, 0.15);
        }

        /* Progress */
        .progress-bar {
            height: 4px;
            background: rgba(255,255,255,0.06);
            border-radius: 99px;
            overflow: hidden;
            margin-bottom: 18px;
            display: none;
        }
        .progress-bar.active { display: block; }
        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #d4a843, #f0c75e);
            width: 0%;
            transition: width 0.3s ease;
            box-shadow: 0 0 8px rgba(212, 168, 67, 0.5);
        }

        /* Тест list */
        .test-list {
            margin-bottom: 18px;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        .test-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 10px 12px;
            background: rgba(0,0,0,0.35);
            border: 1px solid rgba(255,255,255,0.04);
            border-radius: 10px;
            font-size: 13px;
            animation: fadeUp 0.3s ease-out both;
        }
        .test-name { color: #d0c0a0; }
        .test-detail { color: #8c7b58; font-size: 12px; }

        /* User card */
        .user-card {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 14px;
            background: rgba(212, 168, 67, 0.06);
            border: 1px solid rgba(212, 168, 67, 0.20);
            border-radius: 12px;
            margin-bottom: 18px;
        }
        .user-avatar {
            width: 48px; height: 48px;
            border-radius: 50%;
            border: 2px solid #d4a843;
            box-shadow: 0 0 0 3px rgba(0,0,0,0.4);
        }
        .user-name { font-size: 14px; color: #f5ecd2; }
        .user-id   { font-size: 11.5px; color: #8c7b58; margin-top: 2px; }

        /* Mobile */
        @media (max-width: 480px) {
            .login-wrapper { max-width: 100%; }
            .auth-card { padding: 24px 20px; }
            .hero h1 { font-size: 24px; }
        }
    </style>
</head>
<body>

<div class="aurora"></div>
<div class="aurora-extra"></div>
<div class="particles" id="particles"></div>

<div class="login-wrapper">
    <div class="hero">
        <div class="hero-logo"><i class="fas fa-robot"></i></div>
        <h1>Aether Panel</h1>
        <p>Центр управления Discord-сервером</p>
    </div>

    <div class="auth-card">
        <div class="tab-switcher">
            <button class="tab-btn active" id="tabBtnPass" onclick="switchTab('pass')">
                <i class="fas fa-key"></i> Вход по паролю
            </button>
            <button class="tab-btn" id="tabBtnPin" onclick="switchTab('pin')">
                <i class="fab fa-discord"></i> Discord ID (PIN)
            </button>
        </div>

        {% if error %}
        <div class="alert alert-err">
            <i class="fas fa-exclamation-circle"></i>
            <span>{{ error }}</span>
        </div>
        {% endif %}

        <!-- TAB 1: USERNAME / PASSWORD FORM -->
        <form id="formPass" method="POST" action="/login">
            <div class="form-group">
                <label class="form-label">Логин или Discord ID</label>
                <div class="form-input-wrap">
                    <i class="fas fa-user"></i>
                    <input type="text" name="username" id="passUsername" class="form-input" placeholder="owner, @username или ID" required autocomplete="off" oninput="showSuggest(this, 'passPopup')" onfocus="showSuggest(this, 'passPopup')">
                </div>
                <div class="autocomplete-popup" id="passPopup"></div>
            </div>

            <div class="form-group">
                <label class="form-label">Пароль</label>
                <div class="form-input-wrap">
                    <i class="fas fa-lock"></i>
                    <input type="password" name="password" class="form-input" placeholder="••••••••" required>
                </div>
            </div>

            <button type="submit" class="btn-submit">
                <i class="fas fa-sign-in-alt"></i> Войти
            </button>

            <div class="helper-note">
                💡 <strong>Подсказка:</strong> По умолчанию для входа владельца используйте логин <code>owner</code> и пароль <code>123</code>.
            </div>
        </form>

        <!-- TAB 2: DISCORD ID PIN LOGIN -->
        <div id="formPin" style="display: none">
            <div class="progress-bar" id="progressBar"><div class="progress-fill" id="progressFill"></div></div>

            <div id="step1">
                <div class="form-group">
                    <label class="form-label">Discord ID или @имя</label>
                    <div class="form-input-wrap">
                        <i class="fab fa-discord"></i>
                        <input type="text" id="discordQuery" class="form-input" placeholder="123456789012345678 или @username" autocomplete="off" oninput="showSuggest(this, 'pinPopup')" onfocus="showSuggest(this, 'pinPopup')">
                    </div>
                    <div class="autocomplete-popup" id="pinPopup"></div>
                </div>
                <div id="step1-error"></div>
                <button type="button" class="btn-submit" id="btnCheck" onclick="doCheck()">
                    <i class="fas fa-paper-plane"></i> Отправить PIN-код
                </button>
            </div>

            <div id="step2">
                <div class="test-list" id="testList"></div>
            </div>

            <div id="step3">
                <div class="user-card" id="userCard"></div>
                <div class="form-group">
                    <label class="form-label">6-значный PIN-код из ЛС</label>
                    <div class="form-input-wrap">
                        <i class="fas fa-shield-alt"></i>
                        <input type="text" id="pinInput" class="form-input" placeholder="000000" maxlength="6" autocomplete="one-time-code">
                    </div>
                </div>
                <div id="step3-error"></div>
                <button type="button" class="btn-submit" id="btnPin" onclick="doPin()">
                    <i class="fas fa-check"></i> Подтвердить и войти
                </button>
                <button type="button" class="btn-ghost" onclick="resetAll()">
                    <i class="fas fa-arrow-left"></i> Назад
                </button>
            </div>
        </div>
    </div>
</div>

<script>
// Floating particles
(function () {
    var container = document.getElementById('particles');
    for (var i = 0; i < 24; i++) {
        var p = document.createElement('div');
        p.className = 'particle';
        p.style.left = Math.random() * 100 + '%';
        p.style.animationDuration = (8 + Math.random() * 12) + 's';
        p.style.animationDelay = (-Math.random() * 20) + 's';
        p.style.opacity = (0.3 + Math.random() * 0.5);
        container.appendChild(p);
    }
})();

let _discordId = '';
let _suggestTimer = null;

function switchTab(mode) {
    if (mode === 'pass') {
        document.getElementById('formPass').style.display = 'block';
        document.getElementById('formPin').style.display = 'none';
        document.getElementById('tabBtnPass').classList.add('active');
        document.getElementById('tabBtnPin').classList.remove('active');
    } else {
        document.getElementById('formPass').style.display = 'none';
        document.getElementById('formPin').style.display = 'block';
        document.getElementById('tabBtnPass').classList.remove('active');
        document.getElementById('tabBtnPin').classList.add('active');
        resetAll();
    }
    hideAllSuggest();
}

function resetAll() {
    document.getElementById('step1').style.display = 'block';
    document.getElementById('step2').style.display = 'none';
    document.getElementById('step3').style.display = 'none';
    document.getElementById('progressBar').classList.remove('active');
    document.getElementById('progressFill').style.width = '0%';
    document.getElementById('testList').innerHTML = '';
    document.getElementById('step1-error').innerHTML = '';
    document.getElementById('step3-error').innerHTML = '';
    const checkBtn = document.getElementById('btnCheck');
    if (checkBtn) checkBtn.disabled = false;
}

function showStep(n) {
    ['step1', 'step2', 'step3'].forEach((s, i) => {
        document.getElementById(s).style.display = (i + 1 === n) ? 'block' : 'none';
    });
}

function setProgress(pct) {
    document.getElementById('progressBar').classList.add('active');
    document.getElementById('progressFill').style.width = pct + '%';
}

function addTestItem(name, status, detail) {
    const list = document.getElementById('testList');
    const item = document.createElement('div');
    item.className = 'test-item';
    let iconHtml = '<i class="fas fa-spinner fa-spin" ></i>';
    if (status === 'ok') iconHtml = '<i class="fas fa-check-circle" ></i>';
    else if (status === 'fail') iconHtml = '<i class="fas fa-times-circle" ></i>';
    else if (status === 'warn') iconHtml = '<i class="fas fa-exclamation-circle" ></i>';
    item.innerHTML = '<div>' + iconHtml + ' <span class="test-name" style="margin-left: 6px">' + name + '</span></div><span class="test-detail">' + (detail || '') + '</span>';
    list.appendChild(item);
    return item;
}

function sleep(ms) { return new Promise(r => setTimeout(r, ms)); }

function hideAllSuggest() {
    document.getElementById('passPopup').style.display = 'none';
    document.getElementById('pinPopup').style.display = 'none';
}

document.addEventListener('click', function(e) {
    if (!e.target.closest('.form-group')) {
        hideAllSuggest();
    }
});

function showSuggest(inputEl, popupId) {
    if (_suggestTimer) clearTimeout(_suggestTimer);
    _suggestTimer = setTimeout(async () => {
        const q = inputEl.value.trim();
        const popup = document.getElementById(popupId);
        try {
            const res = await fetch('/api/login/suggest?q=' + encodeURIComponent(q));
            const d = await res.json();
            if (d.success && d.suggestions && d.suggestions.length) {
                popup.innerHTML = d.suggestions.map(item => {
                    const disp = item.display_name || item.name;
                    const mentionVal = (item.name === 'Owner' || item.name === 'owner') ? 'owner' : '@' + item.name;
                    const idVal = item.id;
                    return `<div class="suggest-item" onclick="selectSuggestItem('${inputEl.id}', '${popupId}', '${mentionVal}', '${idVal}')">
                        <img src="${item.avatar}" class="suggest-avatar" onerror="this.src='https://cdn.discordapp.com/embed/avatars/0.png'"/>
                        <div>
                            <div class="suggest-name">${disp}</div>
                            <div class="suggest-id">ID: ${idVal}</div>
                        </div>
                    </div>`;
                }).join('');
                popup.style.display = 'block';
            } else {
                popup.style.display = 'none';
            }
        } catch (err) {
            popup.style.display = 'none';
        }
    }, 150);
}

function selectSuggestItem(inputId, popupId, mentionVal, idVal) {
    const inputEl = document.getElementById(inputId);
    document.getElementById(popupId).style.display = 'none';
    inputEl.value = idVal || mentionVal;
    if (inputId === 'passUsername') {
        document.querySelector('#formPass input[name="password"]').focus();
    } else {
        inputEl.focus();
    }
}

async function doCheck() {
    const query = document.getElementById('discordQuery').value.trim();
    if (!query) {
        document.getElementById('step1-error').innerHTML = '<div class="alert alert-err"><i class="fas fa-exclamation-circle"></i> Пожалуйста, введите Discord ID или @имя пользователя.</div>';
        return;
    }
    document.getElementById('btnCheck').disabled = true;
    showStep(2);
    setProgress(20);

    const list = document.getElementById('testList');
    list.innerHTML = '';
    addTestItem('Поиск пользователя...', 'loading', '');
    await sleep(300);

    try {
        const r = await fetch('/api/discord-check', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({query: query})
        });
        const d = await r.json();

        list.innerHTML = '';
        setProgress(60);

        if (d.tests && d.tests.length) {
            for (let i = 0; i < d.tests.length; i++) {
                const t = d.tests[i];
                addTestItem(t.name, t.status, t.detail);
            }
        }

        if (!d.success) {
            await sleep(600);
            document.getElementById('step1-error').innerHTML = '<div class="alert alert-err"><i class="fas fa-times-circle"></i> ' + (d.error || 'Пользователь не найден или ошибка операции.') + '</div>';
            showStep(1);
            document.getElementById('progressBar').classList.remove('active');
            document.getElementById('btnCheck').disabled = false;
            return;
        }

        setProgress(100);
        _discordId = d.discord_id;
        await sleep(500);

        const card = document.getElementById('userCard');
        card.innerHTML = '<img class="user-avatar" src="' + (d.avatar || 'https://cdn.discordapp.com/embed/avatars/0.png') + '" onerror="this.src=\'https://cdn.discordapp.com/embed/avatars/0.png\'"><div><div class="user-name">' + d.display_name + '</div><div class="user-id">Discord ID: ' + d.discord_id + '</div></div>';
        showStep(3);
        document.getElementById('progressBar').classList.remove('active');
        document.getElementById('pinInput').focus();
        document.getElementById('btnCheck').disabled = false;

    } catch (e) {
        list.innerHTML = '';
        addTestItem('Ошибка соединения', 'fail', e.message);
        await sleep(1200);
        showStep(1);
        document.getElementById('progressBar').classList.remove('active');
        document.getElementById('btnCheck').disabled = false;
    }
}

async function doPin() {
    const pin = document.getElementById('pinInput').value.trim();
    if (!pin || pin.length !== 6) {
        document.getElementById('step3-error').innerHTML = '<div class="alert alert-err"><i class="fas fa-exclamation-circle"></i> Пожалуйста, введите 6-значный PIN-код.</div>';
        return;
    }
    const pinBtn = document.getElementById('btnPin');
    pinBtn.disabled = true;
    try {
        const r = await fetch('/api/discord-login', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({discord_id: _discordId, pin: pin})
        });
        const d = await r.json();
        if (d.success) {
            document.getElementById('step3-error').innerHTML = '<div class="alert alert-ok"><i class="fas fa-check-circle"></i> Успешный вход, перенаправление...</div>';
            setTimeout(() => { window.location.href = d.redirect || '/'; }, 600);
        } else {
            document.getElementById('step3-error').innerHTML = '<div class="alert alert-err"><i class="fas fa-times-circle"></i> ' + (d.error || 'Неверный PIN-код или истек срок его действия.') + '</div>';
            pinBtn.disabled = false;
        }
    } catch (e) {
        document.getElementById('step3-error').innerHTML = '<div class="alert alert-err"><i class="fas fa-times-circle"></i> Ошибка соединения с сервером: ' + e.message + '</div>';
        pinBtn.disabled = false;
    }
}
</script>
