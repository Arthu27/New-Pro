<!DOCTYPE html>
<html lang="ru" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aether — Вход в панель управления</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="/static/style.css?v=60">
    <style>
      html, body { min-height: 100%; }
      body {
        display: flex; align-items: center; justify-content: center;
        padding: 24px;
        background:
          radial-gradient(ellipse 60% 40% at 50% -10%, var(--ac-soft), transparent 70%),
          var(--bg);
      }
      .auth-card {
        width: 100%; max-width: 400px;
        background: var(--surface);
        border: 1px solid var(--line);
        border-radius: var(--r-lg);
        box-shadow: var(--shadow-2);
        padding: 32px 30px 26px;
        animation: fadeUp 0.35s var(--ease) both;
      }
      .auth-brand { display: flex; align-items: center; gap: 10px; margin-bottom: 22px; }
      .auth-brand .brand-icon { width: 34px; height: 34px; border-radius: 9px; background: var(--ac); color: #fff; display: grid; place-items: center; font-size: 14px; box-shadow: 0 2px 10px rgba(79,70,229,.3); }
      .auth-brand b { font-size: 17px; font-weight: 800; letter-spacing: .02em; }
      .auth-brand span { display: block; font-size: var(--fs-xs); color: var(--text-3); }
      .auth-title { font-size: 19px; font-weight: 800; letter-spacing: -.02em; margin-bottom: 4px; }
      .auth-sub { color: var(--text-3); font-size: var(--fs-md); margin-bottom: 20px; }
      .auth-error {
        background: var(--err-soft); border: 1px solid color-mix(in srgb, var(--err) 25%, transparent);
        color: var(--err); border-radius: var(--r); padding: 10px 13px;
        font-size: var(--fs-md); margin-bottom: 16px; display: none;
      }
      .auth-ok {
        background: var(--ok-soft); border: 1px solid color-mix(in srgb, var(--ok) 25%, transparent);
        color: var(--ok); border-radius: var(--r); padding: 10px 13px;
        font-size: var(--fs-md); margin-bottom: 16px; display: none;
      }
      .auth-field { position: relative; margin-bottom: 14px; }
      .auth-field .lbl { font-size: var(--fs-sm); font-weight: 600; color: var(--text-2); display: block; margin-bottom: 5px; }
      .auth-field input {
        width: 100%; padding: 10px 13px;
        background: var(--surface);
        border: 1px solid var(--line-2);
        border-radius: var(--r-sm);
        font-size: var(--fs-md);
      }
      .auth-field input:focus { outline: none; border-color: var(--ac); box-shadow: 0 0 0 3px var(--ac-soft); }
      .auth-btn {
        width: 100%; padding: 10px;
        background: var(--ac); color: #fff;
        border: 1px solid var(--ac); border-radius: var(--r-sm);
        font-size: var(--fs-md); font-weight: 700; cursor: pointer;
        display: inline-flex; align-items: center; justify-content: center; gap: 8px;
      }
      [data-theme="dark"] .auth-btn { color: #14152a; }
      .auth-btn:hover { background: var(--ac-3); border-color: var(--ac-3); }
      .auth-foot { text-align: center; margin-top: 18px; font-size: var(--fs-sm); color: var(--text-3); }
      .autocomplete-popup {
        position: absolute; top: 100%; left: 0; right: 0;
        background: var(--surface); border: 1px solid var(--line-2);
        border-radius: var(--r-sm); box-shadow: var(--shadow-2);
        max-height: 220px; overflow-y: auto; z-index: 50; display: none;
      }
      .autocomplete-popup .item { padding: 8px 12px; cursor: pointer; font-size: var(--fs-md); display: flex; gap: 9px; align-items: center; }
      .autocomplete-popup .item:hover, .autocomplete-popup .item.active { background: var(--ac-soft); color: var(--ac); }
      .autocomplete-popup .item img { width: 22px; height: 22px; border-radius: 50%; }
      .pin-box { display: flex; gap: 8px; justify-content: center; margin-bottom: 16px; }
      .pin-box input {
        width: 44px; height: 50px; text-align: center;
        font-size: 20px; font-weight: 700; font-family: var(--mono);
        border: 1px solid var(--line-2); border-radius: var(--r-sm); background: var(--surface);
      }
      .pin-box input:focus { outline: none; border-color: var(--ac); box-shadow: 0 0 0 3px var(--ac-soft); }
      .step-hint { font-size: var(--fs-sm); color: var(--text-3); text-align: center; margin-bottom: 14px; }
    </style>
</head>
<body>
  <div class="auth-card">
    <div class="auth-brand">
      <div class="brand-icon"><i class="fas fa-bolt"></i></div>
      <div><b>Aether</b><span>Панель управления</span></div>
    </div>

    <div class="tabs" style="margin-bottom:20px">
      <button type="button" class="tab-btn active" id="tabBtnPass" data-auth-tab="pass"><i class="fas fa-key"></i> Пароль</button>
      <button type="button" class="tab-btn" id="tabBtnPin" data-auth-tab="pin"><i class="fas fa-shield-halved"></i> Discord PIN</button>
    </div>

    <!-- Вход по паролю -->
    <div id="tabPass">
      <div class="auth-error" id="passError" {% if error %}style="display:block"{% endif %}>{{ error|e }}</div>
      <form method="POST" action="/login" autocomplete="off">
        <div class="auth-field">
          <label class="lbl" for="passUsername">Логин</label>
          <input type="text" name="username" id="passUsername" placeholder="owner, @username или ID" required autocomplete="off" oninput="showSuggest(this, 'passPopup')" onfocus="showSuggest(this, 'passPopup')" aria-label="Логин">
          <div class="autocomplete-popup" id="passPopup"></div>
        </div>
        <div class="auth-field">
          <label class="lbl" for="passPassword">Пароль</label>
          <input type="password" name="password" id="passPassword" placeholder="••••••••" required aria-label="Пароль">
        </div>
        <button type="submit" class="auth-btn"><i class="fas fa-arrow-right"></i> Войти</button>
      </form>
    </div>

    <!-- Вход по Discord PIN -->
    <div id="tabPin" style="display:none">
      <div class="auth-error" id="pinError"></div>
      <div id="step1">
        <div class="auth-title">Шаг 1 · Найти аккаунт</div>
        <div class="auth-sub">Введите ID или @username, привязанный к панели.</div>
        <div class="auth-field">
          <label class="lbl" for="discordQuery">Discord</label>
          <input type="text" id="discordQuery" placeholder="123456789012345678 или @username" autocomplete="off" oninput="showSuggest(this, 'pinPopup')" onfocus="showSuggest(this, 'pinPopup')" aria-label="Discord">
          <div class="autocomplete-popup" id="pinPopup"></div>
        </div>
        <button type="button" class="auth-btn" id="pinCheckBtn"><i class="fas fa-magnifying-glass"></i> Проверить</button>
        <div class="step-hint" id="step1-error" style="color:var(--err)"></div>
      </div>
      <div id="step2" style="display:none">
        <div class="auth-title">Шаг 2 · PIN</div>
        <div class="auth-sub" id="step2-who">Введите 6 цифр, которые вы получили от бота.</div>
        <div class="pin-box" id="pinBox"></div>
        <button type="button" class="auth-btn" id="pinConfirmBtn"><i class="fas fa-arrow-right"></i> Подтвердить</button>
        <div class="step-hint" id="step2-error" style="color:var(--err)"></div>
      </div>
    </div>

    <div class="auth-foot">Нет доступа? Заявка — <a href="/member-apply">страница набора</a> · <a href="/register">регистрация</a></div>
  </div>

<script>
(function () {
  'use strict';
  var _discordId = null;
  var _pin = '';

  function $(id) { return document.getElementById(id); }
  function esc(s) { return String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;'); }
  function showError(boxId, text) {
    var el = $(boxId);
    if (text) { el.textContent = text; el.style.display = ''; }
    else el.style.display = 'none';
  }

  /* Табы */
  document.querySelectorAll('[data-auth-tab]').forEach(function (btn) {
    btn.addEventListener('click', function () {
      var tab = btn.dataset.authTab;
      document.querySelectorAll('[data-auth-tab]').forEach(function (b) { b.classList.toggle('active', b === btn); });
      $('tabPass').style.display = tab === 'pass' ? '' : 'none';
      $('tabPin').style.display = tab === 'pin' ? '' : 'none';
    });
  });

  /* Автодополнение логинов */
  var suggestTimer = null;
  window.showSuggest = function (input, popupId) {
    var popup = $(popupId);
    var q = (input.value || '').trim();
    if (q.length < 2) { popup.style.display = 'none'; return; }
    clearTimeout(suggestTimer);
    suggestTimer = setTimeout(function () {
      fetch('/api/login/suggest?q=' + encodeURIComponent(q))
        .then(function (r) { return r.json(); })
        .then(function (d) {
          var items = Array.isArray(d) ? d : (d.suggestions || []);
          if (!items.length) { popup.style.display = 'none'; return; }
          popup.innerHTML = items.slice(0, 6).map(function (s) {
            return '<div class="item" data-user="' + esc(s.username || '') + '" data-id="' + esc(s.discord_id || '') + '">' +
              (s.avatar ? '<img alt="" src="' + esc(s.avatar) + '" onerror="this.style.display=\'none\'">' : '<i class="fas fa-user"></i>') +
              '<span>' + esc(s.username || '') + (s.discord_id ? ' <small class="muted">' + esc(s.discord_id) + '</small>' : '') + '</span></div>';
          }).join('');
          popup.style.display = '';
          Array.prototype.forEach.call(popup.querySelectorAll('.item'), function (it) {
            it.addEventListener('click', function () {
              input.value = it.dataset.user || it.dataset.id || input.value;
              popup.style.display = 'none';
            });
          });
        })
        .catch(function () { popup.style.display = 'none'; });
    }, 220);
  };
  document.addEventListener('click', function (e) {
    if (!e.target.closest('.autocomplete-popup') && !e.target.closest('.auth-field input')) {
      document.querySelectorAll('.autocomplete-popup').forEach(function (p) { p.style.display = 'none'; });
    }
  });

  /* PIN: шаг 1 */
  $('pinCheckBtn').addEventListener('click', function () {
    var q = $('discordQuery').value.trim();
    showError('step1-error', '');
    if (!q) { showError('step1-error', 'Введите ID или @username'); return; }
    var btn = $('pinCheckBtn');
    window.qualitySetLoading(btn, true);
    fetch('/api/discord-check', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ query: q })
    }).then(function (r) { return r.json(); }).then(function (d) {
      window.qualitySetLoading(btn, false);
      if (!d.success) { showError('step1-error', d.error || 'Аккаунт не найден'); return; }
      _discordId = d.discord_id;
      $('step2-who').textContent = (d.username ? d.username + ' — ' : '') + 'Введите 6 цифр, которые вы получили от бота в ЛС.';
      $('step1').style.display = 'none';
      $('step2').style.display = '';
      buildPinBox();
    }).catch(function () { window.qualitySetLoading(btn, false); showError('step1-error', 'Сеть недоступна'); });
  });

  /* PIN: поле из 6 клеток */
  function buildPinBox() {
    var box = $('pinBox');
    box.innerHTML = '';
    _pin = '';
    for (var i = 0; i < 6; i++) {
      var inp = document.createElement('input');
      inp.type = 'text';
      inp.maxLength = 1;
      inp.inputMode = 'numeric';
      inp.autocomplete = 'off';
      inp.dataset.i = i;
      box.appendChild(inp);
      inp.addEventListener('input', function () {
        this.value = this.value.replace(/\D/g, '');
        var idx = parseInt(this.dataset.i, 10);
        if (this.value && idx < 5) box.children[idx + 1].focus();
        _pin = Array.prototype.map.call(box.children, function (c) { return c.value; }).join('');
        if (_pin.length === 6) $('pinConfirmBtn').focus();
      });
      inp.addEventListener('keydown', function (e) {
        var idx = parseInt(this.dataset.i, 10);
        if (e.key === 'Backspace' && !this.value && idx > 0) box.children[idx - 1].focus();
      });
    }
    box.children[0].focus();
  }

  /* PIN: шаг 2 */
  $('pinConfirmBtn').addEventListener('click', function () {
    showError('step2-error', '');
    if (_pin.length !== 6) { showError('step2-error', 'Введите 6 цифр'); return; }
    var btn = $('pinConfirmBtn');
    window.qualitySetLoading(btn, true);
    fetch('/api/discord-login', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ discord_id: _discordId, pin: _pin })
    }).then(function (r) { return r.json(); }).then(function (d) {
      window.qualitySetLoading(btn, false);
      if (d.success) {
        window.location.href = d.redirect || '/';
      } else {
        showError('step2-error', d.error || 'Неверный PIN');
      }
    }).catch(function () { window.qualitySetLoading(btn, false); showError('step2-error', 'Сеть недоступна'); });
  });

})();
</script>
</body>
</html>
