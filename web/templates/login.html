<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aether — Вход в панель управления</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
        html, body {
            min-height: 100%;
            font-family: 'Inter', sans-serif;
            background: #100e08;
            color: #f0e8d0;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            position: relative;
            overflow-x: hidden;
        }
        body::before {
            content: '';
            position: fixed;
            top: -150px;
            left: 50%;
            transform: translateX(-50%);
            width: 900px;
            height: 500px;
            background: radial-gradient(ellipse at center top, rgba(200, 146, 42, 0.22) 0%, rgba(160, 110, 30, 0.08) 45%, transparent 70%);
            pointer-events: none;
            z-index: 0;
        }

        .login-wrapper {
            position: relative;
            z-index: 10;
            width: 100%;
            max-width: 440px;
        }

        .login-brand {
            text-align: center;
            margin-bottom: 24px;
        }
        .login-brand-icon {
            width: 56px;
            height: 56px;
            background: rgba(212, 168, 67, 0.15);
            border: 1px solid rgba(212, 168, 67, 0.35);
            border-radius: 16px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 14px;
            box-shadow: 0 8px 24px rgba(200, 146, 42, 0.2);
        }
        .login-brand-icon i {
            color: #d4a843;
            font-size: 26px;
        }
        .login-brand h1 {
            font-size: 26px;
            font-weight: 800;
            color: #f0e8d0;
            letter-spacing: -0.02em;
            margin-bottom: 6px;
        }
        .login-brand p {
            font-size: 14px;
            color: #8c7b58;
            font-weight: 500;
        }

        .login-card {
            background: rgba(26, 22, 16, 0.92);
            border: 1px solid rgba(212, 168, 67, 0.2);
            border-radius: 20px;
            padding: 32px;
            box-shadow: 0 24px 60px rgba(0, 0, 0, 0.65), inset 0 1px 0 rgba(255, 255, 255, 0.04);
            backdrop-filter: blur(16px);
            position: relative;
        }

        .tab-switcher {
            display: flex;
            background: rgba(16, 14, 8, 0.8);
            border: 1px solid rgba(212, 168, 67, 0.15);
            border-radius: 12px;
            padding: 4px;
            margin-bottom: 24px;
        }
        .tab-btn {
            flex: 1;
            padding: 10px 14px;
            background: transparent;
            border: none;
            border-radius: 8px;
            color: #8c7b58;
            font-size: 13px;
            font-weight: 600;
            font-family: 'Inter', sans-serif;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
        }
        .tab-btn.active {
            background: rgba(212, 168, 67, 0.18);
            color: #f0e8d0;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.3);
        }

        .form-group {
            margin-bottom: 18px;
            position: relative;
        }
        .form-label {
            display: block;
            font-size: 12.5px;
            font-weight: 600;
            color: #b0a078;
            margin-bottom: 7px;
            text-transform: uppercase;
            letter-spacing: 0.04em;
        }
        .form-input-wrap {
            position: relative;
            display: flex;
            align-items: center;
        }
        .form-input-wrap i {
            position: absolute;
            left: 14px;
            color: #7a6a48;
            font-size: 15px;
            pointer-events: none;
        }
        .form-input {
            width: 100%;
            padding: 12px 14px 12px 42px;
            background: rgba(16, 14, 8, 0.9);
            border: 1px solid rgba(212, 168, 67, 0.25);
            border-radius: 12px;
            color: #f0e8d0;
            font-size: 14px;
            font-family: 'Inter', sans-serif;
            transition: all 0.2s;
        }
        .form-input:focus {
            outline: none;
            border-color: #d4a843;
            background: rgba(22, 18, 11, 1);
            box-shadow: 0 0 0 3px rgba(212, 168, 67, 0.15);
        }

        /* Autocomplete dropdown for @member picker */
        .autocomplete-popup {
            position: absolute;
            top: 100%;
            left: 0;
            right: 0;
            background: rgba(20, 17, 12, 0.98);
            border: 1px solid rgba(212, 168, 67, 0.35);
            border-radius: 12px;
            box-shadow: 0 12px 36px rgba(0, 0, 0, 0.85);
            margin-top: 6px;
            max-height: 220px;
            overflow-y: auto;
            z-index: 1000;
        }
        .suggest-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 10px 14px;
            cursor: pointer;
            border-bottom: 1px solid rgba(255, 255, 255, 0.04);
            transition: background 0.15s;
        }
        .suggest-item:last-child {
            border-bottom: none;
        }
        .suggest-item:hover {
            background: rgba(212, 168, 67, 0.18);
        }
        .suggest-avatar {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            border: 1px solid #c8922a;
            object-fit: cover;
        }
        .suggest-name {
            font-size: 13.5px;
            font-weight: 700;
            color: #f0e8d0;
        }
        .suggest-id {
            font-size: 11px;
            color: #8c7b58;
        }

        .btn-submit {
            width: 100%;
            padding: 13px;
            background: linear-gradient(135deg, #c8922a, #d4a843);
            color: #100e08;
            border: none;
            border-radius: 12px;
            font-size: 14.5px;
            font-weight: 700;
            font-family: 'Inter', sans-serif;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            margin-top: 6px;
            box-shadow: 0 4px 16px rgba(200, 146, 42, 0.25);
        }
        .btn-submit:hover {
            transform: translateY(-1px);
            box-shadow: 0 6px 20px rgba(200, 146, 42, 0.4);
        }
        .btn-submit:disabled {
            opacity: 0.55;
            cursor: not-allowed;
            transform: none;
        }

        .btn-ghost {
            width: 100%;
            padding: 11px;
            background: transparent;
            color: #8c7b58;
            border: 1px solid rgba(212, 168, 67, 0.18);
            border-radius: 12px;
            font-size: 13.5px;
            font-weight: 600;
            font-family: 'Inter', sans-serif;
            cursor: pointer;
            transition: all 0.2s;
            margin-top: 10px;
        }
        .btn-ghost:hover {
            color: #f0e8d0;
            background: rgba(255, 255, 255, 0.04);
        }

        .alert {
            padding: 12px 14px;
            border-radius: 10px;
            margin-bottom: 18px;
            font-size: 13px;
            font-weight: 500;
            display: flex;
            align-items: center;
            gap: 10px;
            line-height: 1.4;
        }
        .alert-err {
            background: rgba(220, 53, 69, 0.12);
            border: 1px solid rgba(220, 53, 69, 0.35);
            color: #f8a0a8;
        }
        .alert-ok {
            background: rgba(46, 204, 113, 0.12);
            border: 1px solid rgba(46, 204, 113, 0.35);
            color: #82e0a8;
        }

        .helper-note {
            margin-top: 22px;
            padding: 12px 14px;
            background: rgba(212, 168, 67, 0.08);
            border: 1px dashed rgba(212, 168, 67, 0.25);
            border-radius: 12px;
            font-size: 12px;
            color: #a09068;
            line-height: 1.5;
            text-align: center;
        }
        .helper-note code {
            color: #f0e8d0;
            background: rgba(0,0,0,0.4);
            padding: 2px 6px;
            border-radius: 4px;
            font-weight: 600;
        }

        .progress-bar {
            height: 4px;
            background: rgba(255,255,255,0.06);
            border-radius: 99px;
            overflow: hidden;
            margin-bottom: 18px;
            display: none;
        }
        .progress-bar.active { display: block; }
        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #c8922a, #f0e8d0);
            width: 0%;
            transition: width 0.3s ease;
        }

        .test-list {
            margin-bottom: 18px;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        .test-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 10px 12px;
            background: rgba(0,0,0,0.35);
            border-radius: 8px;
            font-size: 13px;
        }
        .test-name { color: #d0c0a0; }
        .test-detail { color: #8c7b58; font-weight: 600; font-size: 12px; }

        .user-card {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 12px 14px;
            background: rgba(255,255,255,0.04);
            border: 1px solid rgba(212,168,67,0.2);
            border-radius: 12px;
            margin-bottom: 18px;
        }
        .user-avatar {
            width: 44px;
            height: 44px;
            border-radius: 50%;
            border: 2px solid #c8922a;
        }
        .user-name { font-size: 14px; font-weight: 700; color: #f0e8d0; }
        .user-id { font-size: 11.5px; color: #8c7b58; }
    </style>
</head>
<body>

<div class="login-wrapper">
    <div class="login-brand">
        <div class="login-brand-icon"><i class="fas fa-robot"></i></div>
        <h1>Панель управления Aether</h1>
        <p>Добро пожаловать в центр управления сервером</p>
    </div>

    <div class="login-card">
        <!-- Tab Switcher -->
        <div class="tab-switcher">
            <button class="tab-btn active" id="tabBtnPass" onclick="switchTab('pass')">
                <i class="fas fa-key"></i> Вход по паролю
            </button>
            <button class="tab-btn" id="tabBtnPin" onclick="switchTab('pin')">
                <i class="fab fa-discord"></i> Discord ID (PIN)
            </button>
        </div>

        {% if error %}
        <div class="alert alert-err">
            <i class="fas fa-exclamation-circle"></i>
            <span>{{ error }}</span>
        </div>
        {% endif %}

        <!-- TAB 1: USERNAME / PASSWORD FORM -->
        <form id="formPass" method="POST" action="/login">
            <div class="form-group">
                <label class="form-label">Логин или Discord ID</label>
                <div class="form-input-wrap">
                    <i class="fas fa-user"></i>
                    <input type="text" name="username" id="passUsername" class="form-input" placeholder="owner, @username или ID" required autocomplete="off" oninput="showSuggest(this, 'passPopup')" onfocus="showSuggest(this, 'passPopup')">
                </div>
                <!-- Autocomplete dropdown for password login -->
                <div class="autocomplete-popup" id="passPopup" ></div>
            </div>

            <div class="form-group">
                <label class="form-label">Пароль</label>
                <div class="form-input-wrap">
                    <i class="fas fa-lock"></i>
                    <input type="password" name="password" class="form-input" placeholder="••••••••" required>
                </div>
            </div>

            <button type="submit" class="btn-submit">
                <i class="fas fa-sign-in-alt"></i> Войти
            </button>

            <div class="helper-note">
                💡 <strong>Подсказка:</strong> По умолчанию для входа владельца используйте логин <code>owner</code> и пароль <code>123</code>.
            </div>
        </form>

        <!-- TAB 2: DISCORD ID PIN LOGIN -->
        <div id="formPin" style="display: none;">
            <div class="progress-bar" id="progressBar"><div class="progress-fill" id="progressFill"></div></div>

            <div id="step1">
                <div class="form-group">
                    <label class="form-label">Discord ID или @имя</label>
                    <div class="form-input-wrap">
                        <i class="fab fa-discord"></i>
                        <input type="text" id="discordQuery" class="form-input" placeholder="123456789012345678 или @username" autocomplete="off" oninput="showSuggest(this, 'pinPopup')" onfocus="showSuggest(this, 'pinPopup')">
                    </div>
                    <!-- Autocomplete dropdown for PIN check -->
                    <div class="autocomplete-popup" id="pinPopup" ></div>
                </div>
                <div id="step1-error"></div>
                <button type="button" class="btn-submit" id="btnCheck" onclick="doCheck()">
                    <i class="fas fa-paper-plane"></i> Отправить PIN-код
                </button>
            </div>

            <div id="step2" >
                <div class="test-list" id="testList"></div>
            </div>

            <div id="step3" >
                <div class="user-card" id="userCard"></div>
                <div class="form-group">
                    <label class="form-label">6-значный PIN-код из ЛС</label>
                    <div class="form-input-wrap">
                        <i class="fas fa-shield-alt"></i>
                        <input type="text" id="pinInput" class="form-input" placeholder="000000" maxlength="6" autocomplete="one-time-code">
                    </div>
                </div>
                <div id="step3-error"></div>
                <button type="button" class="btn-submit" id="btnPin" onclick="doPin()">
                    <i class="fas fa-check"></i> Подтвердить и войти
                </button>
                <button type="button" class="btn-ghost" onclick="resetAll()">
                    <i class="fas fa-arrow-left"></i> Назад
                </button>
            </div>
        </div>
    </div>
</div>

<script>
let _discordId = '';
let _suggestTimer = null;

function switchTab(mode) {
    if (mode === 'pass') {
        document.getElementById('formPass').style.display = 'block';
        document.getElementById('formPin').style.display = 'none';
        document.getElementById('tabBtnPass').classList.add('active');
        document.getElementById('tabBtnPin').classList.remove('active');
    } else {
        document.getElementById('formPass').style.display = 'none';
        document.getElementById('formPin').style.display = 'block';
        document.getElementById('tabBtnPass').classList.remove('active');
        document.getElementById('tabBtnPin').classList.add('active');
        resetAll();
    }
    hideAllSuggest();
}

function resetAll() {
    document.getElementById('step1').style.display = 'block';
    document.getElementById('step2').style.display = 'none';
    document.getElementById('step3').style.display = 'none';
    document.getElementById('progressBar').classList.remove('active');
    document.getElementById('progressFill').style.width = '0%';
    document.getElementById('testList').innerHTML = '';
    document.getElementById('step1-error').innerHTML = '';
    document.getElementById('step3-error').innerHTML = '';
    const checkBtn = document.getElementById('btnCheck');
    if (checkBtn) checkBtn.disabled = false;
}

function showStep(n) {
    ['step1', 'step2', 'step3'].forEach((s, i) => {
        document.getElementById(s).style.display = (i + 1 === n) ? 'block' : 'none';
    });
}

function setProgress(pct) {
    document.getElementById('progressBar').classList.add('active');
    document.getElementById('progressFill').style.width = pct + '%';
}

function addTestItem(name, status, detail) {
    const list = document.getElementById('testList');
    const item = document.createElement('div');
    item.className = 'test-item';
    let iconHtml = '<i class="fas fa-spinner fa-spin" style="color:#d4a843;"></i>';
    if (status === 'ok') iconHtml = '<i class="fas fa-check-circle" style="color:#82e0a8;"></i>';
    else if (status === 'fail') iconHtml = '<i class="fas fa-times-circle" style="color:#f8a0a8;"></i>';
    else if (status === 'warn') iconHtml = '<i class="fas fa-exclamation-circle" style="color:#f5c060;"></i>';
    item.innerHTML = '<div>' + iconHtml + ' <span class="test-name" style="margin-left:6px;">' + name + '</span></div><span class="test-detail">' + (detail || '') + '</span>';
    list.appendChild(item);
    return item;
}

function sleep(ms) { return new Promise(r => setTimeout(r, ms)); }

/* Autocomplete Member Picker for @ query */
function hideAllSuggest() {
    document.getElementById('passPopup').style.display = 'none';
    document.getElementById('pinPopup').style.display = 'none';
}

document.addEventListener('click', function(e) {
    if (!e.target.closest('.form-group')) {
        hideAllSuggest();
    }
});

function showSuggest(inputEl, popupId) {
    if (_suggestTimer) clearTimeout(_suggestTimer);
    _suggestTimer = setTimeout(async () => {
        const q = inputEl.value.trim();
        const popup = document.getElementById(popupId);
        try {
            const res = await fetch('/api/login/suggest?q=' + encodeURIComponent(q));
            const d = await res.json();
            if (d.success && d.suggestions && d.suggestions.length) {
                popup.innerHTML = d.suggestions.map(item => {
                    const disp = item.display_name || item.name;
                    const mentionVal = (item.name === 'Owner' || item.name === 'owner') ? 'owner' : '@' + item.name;
                    const idVal = item.id;
                    return `<div class="suggest-item" onclick="selectSuggestItem('${inputEl.id}', '${popupId}', '${mentionVal}', '${idVal}')">
                        <img src="${item.avatar}" class="suggest-avatar" onerror="this.src='https://cdn.discordapp.com/embed/avatars/0.png'"/>
                        <div>
                            <div class="suggest-name">${disp}</div>
                            <div class="suggest-id">ID: ${idVal}</div>
                        </div>
                    </div>`;
                }).join('');
                popup.style.display = 'block';
            } else {
                popup.style.display = 'none';
            }
        } catch (err) {
            popup.style.display = 'none';
        }
    }, 150);
}

function selectSuggestItem(inputId, popupId, mentionVal, idVal) {
    const inputEl = document.getElementById(inputId);
    document.getElementById(popupId).style.display = 'none';

    // A member selected from the password form does not know a panel password.
    // Take them to the Discord PIN flow instead of leaving a mismatched @name in
    // the username field (the server authenticates password logins by Discord ID).
    if (inputId === 'passUsername' && idVal) {
        switchTab('pin');
        const discordQuery = document.getElementById('discordQuery');
        discordQuery.value = idVal;
        discordQuery.focus();
        return;
    }

    inputEl.value = idVal || mentionVal;
    inputEl.focus();
}

async function doCheck() {
    const query = document.getElementById('discordQuery').value.trim();
    if (!query) {
        document.getElementById('step1-error').innerHTML = '<div class="alert alert-err"><i class="fas fa-exclamation-circle"></i> Пожалуйста, введите Discord ID или @имя пользователя.</div>';
        return;
    }
    document.getElementById('btnCheck').disabled = true;
    showStep(2);
    setProgress(20);

    const list = document.getElementById('testList');
    list.innerHTML = '';
    addTestItem('Поиск пользователя...', 'loading', '');
    await sleep(300);

    try {
        const r = await fetch('/api/discord-check', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({query: query})
        });
        const d = await r.json();

        list.innerHTML = '';
        setProgress(60);

        if (d.tests && d.tests.length) {
            for (let i = 0; i < d.tests.length; i++) {
                const t = d.tests[i];
                addTestItem(t.name, t.status, t.detail);
            }
        }

        if (!d.success) {
            await sleep(600);
            document.getElementById('step1-error').innerHTML = '<div class="alert alert-err"><i class="fas fa-times-circle"></i> ' + (d.error || 'Пользователь не найден или ошибка операции.') + '</div>';
            showStep(1);
            document.getElementById('progressBar').classList.remove('active');
            document.getElementById('btnCheck').disabled = false;
            return;
        }

        setProgress(100);
        _discordId = d.discord_id;
        await sleep(500);

        const card = document.getElementById('userCard');
        card.innerHTML = '<img class="user-avatar" src="' + (d.avatar || 'https://cdn.discordapp.com/embed/avatars/0.png') + '" onerror="this.src=\'https://cdn.discordapp.com/embed/avatars/0.png\'"><div><div class="user-name">' + d.display_name + '</div><div class="user-id">Discord ID: ' + d.discord_id + '</div></div>';
        showStep(3);
        document.getElementById('progressBar').classList.remove('active');
        document.getElementById('pinInput').focus();
        document.getElementById('btnCheck').disabled = false;

    } catch (e) {
        list.innerHTML = '';
        addTestItem('Ошибка соединения', 'fail', e.message);
        await sleep(1200);
        showStep(1);
        document.getElementById('progressBar').classList.remove('active');
        document.getElementById('btnCheck').disabled = false;
    }
}

async function doPin() {
    const pin = document.getElementById('pinInput').value.trim();
    if (!pin || pin.length !== 6) {
        document.getElementById('step3-error').innerHTML = '<div class="alert alert-err"><i class="fas fa-exclamation-circle"></i> Пожалуйста, введите 6-значный PIN-код.</div>';
        return;
    }
    const pinBtn = document.getElementById('btnPin');
    pinBtn.disabled = true;
    try {
        const r = await fetch('/api/discord-login', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({discord_id: _discordId, pin: pin})
        });
        const d = await r.json();
        if (d.success) {
            document.getElementById('step3-error').innerHTML = '<div class="alert alert-ok"><i class="fas fa-check-circle"></i> Успешный вход, перенаправление...</div>';
            setTimeout(() => { window.location.href = d.redirect || '/'; }, 600);
        } else {
            document.getElementById('step3-error').innerHTML = '<div class="alert alert-err"><i class="fas fa-times-circle"></i> ' + (d.error || 'Неверный PIN-код или истек срок его действия.') + '</div>';
            pinBtn.disabled = false;
        }
    } catch (e) {
        document.getElementById('step3-error').innerHTML = '<div class="alert alert-err"><i class="fas fa-times-circle"></i> Ошибка соединения с сервером: ' + e.message + '</div>';
        pinBtn.disabled = false;
    }
}
</script>
</body>
</html>
