<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Aether — Вход</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box;}
html,body{height:100%;font-family:'Inter',sans-serif;background:#100e08;color:#f0e8d0;overflow:hidden;}
body::before{content:'';position:fixed;top:-100px;left:50%;transform:translateX(-50%);width:800px;height:400px;
  background:radial-gradient(ellipse at center top,rgba(160,110,30,0.22) 0%,rgba(120,80,20,0.08) 45%,transparent 70%);pointer-events:none;z-index:0;}

/* Navbar */
.navbar{position:fixed;top:18px;left:50%;transform:translateX(-50%);z-index:200;display:flex;align-items:center;gap:4px;
  background:rgba(20,16,8,0.88);border:1px solid rgba(200,160,60,0.14);border-radius:99px;padding:6px 8px;backdrop-filter:blur(16px);
  box-shadow:0 2px 20px rgba(0,0,0,0.5),inset 0 1px 0 rgba(255,255,255,0.04);}
.nav-logo{width:28px;height:28px;background:rgba(212,168,67,0.15);border:1px solid rgba(212,168,67,0.25);border-radius:8px;
  display:flex;align-items:center;justify-content:center;margin-right:4px;}
.nav-logo i{color:#d4a843;font-size:12px;}
.nav-link{padding:6px 14px;font-size:13px;font-weight:500;color:rgba(240,232,208,0.55);text-decoration:none;border-radius:99px;
  transition:color 0.15s,background 0.15s;white-space:nowrap;}
.nav-link:hover{color:#f0e8d0;background:rgba(255,255,255,0.05);}
.nav-btn{padding:7px 18px;background:#f0e8d0;color:#100e08;border:none;border-radius:99px;font-size:13px;font-weight:700;
  cursor:pointer;font-family:'Inter',sans-serif;transition:background 0.15s,transform 0.12s;margin-left:4px;white-space:nowrap;}
.nav-btn:hover{background:#fff;transform:translateY(-1px);}

/* Hero */
.hero{position:relative;z-index:1;height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:0 24px;}
.hero-title{font-size:clamp(52px,8vw,96px);font-weight:900;line-height:1.0;letter-spacing:-0.04em;margin-bottom:20px;max-width:900px;}
.hero-title .t1{color:#f0e8d0;display:block;}
.hero-title .t2{color:#c8922a;display:block;}
.hero-desc{font-size:15px;color:#6a5a38;line-height:1.7;max-width:480px;margin-bottom:14px;}
.hero-stat-line{font-size:13px;font-weight:600;color:#5a4a28;margin-bottom:36px;}
.hero-btns{display:flex;align-items:center;gap:12px;}
.btn-primary{display:inline-flex;align-items:center;gap:8px;padding:12px 24px;background:transparent;color:#f0e8d0;
  border:1px solid rgba(240,232,208,0.35);border-radius:99px;font-size:14px;font-weight:600;cursor:pointer;font-family:'Inter',sans-serif;
  transition:all 0.15s;text-decoration:none;}
.btn-primary:hover{background:rgba(240,232,208,0.08);border-color:rgba(240,232,208,0.6);}
.btn-primary .arrow{width:22px;height:22px;background:#f0e8d0;color:#100e08;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:10px;}
.btn-ghost{padding:12px 24px;background:transparent;color:rgba(240,232,208,0.5);border:none;border-radius:99px;font-size:14px;
  font-weight:500;cursor:pointer;font-family:'Inter',sans-serif;transition:color 0.15s;text-decoration:none;}
.btn-ghost:hover{color:#f0e8d0;}

/* Modal */
.modal-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,0.7);backdrop-filter:blur(8px);z-index:300;align-items:center;justify-content:center;}
.modal-overlay.open{display:flex;}
.modal-card{background:#1a1610;border:1px solid rgba(212,168,67,0.15);border-radius:16px;padding:32px;width:420px;max-width:92vw;
  box-shadow:0 24px 80px rgba(0,0,0,0.7);animation:modalUp 0.25s ease-out;max-height:90vh;overflow-y:auto;}
@keyframes modalUp{from{opacity:0;transform:translateY(16px) scale(0.97);}to{opacity:1;transform:translateY(0) scale(1);}}
.modal-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:24px;}
.modal-title{font-size:18px;font-weight:800;color:#f0e8d0;letter-spacing:-0.02em;}
.modal-sub{font-size:12px;color:#5a5038;margin-top:2px;}
.modal-close{width:28px;height:28px;background:rgba(255,255,255,0.05);border:1px solid rgba(255,255,255,0.08);border-radius:8px;
  display:flex;align-items:center;justify-content:center;cursor:pointer;color:rgba(240,232,208,0.4);font-size:12px;transition:all 0.15s;}
.modal-close:hover{background:rgba(255,255,255,0.1);color:#f0e8d0;}

/* Form */
.field{margin-bottom:12px;}
.field-lbl{display:block;font-size:11px;font-weight:600;color:#7a6a48;text-transform:uppercase;letter-spacing:0.07em;margin-bottom:6px;}
.inp-wrap{position:relative;}
.inp-wrap i{position:absolute;left:11px;top:50%;transform:translateY(-50%);color:#4a4030;font-size:12px;pointer-events:none;}
.inp-wrap input{width:100%;padding:10px 12px 10px 34px;background:rgba(255,255,255,0.04);border:1px solid rgba(212,168,67,0.12);
  border-radius:8px;color:#f0e8d0;font-size:13px;font-family:'Inter',sans-serif;transition:border-color 0.15s,background 0.15s;margin:0;}
.inp-wrap input:focus{outline:none;border-color:rgba(212,168,67,0.45);background:rgba(255,255,255,0.06);}
.inp-wrap input::placeholder{color:#3a3020;}
.btn-login{width:100%;padding:11px;background:#c8922a;color:#100e08;border:none;border-radius:99px;font-size:14px;font-weight:700;
  cursor:pointer;font-family:'Inter',sans-serif;transition:background 0.15s,transform 0.12s;margin-top:8px;}
.btn-login:hover{background:#e0a830;transform:translateY(-1px);}
.btn-login:disabled{opacity:0.5;cursor:not-allowed;transform:none;}
.btn-reg{display:block;width:100%;margin-top:8px;padding:10px;background:transparent;color:#6a5a38;border:1px solid rgba(212,168,67,0.1);
  border-radius:99px;font-size:13px;font-weight:600;cursor:pointer;text-align:center;text-decoration:none;transition:all 0.15s;font-family:'Inter',sans-serif;}
.btn-reg:hover{background:rgba(212,168,67,0.06);color:#c8922a;border-color:rgba(212,168,67,0.22);}
.sep{height:1px;background:rgba(212,168,67,0.07);margin:14px 0;}
.foot{text-align:center;font-size:11px;color:#3a3020;margin-top:16px;}

/* Progress bar */
.progress-bar{width:100%;height:3px;background:rgba(212,168,67,0.1);border-radius:2px;margin-bottom:16px;overflow:hidden;display:none;}
.progress-bar.active{display:block;}
.progress-fill{height:100%;background:linear-gradient(90deg,#c8922a,#e0a830);border-radius:2px;transition:width 0.5s ease;width:0%;}

/* Test list */
.test-list{margin-bottom:16px;}
.test-item{display:flex;align-items:center;gap:10px;padding:8px 12px;border-radius:8px;margin-bottom:4px;font-size:13px;
  transition:all 0.3s;opacity:0;transform:translateX(-10px);}
.test-item.visible{opacity:1;transform:translateX(0);}
.test-item .test-icon{width:20px;height:20px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:10px;flex-shrink:0;}
.test-item .test-icon.spinner{border:2px solid rgba(200,146,42,0.3);border-top-color:#c8922a;animation:spin 0.8s linear infinite;}
.test-item .test-icon.ok{background:rgba(80,180,100,0.15);color:#70c47a;}
.test-item .test-icon.fail{background:rgba(200,60,60,0.15);color:#d08080;}
.test-item .test-icon.warn{background:rgba(200,180,60,0.15);color:#c8b43c;}
.test-name{flex:1;color:rgba(240,232,208,0.7);}
.test-detail{font-size:11px;color:#5a5038;max-width:140px;text-align:right;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
@keyframes spin{to{transform:rotate(360deg);}}

/* PIN input */
.pin-input{text-align:center;font-size:28px;letter-spacing:12px;font-family:'Inter',sans-serif;padding:15px 20px;
  width:100%;background:rgba(255,255,255,0.04);border:1px solid rgba(212,168,67,0.12);border-radius:8px;color:#f0e8d0;}
.pin-input:focus{outline:none;border-color:rgba(212,168,67,0.45);background:rgba(255,255,255,0.06);}

/* User card */
.user-card{display:flex;align-items:center;gap:12px;padding:12px;background:rgba(255,255,255,0.03);border:1px solid rgba(212,168,67,0.1);
  border-radius:10px;margin-bottom:16px;}
.user-avatar{width:40px;height:40px;border-radius:50%;border:2px solid rgba(212,168,67,0.3);}
.user-name{font-size:14px;font-weight:600;color:#f0e8d0;}
.user-id{font-size:11px;color:#5a5038;}

/* Alert */
.alert{padding:10px 13px;border-radius:8px;margin-bottom:14px;font-size:12px;display:flex;align-items:center;gap:8px;}
.alert-err{background:rgba(200,60,60,0.1);border:1px solid rgba(200,60,60,0.2);color:#d08080;}
.alert-ok{background:rgba(80,180,100,0.1);border:1px solid rgba(80,180,100,0.2);color:#70c47a;}
</style>
</head>
<body>

<nav class="navbar">
    <div class="nav-logo"><i class="fas fa-robot"></i></div>
    <a href="#" class="nav-link" onclick="openModal();return false;">Заявки</a>
    <a href="#" class="nav-link" onclick="openModal();return false;">Объявления</a>
    <a href="#" class="nav-link" onclick="openModal();return false;">Уведомления</a>
    <button class="nav-btn" onclick="openModal()">Войти</button>
</nav>

<div class="hero">
    <h1 class="hero-title">
        <span class="t1">Центр Управления</span>
        <span class="t2">Вашим Сервером.</span>
    </h1>
    <p class="hero-desc">Следите за объявлениями, управляйте заявками и получайте уведомления. Всё в одном месте.</p>
    <p class="hero-stat-line">Всегда на связи с вашим сервером.</p>
    <div class="hero-btns">
        <a href="#" class="btn-primary" onclick="openModal();return false;">
            Войти
            <span class="arrow"><i class="fas fa-arrow-right"></i></span>
        </a>
    </div>
</div>

<!-- Логin Modal -->
<div class="modal-overlay" id="modal" onclick="if(event.target===this)closeModal()">
    <div class="modal-card">
        <div class="modal-head">
            <div>
                <div class="modal-title">Вход в panel</div>
                <div class="modal-sub">Войдите через Discord</div>
            </div>
            <div class="modal-close" onclick="closeModal()"><i class="fas fa-times"></i></div>
        </div>

        <!-- Progress Bar -->
        <div class="progress-bar" id="progressBar"><div class="progress-fill" id="progressFill"></div></div>

        <!-- STEP 1: Enter Discord -->
        <div id="step1">
            <div class="field">
                <label class="field-lbl">Discord ID или @имя</label>
                <div class="inp-wrap">
                    <i class="fab fa-discord"></i>
                    <input type="text" id="discordQuery" placeholder="123456789012345678 или @username" autocomplete="off">
                </div>
            </div>
            <div id="step1-error"></div>
            <button class="btn-login" id="btnCheck" onclick="doCheck()">
                <i class="fas fa-sign-in-alt" style="margin-right:6px;"></i>Войти
            </button>
            <div class="sep"></div>
            <div class="foot"><i class="fas fa-shield-alt" style="margin-right:4px;"></i>Безопасное подключение</div>
        </div>

        <!-- STEP 2: Tests running -->
        <div id="step2" style="display:none;">
            <div class="test-list" id="testList"></div>
        </div>

        <!-- STEP 3: PIN input -->
        <div id="step3" style="display:none;">
            <div class="user-card" id="userCard"></div>
            <div class="field">
                <label class="field-lbl">PIN-код из DM</label>
                <input type="text" id="pinInput" class="pin-input" placeholder="000000" maxlength="6" autocomplete="one-time-code">
            </div>
            <div id="step3-error"></div>
            <button class="btn-login" id="btnPin" onclick="doPin()">
                <i class="fas fa-check" style="margin-right:6px;"></i>Подтвердить
            </button>
            <button class="btn-reg" onclick="goBack()" style="margin-top:8px;">
                <i class="fas fa-arrow-left" style="margin-right:6px;"></i>Назад
            </button>
        </div>
    </div>
</div>

<script>
let _discordId = '';

function openModal(){document.getElementById('modal').classList.add('open');document.getElementById('discordQuery').focus();}
function closeModal(){document.getElementById('modal').classList.remove('open');resetAll();}
function resetAll(){
    document.getElementById('step1').style.display='block';
    document.getElementById('step2').style.display='none';
    document.getElementById('step3').style.display='none';
    document.getElementById('progressBar').classList.remove('active');
    document.getElementById('progressFill').style.width='0%';
    document.getElementById('testList').innerHTML='';
    document.getElementById('step1-error').innerHTML='';
    document.getElementById('step3-error').innerHTML='';
}
function goBack(){resetAll();}

function showStep(n){
    ['step1','step2','step3'].forEach((s,i)=>{document.getElementById(s).style.display=i+1===n?'block':'none';});
}

function setProgress(pct){
    document.getElementById('progressBar').classList.add('active');
    document.getElementById('progressFill').style.width=pct+'%';
}

function addTest(name,status,detail){
    const list=document.getElementById('testList');
    const item=document.createElement('div');
    item.className='test-item';
    let iconHtml='';
    if(status==='loading') iconHtml='<div class="test-icon spinner"></div>';
    else if(status==='ok') iconHtml='<div class="test-icon ok"><i class="fas fa-check"></i></div>';
    else if(status==='fail') iconHtml='<div class="test-icon fail"><i class="fas fa-times"></i></div>';
    else if(status==='warn') iconHtml='<div class="test-icon warn"><i class="fas fa-exclamation"></i></div>';
    item.innerHTML=iconHtml+'<span class="test-name">'+name+'</span><span class="test-detail">'+(detail||'')+'</span>';
    list.appendChild(item);
    setМут(()=>item.classList.add('visible'),50);
    return item;
}

function updateTest(item,status,detail){
    let iconHtml='';
    if(status==='ok') iconHtml='<div class="test-icon ok"><i class="fas fa-check"></i></div>';
    else if(status==='fail') iconHtml='<div class="test-icon fail"><i class="fas fa-times"></i></div>';
    else if(status==='warn') iconHtml='<div class="test-icon warn"><i class="fas fa-exclamation"></i></div>';
    item.querySelector('.test-icon').outerHTML=iconHtml;
    if(detail) item.querySelector('.test-detail').textContent=detail;
}

async function doCheck(){
    const query=document.getElementById('discordQuery').value.trim();
    if(!query){document.getElementById('step1-error').innerHTML='<div class="alert alert-err"><i class="fas fa-exclamation-circle"></i> Введите Discord ID или @имя</div>';return;}
    document.getElementById('btnCheck').disabled=true;
    showStep(2);
    setProgress(10);

    // Имяd loading tests
    const t1=addTest('Поиск пользователя...','loading');
    setProgress(20);
    await sleep(400);

    try{
        const r=await fetch('/api/discord-check',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({query:query})});
        const d=await r.json();

        // Render tests with delays
        document.getElementById('testList').innerHTML='';
        setProgress(15);

        for(let i=0;i<d.tests.length;i++){
            const t=d.tests[i];
            await sleep(500);
            addTest(t.name,t.status,t.detail);
            setProgress(15+((i+1)/d.tests.length)*75);
        }

        if(!d.success){
            await sleep(300);
            document.getElementById('step1-error').innerHTML='<div class="alert alert-err"><i class="fas fa-times-circle"></i> '+(d.error||'Ошибка')+'</div>';
            // Show error in step1
            await sleep(1500);
            showStep(1);
            document.getElementById('progressBar').classList.remove('active');
            document.getElementById('btnCheck').disabled=false;
            return;
        }

        setProgress(100);
        _discordId=d.discord_id;
        await sleep(600);

        // Show PIN step
        const card=document.getElementById('userCard');
        card.innerHTML='<img class="user-avatar" src="'+d.avatar+'" onerror="this.style.display=\'none\'"><div><div class="user-name">'+d.display_name+'</div><div class="user-id">ID: '+d.discord_id+'</div></div>';
        showStep(3);
        document.getElementById('progressBar').classList.remove('active');
        document.getElementById('pinInput').focus();
        document.getElementById('btnCheck').disabled=false;

    }catch(e){
        addTest('Ошибка соединения','fail',e.message);
        await sleep(1500);
        showStep(1);
        document.getElementById('progressBar').classList.remove('active');
        document.getElementById('btnCheck').disabled=false;
    }
}

async function doPin(){
    const pin=document.getElementById('pinInput').value.trim();
    if(!pin||pin.length!==6){document.getElementById('step3-error').innerHTML='<div class="alert alert-err"><i class="fas fa-exclamation-circle"></i> Введите 6-значный PIN</div>';return;}
    document.getElementById('btnPin').disabled=true;
    try{
        const r=await fetch('/api/discord-login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({discord_id:_discordId,pin:pin})});
        const d=await r.json();
        if(d.success){
            document.getElementById('step3-error').innerHTML='<div class="alert alert-ok"><i class="fas fa-check-circle"></i> Вход выполнен!</div>';
            setМут(()=>{window.location.href=d.redirect||'/';},800);
        }else{
            document.getElementById('step3-error').innerHTML='<div class="alert alert-err"><i class="fas fa-times-circle"></i> '+(d.error||'Ошибка')+'</div>';
            document.getElementById('btnPin').disabled=false;
        }
    }catch(e){
        document.getElementById('step3-error').innerHTML='<div class="alert alert-err">Ошибка соединения</div>';
        document.getElementById('btnPin').disabled=false;
    }
}

function sleep(ms){return new Promise(r=>setМут(r,ms));}

// Enter key
document.addEventListener('keydown',function(e){
    if(e.key==='Escape')closeModal();
    if(e.key==='Enter'){
        if(document.getElementById('step1').style.display!=='none')doCheck();
        else if(document.getElementById('step3').style.display!=='none')doPin();
    }
});
</script>
</body>
</html>
