{% extends "base.html" %}
{% block title %}Warning Eşik Настройка{% endblock %}
{% block page_title %}⚠️ Warning Eşik Настройка{% endblock %}
{% block content %}
<style>
.wc-card{background:rgba(26,22,16,0.7);border:1px solid rgba(212,168,67,0.1);border-radius:14px;padding:22px;margin-bottom:16px;max-width:700px;}
.wc-card h2{font-size:11px;font-weight:700;color:rgba(240,232,208,0.4);text-transform:uppercase;letter-spacing:0.1em;margin-bottom:16px;padding-bottom:10px;border-bottom:1px solid rgba(212,168,67,0.08);}
label{font-size:11px;color:rgba(240,232,208,0.45);display:block;margin-bottom:4px;text-transform:uppercase;letter-spacing:0.06em;}
.field{margin-bottom:14px;}
.rule-grid{display:grid;grid-template-columns:90px 1fr 130px 40px;gap:10px;align-items:end;margin-bottom:10px;}
.del-btn{padding:8px 10px;background:rgba(224,85,85,0.1);border:1px solid rgba(224,85,85,0.2);color:#e05555;border-radius:8px;cursor:pointer;font-size:13px;transition:all 0.15s;height:38px;}
.del-btn:hover{background:rgba(224,85,85,0.2);}
.add-btn{padding:9px 20px;background:rgba(46,213,115,0.1);border:1px solid rgba(46,213,115,0.2);color:#2ed573;border-radius:99px;cursor:pointer;font-size:12px;font-weight:600;font-family:Inter,sans-serif;transition:all 0.15s;margin-top:4px;}
.add-btn:hover{background:rgba(46,213,115,0.18);}
.rule-item{display:flex;align-items:center;justify-content:space-between;padding:12px 16px;background:rgba(212,168,67,0.04);border:1px solid rgba(212,168,67,0.08);border-radius:10px;margin-bottom:8px;}
.action-badge{display:inline-block;padding:3px 10px;border-radius:99px;font-size:10px;font-weight:700;}
.ab-timeout{background:rgba(255,165,2,0.12);color:#ffa502;border:1px solid rgba(255,165,2,0.25);}
.ab-ban{background:rgba(224,85,85,0.12);color:#e05555;border:1px solid rgba(224,85,85,0.25);}
.ab-kick{background:rgba(83,82,237,0.12);color:#5352ed;border:1px solid rgba(83,82,237,0.25);}
</style>

<div class="wc-card">
  <h2>📋 Текущий Правила</h2>
  <div id="rules-list" style="color:rgba(240,232,208,0.3);font-size:13px;">Загрузка...</div>
</div>

<div class="wc-card">
  <h2>➕ Новый Правило Добавить</h2>
  <div class="rule-grid">
    <div class="field">
      <label>Warning Число</label>
      <input type="number" id="new-count" value="3" min="1" max="20">
    </div>
    <div class="field">
      <label>Aksiyon</label>
      <select id="new-action">
        <option value="timeout">⏳ Mute</option>
        <option value="kick">👢 Kick</option>
        <option value="ban">🔨 Ban</option>
      </select>
    </div>
    <div class="field">
      <label>Длительность (dk, timeout для)</label>
      <input type="number" id="new-duration" value="10" min="1" max="10080">
    </div>
    <div></div>
  </div>
  <button class="add-btn" onclick="addRule()">➕ Правило Добавить</button>
  <span id="rule-msg" style="margin-left:12px;font-size:12px;color:rgba(240,232,208,0.4);"></span>
</div>

<script>
var GUILD_ID = '{{ guild_id }}';
var _rules = [];

var ACTION_LABEL = {timeout: '⏳ Mute', ban: '🔨 Ban', kick: '👢 Kick'};
var ACTION_CLASS = {timeout: 'ab-timeout', ban: 'ab-ban', kick: 'ab-kick'};

async function loadConfig() {
  try {
    var d = await fetch('/api/warn-config/' + GUILD_ID).then(r => r.json());
    _rules = d.thresholds || [];
    renderRules();
  } catch(e) {
    document.getElementById('rules-list').textContent = 'Загруз: ' + e.message;
  }
}

function renderRules() {
  var el = document.getElementById('rules-list');
  if (!_rules.length) {
    el.innerHTML = '<div style="color:rgba(240,232,208,0.3);font-size:13px;padding:8px 0;">Пока правило yok. Varчислоlan davranış активен: 3 warning = 10dk timeout, 5 warning = ban</div>';
    return;
  }
  el.innerHTML = _rules.map(function(r, i) {
    var cls = ACTION_CLASS[r.action] || 'ab-timeout';
    var lbl = ACTION_LABEL[r.action] || r.action;
    return '<div class="rule-item">' +
      '<div style="display:flex;align-items:center;gap:14px;">' +
        '<span style="font-size:22px;font-weight:800;color:#c8922a;min-width:32px;">' + r.count + '</span>' +
        '<span style="font-size:12px;color:rgba(240,232,208,0.4);">предупреждение</span>' +
        '<span class="action-badge ' + cls + '">' + lbl + '</span>' +
        (r.action === 'timeout' ? '<span style="font-size:11px;color:rgba(240,232,208,0.35);">' + r.duration + ' min</span>' : '') +
      '</div>' +
      '<button class="del-btn" onclick="deleteRule(' + i + ')">🗑</button>' +
    '</div>';
  }).join('');
}

async function addRule() {
  var msg = document.getElementById('rule-msg');
  var count    = parseInt(document.getElementById('new-count').value);
  var action   = document.getElementById('new-action').value;
  var duration = parseInt(document.getElementById('new-duration').value) || 10;
  if (!count || count < 1) { msg.textContent = '❌ Неверный число'; return; }
  // Benzer count varsa обновить
  var existing = _rules.findIndex(function(r){ return r.count === count; });
  if (existing >= 0) _rules.splice(existing, 1);
  _rules.push({count, action, duration});
  _rules.sort(function(a,b){ return a.count - b.count; });
  await saveConfig();
  msg.textContent = '✅ Сохранено';
  setTimeout(function(){ msg.textContent = ''; }, 2000);
  renderRules();
}

async function deleteRule(i) {
  _rules.splice(i, 1);
  await saveConfig();
  renderRules();
}

async function saveConfig() {
  await fetch('/api/warn-config/' + GUILD_ID, {
    method: 'POST',
    headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({thresholds: _rules})
  });
}

loadConfig();
</script>
{% endblock %}
