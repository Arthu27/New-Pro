{% extends "base.html" %}
{% block title %}Настройка порогов — Aether{% endblock %}
{% block page_title %}<i class="fas fa-exclamation-triangle" style="color:var(--ac);"></i> Пороги предупреждений{% endblock %}
{% block content %}
<style>
.wc-card{
  background:var(--surface) !important;
  border:1px solid var(--line) !important;
  border-radius:var(--r-lg) !important;
  padding:22px 24px !important;
  margin-bottom:16px !important;
  max-width:760px;
  transition:border-color 0.2s var(--ease);
}
.wc-card:hover{border-color:var(--ac-line) !important;}
.wc-card h2{font-size:11.5px !important;font-weight:700 !important;color:var(--text-2) !important;text-transform:uppercase !important;letter-spacing:0.10em !important;margin-bottom:16px !important;padding-bottom:10px !important;border-bottom:1px solid var(--line) !important;display:flex;align-items:center;gap:8px;}
.wc-card h2 i{color:var(--ac);font-size:14px;}

.rule-grid{display:grid;grid-template-columns:90px 1fr 130px 40px;gap:10px;align-items:end;margin-bottom:10px;}
@media(max-width:600px){.rule-grid{grid-template-columns:1fr 1fr;}}
.del-btn{
  padding:8px 10px;
  background:rgba(248,113,113,0.10);
  border:1px solid rgba(248,113,113,0.25);
  color:var(--err);
  border-radius:8px;cursor:pointer;font-size:13px;
  transition:all 0.18s var(--ease);
  height:38px;
}
.del-btn:hover{background:rgba(248,113,113,0.22);transform:translateY(-1px);}

.add-btn{
  padding:9px 22px;
  background:rgba(52,211,153,0.10);
  border:1px solid rgba(52,211,153,0.25);
  color:var(--ok);
  border-radius:99px;
  cursor:pointer;font-size:12px;font-weight:700;
  font-family:Inter,sans-serif;
  transition:all 0.18s var(--ease);
  margin-top:6px;
}
.add-btn:hover{background:rgba(52,211,153,0.20);transform:translateY(-1px);box-shadow:0 4px 12px rgba(52,211,153,0.20);}

.rule-item{
  display:flex;align-items:center;justify-content:space-between;
  padding:14px 16px;
  background:var(--ac-soft);
  border:1px solid var(--ac-line);
  border-radius:10px;
  margin-bottom:8px;
  transition:all 0.18s var(--ease);
}
.rule-item:hover{background:rgba(212,168,67,0.10);transform:translateX(4px);}
.rule-left{display:flex;align-items:center;gap:14px;}

.rule-count{
  font-size:24px;font-weight:800;
  background:linear-gradient(135deg, var(--ac-2), var(--ac));
  -webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;
  min-width:36px;
  font-variant-numeric:tabular-nums;
  line-height:1;
}
.rule-label{font-size:11px;color:var(--text-3);text-transform:uppercase;letter-spacing:0.06em;font-weight:600;}
.rule-duration{font-size:11px;color:var(--text-2);background:rgba(0,0,0,0.30);padding:3px 9px;border-radius:99px;font-weight:600;}

.action-badge{
  display:inline-flex;align-items:center;gap:4px;
  padding:4px 11px;border-radius:99px;
  font-size:10.5px;font-weight:700;letter-spacing:0.06em;
  text-transform:uppercase;
}
.ab-timeout{background:rgba(251,191,36,0.12);color:var(--warn);border:1px solid rgba(251,191,36,0.30);}
.ab-бан{background:rgba(248,113,113,0.12);color:var(--err);border:1px solid rgba(248,113,113,0.30);}
.ab-кик{background:rgba(96,165,250,0.12);color:var(--info);border:1px solid rgba(96,165,250,0.30);}

.empty-hint{text-align:center;padding:18px;color:var(--text-3);font-size:12.5px;}
.empty-hint i{color:var(--ac);font-size:18px;margin-bottom:6px;display:block;opacity:0.6;}
</style>

<div class="wc-card">
  <h2><i class="fas fa-list"></i> Текущие правила</h2>
  <div id="rules-list" style="color:var(--text-3);font-size:13px;">Загрузка...</div>
</div>

<div class="wc-card">
  <h2><i class="fas fa-plus-circle"></i> Добавить новое правило</h2>
  <div class="rule-grid">
    <div class="form-group">
      <label>Кол-во варнов</label>
      <input type="number" id="new-count" value="3" min="1" max="20">
    </div>
    <div class="form-group">
      <label>Действие</label>
      <select id="new-action">
        <option value="timeout">⏳ Мьют</option>
        <option value="кик">👢 Кик</option>
        <option value="бан">🔨 Бан</option>
      </select>
    </div>
    <div class="form-group">
      <label>Длительность (мин)</label>
      <input type="number" id="new-duration" value="10" min="1" max="10080">
    </div>
    <div></div>
  </div>
  <button class="add-btn" onclick="addRule()"><i class="fas fa-plus"></i> Добавить правило</button>
  <span id="rule-msg" style="margin-left:12px;font-size:12px;color:var(--text-3);"></span>
</div>

<script>
var GUILD_ID = '{{ guild_id }}';
var _rules = [];

var ACTION_LABEL = {timeout: '⏳ Мьют', бан: '🔨 Бан', кик: '👢 Кик'};
var ACTION_CLASS = {timeout: 'ab-timeout', бан: 'ab-бан', кик: 'ab-кик'};
function esc(s) { return String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;'); }

async function loadConfig() {
  try {
    var d = await fetch('/api/warn-config/' + GUILD_ID).then(r => r.json());
    _rules = d.thresholds || [];
    renderRules();
  } catch(e) {
    document.getElementById('rules-list').textContent = 'Ошибка: ' + e.message;
  }
}

function renderRules() {
  var el = document.getElementById('rules-list');
  if (!_rules.length) {
    el.innerHTML = '<div class="empty-hint"><i class="fas fa-info-circle"></i>Пока правил нет.<br><span style="font-size:11px;color:var(--text-4);">По умолчанию: 3 варна = 10 мин мьют, 5 варнов = бан</span></div>';
    return;
  }
  el.innerHTML = _rules.map(function(r, i) {
    var cls = ACTION_CLASS[r.action] || 'ab-timeout';
    var lbl = ACTION_LABEL[r.action] || r.action;
    return '<div class="rule-item">' +
      '<div class="rule-left">' +
        '<span class="rule-count">' + r.count + '</span>' +
        '<span class="rule-label">предупреждений</span>' +
        '<span class="action-badge ' + cls + '">' + lbl + '</span>' +
        (r.action === 'timeout' ? '<span class="rule-duration">' + r.duration + ' мин</span>' : '') +
      '</div>' +
      '<button class="del-btn" onclick="deleteRule(' + i + ')" title="Удалить"><i class="fas fa-trash"></i></button>' +
    '</div>';
  }).join('');
}

async function addRule() {
  var msg = document.getElementById('rule-msg');
  var count    = parseInt(document.getElementById('new-count').value);
  var action   = document.getElementById('new-action').value;
  var duration = parseInt(document.getElementById('new-duration').value) || 10;
  if (!count || count < 1) { msg.innerHTML = '<span style="color:var(--err);">✗ Неверное число</span>'; return; }
  var existing = _rules.findIndex(function(r){ return r.count === count; });
  if (existing >= 0) _rules.splice(existing, 1);
  _rules.push({count, action, duration});
  _rules.sort(function(a,b){ return a.count - b.count; });
  await saveConfig();
  msg.innerHTML = '<span style="color:var(--ok);">✓ Сохранено</span>';
  setTimeout(function(){ msg.textContent = ''; }, 2000);
  renderRules();
}

async function deleteRule(i) {
  _rules.splice(i, 1);
  await saveConfig();
  renderRules();
}

async function saveConfig() {
  await fetch('/api/warn-config/' + GUILD_ID, {
    method: 'POST',
    headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({thresholds: _rules})
  });
}

loadConfig();
</script>
{% endblock %}
