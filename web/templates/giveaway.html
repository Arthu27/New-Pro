{% extends "base.html" %}
{% block title %}Розыгрыши - Aether{% endblock %}
{% block page_title %}<i class="fas fa-gift" ></i> Розыгрыши{% endblock %}
{% block content %}
{% block page_hero %}
<div class="page-hero compact">
  <div class="page-hero-content">
    <div class="page-hero-greeting">
      <span class="dot"></span>
      <span>Розыгрыши</span>
    </div>
    <h1>Розыгрыши</h1>
    <p>Создание и управление розыгрышами на сервере.</p>
  </div>
</div>
{% endblock %}



<div  >
  <div  >
    <span class="gw-badge live" id="live-count">0 live</span>
    <span class="gw-badge ended" id="ended-count">0 завершено</span>
  </div>
  <button class="btn btn-primary" id="btn-new" type="button"><i class="fas fa-plus"></i> Новый розыгрыш</button>
</div>

<div class="gw-grid" id="gw-grid">
  <p class="empty">Розыгрышей нет</p>
</div>

<script>
(function () {
  'use strict';
  function $(id) { return document.getElementById(id); }
  function esc(s) { return String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;'); }

  var giveaways = [
    { prize: 'fa-gift', title: 'Nitro 1 месяц', winners: 1, entries: 245, max: 500, live: true, ends: '2 gюn' },
    { prize: 'fa-crown', title: 'VIP Роль', winners: 3, entries: 89, max: 100, live: true, ends: '5 часов' },
    { prize: 'fa-gamepad', title: 'Игра kodu', winners: 1, entries: 50, max: 50, live: false, ends: 'Готово' }
  ];

  function render() {
    var live = giveaways.filter(function (g) { return g.live; }).length;
    var ended = giveaways.filter(function (g) { return !g.live; }).length;
    $('live-count').textContent = live + ' live';
    $('ended-count').textContent = ended + ' завершено';
    if (!giveaways.length) {
      $('gw-grid').innerHTML = '<p class="empty">Розыгрышей нет</p>';
      return;
    }
    var html = '';
    giveaways.forEach(function (g, i) {
      var pct = g.max ? Math.round(g.entries / g.max * 100) : 0;
      html += '<div class="gw-card" >' +
        '<div class="gw-prize"><i class="fas ' + esc(g.prize) + '"></i></div>' +
        '<div class="gw-title">' + esc(g.title) + '</div>' +
        '<div class="gw-info"><span><i class="fas fa-trophy"></i>' + g.winners + ' победител' + '</span><span><i class="fas fa-clock"></i>' + esc(g.ends) + '</span></div>' +
        '<div class="gw-progress"><div class="gw-progress-fill"   style="width: ' + pct + '%;"></div></div>' +
        '<div class="gw-foot"><span>' + g.entries + ' / ' + g.max + ' katиlиmcи</span><span class="gw-badge ' + (g.live ? 'live' : 'ended') + '">' + (g.live ? 'LIVE' : 'Готово') + '</span></div>' +
      '</div>';
    });
    $('gw-grid').innerHTML = html;
  }

  function bind() {
    var b = $('btn-new');
    if (b) b.addEventListener('click', function () { alert('Новый розыгрыш — form burada olacak'); });
  }

  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', function () { bind(); render(); });
  else { bind(); render(); }
})();
</script>
{% endblock %}
