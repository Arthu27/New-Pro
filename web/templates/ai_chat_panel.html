{% extends "base.html" %}
{% block title %}AI Чат — Aether{% endblock %}
{% block page_title %}<i class="fas fa-comments" style="color:var(--ac);"></i> AI Чат{% endblock %}
{% block content %}

<style>
.chat-wrap {
  display: flex;
  flex-direction: column;
  height: calc(100vh - 180px);
  min-height: 500px;
  background: var(--surface) !important;
  border: 1px solid var(--line) !important;
  border-radius: var(--r-lg) !important;
  overflow: hidden;
  box-shadow: var(--shadow-sm) !important;
}

.chat-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 16px 20px;
  border-bottom: 1px solid var(--line);
  background: linear-gradient(180deg, rgba(212, 168, 67, 0.06), transparent);
}

.chat-header h2 {
  font-size: 16px !important;
  !important;
  color: var(--text) !important;
  margin: 0 !important;
  padding: 0 !important;
  border: none !important;
  display: flex !important;
  align-items: center;
  gap: 10px;
  text-transform: none !important;
  letter-spacing: 0 !important;
}

.model-badge {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  padding: 4px 12px;
  background: linear-gradient(135deg, rgba(212, 168, 67, 0.18), rgba(212, 168, 67, 0.06));
  border: 1px solid var(--ac-line);
  border-radius: 99px;
  font-size: 11px !important;
  !important;
  color: var(--ac) !important;
  text-transform: uppercase;
  letter-spacing: 0.06em;
}

.chat-box {
  flex: 1;
  overflow-y: auto;
  padding: 20px;
  display: flex;
  flex-direction: column;
  gap: 14px;
  background: rgba(10, 9, 7, 0.3);
}

.welcome-msg {
  padding: 40px 20px;
  color: var(--text-2);
  margin: auto;
}

.welcome-msg i {
  font-size: 48px;
  background: linear-gradient(135deg, var(--ac), var(--ac-3));
  -webkit-background-clip: text;
  background-clip: text;
  -webkit-text-fill-color: transparent;
  margin-bottom: 14px;
  display: block;
}

.welcome-msg p {
  font-size: 14px !important;
  color: var(--text-2) !important;
  margin: 0 !important;
}

.welcome-msg strong {
  color: var(--ac) !important;
}

.msg {
  display: flex;
  gap: 12px;
  max-width: 80%;
  animation: msgIn 0.3s cubic-bezier(0.16, 1, 0.3, 1) both;
}

@keyframes msgIn {
  from { opacity: 0; transform: translateY(8px); }
  to { opacity: 1; transform: translateY(0); }
}

.msg.user {
  align-self: flex-end;
  flex-direction: row-reverse;
}

.msg.bot {
  align-self: flex-start;
}

.msg-avatar {
  width: 36px;
  height: 36px;
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
  font-size: 14px;
  box-shadow: 0 0 0 2px rgba(0, 0, 0, 0.3);
}

.msg.bot .msg-avatar {
  background: linear-gradient(135deg, var(--ac), var(--ac-3));
  color: var(--bg);
}

.msg.user .msg-avatar {
  background: linear-gradient(135deg, var(--violet), var(--cyan));
  color: #fff;
}

.msg-bubble {
  padding: 12px 16px;
  border-radius: 14px;
  font-size: 13.5px !important;
  color: var(--text) !important;
  word-wrap: break-word;
  word-break: break-word;
}

.msg.bot .msg-bubble {
  background: var(--surface-2);
  border: 1px solid var(--line);
  border-top-left-radius: 4px;
}

.msg.user .msg-bubble {
  background: linear-gradient(135deg, rgba(139, 92, 246, 0.18), rgba(6, 182, 212, 0.12));
  border: 1px solid rgba(139, 92, 246, 0.25);
  border-top-right-radius: 4px;
  color: var(--text) !important;
}

.msg-time {
  font-size: 10.5px !important;
  color: var(--text-3) !important;
  margin-top: 5px;
  padding: 0 4px;
  }

.msg.user .msg-time {
  }

.typing {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  padding: 12px 16px;
  background: var(--surface-2);
  border: 1px solid var(--line);
  border-radius: 14px;
  border-top-left-radius: 4px;
}

.typing span {
  width: 7px;
  height: 7px;
  background: var(--ac);
  border-radius: 50%;
  animation: typingBounce 1.4s ease-in-out infinite;
}

.typing span:nth-child(2) { animation-delay: 0.2s; }
.typing span:nth-child(3) { animation-delay: 0.4s; }

@keyframes typingBounce {
  0%, 60%, 100% { transform: translateY(0); opacity: 0.4; }
  30% { transform: translateY(-6px); opacity: 1; }
}

.chat-input-wrap {
  display: flex;
  align-items: flex-end;
  gap: 8px;
  padding: 14px 16px;
  border-top: 1px solid var(--line);
  background: rgba(10, 9, 7, 0.5);
}

.chat-input {
  flex: 1;
  resize: none !important;
  min-height: 42px !important;
  max-height: 120px !important;
  background: rgba(10, 9, 7, 0.7) !important;
  border: 1px solid var(--line-2) !important;
  border-radius: 12px !important;
  padding: 11px 14px !important;
  font-size: 13.5px !important;
  color: var(--text) !important;
}

.chat-input:focus {
  border-color: var(--ac) !important;
  box-shadow: 0 0 0 3px rgba(212, 168, 67, 0.12) !important;
  background: rgba(10, 9, 7, 0.85) !important;
}

.chat-input::placeholder { color: var(--text-4) !important; }

.clear-btn,
.send-btn {
  width: 42px;
  height: 42px;
  flex-shrink: 0;
  border-radius: 12px;
  border: none;
  cursor: pointer;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  font-size: 14px;
  transition: all 0.18s var(--ease);
}

.clear-btn {
  background: rgba(248, 113, 113, 0.10);
  color: var(--err);
  border: 1px solid rgba(248, 113, 113, 0.25);
}

.clear-btn:hover {
  background: rgba(248, 113, 113, 0.20);
  transform: translateY(-1px);
}

.send-btn {
  background: linear-gradient(135deg, var(--ac), var(--ac-3));
  color: var(--bg);
  box-shadow: 0 4px 14px var(--ac-glow);
}

.send-btn:hover:not(:disabled) {
  transform: translateY(-1px);
  box-shadow: 0 6px 22px rgba(212, 168, 67, 0.40);
  filter: brightness(1.05);
}

.send-btn:disabled {
  opacity: 0.5;
  cursor: not-allowed;
}

@media (max-width: 600px) {
  .chat-wrap { height: calc(100vh - 160px); }
  .msg { max-width: 90%; }
}
</style>

<div class="chat-wrap">
  <div class="chat-header">
    <h2><i class="fas fa-robot" style="color:var(--ac);"></i> Aether AI</h2>
    <span class="model-badge" id="model-badge">Mistral</span>
  </div>

  <div class="chat-box" id="chat-box">
    <div class="welcome-msg">
      <i class="fas fa-robot"></i>
      <p>Привет, <strong>{{ username }}</strong>! Я Aether AI.<br>
      Задавай вопросы по серверу или просто общайся со мной.</p>
    </div>
  </div>

  <div class="chat-input-wrap">
    <textarea class="chat-input" id="chat-input" placeholder="Напишите что-нибудно..." rows="1"></textarea>
    <button class="clear-btn" onclick="clearChat()" title="Очистить чат"><i class="fas fa-trash"></i></button>
    <button class="send-btn" id="send-btn" onclick="sendMessage()" title="Отправить"><i class="fas fa-paper-plane"></i></button>
  </div>
</div>

<script>
(function () {
  'use strict';
  function $(id) { return document.getElementById(id); }

  var chatBox = $('chat-box');
  var input = $('chat-input');
  var sendBtn = $('send-btn');
  var isTyping = false;

  if (!chatBox || !input || !sendBtn) return;

  function getTime() {
    var d = new Date();
    return d.getHours().toString().padStart(2, '0') + ':' + d.getMinutes().toString().padStart(2, '0');
  }

  function esc(s) {
    return String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
  }

  function addMsg(text, type, model) {
    if (!chatBox) return;
    var welcome = chatBox.querySelector('.welcome-msg');
    if (welcome) welcome.remove();

    var div = document.createElement('div');
    div.className = 'msg ' + type;
    var icon = type === 'bot' ? 'fa-robot' : 'fa-user';
    div.innerHTML =
      '<div class="msg-avatar"><i class="fas ' + icon + '"></i></div>' +
      '<div>' +
        '<div class="msg-bubble">' + esc(text).replace(/\n/g, '<br>') + '</div>' +
        '<div class="msg-time">' + getTime() + (model ? ' · ' + esc(model) : '') + '</div>' +
      '</div>';
    chatBox.appendChild(div);
    chatBox.scrollTop = chatBox.scrollHeight;
  }

  function showTyping() {
    if (!chatBox) return;
    var div = document.createElement('div');
    div.className = 'msg bot';
    div.id = 'typing-indicator';
    div.innerHTML =
      '<div class="msg-avatar"><i class="fas fa-robot"></i></div>' +
      '<div class="typing"><span></span><span></span><span></span></div>';
    chatBox.appendChild(div);
    chatBox.scrollTop = chatBox.scrollHeight;
  }

  function removeTyping() {
    var t = $('typing-indicator');
    if (t) t.remove();
  }

  function showToast(msg, ok) {
    var t = document.createElement('div');
    t.className = 'toast ' + (ok ? 'ok' : 'err');
    t.textContent = msg;
    document.body.appendChild(t);
    setTimeout(function () { t.remove(); }, 3000);
  }

  async function sendMessage() {
    var msg = input.value.trim();
    if (!msg || isTyping) return;

    addMsg(msg, 'user');
    input.value = '';
    input.style.height = 'auto';
    isTyping = true;
    sendBtn.disabled = true;
    showTyping();

    try {
      var r = await fetch('/api/ai-chat', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ message: msg })
      });
      var d = await r.json();
      removeTyping();
      if (d.error) {
        addMsg('⚠ ' + d.error, 'bot');
      } else {
        addMsg(d.answer || '(пустой ответ)', 'bot', d.model);
        if (d.model) {
          var mb = $('model-badge');
          if (mb) mb.textContent = d.model;
        }
      }
    } catch (e) {
      removeTyping();
      addMsg('✗ Ошибка соединения: ' + (e.message || 'unknown'), 'bot');
    }

    isTyping = false;
    sendBtn.disabled = false;
    input.focus();
  }

  async function clearChat() {
    try { await fetch('/api/ai-chat/clear', { method: 'POST' }); } catch (e) {}
    chatBox.innerHTML =
      '<div class="welcome-msg">' +
        '<i class="fas fa-robot"></i>' +
        '<p>Чат очищен. Можете начать новый разговор.</p>' +
      '</div>';
  }

  // Enter to send, Shift+Enter for newline
  input.addEventListener('keydown', function (e) {
    if (e.key === 'Enter' && !e.shiftKey) {
      e.preventDefault();
      sendMessage();
    }
  });

  // Auto-grow textarea
  input.addEventListener('input', function () {
    input.style.height = 'auto';
    input.style.height = Math.min(input.scrollHeight, 120) + 'px';
  });

  // Expose to onclick
  window.sendMessage = sendMessage;
  window.clearChat = clearChat;
})();
</script>
{% endblock %}
