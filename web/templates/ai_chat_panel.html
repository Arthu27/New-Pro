{% extends "base.html" %}
{% block title %}AI Sohbet - Aether{% endblock %}
{% block page_title %}🤖 AI SOHBET{% endblock %}
{% block content %}
<style>
.chat-wrap{display:flex;flex-direction:column;height:calc(100vh - 160px);max-width:860px;margin:0 auto;}
.chat-box{flex:1;overflow-y:auto;display:flex;flex-direction:column;gap:14px;padding:20px;
  background:rgba(16,14,8,0.6);border:1px solid rgba(212,168,67,0.15);border-radius:18px 18px 0 0;}
.msg{display:flex;gap:12px;align-items:flex-start;animation:fadeIn .2s ease;}
.msg.user{flex-direction:row-reverse;}
.msg-avatar{width:34px;height:34px;border-radius:50%;display:flex;align-items:center;justify-content:center;
  font-size:14px;flex-shrink:0;border:1px solid rgba(212,168,67,0.2);}
.msg.bot .msg-avatar{background:rgba(200,146,42,0.15);color:#c8922a;}
.msg.user .msg-avatar{background:rgba(88,101,242,0.2);color:#7289da;}
.msg-bubble{max-width:72%;padding:12px 16px;border-radius:16px;font-size:13.5px;line-height:1.6;word-break:break-word;}
.msg.bot .msg-bubble{background:rgba(26,22,16,0.9);border:1px solid rgba(212,168,67,0.12);color:#f0e8d0;border-radius:4px 16px 16px 16px;}
.msg.user .msg-bubble{background:rgba(88,101,242,0.2);border:1px solid rgba(88,101,242,0.25);color:#f0e8d0;border-radius:16px 4px 16px 16px;}
.msg-time{font-size:10px;color:rgba(240,232,208,0.3);margin-top:4px;}
.msg.user .msg-time{text-align:right;}
.typing{display:flex;gap:4px;align-items:center;padding:8px 0;}
.typing span{width:7px;height:7px;background:#c8922a;border-radius:50%;animation:bounce .8s infinite;}
.typing span:nth-child(2){animation-delay:.15s;}
.typing span:nth-child(3){animation-delay:.3s;}
@keyframes bounce{0%,80%,100%{transform:translateY(0)}40%{transform:translateY(-8px)}}
@keyframes fadeIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}
.chat-input-wrap{display:flex;gap:10px;padding:14px;
  background:rgba(20,16,8,0.9);border:1px solid rgba(212,168,67,0.15);border-top:none;border-radius:0 0 18px 18px;}
.chat-input{flex:1;background:rgba(255,255,255,0.05);border:1px solid rgba(212,168,67,0.15);
  border-radius:12px;padding:11px 16px;color:#f0e8d0;font-size:13.5px;font-family:Inter,sans-serif;
  resize:none;outline:none;transition:border-color .15s;max-height:120px;}
.chat-input:focus{border-color:rgba(212,168,67,0.4);}
.chat-input::placeholder{color:rgba(240,232,208,0.3);}
.send-btn{padding:11px 20px;background:#c8922a;color:#100e08;border:none;border-radius:12px;
  cursor:pointer;font-weight:700;font-size:13px;font-family:Inter,sans-serif;transition:all .15s;flex-shrink:0;}
.send-btn:hover{background:#e0a830;transform:translateY(-1px);}
.send-btn:disabled{opacity:.5;cursor:not-allowed;transform:none;}
.clear-btn{padding:11px 14px;background:rgba(255,255,255,0.05);color:rgba(240,232,208,0.5);
  border:1px solid rgba(212,168,67,0.1);border-radius:12px;cursor:pointer;font-size:12px;
  font-family:Inter,sans-serif;transition:all .15s;flex-shrink:0;}
.clear-btn:hover{background:rgba(255,255,255,0.08);color:#f0e8d0;}
.chat-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px;}
.chat-header h2{font-size:16px;font-weight:700;color:#f0e8d0;}
.model-badge{font-size:11px;color:rgba(240,232,208,0.4);background:rgba(255,255,255,0.04);
  border:1px solid rgba(212,168,67,0.1);border-radius:99px;padding:3px 10px;}
.welcome-msg{text-align:center;padding:40px 20px;color:rgba(240,232,208,0.4);}
.welcome-msg i{font-size:40px;color:rgba(200,146,42,0.3);margin-bottom:12px;display:block;}
.welcome-msg p{font-size:13px;line-height:1.7;}
</style>

<div class="chat-wrap">
  <div class="chat-header">
    <h2>🤖 Aether AI</h2>
    <span class="model-badge" id="model-badge">Mistral</span>
  </div>

  <div class="chat-box" id="chat-box">
    <div class="welcome-msg">
      <i class="fas fa-robot"></i>
      <p>Merhaba <strong>{{ username }}</strong>! Ben Aether AI.<br>
      Сервер о soru edebilirsiniz zadat, sohbet edebilirsiniz obsatsya.</p>
    </div>
  </div>

  <div class="chat-input-wrap">
    <textarea class="chat-input" id="chat-input" placeholder=" ne-nibud напишите..." rows="1"></textarea>
    <button class="clear-btn" onclick="clearChat()" title="Sohbeti temizle"><i class="fas fa-trash"></i></button>
    <button class="send-btn" id="send-btn" onclick="sendMessage()"><i class="fas fa-paper-plane"></i></button>
  </div>
</div>

<script>
const chatBox = document.getElementById('chat-box');
const input = document.getElementById('chat-input');
const sendBtn = document.getElementById('send-btn');
let isTyping = false;

function getTime() {
  return new Date().toLocaleTimeString('tr-TR', {hour:'2-digit',minute:'2-digit'});
}

function addMsg(text, type, model) {
  // Приветствие сообщение удалить
  const welcome = chatBox.querySelector('.welcome-msg');
  if (welcome) welcome.remove();

  const div = document.createElement('div');
  div.className = `msg ${type}`;
  const icon = type === 'bot' ? 'fa-robot' : 'fa-user';
  div.innerHTML = `
    <div class="msg-avatar"><i class="fas ${icon}"></i></div>
    <div>
      <div class="msg-bubble">${text.replace(/\n/g,'<br>')}</div>
      <div class="msg-time">${getTime()}${model ? ' · ' + model : ''}</div>
    </div>`;
  chatBox.appendChild(div);
  chatBox.scrollTop = chatBox.scrollHeight;
}

function showTyping() {
  const div = document.createElement('div');
  div.className = 'msg bot';
  div.id = 'typing-indicator';
  div.innerHTML = `
    <div class="msg-avatar"><i class="fas fa-robot"></i></div>
    <div class="typing"><span></span><span></span><span></span></div>`;
  chatBox.appendChild(div);
  chatBox.scrollTop = chatBox.scrollHeight;
}

function removeTyping() {
  const t = document.getElementById('typing-indicator');
  if (t) t.remove();
}

async function sendMessage() {
  const msg = input.value.trim();
  if (!msg || isTyping) return;

  addMsg(msg, 'user');
  input.value = '';
  input.style.height = 'auto';
  isTyping = true;
  sendBtn.disabled = true;
  showTyping();

  try {
    const r = await fetch('/api/ai-chat', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({message: msg})
    });
    const d = await r.json();
    removeTyping();
    if (d.error) {
      addMsg('❌ ' + d.error, 'bot');
    } else {
      addMsg(d.answer, 'bot', d.model);
      if (d.model) document.getElementById('model-badge').textContent = d.model;
    }
  } catch(e) {
    removeTyping();
    addMsg('❌ Ошибка соединения.', 'bot');
  }

  isTyping = false;
  sendBtn.disabled = false;
  input.focus();
}

async function clearChat() {
  await fetch('/api/ai-chat/clear', {method:'POST'});
  chatBox.innerHTML = `<div class="welcome-msg">
    <i class="fas fa-robot"></i>
    <p>Sohbet ocisena. Новый  разговор nacat edebilirsiniz.</p>
  </div>`;
}

// Enter с с отправить (Shift+Enter новый строка)
input.addEventListener('keydown', e => {
  if (e.key === 'Enter' && !e.shiftKey) {
    e.preventDefault();
    sendMessage();
  }
});

// Textarea автоматически rost
input.addEventListener('input', () => {
  input.style.height = 'auto';
  input.style.height = Math.min(input.scrollHeight, 120) + 'px';
});
</script>
{% endblock %}
