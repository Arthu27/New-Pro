{% extends "base.html" %}
{% block title %}Сменить пароль — Aether{% endblock %}
{% block page_title %}<i class="fas fa-key" style="color:var(--ac);"></i> Сменить пароль{% endblock %}
{% block content %}
<style>
.pw-wrap{max-width:440px;margin:30px auto;}
.pw-card{
  background:var(--surface-2) !important;
  border:1px solid var(--ac-line) !important;
  border-radius:var(--r-xl) !important;
  padding:30px !important;
  box-shadow:var(--shadow-md) !important;
  position:relative;
  overflow:hidden;
}
.pw-card::before{content:'';position:absolute;top:-1px;left:25%;right:25%;height:2px;background:linear-gradient(90deg, transparent, var(--ac), transparent);}
.pw-card h2{font-size:12px !important;font-weight:700 !important;color:var(--text-2) !important;text-transform:uppercase !important;letter-spacing:0.10em !important;margin-bottom:22px !important;padding-bottom:14px !important;border-bottom:1px solid var(--line) !important;display:flex;align-items:center;gap:8px;}
.pw-card h2 i{color:var(--ac);font-size:14px;}
.btn-save{width:100%;padding:12px;background:linear-gradient(135deg, var(--ac), var(--ac-3));color:var(--bg);border:none;border-radius:10px;font-weight:700;font-size:13px;cursor:pointer;transition:all 0.18s var(--ease);box-shadow:0 4px 14px var(--ac-glow);font-family:Inter,sans-serif;}
.btn-save:hover{transform:translateY(-1px);box-shadow:0 6px 22px rgba(212,168,67,0.40);filter:brightness(1.05);}
.btn-save:disabled{opacity:0.5;cursor:not-allowed;transform:none;}
.msg{margin-top:14px;padding:11px 14px;border-radius:10px;font-size:12.5px;display:none;animation:fadeUp 0.3s var(--ease-out) both;}
.msg.ok{background:rgba(52,211,153,0.10);border:1px solid rgba(52,211,153,0.30);color:#6ee7b7;}
.msg.err{background:rgba(248,113,113,0.10);border:1px solid rgba(248,113,113,0.30);color:#fca5a5;}
.pw-hint{font-size:11px;color:var(--text-3);margin-top:-6px;margin-bottom:14px;display:flex;align-items:center;gap:6px;}
.pw-hint i{color:var(--ac);font-size:11px;}
</style>

<div class="pw-wrap">
  <div class="pw-card">
    <h2><i class="fas fa-key"></i> Изменение пароля</h2>
    <div class="form-group">
      <label>Текущий пароль</label>
      <input type="password" id="old-pass" placeholder="Введите текущий пароль">
    </div>
    <div class="form-group">
      <label>Новый пароль</label>
      <input type="password" id="new-pass" placeholder="Минимум 6 символов">
      <div class="pw-hint"><i class="fas fa-info-circle"></i> Минимум 6 символов</div>
    </div>
    <div class="form-group">
      <label>Подтверждение</label>
      <input type="password" id="new-pass2" placeholder="Повторите новый пароль">
    </div>
    <button class="btn-save" id="save-btn" onclick="changePassword()"><i class="fas fa-save"></i> Обновить пароль</button>
    <div class="msg" id="msg"></div>
  </div>
</div>

<script>
async function changePassword() {
  const oldPass  = document.getElementById('old-pass').value.trim();
  const newPass  = document.getElementById('new-pass').value.trim();
  const newPass2 = document.getElementById('new-pass2').value.trim();
  const msg      = document.getElementById('msg');
  const btn      = document.getElementById('save-btn');

  msg.style.display = 'none';

  if (!oldPass || !newPass || !newPass2) {
    showMsg('Заполните все поля.', 'err'); return;
  }
  if (newPass.length < 6) {
    showMsg('Новый пароль должен быть не менее 6 символов.', 'err'); return;
  }
  if (newPass !== newPass2) {
    showMsg('Пароли не совпадают.', 'err'); return;
  }

  btn.disabled = true;
  try {
    const r = await fetch('/api/user/change-password', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({old_password: oldPass, new_password: newPass})
    });
    const d = await r.json();
    if (d.success) {
      showMsg('✓ Пароль успешно обновлён!', 'ok');
      document.getElementById('old-pass').value = '';
      document.getElementById('new-pass').value = '';
      document.getElementById('new-pass2').value = '';
    } else {
      showMsg('✗ ' + (d.error || 'Произошла ошибка.'), 'err');
    }
  } catch(e) {
    showMsg('✗ Ошибка соединения.', 'err');
  }
  btn.disabled = false;
}

function showMsg(text, type) {
  const el = document.getElementById('msg');
  el.textContent = text;
  el.className = 'msg ' + type;
  el.style.display = 'block';
}

document.addEventListener('keydown', e => {
  if (e.key === 'Enter') changePassword();
});
</script>
{% endblock %}
