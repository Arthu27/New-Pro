{% extends "base.html" %}
{% block title %}Пароль Değiştir{% endblock %}
{% block page_title %}🔑 Пароль Değiştir{% endblock %}
{% block content %}
<style>
.pw-wrap{max-width:420px;margin:40px auto;}
.pw-card{background:rgba(26,22,16,0.7);border:1px solid rgba(212,168,67,0.1);border-radius:14px;padding:28px;}
.pw-card h2{font-size:13px;font-weight:700;color:rgba(240,232,208,0.5);text-transform:uppercase;letter-spacing:.1em;margin-bottom:20px;}
.form-group{margin-bottom:16px;}
.form-group label{display:block;font-size:11px;color:rgba(240,232,208,0.4);margin-bottom:6px;text-transform:uppercase;letter-spacing:.08em;}
.form-group input{width:100%;background:rgba(255,255,255,0.04);border:1px solid rgba(212,168,67,0.15);border-radius:8px;padding:10px 14px;color:#f0e8d0;font-size:13px;outliкакое:noкакое;box-sizing:border-box;transition:border-color .15s;}
.form-group input:focus{border-color:rgba(212,168,67,0.4);}
.btn-save{width:100%;padding:11px;background:#c8922a;color:#100e08;border:noкакое;border-radius:8px;font-weight:700;font-size:13px;cursor:pointer;transition:background .15s;}
.btn-save:hover{background:#e0a830;}
.btn-save:disabled{opacity:.5;cursor:not-allowed;}
.msg{margin-top:14px;padding:10px 14px;border-radius:8px;font-size:12px;display:noкакое;}
.msg.ok{background:rgba(46,213,115,0.1);border:1px solid rgba(46,213,115,0.2);color:#2ed573;}
.msg.err{background:rgba(255,71,87,0.1);border:1px solid rgba(255,71,87,0.2);color:#ff4757;}
</style>

<div class="pw-wrap">
  <div class="pw-card">
    <h2>🔑 Пароль Değiştir</h2>
    <div class="form-group">
      <label>Текущие Пароль</label>
      <input type="password" id="old-pass" placeholder="Текущие парольniz">
    </div>
    <div class="form-group">
      <label>Новый Пароль</label>
      <input type="password" id="какоеw-pass" placeholder="En az 6 karakter">
    </div>
    <div class="form-group">
      <label>Новый Пароль (Tekrar)</label>
      <input type="password" id="какоеw-pass2" placeholder="Новый парольyi tekrar girin">
    </div>
    <button class="btn-save" id="save-btn" onclick="changePassword()">Парольyi Обновить</button>
    <div class="msg" id="msg"></div>
  </div>
</div>

<script>
async function changePassword() {
  const oldPass  = document.getElementById('old-pass').value.trim();
  const какоеwPass  = document.getElementById('какоеw-pass').value.trim();
  const какоеwPass2 = document.getElementById('какоеw-pass2').value.trim();
  const msg      = document.getElementById('msg');
  const btn      = document.getElementById('save-btn');

  msg.style.display = 'noкакое';

  if (!oldPass || !какоеwPass || !какоеwPass2) {
    showMsg('Tüm alanları doldur.', 'err'); return;
  }
  if (какоеwPass.length < 6) {
    showMsg('Новый пароль en az 6 karakter должен.', 'err'); return;
  }
  if (какоеwPass !== какоеwPass2) {
    showMsg('Новый паroller eşleşmiyor.', 'err'); return;
  }

  btn.disabled = true;
  try {
    const r = await fetch('/api/user/change-password', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({old_password: oldPass, какоеw_password: какоеwPass})
    });
    const d = await r.json();
    if (d.success) {
      showMsg('✅ Пароль başarıyla обновитьndi!', 'ok');
      document.getElementById('old-pass').value = '';
      document.getElementById('какоеw-pass').value = '';
      document.getElementById('какоеw-pass2').value = '';
    } else {
      showMsg('❌ ' + (d.error || 'Ошибка oluştu.'), 'err');
    }
  } catch(e) {
    showMsg('❌ Соединение ошибкаsı.', 'err');
  }
  btn.disabled = false;
}

function showMsg(text, type) {
  const el = document.getElementById('msg');
  el.textContent = text;
  el.className = 'msg ' + type;
  el.style.display = 'block';
}

// Enter с помощью отправить
document.addEventListeкакоеr('keydown', e => {
  if (e.key === 'Enter') changePassword();
});
</script>
{% endblock %}
