{% extends "base.html" %}
{% block title %}Moderasyon История - Aether{% endblock %}
{% block page_title %}<i class="fas fa-gavel" style="color:#e05555;animation:pulse 2s infinite;"></i> MODERASYON ИСТОРИЯ{% endblock %}

{% block content %}
<style>
  .filter-bar{display:flex;gap:10px;margin-bottom:20px;flex-wrap:wrap;}
  .filter-btn{padding:8px 18px;border:2px solid rgba(231,76,60,0.3);background:transparent;color:rgba(240,232,208,0.55);border-radius:20px;cursor:pointer;transition:all 0.2s;font-size:13px;}
  .filter-btn.active,.filter-btn:hover{background:rgba(224,85,85,0.15);border-color:#e05555;color:#f0e8d0;}
  .mod-card{background:linear-gradient(135deg,#100e08,rgba(26,22,16,0.7));border:1px solid rgba(231,76,60,0.2);border-radius:14px;padding:18px;margin-bottom:12px;display:flex;gap:15px;align-items:flex-start;transition:all 0.3s;cursor:pointer;}
  .mod-card:hover{border-color:rgba(231,76,60,0.5);transform:translateX(4px);box-shadow:0 6px 20px rgba(231,76,60,0.1);}
  .mod-icon{width:46px;height:46px;border-radius:50%;display:flex;align-items:center;justify-content:center;flex-shrink:0;font-size:18px;}
  .бан-icon{background:rgba(231,76,60,0.15);color:#e05555;border:1px solid rgba(231,76,60,0.3);}
  .кик-icon{background:rgba(212,168,67,0.15);color:#c8922a;border:1px solid rgba(212,168,67,0.3);}
  .мьют-icon{background:rgba(212,168,67,0.15);color:#c8922a;border:1px solid rgba(212,168,67,0.3);}
  .warn-icon{background:rgba(255,193,7,0.15);color:#c8922a;border:1px solid rgba(255,193,7,0.3);}
  .mod-user{font-size:15px;font-weight:700;color:#f0e8d0;}
  .mod-reason{font-size:13px;color:rgba(240,232,208,0.55);margin-top:4px;line-height:1.5;max-width:400px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .mod-meta{font-size:11px;color:#5a5040;margin-top:6px;}
  .search-box{width:100%;padding:12px 16px;background:#100e08;border:2px solid rgba(231,76,60,0.3);border-radius:14px;color:#f0e8d0;margin-bottom:15px;box-sizing:border-box;font-size:14px;transition:all 0.3s;}
  .search-box:focus{outline:none;border-color:#e05555;box-shadow:0 0 15px rgba(231,76,60,0.2);}
  .guild-select{width:100%;padding:12px;background:#100e08;border:2px solid #e74c3c;border-radius:14px;color:#f0e8d0;margin-bottom:15px;font-size:14px;}
  .action-badge{padding:3px 10px;border-radius:14px;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:1px;}
  .empty-state{text-align:center;padding:50px;color:#5a5040;font-style:italic;}
  .empty-state i{font-size:40px;color:#e05555;opacity:0.3;display:block;margin-bottom:12px;}
  /* Modal pencere */
  .reason-modal{display:none;position:fixed;inset:0;z-index:9999;background:rgba(0,0,0,0.7);backdrop-filter:blur(4px);align-items:center;justify-content:center;}
  .reason-modal.open{display:flex;}
  .reason-modal-box{background:linear-gradient(135deg,#1a1610,#100e08);border:1px solid rgba(231,76,60,0.4);border-radius:20px;padding:32px;max-width:480px;width:90%;box-shadow:0 20px 60px rgba(0,0,0,0.8);position:relative;}
  .reason-modal-close{position:absolute;top:16px;right:16px;background:rgba(231,76,60,0.15);border:1px solid rgba(231,76,60,0.3);color:#e05555;width:32px;height:32px;border-radius:50%;cursor:pointer;font-size:14px;display:flex;align-items:center;justify-content:center;transition:all 0.2s;}
  .reason-modal-close:hover{background:rgba(231,76,60,0.3);}
  .reason-modal-title{font-size:16px;font-weight:700;color:#f0e8d0;margin-bottom:20px;display:flex;align-items:center;gap:10px;}
  .reason-field{background:rgba(0,0,0,0.4);border:1px solid rgba(231,76,60,0.2);border-radius:12px;padding:16px;margin-bottom:12px;}
  .reason-field-label{font-size:10px;color:#5a5040;text-transform:uppercase;letter-spacing:1px;margin-bottom:6px;}
  .reason-field-value{font-size:14px;color:#f0e8d0;line-height:1.6;word-break:break-word;}
</style>

<!-- Причина Modal pencere -->
<div class="reason-modal" id="reason-modal" onclick="if(event.target===this)closeModal()">
  <div class="reason-modal-box">
    <button class="reason-modal-close" onclick="closeModal()"><i class="fas fa-times"></i></button>
    <div class="reason-modal-title"><i class="fas fa-gavel" style="color:#e05555;"></i> <span id="modal-action-title">Детали действия</span></div>
    <div class="reason-field">
      <div class="reason-field-label">Целевой пользователь</div>
      <div class="reason-field-value" id="modal-target">-</div>
    </div>
    <div class="reason-field">
      <div class="reason-field-label">Модератор</div>
      <div class="reason-field-value" id="modal-mod">-</div>
    </div>
    <div class="reason-field">
      <div class="reason-field-label">Причина</div>
      <div class="reason-field-value" id="modal-reason" style="color:#c8922a;">-</div>
    </div>
    <div class="reason-field">
      <div class="reason-field-label">Дата</div>
      <div class="reason-field-value" id="modal-date" style="color:#5a5040;">-</div>
    </div>
  </div>
</div>

<select  id="guild-select" class="guild-select" ></select>
<input type="text" class="search-box" id="search" placeholder="🔍 Поиск пользователя..." oninput="filterHistory()">
<div class="filter-bar">
  <button class="filter-btn active" onclick="setFilter('all',this)">📋 Все</button>
  <button class="filter-btn" onclick="setFilter('бан',this)">🔨 Бан</button>
  <button class="filter-btn" onclick="setFilter('кик',this)">👢 Кик</button>
  <button class="filter-btn" onclick="setFilter('мьют',this)">🔇 Мьют</button>
  <button class="filter-btn" onclick="setFilter('warn',this)">⚠️ Warning</button>
</div>
<div id="history-list"></div>

<script>
var allHistory = [];
var currentFilter = 'all';

async function loadGuilds() {
  loadHistory();
}

async function loadHistory() {
  document.getElementById('history-list').innerHTML = '<div class="empty-state"><i class="fas fa-spinner fa-spin" style="opacity:1;color:#e05555;"></i><p>Загрузка...</p></div>';
  try {
    var r = await fetch('/api/mod-history');
    if (!r.ok) throw new Error('HTTP ' + r.status);
    var data = await r.json();
    allHistory = Array.isArray(data) ? data : [];
    if (allHistory.length === 0) {
      // Попробовать также предупреждения
      var r2 = await fetch('/api/warnings');
      var warns = await r2.json();
      allHistory = warns.map(function(w) {
        return {
          action: 'warn',
          target_name: w.user_id,
          target_id: w.user_id,
          mod_name: w.moderator,
          reason: w.reason,
          created_at: w.timestamp,
          guild_id: w.guild_id
        };
      });
    }
    render();
  } catch(e) {
    document.getElementById('history-list').innerHTML = '<div class="empty-state"><i class="fas fa-exclamation-circle" style="color:#e05555;opacity:1;"></i><p>Загруз: ' + e.message + '</p></div>';
  }
}

function setFilter(f, btn) {
  currentFilter = f;
  document.querySelectorAll('.filter-btn').forEach(function(b){b.classList.remove('active');});
  btn.classList.add('active');
  render();
}

function filterHistory() { render(); }

function openModal(idx) {
  var h = allHistory[idx];
  if (!h) return;
  var action = (h.action||'warn').toLowerCase();
  var iconMap = {
    бан:'🔨 Бан', кик:'👢 Кик', мьют:'🔇 Мьют', timeout:'⏱ Мьют',
    warn:'⚠️ Warning', unбан:'✅ Разбан'
  };
  document.getElementById('modal-action-title').textContent = iconMap[action] || action.toUpperCase();
  document.getElementById('modal-target').textContent = h.target_name||h.user_name||h.user_id||'?';
  document.getElementById('modal-mod').textContent = h.mod_name||h.mod_id||'?';
  document.getElementById('modal-reason').textContent = h.reason||'Причина не belirtildi';
  var d = h.created_at||h.timestamp||'';
  document.getElementById('modal-date').textContent = d ? new Date(d).toLocaleString('tr-TR') : '-';
  document.getElementById('reason-modal').classList.add('open');
}

function closeModal() {
  document.getElementById('reason-modal').classList.remove('open');
}

document.addEventListener('keydown', function(e){ if(e.key==='Escape') closeModal(); });

function render() {
  var q = document.getElementById('search').value.toLowerCase();
  var filtered = allHistory.filter(function(h){
    var action = (h.action||'warn').toLowerCase();
    var matchFilter = currentFilter==='all' || action===currentFilter ||
      (currentFilter==='мьют' && (action==='мьют'||action==='timeout'));
    var matchSearch = !q || (h.target_name||'').toLowerCase().includes(q) ||
      (h.user_name||'').toLowerCase().includes(q) || (h.mod_name||'').toLowerCase().includes(q);
    return matchFilter && matchSearch;
  });
  var box = document.getElementById('history-list');
  if(!filtered.length) {
    box.innerHTML = '<div class="empty-state"><i class="fas fa-search"></i><p>Запись не найдено.</p></div>';
    return;
  }
  var iconMap = {
    бан:{cls:'бан-icon',icon:'fa-бан',color:'#e74c3c'},
    кик:{cls:'кик-icon',icon:'fa-sign-out-alt',color:'#c8922a'},
    мьют:{cls:'мьют-icon',icon:'fa-microphone-slash',color:'#c8922a'},
    timeout:{cls:'мьют-icon',icon:'fa-clock',color:'#c8922a'},
    warn:{cls:'warn-icon',icon:'fa-exclamation-triangle',color:'#c8922a'},
    unбан:{cls:'бан-icon',icon:'fa-user-check',color:'#2ecc71'}
  };

  // Найти оригинальный индекс allHistory для filtered
  var filteredWithIdx = filtered.map(function(h){ return {h:h, idx:allHistory.indexOf(h)}; });

  box.innerHTML = filteredWithIdx.map(function(item){
    var h = item.h, idx = item.idx;
    var action = (h.action||'warn').toLowerCase();
    var ic = iconMap[action]||iconMap.warn;
    var targetName = h.target_name||h.user_name||h.user_id||'?';
    var modName = h.mod_name||h.mod_id||'?';
    var reason = h.reason||'Причина не belirtildi';
    var createdAt = h.created_at||h.timestamp||'';
    var d = createdAt ? new Date(createdAt) : null;
    var dateStr = d && !isNaN(d) ? d.toLocaleString('tr-TR') : createdAt;
    var r = reason.length > 60 ? reason.substring(0,60)+'...' : reason;
    return '<div class="mod-card" onclick="openModal('+idx+')" title="Детали для клик">'+
      '<div class="mod-icon '+ic.cls+'"><i class="fas '+ic.icon+'"></i></div>'+
      '<div style="flex:1;">'+
        '<div style="display:flex;align-items:center;gap:8px;margin-bottom:4px;">'+
          '<div class="mod-user">'+targetName+'</div>'+
          '<span class="action-badge" style="background:rgba('+hexToRgb(ic.color)+',0.15);color:'+ic.color+';border:1px solid '+ic.color+';">'+action.toUpperCase()+'</span>'+
          '<span style="margin-left:auto;font-size:11px;color:#5a5040;"><i class="fas fa-eye" style="margin-right:3px;"></i>Детали</span>'+
        '</div>'+
        '<div class="mod-reason">'+r+'</div>'+
        '<div class="mod-meta"><i class="fas fa-shield-alt" style="font-size:10px;margin-right:4px;"></i>'+modName+' &nbsp;·&nbsp; '+dateStr+'</div>'+
      '</div>'+
    '</div>';
  }).join('');
}

function hexToRgb(hex) {
  var r = parseInt(hex.slice(1,3),16), g = parseInt(hex.slice(3,5),16), b = parseInt(hex.slice(5,7),16);
  return r+','+g+','+b;
}

loadGuilds();
</script>
{% endblock %}
