{% extends "base.html" %}
{% block title %}Mod Geçmişi - Aether{% endblock %}
{% block page_title %}История модерации{% endblock %}
{% block content %}
<style>
.mh-toolbar{display:flex;gap:10px;margin-bottom:14px;flex-wrap:wrap;align-items:center;}
.mh-search{flex:1;min-width:200px;padding:7px 11px;background:rgba(255,255,255,0.03);border:1px solid rgba(212,168,67,0.16);border-radius:8px;color:#f0e8d0;font-size:12px;}

.mh-stats{display:flex;gap:8px;margin-bottom:12px;flex-wrap:wrap;}
.mh-stat{flex:1;min-width:80px;background:rgba(26,22,16,0.7);border:1px solid rgba(212,168,67,0.1);border-radius:10px;padding:8px 12px;text-align:center;}
.mh-stat-num{font-size:16px;font-weight:800;color:#c8922a;}
.mh-stat-lbl{font-size:9px;color:#5a5040;text-transform:uppercase;letter-spacing:0.05em;}

.mh-box{background:rgba(26,22,16,0.7);border:1px solid rgba(212,168,67,0.08);border-radius:12px;overflow:hidden;}
.mh-head{padding:10px 14px;border-bottom:1px solid rgba(212,168,67,0.07);display:flex;justify-content:space-between;align-items:center;}
.mh-title{font-size:10px;font-weight:700;color:rgba(240,232,208,0.55);text-transform:uppercase;letter-spacing:0.08em;display:flex;align-items:center;gap:7px;}
.mh-title i{color:#c8922a;}
.mh-count{font-size:10px;color:#5a5040;background:rgba(212,168,67,0.06);padding:2px 8px;border-radius:99px;}
.mh-body{max-height:520px;overflow-y:auto;overflow-anchor:none;}

table{width:100%;border-collapse:collapse;font-size:11px;}
th,td{padding:7px 12px;text-align:left;border-bottom:1px solid rgba(212,168,67,0.05);}
th{background:rgba(212,168,67,0.04);color:rgba(240,232,208,0.35);font-weight:600;text-transform:uppercase;letter-spacing:0.06em;font-size:9px;position:sticky;top:0;z-index:1;}
tr:hover td{background:rgba(212,168,67,0.04);}
.case-badge{padding:2px 7px;border-radius:99px;font-size:9px;font-weight:700;text-transform:uppercase;letter-spacing:0.04em;}

.empty{text-align:center;padding:30px;color:#5a5040;font-size:12px;}
</style>

<div class="mh-toolbar">
  <input type="text" id="search" class="mh-search" placeholder="Mod geçmişi ara... (kullanıcı, mod, sebep)">
  <select id="filter" class="mh-search" style="flex:0 0 auto;min-width:120px;">
    <option value="">Tüm aksiyonlar</option>
    <option>Ban</option>
    <option>Kick</option>
    <option>Warn</option>
    <option>Mute</option>
  </select>
</div>

<div class="mh-stats">
  <div class="mh-stat"><div class="mh-stat-num" id="stat-total">-</div><div class="mh-stat-lbl">Всего</div></div>
  <div class="mh-stat"><div class="mh-stat-num" id="stat-bans" style="color:var(--red);">-</div><div class="mh-stat-lbl">Ban</div></div>
  <div class="mh-stat"><div class="mh-stat-num" id="mh-kicks" style="color:#e8903a;">-</div><div class="mh-stat-lbl">Kick</div></div>
  <div class="mh-stat"><div class="mh-stat-num" id="mh-warns" style="color:#c8922a;">-</div><div class="mh-stat-lbl">Warn</div></div>
</div>

<div class="mh-box">
  <div class="mh-head">
    <div class="mh-title"><i class="fas fa-history"></i> Mod Geçmişi</div>
    <span class="mh-count" id="mh-count">-</span>
  </div>
  <div class="mh-body" id="mh-body">
    <p class="empty"><i class="fas fa-spinner fa-spin"></i></p>
  </div>
</div>

<script>
(function () {
  'use strict';
  function $(id) { return document.getElementById(id); }
  function esc(s) { return String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;'); }

  var cases = [
    { id: 1, action: 'Ban', user: 'User1', mod: 'Mod1', reason: 'Reklam', date: '2 дн назад' },
    { id: 2, action: 'Warn', user: 'User2', mod: 'Mod2', reason: 'Spam', date: '3 дн назад' },
    { id: 3, action: 'Kick', user: 'User3', mod: 'Mod1', reason: 'Hakaret', date: '4 дн назад' },
    { id: 4, action: 'Mute', user: 'User4', mod: 'Mod2', reason: 'CAPS', date: '5 дн назад' }
  ];
  var colorMap = { Ban: '#ef4444', Kick: '#f97316', Warn: '#c8922a', Mute: '#c8922a' };

  function render() {
    var q = ($('search').value || '').toLowerCase();
    var f = $('filter').value;
    var list = cases.filter(function (c) {
      if (f && c.action !== f) return false;
      if (q && ((c.user + ' ' + c.mod + ' ' + c.reason).toLowerCase().indexOf(q) === -1)) return false;
      return true;
    });
    $('mh-count').textContent = list.length + ' / ' + cases.length;
    $('stat-total').textContent = cases.length;
    $('stat-bans').textContent = cases.filter(function (c) { return c.action === 'Ban'; }).length;
    $('mh-kicks').textContent = cases.filter(function (c) { return c.action === 'Kick'; }).length;
    $('mh-warns').textContent = cases.filter(function (c) { return c.action === 'Warn'; }).length;
    if (!list.length) { $('mh-body').innerHTML = '<p class="empty">Vaka yok</p>'; return; }
    var rows = list.map(function (c) {
      var c1 = colorMap[c.action] || '#5a5040';
      return '<tr><td><span class="case-badge" style="background:' + c1 + '18;color:' + c1 + ';border:1px solid ' + c1 + '33">#' + c.id + '</span></td>' +
        '<td><span class="case-badge" style="background:' + c1 + '18;color:' + c1 + ';">' + c.action + '</span></td>' +
        '<td style="font-size:11px;">' + esc(c.user) + '</td>' +
        '<td style="color:rgba(240,232,208,0.55);font-size:10px;">' + esc(c.mod) + '</td>' +
        '<td style="color:#5a5040;max-width:160px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:10px;">' + esc(c.reason) + '</td>' +
        '<td style="color:#5a5040;font-size:10px;white-space:nowrap;">' + esc(c.date) + '</td></tr>';
    }).join('');
    $('mh-body').innerHTML = '<table><thead><tr><th>ID</th><th>Aksiyon</th><th>Kullanıcı</th><th>Mod</th><th>Sebep</th><th>Tarih</th></tr></thead><tbody>' + rows + '</tbody></table>';
  }

  function bind() {
    $('search').addEventListener('input', render);
    $('filter').addEventListener('change', render);
  }

  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', function () { bind(); render(); });
  else { bind(); render(); }
})();
</script>
{% endblock %}
