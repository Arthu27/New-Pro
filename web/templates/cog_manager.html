{% extends "base.html" %}
{% block title %}Менеджер модулей — Aether{% endblock %}
{% block page_title %}<i class="fas fa-cubes" style="color:var(--ac);"></i> Менеджер модулей{% endblock %}
{% block content %}
<style>
.cog-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px;}
.cog-card{
  background:var(--surface) !important;
  border:1px solid var(--line) !important;
  border-radius:var(--r-lg) !important;
  padding:16px 18px !important;
  display:flex;
  align-items:center;
  justify-content:space-between;
  transition:all 0.22s var(--ease) !important;
  position:relative;
  overflow:hidden;
}
.cog-card::before{content:'';position:absolute;top:0;left:0;bottom:0;width:3px;background:var(--ok);transition:background 0.2s;}
.cog-card.loaded::before{background:linear-gradient(180deg, var(--ok), #10b981);}
.cog-card.unloaded::before{background:linear-gradient(180deg, var(--err), #dc2626);}
.cog-card.unloaded{opacity:0.7;}
.cog-card:hover{border-color:var(--ac-line) !important;transform:translateY(-2px);box-shadow:var(--shadow-md);opacity:1;}
.cog-name{font-size:13.5px;font-weight:700;color:var(--text);display:flex;align-items:center;gap:8px;}
.cog-name i{color:var(--ac);font-size:14px;}
.cog-status{font-size:10.5px;margin-top:3px;font-weight:600;}
.cog-status.ok{color:var(--ok);}
.cog-status.err{color:var(--err);}
.toggle-btn{
  padding:5px 14px;border-radius:99px;font-size:10.5px;font-weight:700;
  cursor:pointer;font-family:Inter,sans-serif;
  transition:all 0.18s var(--ease);
  letter-spacing:0.06em;
  text-transform:uppercase;
}
.toggle-btn.unload{background:rgba(248,113,113,0.12);color:var(--err);border:1px solid rgba(248,113,113,0.30);}
.toggle-btn.unload:hover{background:rgba(248,113,113,0.22);transform:translateY(-1px);}
.toggle-btn.load{background:rgba(52,211,153,0.12);color:var(--ok);border:1px solid rgba(52,211,153,0.30);}
.toggle-btn.load:hover{background:rgba(52,211,153,0.22);transform:translateY(-1px);}
.reload-btn{
  padding:5px 10px;border-radius:99px;font-size:11px;font-weight:700;cursor:pointer;
  border:1px solid var(--ac-line);background:var(--ac-soft);color:var(--ac);
  font-family:Inter,sans-serif;margin-right:6px;
  transition:all 0.18s var(--ease);
}
.reload-btn:hover{background:rgba(212,168,67,0.20);transform:translateY(-1px);}
.top-bar{display:flex;align-items:center;justify-content:space-between;margin-bottom:18px;flex-wrap:wrap;gap:10px;}
.top-bar .summary{
  font-size:11px;color:var(--text-2);
  background:var(--ac-soft);padding:6px 14px;border-radius:99px;font-weight:700;
  border:1px solid var(--ac-line);letter-spacing:0.05em;
}
</style>

<div class="top-bar">
  <div class="summary" id="cog-summary">Загрузка...</div>
  <button class="btn btn-primary" onclick="reloadAll()"><i class="fas fa-sync"></i> Обновить все</button>
</div>

<div class="cog-grid" id="cog-grid">
  <div style="color:var(--text-3);font-size:13px;padding:10px;">Загрузка...</div>
</div>

<script>
var _cogs = [];
function esc(s) { return String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;'); }

async function loadCogs() {
  try {
    var d = await fetch('/api/cogs').then(r => r.json());
    _cogs = d;
    var loaded = d.filter(c => c.loaded).length;
    document.getElementById('cog-summary').textContent = loaded + ' / ' + d.length + ' модулей загружено';
    document.getElementById('cog-grid').innerHTML = d.map(function(c) {
      return '<div class="cog-card ' + (c.loaded ? 'loaded' : 'unloaded') + '" id="cog-' + esc(c.name) + '">' +
        '<div>' +
          '<div class="cog-name"><i class="fas fa-cube"></i> ' + esc(c.name) + '</div>' +
          '<div class="cog-status ' + (c.loaded ? 'ok' : 'err') + '"><i class="fas fa-circle" style="font-size:5px;margin-right:4px;"></i>' + (c.loaded ? 'Загружен' : 'Не загружен') + '</div>' +
        '</div>' +
        '<div style="display:flex;align-items:center;">' +
          (c.loaded ? '<button class="reload-btn" onclick="reloadCog(\'' + esc(c.name) + '\')" title="Перезагрузить"><i class="fas fa-redo"></i></button>' : '') +
          '<button class="toggle-btn ' + (c.loaded ? 'unload' : 'load') + '" onclick="toggleCog(\'' + esc(c.name) + '\',' + c.loaded + ')">' +
            (c.loaded ? 'Выкл.' : 'Вкл.') +
          '</button>' +
        '</div>' +
      '</div>';
    }).join('');
  } catch(e) {
    document.getElementById('cog-grid').innerHTML = '<div style="color:var(--err);">Ошибка: ' + esc(e.message) + '</div>';
  }
}

async function toggleCog(name, isLoaded) {
  var action = isLoaded ? 'unload' : 'load';
  try {
    var r = await fetch('/api/cogs/' + action, {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({name: 'cogs.' + name})
    }).then(r => r.json());
    if (r.ok) loadCogs();
    else alert('Ошибка: ' + (r.error || 'Неизвестно'));
  } catch(e) { alert('Ошибка соединения'); }
}

async function reloadCog(name) {
  try {
    var r = await fetch('/api/cogs/reload', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({name: 'cogs.' + name})
    }).then(r => r.json());
    if (r.ok) loadCogs();
    else alert('Ошибка: ' + (r.error || 'Неизвестно'));
  } catch(e) { alert('Ошибка соединения'); }
}

async function reloadAll() {
  try {
    await fetch('/api/cogs/reload-all', {method:'POST'}).then(r => r.json());
    loadCogs();
  } catch(e) {}
}

loadCogs();
</script>
{% endblock %}
