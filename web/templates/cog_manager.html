{% extends "base.html" %}
{% block title %}Менеджер модулей — Aether{% endblock %}
{% block page_title %}<i class="fas fa-cubes" style="color:var(--ac);"></i> Менеджер модулей{% endblock %}
{% block content %}

<div class="top-bar">
  <div class="summary" id="cog-summary">Загрузка...</div>
  <button class="btn btn-primary" onclick="reloadAll()"><i class="fas fa-sync"></i> Обновить все</button>
</div>

<div class="cog-grid" id="cog-grid">
  <div style="color:var(--text-3);font-size:13px;padding:10px;">Загрузка...</div>
</div>

<script>
var _cogs = [];
function esc(s) { return String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;'); }

async function loadCogs() {
  try {
    var d = await fetch('/api/cogs').then(r => r.json());
    _cogs = d;
    var loaded = d.filter(c => c.loaded).length;
    document.getElementById('cog-summary').textContent = loaded + ' / ' + d.length + ' модулей загружено';
    document.getElementById('cog-grid').innerHTML = d.map(function(c) {
      return '<div class="cog-card ' + (c.loaded ? 'loaded' : 'unloaded') + '" id="cog-' + esc(c.name) + '">' +
        '<div>' +
          '<div class="cog-name"><i class="fas fa-cube"></i> ' + esc(c.name) + '</div>' +
          '<div class="cog-status ' + (c.loaded ? 'ok' : 'err') + '"><i class="fas fa-circle" style="font-size:5px;margin-right:4px;"></i>' + (c.loaded ? 'Загружен' : 'Не загружен') + '</div>' +
        '</div>' +
        '<div style="display:flex;align-items:center;">' +
          (c.loaded ? '<button class="reload-btn" onclick="reloadCog(\'' + esc(c.name) + '\')" title="Перезагрузить"><i class="fas fa-redo"></i></button>' : '') +
          '<button class="toggle-btn ' + (c.loaded ? 'unload' : 'load') + '" onclick="toggleCog(\'' + esc(c.name) + '\',' + c.loaded + ')">' +
            (c.loaded ? 'Выкл.' : 'Вкл.') +
          '</button>' +
        '</div>' +
      '</div>';
    }).join('');
  } catch(e) {
    document.getElementById('cog-grid').innerHTML = '<div style="color:var(--err);">Ошибка: ' + esc(e.message) + '</div>';
  }
}

async function toggleCog(name, isLoaded) {
  var action = isLoaded ? 'unload' : 'load';
  try {
    var r = await fetch('/api/cogs/' + action, {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({name: 'cogs.' + name})
    }).then(r => r.json());
    if (r.ok) loadCogs();
    else alert('Ошибка: ' + (r.error || 'Неизвестно'));
  } catch(e) { alert('Ошибка соединения'); }
}

async function reloadCog(name) {
  try {
    var r = await fetch('/api/cogs/reload', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({name: 'cogs.' + name})
    }).then(r => r.json());
    if (r.ok) loadCogs();
    else alert('Ошибка: ' + (r.error || 'Неизвестно'));
  } catch(e) { alert('Ошибка соединения'); }
}

async function reloadAll() {
  try {
    await fetch('/api/cogs/reload-all', {method:'POST'}).then(r => r.json());
    loadCogs();
  } catch(e) {}
}

loadCogs();
</script>
{% endblock %}
