{% extends "base.html" %}
{% block title %}Analitik - Aether{% endblock %}
{% block page_title %}<i class="fas fa-chart-line" style="color:#c8922a;animation:pulse 2s infinite;"></i> СЕРВЕР АНАЛИТИКА{% endblock %}
{% block content %}
<style>
  .chart-box{background:linear-gradient(135deg,#100e08,rgba(26,22,16,0.7));border:1px solid rgba(200,146,42,0.3);border-radius:16px;padding:25px;margin-bottom:20px;position:relative;overflow:hidden;}
  .chart-box::before{content:'';position:absolute;top:0;left:-100%;width:100%;height:2px;background:linear-gradient(90deg,transparent,#c8922a,transparent);;}
  @keyframes scan{0%{left:-100%}100%{left:100%}}
  .chart-title{color:#c8922a;font-size:13px;text-transform:uppercase;letter-spacing:2px;margin-bottom:18px;display:flex;align-items:center;gap:8px;padding-bottom:12px;border-bottom:1px solid rgba(200,146,42,0.2);}
  .top-grid{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-bottom:20px;}
  @media(max-width:768px){.top-grid{grid-template-columns:1fr;}}
  .top-item{display:flex;justify-content:space-between;align-items:center;padding:11px 14px;border-bottom:1px solid rgba(255,255,255,0.04);transition:all 0.2s;}
  .top-item:hover{background:rgba(200,146,42,0.07);border-radius:8px;}
  .top-name{color:#f0e8d0;font-size:13px;}
  .top-val{color:#c8922a;font-weight:700;font-size:13px;}
  .top-rank{color:#5a5040;font-size:12px;min-width:20px;}
  .guild-select{width:100%;padding:12px;background:#100e08;border:2px solid #c8922a;border-radius:14px;color:#f0e8d0;margin-bottom:20px;font-size:14px;}
  .empty-state{text-align:center;padding:30px;color:#5a5040;font-style:italic;}
  .bar-contaеr{margin-bottom:8px;}
  .bar-label{display:flex;justify-content:space-between;margin-bottom:4px;font-size:12px;}
  .bar-track{height:8px;background:rgba(200,146,42,0.15);border-radius:4px;overflow:hidden;}
  .bar-fill{height:100%;background:linear-gradient(90deg,#c8922a,#c8922a);border-radius:4px;transition:width 1s ease;}
</style>

<select  id="guild-select" class="guild-select" onchange="loadAnalytics()">
  <option value="">Выберите сервер...</option>
</select>

<div class="top-grid">
  <div class="chart-box">
    <div class="chart-title"><i class="fas fa-trophy"></i> En Активен Участники</div>
    <div id="top-members"><div class="empty-state">Загрузка...</div></div>
  </div>
  <div class="chart-box">
    <div class="chart-title"><i class="fas fa-hashtag"></i> En Активен Каналы</div>
    <div id="top-channels"><div class="empty-state">Загрузка...</div></div>
  </div>
</div>

<div class="chart-box">
  <div class="chart-title"><i class="fas fa-chart-bar"></i> Ежедневный Сообщение Число (В конец 7 день)</div>
  <canvas id="msgChart" height="80"></canvas>
</div>

<div class="chart-box">
  <div class="chart-title"><i class="fas fa-user-plus"></i> Участник Rost</div>
  <canvas id="memberChart" height="80"></canvas>
</div>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script>
var MAIN_GID = '1498837105915330562';
var msgChart, memberChart;

async function loadAnalytics(gid_param) {
  var gid = gid_param || MAIN_GID;
  if(!gid) return;
  var r = await fetch('/api/guild/'+gid+'/analytics');
  var d = await r.json();

  var topMembers = d.top_members||[];
  var maxM = topMembers[0] ? topMembers[0].messages : 1;
  document.getElementById('top-members').innerHTML = topMembers.length ?
    topMembers.map(function(m,i){
      var pct = Math.round((m.messages/maxM)*100);
      return '<div class="bar-contaеr">'+
        '<div class="bar-label"><span class="top-name">'+(i+1)+'. '+m.name+'</span><span class="top-val">'+m.messages+' сообщение</span></div>'+
        '<div class="bar-track"><div class="bar-fill" style="width:'+pct+'%;"></div></div>'+
      '</div>';
    }).join('') :
    '<div class="empty-state">Нет данных</div>';

  var topChannels = d.top_channels||[];
  var maxC = topChannels[0] ? topChannels[0].messages : 1;
  document.getElementById('top-channels').innerHTML = topChannels.length ?
    topChannels.map(function(c,i){
      var pct = Math.round((c.messages/maxC)*100);
      return '<div class="bar-contaеr">'+
        '<div class="bar-label"><span class="top-name">'+(i+1)+'. #'+c.name+'</span><span class="top-val">'+c.messages+' сообщение</span></div>'+
        '<div class="bar-track"><div class="bar-fill" style="width:'+pct+'%;background:linear-gradient(90deg,#c8922a,#c8922a);"></div></div>'+
      '</div>';
    }).join('') :
    '<div class="empty-state">Нет данных</div>';

  if(msgChart) msgChart.destroy();
  if(memberChart) memberChart.destroy();

  Chart.defaults.color = '#888';
  msgChart = new Chart(document.getElementById('msgChart'), {
    type:'bar',
    data:{labels:d.daily_labels||[],datasets:[{label:'Сообщение',data:d.daily_messages||[],backgroundColor:'rgba(200,146,42,0.5)',borderColor:'#c8922a',borderWidth:2,borderRadius:6}]},
    options:{responsive:true,plugins:{legend:{labels:{color:'#ccc'}}},scales:{y:{ticks:{color:'#888'},grid:{color:'rgba(255,255,255,0.05)'}},x:{ticks:{color:'#888'},grid:{color:'rgba(255,255,255,0.05)'}}}}
  });

  memberChart = new Chart(document.getElementById('memberChart'), {
    type:'line',
    data:{labels:d.member_labels||[],datasets:[{label:'Участник',data:d.member_counts||[],borderColor:'#2ecc71',tension:0.4,fill:true,backgroundColor:'rgba(46,204,113,0.08)',pointBackgroundColor:'#2ecc71',pointRadius:4}]},
    options:{responsive:true,plugins:{legend:{labels:{color:'#ccc'}}},scales:{y:{ticks:{color:'#888'},grid:{color:'rgba(255,255,255,0.05)'}},x:{ticks:{color:'#888'},grid:{color:'rgba(255,255,255,0.05)'}}}}
  });
}

window.addEventListener('load', function(){ loadAnalytics(''); });
</script>
{% endblock %}
