{% extends "base.html" %}
{% block title %}Аналитика - Aether{% endblock %}
{% block page_title %}<i class="fas fa-chart-line" style="color:var(--ac);"></i> Аналитика сервера{% endblock %}
{% block content %}
<style>
  .chart-title{color:var(--ac);font-size:11.5px;text-transform:uppercase;letter-spacing:0.10em;margin-bottom:18px;display:flex;align-items:center;gap:8px;padding-bottom:12px;border-bottom:1px solid var(--line);font-weight:700;}
  .top-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:16px;}
  @media(max-width:900px){.top-grid{grid-template-columns:1fr;}}
  .top-item{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px solid var(--line);transition:all 0.18s var(--ease);}
  .top-item:last-child{border-bottom:none;}
  .top-item:hover{padding-left:6px;}
  .top-name{color:var(--text);font-size:13px;font-weight:500;}
  .top-val{color:var(--ac);font-weight:700;font-size:13px;}
  .top-rank{color:var(--text-3);font-size:11px;min-width:24px;font-weight:700;}
  .guild-select{width:100%;padding:12px 14px;background:rgba(10,9,7,0.7);border:1px solid var(--ac-line);border-radius:10px;color:var(--text);margin-bottom:16px;font-size:13.5px;font-family:Inter,sans-serif;transition:all 0.18s var(--ease);}
  .guild-select:focus{outline:none;border-color:var(--ac);box-shadow:0 0 0 3px rgba(212,168,67,0.12);}
  .empty-state{text-align:center;padding:30px;color:var(--text-3);font-style:italic;font-size:13px;}
  .bar-container{margin-bottom:12px;}
  .bar-label{display:flex;justify-content:space-between;margin-bottom:6px;font-size:12.5px;}
  .bar-track{height:8px;background:rgba(212,168,67,0.10);border-radius:99px;overflow:hidden;position:relative;}
  .bar-fill{height:100%;background:linear-gradient(90deg, #d4a843, #f0c75e);border-radius:99px;transition:width 1s var(--ease-out);position:relative;overflow:hidden;}
  .bar-fill::after{content:'';position:absolute;inset:0;background:linear-gradient(90deg, transparent, rgba(255,255,255,0.3), transparent);background-size:200% 100%;animation:shimmer 2.4s ease infinite;}
</style>

<select id="guild-select" class="guild-select" onchange="loadAnalytics()">
  <option value="">Выберите сервер...</option>
</select>

<div class="top-grid">
  <div class="section">
    <div class="chart-title"><i class="fas fa-trophy"></i> Самые активные участники</div>
    <div id="top-members"><div class="empty-state">Загрузка...</div></div>
  </div>
  <div class="section">
    <div class="chart-title"><i class="fas fa-hashtag"></i> Самые активные каналы</div>
    <div id="top-channels"><div class="empty-state">Загрузка...</div></div>
  </div>
</div>

<div class="section">
  <div class="chart-title"><i class="fas fa-chart-bar"></i> Сообщений в день (последние 7 дней)</div>
  <canvas id="msgChart" height="80"></canvas>
</div>

<div class="section">
  <div class="chart-title"><i class="fas fa-user-plus"></i> Рост участников</div>
  <canvas id="memberChart" height="80"></canvas>
</div>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script>
var MAIN_GID = '{{ main_guild_id }}';
var msgChart, memberChart;

async function loadAnalytics(gid_param) {
  var gid = gid_param || MAIN_GID;
  if(!gid) return;
  var r = await fetch('/api/guild/'+gid+'/analytics');
  var d = await r.json();

  var topMembers = d.top_members||[];
  var maxM = topMembers[0] ? topMembers[0].messages : 1;
  document.getElementById('top-members').innerHTML = topMembers.length ?
    topMembers.map(function(m,i){
      var pct = Math.round((m.messages/maxM)*100);
      return '<div class="bar-container">'+
        '<div class="bar-label"><span class="top-name"><span class="top-rank">#'+(i+1)+'</span> '+m.name+'</span><span class="top-val">'+m.messages.toLocaleString()+' сообщ.</span></div>'+
        '<div class="bar-track"><div class="bar-fill" style="width:'+pct+'%;"></div></div>'+
      '</div>';
    }).join('') :
    '<div class="empty-state">Нет данных</div>';

  var topChannels = d.top_channels||[];
  var maxC = topChannels[0] ? topChannels[0].messages : 1;
  document.getElementById('top-channels').innerHTML = topChannels.length ?
    topChannels.map(function(c,i){
      var pct = Math.round((c.messages/maxC)*100);
      return '<div class="bar-container">'+
        '<div class="bar-label"><span class="top-name"><span class="top-rank">#'+(i+1)+'</span> #'+c.name+'</span><span class="top-val">'+c.messages.toLocaleString()+' сообщ.</span></div>'+
        '<div class="bar-track"><div class="bar-fill" style="width:'+pct+';"></div></div>'+
      '</div>';
    }).join('') :
    '<div class="empty-state">Нет данных</div>';

  if(msgChart) msgChart.destroy();
  if(memberChart) memberChart.destroy();

  Chart.defaults.color = '#b6a47b';
  Chart.defaults.font.family = 'Inter';

  msgChart = new Chart(document.getElementById('msgChart'), {
    type:'bar',
    data:{labels:d.daily_labels||[],datasets:[{
      label:'Сообщения',
      data:d.daily_messages||[],
      backgroundColor:'rgba(212,168,67,0.55)',
      borderColor:'#d4a843',
      borderWidth:2,
      borderRadius:8,
      hoverBackgroundColor:'rgba(240,199,94,0.7)'
    }]},
    options:{
      responsive:true,
      plugins:{legend:{labels:{color:'#b6a47b', font:{size:12, weight:'600'}}}},
      scales:{
        y:{ticks:{color:'#7a6a48', font:{size:11}}, grid:{color:'rgba(212,168,67,0.06)'}, beginAtZero:true},
        x:{ticks:{color:'#7a6a48', font:{size:11}}, grid:{color:'rgba(212,168,67,0.06)'}}
      }
    }
  });

  memberChart = new Chart(document.getElementById('memberChart'), {
    type:'line',
    data:{labels:d.member_labels||[],datasets:[{
      label:'Участники',
      data:d.member_counts||[],
      borderColor:'#34d399',
      tension:0.4,
      fill:true,
      backgroundColor:'rgba(52,211,153,0.10)',
      pointBackgroundColor:'#34d399',
      pointBorderColor:'#0a0907',
      pointBorderWidth:2,
      pointRadius:5,
      pointHoverRadius:7,
      borderWidth:2.5
    }]},
    options:{
      responsive:true,
      plugins:{legend:{labels:{color:'#b6a47b', font:{size:12, weight:'600'}}}},
      scales:{
        y:{ticks:{color:'#7a6a48', font:{size:11}}, grid:{color:'rgba(212,168,67,0.06)'}},
        x:{ticks:{color:'#7a6a48', font:{size:11}}, grid:{color:'rgba(212,168,67,0.06)'}}
      }
    }
  });
}

window.addEventListener('load', function(){ loadAnalytics(''); });
</script>
{% endblock %}
