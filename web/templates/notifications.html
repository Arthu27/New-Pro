{% extends "base.html" %}
{% block title %}Уведомления — Aether{% endblock %}
{% block page_title %}<i class="fas fa-bell" style="color:var(--ac);"></i> Уведомления{% endblock %}
{% block content %}
<style>
.notif-card{
  background:var(--surface) !important;
  border:1px solid var(--line) !important;
  border-radius:var(--r-lg) !important;
  padding:18px 20px !important;
  margin-bottom:12px !important;
  display:flex;
  gap:14px;
  align-items:flex-start;
  transition:all 0.22s var(--ease) !important;
  position:relative;
  overflow:hidden;
}
.notif-card:hover{border-color:var(--ac-line) !important;transform:translateY(-1px);box-shadow:var(--shadow-md);}
.notif-card.unread{
  border-color:var(--ac-line) !important;
  background:var(--surface-2) !important;
  box-shadow:0 0 0 1px var(--ac-line), 0 6px 20px rgba(212,168,67,0.08);
}
.notif-card.unread::before{content:'';position:absolute;top:0;left:0;width:3px;height:100%;background:linear-gradient(180deg, var(--ac-2), var(--ac-3));}
.notif-icon{
  width:44px;height:44px;border-radius:12px;
  background:var(--ac-soft);
  display:flex;align-items:center;justify-content:center;flex-shrink:0;
  border:1px solid var(--ac-line);
}
.notif-icon i{color:var(--ac);font-size:16px;}
.notif-body{flex:1;min-width:0;}
.notif-title{color:var(--text);font-size:14.5px;font-weight:700;margin-bottom:5px;letter-spacing:-0.01em;}
.notif-msg{color:rgba(245,236,210,0.7);font-size:13px;line-height:1.6;}
.notif-meta{color:var(--text-3);font-size:11px;margin-top:8px;display:flex;align-items:center;gap:8px;flex-wrap:wrap;}
.notif-meta i{color:var(--ac);font-size:10px;}
.unread-dot{
  width:10px;height:10px;
  background:linear-gradient(135deg, var(--ac-2), var(--ac-3));
  border-radius:50%;
  flex-shrink:0;
  margin-top:6px;
  box-shadow:0 0 8px var(--ac-glow);
  animation:pulse 2s ease-in-out infinite;
}
.empty-state{padding:60px 20px;text-align:center;color:var(--text-3);}
.empty-state i{font-size:48px;color:var(--ac);opacity:0.4;margin-bottom:15px;display:block;}
.empty-state p{margin:0;font-size:13px;}
</style>

<div id="notif-list"><div class="empty-state"><i class="fas fa-spinner fa-spin"></i><p>Загрузка...</p></div></div>

<script>
function esc(s) { return String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;'); }

async function loadNotifs() {
  var r = await fetch('/api/my-notifications');
  var notifs = await r.json();
  var box = document.getElementById('notif-list');
  if (!notifs.length) {
    box.innerHTML = '<div class="empty-state"><i class="fas fa-bell-slash"></i><p>Пока уведомлений нет</p></div>';
    return;
  }
  box.innerHTML = notifs.map(function(n) {
    var d = new Date(n.created_at);
    var unread = !n.read;
    return '<div class="notif-card'+(unread?' unread':'')+'">' +
      '<div class="notif-icon"><i class="fas fa-bell"></i></div>' +
      '<div class="notif-body">' +
        '<div class="notif-title">'+esc(n.title)+'</div>' +
        '<div class="notif-msg">'+esc(n.message)+'</div>' +
        '<div class="notif-meta"><i class="fas fa-user"></i> '+esc(n.from)+' <span style="color:var(--text-4);">•</span> <i class="fas fa-clock"></i> '+d.toLocaleString('ru-RU')+'</div>' +
      '</div>' +
      (unread?'<div class="unread-dot"></div>':'') +
    '</div>';
  }).join('');
}
loadNotifs();
</script>
{% endblock %}
