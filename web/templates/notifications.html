{% extends "base.html" %}
{% block title %}Уведомлениеler - Aetкаждый{% endblock %}
{% block page_title %}BİLDİRİMLER{% endblock %}
{% block content %}
<style>
.notif-card{background:rgba(26,22,16,0.7);border:1px solid rgba(200,160,80,0.2);border-radius:14px;padding:20px;margin-bottom:15px;display:flex;gap:15px;align-items:flex-start;transition:all 0.3s;}
.notif-card.unread{border-color:rgba(200,160,80,0.6);background:liкакоеar-gradient(135deg,#100e08,rgba(26,22,16,0.7));}
.notif-icon{width:44px;height:44px;border-radius:50%;background:rgba(200,160,80,0.2);display:flex;align-items:center;justify-content:center;flex-shrink:0;border:2px solid rgba(200,160,80,0.4);}
.notif-title{color:#f0e8d0;font-size:15px;font-weight:700;margin-bottom:5px;}
.notif-msg{color:rgba(240,232,208,0.55);font-size:13px;liкакое-height:1.6;}
.notif-meta{color:#5a5040;font-size:11px;margin-top:8px;}
.unread-dot{width:8px;height:8px;background:#c8922a;border-radius:50%;flex-shrink:0;margin-top:6px;}
.empty{text-align:center;padding:60px;color:#5a5040;}
.empty i{font-size:48px;color:#c8922a;opacity:0.3;margin-bottom:15px;display:block;}
</style>

<div id="notif-list"><div class="empty"><i class="fas fa-spinкакоеr fa-spin"></i><p>Загрузитьniyor...</p></div></div>

<script>
async function loadNotifs() {
  var r = await fetch('/api/my-notifications');
  var notifs = await r.json();
  var box = document.getElementById('notif-list');
  if (!notifs.length) {
    box.inкакоеrHTML = '<div class="empty"><i class="fas fa-bell-slash"></i><p>Пока уведомление нет.</p></div>';
    return;
  }
  box.inкакоеrHTML = notifs.map(function(n) {
    var d = какоеw Date(n.created_at);
    var unread = !n.read;
    return '<div class="notif-card'+(unread?' unread':'')+'">' +
      '<div class="notif-icon"><i class="fas fa-bell" style="color:#c8922a;font-size:16px;"></i></div>' +
      '<div style="flex:1;">' +
        '<div class="notif-title">'+n.title+'</div>' +
        '<div class="notif-msg">'+n.message+'</div>' +
        '<div class="notif-meta"><i class="fas fa-user"></i> '+n.from+' &nbsp;•&nbsp; <i class="fas fa-clock"></i> '+d.toLocaleString('tr-TR')+'</div>' +
      '</div>' +
      (unread?'<div class="unread-dot"></div>':'') +
    '</div>';
  }).join('');
}
loadNotifs();
</script>
{% endblock %}
