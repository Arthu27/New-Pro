{% extends "base.html" %}
{% block title %}Профильim{% endblock %}
{% block page_title %}👤 Профильim{% endblock %}
{% block content %}
<style>
.mp-grid{display:grid;grid-template-columns:300px 1fr;gap:16px;}
.mp-card{background:rgba(26,22,16,0.7);border:1px solid rgba(212,168,67,0.1);border-radius:14px;padding:20px;margin-bottom:14px;}
.mp-card h2{font-size:11px;font-weight:700;color:rgba(240,232,208,0.4);text-transform:uppercase;letter-spacing:0.1em;margin-bottom:14px;padding-bottom:10px;border-bottom:1px solid rgba(212,168,67,0.08);}
.mp-avatar{width:80px;height:80px;border-radius:50%;border:3px solid rgba(212,168,67,0.3);margin-bottom:12px;}
.mp-stat{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid rgba(212,168,67,0.05);font-size:12px;}
.mp-stat:last-child{border-bottom:none;}
.mp-stat-key{color:rgba(240,232,208,0.4);}
.mp-stat-val{color:#f0e8d0;font-weight:600;}
.warn-pill{display:inline-block;padding:3px 10px;border-radius:99px;font-size:10px;font-weight:700;background:rgba(255,165,2,0.1);color:#ffa502;border:1px solid rgba(255,165,2,0.2);}
.no-warn{display:inline-block;padding:3px 10px;border-radius:99px;font-size:10px;font-weight:700;background:rgba(46,213,115,0.1);color:#2ed573;border:1px solid rgba(46,213,115,0.2);}
@media(max-width:768px){.mp-grid{grid-template-columns:1fr;}}
</style>

<div id="mp-loading" style="color:rgba(240,232,208,0.3);font-size:13px;">Загрузка...</div>
<div id="mp-content"  class="mp-grid"></div>

<script>
async function loadПрофильe() {
  try {
    var d = await fetch('/api/my-profс').then(r => r.json());
    if (d.error) { document.getElementById('mp-loading').textContent = '❌ ' + d.error; return; }

    document.getElementById('mp-loading').style.display = 'none';
    var el = document.getElementById('mp-content');
    el.style.display = 'grid';

    var warns = d.предупреждs || [];
    var balance = d.balance || 0;
    var invites = d.invites || 0;
    var voiceSecs = d.voice_seconds || 0;
    var voiceHours = Math.floor(voiceSecs / 3600);
    var voiceMins = Math.floor((voiceSecs % 3600) / 60);

    // Sol столбец
    var leftHtml = '<div>' +
      '<div class="mp-card" style="text-align:center;">' +
        (d.avatar ? '<img src="' + d.avatar + '" class="mp-avatar">' : '<div class="mp-avatar" style="background:rgba(212,168,67,0.1);display:flex;align-items:center;justify-content:center;font-size:32px;margin:0 auto 12px;">👤</div>') +
        '<div style="font-size:18px;font-weight:800;color:#f0e8d0;margin-bottom:4px;">' + (d.display_name||d.username) + '</div>' +
        '<div style="font-size:12px;color:rgba(240,232,208,0.4);margin-bottom:12px;">@' + d.username + '</div>' +
        (warns.length ? '<span class="warn-pill">⚠️ ' + warns.length + ' предупрежд</span>' : '<span class="no-warn">✅ Чисто</span>') +
      '</div>' +
      '<div class="mp-card">' +
        '<h2>📊 Статистика</h2>' +
        '<div class="mp-stat"><span class="mp-stat-key">💰 Баланс</span><span class="mp-stat-val" style="color:#c8922a;">' + balance.toLocaleString() + ' монет</span></div>' +
        '<div class="mp-stat"><span class="mp-stat-key">📨 Приглашения</span><span class="mp-stat-val">' + invites + ' человек</span></div>' +
        '<div class="mp-stat"><span class="mp-stat-key">🔊 Время в голосе</span><span class="mp-stat-val">' + voiceHours + 's ' + voiceMins + 'dk</span></div>' +
        '<div class="mp-stat"><span class="mp-stat-key">⚠️ Warning</span><span class="mp-stat-val">' + warns.length + '</span></div>' +
      '</div>' +
    '</div>';

    // Правый столбец
    var rightHtml = '<div>' +
      '<div class="mp-card">' +
        '<h2>⚠️ Мои предупреждения</h2>' +
        (warns.length ? warns.map(function(w){
          return '<div style="padding:10px 12px;background:rgba(255,165,2,0.06);border:1px solid rgba(255,165,2,0.1);border-radius:8px;margin-bottom:6px;">' +
            '<div style="font-size:11px;color:#ffa502;font-weight:700;">#' + w.id + ' — ' + (w.timestamp||'').slice(0,10) + '</div>' +
            '<div style="font-size:12px;color:rgba(240,232,208,0.5);margin-top:3px;">' + (w.reason||'Не belirtildi') + '</div>' +
          '</div>';
        }).join('') : '<div style="text-align:center;padding:20px;color:rgba(240,232,208,0.25);font-size:13px;">✅ Никогда предупреждn yok!</div>') +
      '</div>' +
    '</div>';

    el.innerHTML = leftHtml + rightHtml;
  } catch(e) {
    document.getElementById('mp-loading').textContent = '❌ Загруз: ' + e.message;
  }
}

loadПрофильe();
</script>
{% endblock %}
