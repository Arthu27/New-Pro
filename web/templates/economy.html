{% extends "base.html" %}
{% block title %}Экономика - Aether{% endblock %}
{% block page_title %}<i class="fas fa-coins" style="color:var(--ac);"></i> Экономика сервера{% endblock %}
{% block content %}

<div class="eco-tabs">
  <button class="eco-tab active" data-tab="leaderboard"><i class="fas fa-trophy"></i> Топ</button>
  <button class="eco-tab" data-tab="shop"><i class="fas fa-shopping-cart"></i> Магазин</button>
  <button class="eco-tab" data-tab="rich"><i class="fas fa-gem"></i> Богатые</button>
</div>

<div id="tab-leaderboard" class="tab-content">
  <div class="eco-grid">
    <div class="eco-card"><div class="eco-icon"><i class="fas fa-coins"></i></div><div class="eco-val" id="stat-total">-</div><div class="eco-lbl">В обращении</div></div>
    <div class="eco-card"><div class="eco-icon"><i class="fas fa-users"></i></div><div class="eco-val" id="stat-users">-</div><div class="eco-lbl">Участников</div></div>
    <div class="eco-card"><div class="eco-icon"><i class="fas fa-crown"></i></div><div class="eco-val" id="stat-richest" style="color:#c8922a;">-</div><div class="eco-lbl">Топ 1</div></div>
  </div>

  <div class="eco-box">
    <div class="eco-head">
      <div class="eco-title"><i class="fas fa-trophy"></i> Таблица лидеров</div>
      <span class="eco-count" id="lb-count">-</span>
    </div>
    <div class="eco-body" id="lb-body">
      <p style="text-align:center;color:var(--text-3);padding:30px;font-size:12px;"><i class="fas fa-spinner fa-spin"></i></p>
    </div>
  </div>
</div>

<div id="tab-shop" class="tab-content" style="display:none;">
  <div class="eco-box">
    <div class="eco-head">
      <div class="eco-title"><i class="fas fa-shopping-cart"></i> Магазин</div>
      <button class="btn btn-primary" id="add-item"><i class="fas fa-plus"></i> Добавить</button>
    </div>
    <div class="shop-grid" id="shop-grid">
      <p style="grid-column:1/-1;text-align:center;color:var(--text-3);padding:30px;font-size:12px;">Магазин не найден</p>
    </div>
  </div>
</div>

<div id="tab-rich" class="tab-content" style="display:none;">
  <div class="eco-box">
    <div class="eco-head">
      <div class="eco-title"><i class="fas fa-gem"></i> Богатые участники</div>
    </div>
    <div class="eco-body" id="rich-body">
      <p style="text-align:center;color:var(--text-3);padding:30px;font-size:12px;"><i class="fas fa-spinner fa-spin"></i></p>
    </div>
  </div>
</div>

<script>
(function () {
  'use strict';
  function $(id) { return document.getElementById(id); }
  function esc(s) { return String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;'); }

  // Tabs
  document.querySelectorAll('.eco-tab').forEach(function (t) {
    t.addEventListener('click', function () {
      document.querySelectorAll('.eco-tab').forEach(function (x) { x.classList.remove('active'); });
      t.classList.add('active');
      var tab = t.getAttribute('data-tab');
      document.querySelectorAll('.tab-content').forEach(function (c) { c.style.display = 'none'; });
      $('tab-' + tab).style.display = 'block';
    });
  });

  // Mock data (gercek API'lar eklenebilir)
  var lbData = [
    { rank: 1, name: 'TopUser', coins: 50000 },
    { rank: 2, name: 'ProGamer', coins: 35000 },
    { rank: 3, name: 'Newbie', coins: 12000 }
  ];
  var shopItems = [
    { icon: 'fa-crown', name: 'VIP Роль', price: 5000 },
    { icon: 'fa-palette', name: 'Цвет ник', price: 1500 },
    { icon: 'fa-gift', name: 'Подарок', price: 800 }
  ];

  function renderLeaderboard() {
    $('lb-count').textContent = lbData.length;
    var html = '<table><thead><tr><th>#</th><th>Участник</th><th>Баланс</th><th>Уровень</th></tr></thead><tbody>';
    var max = lbData[0] ? lbData[0].coins : 1;
    lbData.forEach(function (u) {
      var pct = Math.round(u.coins / max * 100);
      html += '<tr><td><span style="color:#c8922a;font-weight:700;">#' + u.rank + '</span></td>' +
        '<td style="font-weight:600;">' + esc(u.name) + '</td>' +
        '<td><span class="coin">' + u.coins.toLocaleString() + '</span><div class="bar"><div class="bar-fill" style="width:' + pct + '%;"></div></div></td>' +
        '<td style="color:var(--text-3);">' + Math.floor(u.coins / 1000) + '</td></tr>';
    });
    html += '</tbody></table>';
    $('lb-body').innerHTML = html;
    $('stat-total').textContent = lbData.reduce(function (a, b) { return a + b.coins; }, 0).toLocaleString();
    $('stat-users').textContent = lbData.length;
    $('stat-richest').textContent = lbData[0] ? lbData[0].coins.toLocaleString() : '-';
  }

  function renderShop() {
    if (!shopItems.length) {
      $('shop-grid').innerHTML = '<p style="grid-column:1/-1;text-align:center;color:var(--text-3);padding:30px;font-size:12px;">Магазин не найден</p>';
      return;
    }
    var html = '';
    shopItems.forEach(function (i) {
      html += '<div class="shop-item">' +
        '<div class="shop-icon"><i class="fas ' + i.icon + '"></i></div>' +
        '<div class="shop-name">' + esc(i.name) + '</div>' +
        '<div class="shop-price">' + i.price.toLocaleString() + ' <i class="fas fa-coins" style="font-size:9px;"></i></div>' +
      '</div>';
    });
    $('shop-grid').innerHTML = html;
  }

  function renderRich() {
    var html = '<table><thead><tr><th>#</th><th>Участник</th><th>Баланс</th><th>% от total</th></tr></thead><tbody>';
    var total = lbData.reduce(function (a, b) { return a + b.coins; }, 0);
    lbData.forEach(function (u, i) {
      var pct = total ? Math.round(u.coins / total * 100) : 0;
      html += '<tr><td>' + (i + 1) + '</td><td style="font-weight:600;">' + esc(u.name) + '</td>' +
        '<td><span class="coin">' + u.coins.toLocaleString() + '</span></td>' +
        '<td><div style="display:flex;align-items:center;gap:6px;"><div class="bar" style="flex:1;"><div class="bar-fill" style="width:' + pct + '%;"></div></div><span style="font-size:10px;color:var(--text-3);">' + pct + '%</span></div></td></tr>';
    });
    html += '</tbody></table>';
    $('rich-body').innerHTML = html;
  }

  function init() {
    renderLeaderboard();
    renderShop();
    renderRich();
  }

  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', init);
  else init();
})();
</script>
{% endblock %}
