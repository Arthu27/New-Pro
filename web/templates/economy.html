{% extends "base.html" %}
{% block title %}Экономика - Aether{% endblock %}
{% block page_title %}Экономика сервера{% endblock %}
{% block content %}
<style>
.eco-tabs{display:flex;gap:6px;margin-bottom:14px;flex-wrap:wrap;}
.eco-tab{padding:7px 14px;background:rgba(255,255,255,0.03);border:1px solid rgba(212,168,67,0.12);border-radius:99px;cursor:pointer;font-size:11px;font-weight:600;color:rgba(240,232,208,0.6);transition:all 0.15s;}
.eco-tab:hover{border-color:rgba(212,168,67,0.3);color:#f0e8d0;}
.eco-tab.active{background:#c8922a;color:#100e08;border-color:#c8922a;}

.eco-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:10px;margin-bottom:14px;}
.eco-card{background:rgba(26,22,16,0.7);border:1px solid rgba(212,168,67,0.1);border-radius:12px;padding:12px 14px;text-align:center;animation:fadeUp 0.3s ease-out both;}
@keyframes fadeUp{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
.eco-icon{width:32px;height:32px;border-radius:8px;background:rgba(212,168,67,0.12);color:#c8922a;display:flex;align-items:center;justify-content:center;font-size:13px;margin:0 auto 6px;}
.eco-val{font-size:18px;font-weight:800;color:#f0e8d0;}
.eco-lbl{font-size:9px;color:#5a5040;text-transform:uppercase;letter-spacing:0.05em;margin-top:2px;}

.eco-box{background:rgba(26,22,16,0.7);border:1px solid rgba(212,168,67,0.08);border-radius:12px;overflow:hidden;margin-bottom:12px;}
.eco-head{padding:10px 14px;border-bottom:1px solid rgba(212,168,67,0.07);display:flex;justify-content:space-between;align-items:center;}
.eco-title{font-size:10px;font-weight:700;color:rgba(240,232,208,0.55);text-transform:uppercase;letter-spacing:0.08em;display:flex;align-items:center;gap:7px;}
.eco-title i{color:#c8922a;}
.eco-count{font-size:10px;color:#5a5040;background:rgba(212,168,67,0.06);padding:2px 8px;border-radius:99px;}
.eco-body{max-height:420px;overflow-y:auto;overflow-anchor:none;}

table{width:100%;border-collapse:collapse;font-size:11px;}
th,td{padding:6px 12px;text-align:left;border-bottom:1px solid rgba(212,168,67,0.05);}
th{background:rgba(212,168,67,0.04);color:rgba(240,232,208,0.35);font-weight:600;text-transform:uppercase;letter-spacing:0.06em;font-size:9px;position:sticky;top:0;}
tr:hover td{background:rgba(212,168,67,0.04);}

.coin{color:#c8922a;font-weight:700;}
.bar{height:6px;background:rgba(255,255,255,0.04);border-radius:99px;overflow:hidden;margin-top:4px;}
.bar-fill{height:100%;background:linear-gradient(90deg,#c8922a,#e0a830);border-radius:99px;}

.btn{padding:7px 12px;border:none;border-radius:99px;cursor:pointer;font-weight:600;font-size:11px;font-family:Inter,sans-serif;}
.btn-primary{background:#c8922a;color:#100e08;}
.btn-primary:hover{background:#e0a830;}

.shop-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:8px;padding:10px;}
.shop-item{background:rgba(255,255,255,0.03);border:1px solid rgba(212,168,67,0.1);border-radius:10px;padding:10px;text-align:center;cursor:pointer;transition:all 0.15s;}
.shop-item:hover{border-color:rgba(212,168,67,0.3);transform:translateY(-2px);}
.shop-icon{font-size:24px;color:#c8922a;margin-bottom:6px;}
.shop-name{font-size:11px;font-weight:600;color:#f0e8d0;margin-bottom:3px;}
.shop-price{font-size:11px;color:#c8922a;font-weight:700;}
</style>

<div class="eco-tabs">
  <button class="eco-tab active" data-tab="leaderboard"><i class="fas fa-trophy"></i> Топ</button>
  <button class="eco-tab" data-tab="shop"><i class="fas fa-shopping-cart"></i> Магазин</button>
  <button class="eco-tab" data-tab="rich"><i class="fas fa-gem"></i> Богатые</button>
</div>

<div id="tab-leaderboard" class="tab-content">
  <div class="eco-grid">
    <div class="eco-card"><div class="eco-icon"><i class="fas fa-coins"></i></div><div class="eco-val" id="stat-total">-</div><div class="eco-lbl">В обращении</div></div>
    <div class="eco-card"><div class="eco-icon"><i class="fas fa-users"></i></div><div class="eco-val" id="stat-users">-</div><div class="eco-lbl">Участников</div></div>
    <div class="eco-card"><div class="eco-icon"><i class="fas fa-crown"></i></div><div class="eco-val" id="stat-richest" style="color:#c8922a;">-</div><div class="eco-lbl">Топ 1</div></div>
  </div>

  <div class="eco-box">
    <div class="eco-head">
      <div class="eco-title"><i class="fas fa-trophy"></i> Таблица лидеров</div>
      <span class="eco-count" id="lb-count">-</span>
    </div>
    <div class="eco-body" id="lb-body">
      <p style="text-align:center;color:#5a5040;padding:30px;font-size:12px;"><i class="fas fa-spinner fa-spin"></i></p>
    </div>
  </div>
</div>

<div id="tab-shop" class="tab-content" style="display:none;">
  <div class="eco-box">
    <div class="eco-head">
      <div class="eco-title"><i class="fas fa-shopping-cart"></i> Магазин</div>
      <button class="btn btn-primary" id="add-item"><i class="fas fa-plus"></i> Добавить</button>
    </div>
    <div class="shop-grid" id="shop-grid">
      <p style="grid-column:1/-1;text-align:center;color:#5a5040;padding:30px;font-size:12px;">Магазин не найден</p>
    </div>
  </div>
</div>

<div id="tab-rich" class="tab-content" style="display:none;">
  <div class="eco-box">
    <div class="eco-head">
      <div class="eco-title"><i class="fas fa-gem"></i> Богатые участники</div>
    </div>
    <div class="eco-body" id="rich-body">
      <p style="text-align:center;color:#5a5040;padding:30px;font-size:12px;"><i class="fas fa-spinner fa-spin"></i></p>
    </div>
  </div>
</div>

<script>
(function () {
  'use strict';
  function $(id) { return document.getElementById(id); }
  function esc(s) { return String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;'); }

  // Tabs
  document.querySelectorAll('.eco-tab').forEach(function (t) {
    t.addEventListener('click', function () {
      document.querySelectorAll('.eco-tab').forEach(function (x) { x.classList.remove('active'); });
      t.classList.add('active');
      var tab = t.getAttribute('data-tab');
      document.querySelectorAll('.tab-content').forEach(function (c) { c.style.display = 'none'; });
      $('tab-' + tab).style.display = 'block';
    });
  });

  // Mock data (gercek API'lar eklenebilir)
  var lbData = [
    { rank: 1, name: 'TopUser', coins: 50000 },
    { rank: 2, name: 'ProGamer', coins: 35000 },
    { rank: 3, name: 'Newbie', coins: 12000 }
  ];
  var shopItems = [
    { icon: 'fa-crown', name: 'VIP Роль', price: 5000 },
    { icon: 'fa-palette', name: 'Цвет ник', price: 1500 },
    { icon: 'fa-gift', name: 'Подарок', price: 800 }
  ];

  function renderLeaderboard() {
    $('lb-count').textContent = lbData.length;
    var html = '<table><thead><tr><th>#</th><th>Участник</th><th>Баланс</th><th>Уровень</th></tr></thead><tbody>';
    var max = lbData[0] ? lbData[0].coins : 1;
    lbData.forEach(function (u) {
      var pct = Math.round(u.coins / max * 100);
      html += '<tr><td><span style="color:#c8922a;font-weight:700;">#' + u.rank + '</span></td>' +
        '<td style="font-weight:600;">' + esc(u.name) + '</td>' +
        '<td><span class="coin">' + u.coins.toLocaleString() + '</span><div class="bar"><div class="bar-fill" style="width:' + pct + '%;"></div></div></td>' +
        '<td style="color:#5a5040;">' + Math.floor(u.coins / 1000) + '</td></tr>';
    });
    html += '</tbody></table>';
    $('lb-body').innerHTML = html;
    $('stat-total').textContent = lbData.reduce(function (a, b) { return a + b.coins; }, 0).toLocaleString();
    $('stat-users').textContent = lbData.length;
    $('stat-richest').textContent = lbData[0] ? lbData[0].coins.toLocaleString() : '-';
  }

  function renderShop() {
    if (!shopItems.length) {
      $('shop-grid').innerHTML = '<p style="grid-column:1/-1;text-align:center;color:#5a5040;padding:30px;font-size:12px;">Магазин не найден</p>';
      return;
    }
    var html = '';
    shopItems.forEach(function (i) {
      html += '<div class="shop-item">' +
        '<div class="shop-icon"><i class="fas ' + i.icon + '"></i></div>' +
        '<div class="shop-name">' + esc(i.name) + '</div>' +
        '<div class="shop-price">' + i.price.toLocaleString() + ' <i class="fas fa-coins" style="font-size:9px;"></i></div>' +
      '</div>';
    });
    $('shop-grid').innerHTML = html;
  }

  function renderRich() {
    var html = '<table><thead><tr><th>#</th><th>Участник</th><th>Баланс</th><th>% от total</th></tr></thead><tbody>';
    var total = lbData.reduce(function (a, b) { return a + b.coins; }, 0);
    lbData.forEach(function (u, i) {
      var pct = total ? Math.round(u.coins / total * 100) : 0;
      html += '<tr><td>' + (i + 1) + '</td><td style="font-weight:600;">' + esc(u.name) + '</td>' +
        '<td><span class="coin">' + u.coins.toLocaleString() + '</span></td>' +
        '<td><div style="display:flex;align-items:center;gap:6px;"><div class="bar" style="flex:1;"><div class="bar-fill" style="width:' + pct + '%;"></div></div><span style="font-size:10px;color:#5a5040;">' + pct + '%</span></div></td></tr>';
    });
    html += '</tbody></table>';
    $('rich-body').innerHTML = html;
  }

  function init() {
    renderLeaderboard();
    renderShop();
    renderRich();
  }

  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', init);
  else init();
})();
</script>
{% endblock %}
