{% extends "base.html" %}
{% block title %}Логи - Aether{% endblock %}
{% block page_title %}<i class="fas fa-clipboard-list" style="color:var(--ac);"></i> Логи модерации{% endblock %}
{% block content %}

<div class="logs-toolbar">
  <select id="guild-filter" class="filter-select"><option value="">Все серверы</option></select>
  <input type="text" id="search" class="search-input" placeholder="Поиск по логам (пользователь, причина, действие)...">
  <span id="logs-count" class="logs-count">0</span>
</div>

<div class="logs-stats" id="logs-stats">
  <div class="log-stat"><div class="log-stat-num" id="stat-total">-</div><div class="log-stat-lbl">Всего</div></div>
  <div class="log-stat"><div class="log-stat-num" id="stat-bans" style="color:var(--err);">-</div><div class="log-stat-lbl">Банов</div></div>
  <div class="log-stat"><div class="log-stat-num" id="stat-kicks" style="color:#f97316;">-</div><div class="log-stat-lbl">Киков</div></div>
  <div class="log-stat"><div class="log-stat-num" id="stat-warns" style="color:var(--warn);">-</div><div class="log-stat-lbl">Warn</div></div>
  <div class="log-stat"><div class="log-stat-num" id="stat-mutes" style="color:#a78bfa;">-</div><div class="log-stat-lbl">Мутов</div></div>
</div>

<div class="logs-box">
  <div class="logs-head">
    <div class="logs-title"><i class="fas fa-list"></i> Список действий</div>
  </div>
  <div class="logs-body" id="logs-body">
    <p class="empty"><i class="fas fa-spinner fa-spin"></i> Загрузка...</p>
  </div>
</div>

<script>
(function () {
  'use strict';
  function $(id) { return document.getElementById(id); }
  function esc(s) { return String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;'); }
  function fmtDate(iso) {
    if (!iso) return '-';
    try { var d = new Date(iso); return d.toLocaleString('ru-RU', {day:'2-digit', month:'2-digit', hour:'2-digit', minute:'2-digit'}); } catch (e) { return '-'; }
  }

  var allLogs = [];
  var guilds = [];

  var colors = { бан: 'var(--err)', кик: '#f97316', warn: 'var(--warn)', мьют: '#a78bfa', timeout: '#a78bfa', unбан: 'var(--ok)', unмьют: 'var(--ok)', lock: 'var(--info)', unlock: 'var(--ok)' };

  async function loadGuilds() {
    try {
      guilds = await fetch('/api/guilds').then(function (r) { return r.json(); });
      var sel = $('guild-filter');
      guilds.forEach(function (g) {
        var opt = document.createElement('option');
        opt.value = g.id;
        opt.textContent = g.name;
        sel.appendChild(opt);
      });
    } catch (e) { /* sessiz */ }
  }

  async function loadLogs() {
    $('logs-body').innerHTML = '<p class="empty"><i class="fas fa-spinner fa-spin"></i> Загрузка...</p>';
    try {
      allLogs = await window.fetchCachedJSON('/api/logs');
      render();
      updateStats();
    } catch (e) {
      $('logs-body').innerHTML = '<p class="empty"><i class="fas fa-exclamation-triangle" style="color:var(--err);"></i>Не удалось загрузить</p>';
    }
  }

  function updateStats() {
    var bans = 0, kicks = 0, warns = 0, mutes = 0;
    allLogs.forEach(function (l) {
      var a = (l.action || '').toLowerCase();
      if (a === 'бан') bans++;
      else if (a === 'кик') kicks++;
      else if (a === 'warn' || a.indexOf('warning') !== -1) warns++;
      else if (a.indexOf('мьют') !== -1 || a.indexOf('timeout') !== -1) mutes++;
    });
    $('stat-total').textContent = allLogs.length;
    $('stat-bans').textContent = bans;
    $('stat-kicks').textContent = kicks;
    $('stat-warns').textContent = warns;
    $('stat-mutes').textContent = mutes;
  }

  function render() {
    var guildFilter = $('guild-filter').value;
    var q = ($('search').value || '').toLowerCase();
    var filtered = allLogs.filter(function (l) {
      if (guildFilter && String(l.guild_id || '') !== guildFilter) return false;
      if (q) {
        var hay = ((l.action || '') + ' ' + (l.user_name || '') + ' ' + (l.mod_name || '') + ' ' + (l.reason || '')).toLowerCase();
        if (hay.indexOf(q) === -1) return false;
      }
      return true;
    });
    $('logs-count').textContent = filtered.length + ' / ' + allLogs.length;
    if (!filtered.length) {
      $('logs-body').innerHTML = '<p class="empty"><i class="fas fa-inbox"></i>Логи не найдены</p>';
      return;
    }
    var rows = filtered.slice(0, 200).map(function (l) {
      var a = (l.action || '?').toLowerCase();
      var c = colors[a] || 'var(--text-3)';
      return '<tr><td><span class="action-badge" style="background:' + c + '15;color:' + c + ';">' + esc(l.action || '?') + '</span></td>' +
        '<td style="font-size:12.5px;">' + esc(l.user_name || l.user_id || '-') + '</td>' +
        '<td style="color:var(--text-2);font-size:12px;">' + esc(l.mod_name || l.mod_id || '-') + '</td>' +
        '<td style="color:var(--text-3);max-width:160px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:12px;">' + esc(l.reason || '-') + '</td>' +
        '<td style="color:var(--text-3);font-size:11.5px;white-space:nowrap;">' + esc(fmtDate(l.timestamp)) + '</td></tr>';
    }).join('');
    $('logs-body').innerHTML = '<table><thead><tr><th>Действие</th><th>Цель</th><th>Модер.</th><th>Причина</th><th>Время</th></tr></thead><tbody>' + rows + '</tbody></table>';
  }

  function bind() {
    $('guild-filter').addEventListener('change', render);
    $('search').addEventListener('input', render);
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', function () { bind(); loadGuilds(); loadLogs(); });
  } else {
    bind(); loadGuilds(); loadLogs();
  }
})();
</script>
{% endblock %}
