{% extends "base.html" %}
{% block title %}Логи - Aether{% endblock %}
{% block page_title %}Логи модерации{% endblock %}
{% block content %}
<style>
.logs-toolbar{display:flex;gap:10px;margin-bottom:14px;flex-wrap:wrap;align-items:center;}
.filter-select,.search-input{padding:7px 11px;background:rgba(255,255,255,0.03);border:1px solid rgba(212,168,67,0.16);border-radius:8px;color:#f0e8d0;font-size:12px;font-family:Inter,sans-serif;}
.filter-select{flex:0 0 auto;min-width:140px;}
.search-input{flex:1;min-width:160px;}
.filter-select:focus,.search-input:focus{outline:none;border-color:rgba(212,168,67,0.45);}

.logs-stats{display:flex;gap:8px;margin-bottom:12px;flex-wrap:wrap;}
.log-stat{flex:1;min-width:80px;background:rgba(26,22,16,0.7);border:1px solid rgba(212,168,67,0.1);border-radius:10px;padding:8px 12px;text-align:center;}
.log-stat-num{font-size:16px;font-weight:800;color:#c8922a;}
.log-stat-lbl{font-size:9px;color:#5a5040;text-transform:uppercase;letter-spacing:0.05em;margin-top:1px;}

.logs-box{background:rgba(26,22,16,0.7);border:1px solid rgba(212,168,67,0.08);border-radius:12px;overflow:hidden;}
.logs-head{padding:10px 14px;border-bottom:1px solid rgba(212,168,67,0.07);display:flex;justify-content:space-between;align-items:center;}
.logs-title{font-size:10px;font-weight:700;color:rgba(240,232,208,0.55);text-transform:uppercase;letter-spacing:0.08em;display:flex;align-items:center;gap:7px;}
.logs-title i{color:#c8922a;font-size:11px;}
.logs-count{font-size:10px;color:#5a5040;background:rgba(212,168,67,0.06);padding:2px 8px;border-radius:99px;}

.logs-body{max-height:520px;overflow-y:auto;overflow-anchor:none;}
table{width:100%;border-collapse:collapse;}
th,td{padding:7px 12px;text-align:left;border-bottom:1px solid rgba(212,168,67,0.05);font-size:11px;}
th{background:rgba(212,168,67,0.04);color:rgba(240,232,208,0.35);font-weight:600;text-transform:uppercase;letter-spacing:0.06em;font-size:9px;position:sticky;top:0;z-index:1;}
tr:hover td{background:rgba(212,168,67,0.04);}
.action-badge{padding:2px 7px;border-radius:5px;font-size:9px;font-weight:600;text-transform:uppercase;letter-spacing:0.04em;}

.empty{text-align:center;padding:30px;color:#5a5040;font-size:12px;}

@media (max-width:700px){.logs-body{max-height:400px;}}
</style>

<div class="logs-toolbar">
  <select id="guild-filter" class="filter-select"><option value="">Все серверы</option></select>
  <input type="text" id="search" class="search-input" placeholder="Log ara... (kullanıcı, sebep, aksiyon)">
  <span id="logs-count" class="logs-count" style="margin-left:auto;">0</span>
</div>

<div class="logs-stats" id="logs-stats">
  <div class="log-stat"><div class="log-stat-num" id="stat-total">-</div><div class="log-stat-lbl">Всего</div></div>
  <div class="log-stat"><div class="log-stat-num" id="stat-bans" style="color:#ef4444;">-</div><div class="log-stat-lbl">Банов</div></div>
  <div class="log-stat"><div class="log-stat-num" id="stat-kicks" style="color:#f97316;">-</div><div class="log-stat-lbl">Киков</div></div>
  <div class="log-stat"><div class="log-stat-num" id="stat-warns" style="color:#c8922a;">-</div><div class="log-stat-lbl">Warn</div></div>
</div>

<div class="logs-box">
  <div class="logs-head">
    <div class="logs-title"><i class="fas fa-list"></i> Список действий</div>
  </div>
  <div class="logs-body" id="logs-body">
    <p class="empty"><i class="fas fa-spinner fa-spin"></i> Yükleniyor...</p>
  </div>
</div>

<script>
(function () {
  'use strict';
  function $(id) { return document.getElementById(id); }
  function esc(s) { return String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;'); }
  function fmtDate(iso) {
    if (!iso) return '-';
    try { var d = new Date(iso); return d.toLocaleString('ru-RU', {day:'2-digit', month:'2-digit', hour:'2-digit', minute:'2-digit'}); } catch (e) { return '-'; }
  }

  var allLogs = [];
  var guilds = [];

  var colors = { бан: '#ef4444', кик: '#f97316', warn: '#c8922a', мьют: '#c8922a', timeout: '#c8922a', unбан: '#4ade80', unмьют: '#4ade80', lock: '#60a5fa', unlock: '#4ade80' };

  async function loadGuilds() {
    try {
      guilds = await fetch('/api/guilds').then(function (r) { return r.json(); });
      var sel = $('guild-filter');
      guilds.forEach(function (g) {
        var opt = document.createElement('option');
        opt.value = g.id;
        opt.textContent = g.name;
        sel.appendChild(opt);
      });
    } catch (e) { /* sessiz */ }
  }

  async function loadLogs() {
    $('logs-body').innerHTML = '<p class="empty"><i class="fas fa-spinner fa-spin"></i> Yükleniyor...</p>';
    try {
      allLogs = await window.fetchCachedJSON('/api/logs');
      render();
      updateStats();
    } catch (e) {
      $('logs-body').innerHTML = '<p class="empty">Не удалось загрузить</p>';
    }
  }

  function updateStats() {
    var bans = 0, kicks = 0, warns = 0;
    allLogs.forEach(function (l) {
      var a = (l.action || '').toLowerCase();
      if (a === 'бан') bans++;
      else if (a === 'кик') kicks++;
      else if (a === 'warn' || a.indexOf('warning') !== -1) warns++;
    });
    $('stat-total').textContent = allLogs.length;
    $('stat-bans').textContent = bans;
    $('stat-kicks').textContent = kicks;
    $('stat-warns').textContent = warns;
  }

  function render() {
    var guildFilter = $('guild-filter').value;
    var q = ($('search').value || '').toLowerCase();
    var filtered = allLogs.filter(function (l) {
      if (guildFilter && String(l.guild_id || '') !== guildFilter) return false;
      if (q) {
        var hay = ((l.action || '') + ' ' + (l.user_name || '') + ' ' + (l.mod_name || '') + ' ' + (l.reason || '')).toLowerCase();
        if (hay.indexOf(q) === -1) return false;
      }
      return true;
    });
    $('logs-count').textContent = filtered.length + ' / ' + allLogs.length;
    if (!filtered.length) {
      $('logs-body').innerHTML = '<p class="empty">Log не найдено</p>';
      return;
    }
    var rows = filtered.slice(0, 200).map(function (l) {
      var a = (l.action || '?').toLowerCase();
      var c = colors[a] || '#5a5040';
      return '<tr><td><span class="action-badge" style="background:' + c + '18;color:' + c + ';border:1px solid ' + c + '33">' + esc(l.action || '?') + '</span></td>' +
        '<td style="font-size:10px;">' + esc(l.user_name || l.user_id || '-') + '</td>' +
        '<td style="color:rgba(240,232,208,0.5);font-size:10px;">' + esc(l.mod_name || l.mod_id || '-') + '</td>' +
        '<td style="color:#5a5040;max-width:140px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:10px;">' + esc(l.reason || '-') + '</td>' +
        '<td style="color:#5a5040;font-size:10px;white-space:nowrap;">' + esc(fmtDate(l.timestamp)) + '</td></tr>';
    }).join('');
    $('logs-body').innerHTML = '<table><thead><tr><th>Действие</th><th>Цель</th><th>Модер.</th><th>Причина</th><th>Время</th></tr></thead><tbody>' + rows + '</tbody></table>';
  }

  function bind() {
    $('guild-filter').addEventListener('change', render);
    $('search').addEventListener('input', render);
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', function () { bind(); loadGuilds(); loadLogs(); });
  } else {
    bind(); loadGuilds(); loadLogs();
  }
})();
</script>
{% endblock %}
