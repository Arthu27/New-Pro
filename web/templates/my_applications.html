{% extends "base.html" %}
{% block title %}Мои заявки — Aether{% endblock %}
{% block page_title %}<i class="fas fa-clipboard-list" ></i> Мои заявки{% endblock %}
{% block content %}

<div class="page-head">
  <div class="page-head-copy">
    <div class="eyebrow">Сообщество <span class="sep">·</span> Набор команды</div>
    <h1>Мои заявки</h1>
    <p class="lead">Твои заявки в администрацию и их текущий статус — всё в одном месте.</p>
  </div>
  <div class="page-head-actions">
    <a class="btn btn-primary" href="/member-apply"><i class="fas fa-plus"></i> Подать заявку</a>
  </div>
</div>

<style>

/* ── Статусная лента заявок ── */
.apps-list { display: flex; flex-direction: column; gap: 12px; max-width: 820px; }
.app-card {
  position: relative;
  background: var(--glass); border: 1px solid var(--line);
  border-radius: var(--r-lg); padding: 18px 20px;
  box-shadow: var(--shadow-1);
  transition: border-color .18s var(--ease), box-shadow .18s;
}
.app-card:hover { border-color: var(--ac-line); }
.app-card.approved { border-left: 4px solid var(--ok); }
.app-card.rejected { border-left: 4px solid var(--err); }
.app-card:not(.approved):not(.rejected) { border-left: 4px solid var(--warn); }
.app-header { display: flex; align-items: flex-start; gap: 10px; margin-bottom: 12px; }
.app-title { font-weight: 800; font-size: 15px; }
.app-id { font-size: 11.5px; color: var(--text-3); font-family: 'JetBrains Mono', monospace; margin-top: 3px; }
.status-badge {
  margin-left: auto; flex: 0 0 auto;
  display: inline-flex; align-items: center; gap: 6px;
  padding: 5px 12px; border-radius: 99px;
  font-size: 11.5px; font-weight: 700;
}
.status-pending { background: color-mix(in srgb, var(--warn) 14%, transparent); color: #b45309; border: 1px solid color-mix(in srgb, var(--warn) 35%, transparent); }
.status-approved { background: color-mix(in srgb, var(--ok) 14%, transparent); color: var(--ok); border: 1px solid color-mix(in srgb, var(--ok) 35%, transparent); }
.status-rejected { background: color-mix(in srgb, var(--err) 14%, transparent); color: var(--err); border: 1px solid color-mix(in srgb, var(--err) 35%, transparent); }
.app-fields{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}
@media(max-width:600px){.app-fields{grid-template-columns:1fr}}
.field-box{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:11px 14px}
.field-box .field-label{font-size:10.5px;color:var(--text-3);text-transform:uppercase;letter-spacing:.06em;font-weight:700;margin-bottom:4px}
.field-box .field-val{font-weight:600;color:var(--text);font-size:13px;line-height:1.5}
.app-header{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.app-id{font-size:12px;color:var(--text-3);font-family:'JetBrains Mono',monospace}
.review-note{display:flex;gap:10px;align-items:flex-start;margin-top:12px;padding:11px 14px;border-radius:12px;font-size:12.5px;color:var(--text-2);line-height:1.5}
.review-note i{margin-top:2px;color:var(--err)}
.review-note.approved{background:color-mix(in srgb,var(--ok) 9%,transparent);border:1px dashed color-mix(in srgb,var(--ok) 40%,transparent)}
.review-note.approved i{color:var(--ok)}
.review-note:not(.approved){background:color-mix(in srgb,var(--err) 8%,transparent);border:1px dashed color-mix(in srgb,var(--err) 35%,transparent)}

</style>



<div class="apps-list" id="apps-container"><div class="empty-state"><i class="fas fa-spinner fa-spin"></i><p>Загрузка…</p></div></div>

<script>
function timeAgo(iso) {
  var d = new Date(iso);
  var diff = Math.floor((Date.now()-d.getTime())/1000);
  if(diff<60) return diff+' сек назад';
  if(diff<3600) return Math.floor(diff/60)+' мин назад';
  if(diff<86400) return Math.floor(diff/3600)+' ч назад';
  return d.toLocaleDateString('ru-RU');
}
function esc(s) { return String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;'); }

async function loadApps() {
  var r = await fetch('/api/my-applications');
  var apps = await r.json();
  var box = document.getElementById('apps-container');
  if (!apps.length) {
    box.innerHTML = '<div class="empty-state"><i class="fas fa-clipboard-list"></i><p>Пока заявок нет</p><a class="btn btn-primary" href="/member-apply" style="margin-top:10px"><i class="fas fa-plus"></i> Подать заявку</a></div>';
    return;
  }
  box.innerHTML = apps.map(function(app) {
    var sc = app.status==='approved'?'status-approved':app.status==='rejected'?'status-rejected':'status-pending';
    var st = app.status==='approved'?'<i class="fas fa-circle-check"></i> Подтверждено'
      : app.status==='rejected' ? '<i class="fas fa-circle-xmark"></i> Отклонено'
      : '<i class="fas fa-hourglass-half"></i> Ожидание';
    var cc = app.status==='approved'?'approved':app.status==='rejected'?'rejected':'';
    var ans = app.answers||{};
    var reviewBox = '';
    if (app.status==='approved') {
      reviewBox = '<div class="review-note approved"><i class="fas fa-circle-check"></i><div>Заявка подтверждена!'+(app.review_note?'<br>Примечание: '+esc(app.review_note):'')+'</div></div>';
    } else if (app.status==='rejected') {
      reviewBox = '<div class="review-note"><i class="fas fa-circle-xmark"></i><div>Причина отказа: '+(app.review_note||'Не указана')+'</div></div>';
    }
    return '<div class="app-card '+cc+'">' +
      '<div class="app-header"><div><div class="app-title">'+esc(app.guild_name)+'</div><div class="app-id">'+esc(app.app_id)+' • '+timeAgo(app.timestamp)+'</div></div><span class="status-badge '+sc+'">'+st+'</span></div>' +
      '<div class="app-fields">' +
        '<div class="field-box"><div class="field-label">Возраст</div><div class="field-val">'+esc(ans.yas||'—')+'</div></div>' +
        '<div class="field-box"><div class="field-label">Активность</div><div class="field-val">'+esc(ans.activity||'—')+'</div></div>' +
      '</div>' +
      '<div class="field-box" style="margin-bottom:10px;grid-column:1/-1"><div class="field-label">Опыт</div><div class="field-val">'+esc(ans.tecrube||'—')+'</div></div>' +
      '<div class="field-box" style="grid-column:1/-1"><div class="field-label">Почему администратор?</div><div class="field-val">'+esc(ans.why||'—')+'</div></div>' +
      reviewBox +
    '</div>';
  }).join('');
}
loadApps();

  /* live: автообновление данных без перезагрузки (заказ владельца: «100%») */
  if (window.setLiveRefresh) window.setLiveRefresh(function () { try { loadApps(); } catch (e) {} }, 1500);
</script>
{% endblock %}
