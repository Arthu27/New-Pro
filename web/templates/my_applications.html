{% extends "base.html" %}
{% block title %}Заявка - Aether{% endblock %}
{% block page_title %}ЗАЯВКА{% endblock %}
{% block content %}
<style>
.app-card{background:rgba(26,22,16,0.7);border:1px solid rgba(200,160,80,0.3);border-radius:15px;padding:25px;margin-bottom:20px;transition:all 0.3s;}
.app-card.approved{border-color:rgba(46,204,113,0.5);}
.app-card.rejected{border-color:rgba(231,76,60,0.4);}
.app-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:15px;}
.app-id{color:#5a5040;font-size:12px;font-family:monospace;}
.status-badge{padding:5px 14px;border-radius:20px;font-size:12px;font-weight:700;}
.status-pending{background:rgba(212,168,67,0.2);color:#c8922a;border:1px solid #c8922a;}
.status-approved{background:rgba(46,204,113,0.2);color:#5ec47a;border:1px solid #2ecc71;}
.status-rejected{background:rgba(231,76,60,0.2);color:#e05555;border:1px solid #e74c3c;}
.app-fields{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:12px;margin-bottom:15px;}
.field-box{background:rgba(0,0,0,0.3);border-radius:8px;padding:10px 14px;}
.field-label{color:#c8922a;font-size:11px;text-transform:uppercase;letter-spacing:1px;margin-bottom:4px;}
.field-val{color:rgba(240,232,208,0.55);font-size:13px;}
.review-note{background:rgba(231,76,60,0.1);border:1px solid rgba(231,76,60,0.3);border-radius:8px;padding:12px;margin-top:10px;color:#e05555;font-size:13px;}
.review-note.approved{background:rgba(46,204,113,0.1);border-color:rgba(46,204,113,0.3);color:#5ec47a;}
.empty{text-align:center;padding:60px;color:#5a5040;}
.empty i{font-size:48px;color:#c8922a;opacity:0.3;margin-bottom:15px;display:block;}
</style>

<div id="apps-container"><div class="empty"><i class="fas fa-spinner fa-spin"></i><p>Загрузка...</p></div></div>

<script>
function timeAgo(iso) {
  var d = new Date(iso);
  var diff = Math.floor((Date.now()-d.getTime())/1000);
  if(diff<60) return diff+'sn до';
  if(diff<3600) return Math.floor(diff/60)+'dk до';
  if(diff<86400) return Math.floor(diff/3600)+'sa до';
  return d.toLocaleDateString('tr-TR');
}

async function loadApps() {
  var r = await fetch('/api/my-applications');
  var apps = await r.json();
  var box = document.getElementById('apps-container');
  if (!apps.length) {
    box.innerHTML = '<div class="empty"><i class="fas fa-clipboard-list"></i><p>Пока заявка yok.</p><a href="/member-apply" style="color:#c8922a;text-decoration:none;margin-top:10px;display:inline-block;"><i class="fas fa-plus"></i> Заявка Yap</a></div>';
    return;
  }
  box.innerHTML = apps.map(function(app) {
    var sc = app.status==='approved'?'status-approved':app.status==='rejected'?'status-rejected':'status-pending';
    var st = app.status==='approved'?'✅ Onaylandı':app.status==='rejected'?'❌ Reddedildi':'⏳ Bekleme';
    var cc = app.status==='approved'?'approved':app.status==='rejected'?'rejected':'';
    var ans = app.answers||{};
    var reviewBox = '';
    if (app.status==='approved') {
      reviewBox = '<div class="review-note approved"><i class="fas fa-check-circle"></i> Заявка podtverjdena!'+(app.review_note?'<br>Not: '+app.review_note:'')+'</div>';
    } else if (app.status==='rejected') {
      reviewBox = '<div class="review-note"><i class="fas fa-times-circle"></i> Red причина: '+(app.review_note||'Не belirtildi')+'</div>';
    }
    return '<div class="app-card '+cc+'">' +
      '<div class="app-header"><div><div style="color:#f0e8d0;font-weight:700;font-size:16px;">'+app.guild_name+'</div><div class="app-id">'+app.app_id+' • '+timeAgo(app.timestamp)+'</div></div><span class="status-badge '+sc+'">'+st+'</span></div>' +
      '<div class="app-fields">' +
        '<div class="field-box"><div class="field-label">Yaş</div><div class="field-val">'+ans.yas+'</div></div>' +
        '<div class="field-box"><div class="field-label">Активен</div><div class="field-val">'+ans.activity+'</div></div>' +
      '</div>' +
      '<div class="field-box" style="margin-bottom:10px;"><div class="field-label">Tecrübe</div><div class="field-val">'+ans.tecrube+'</div></div>' +
      '<div class="field-box"><div class="field-label">Почему Администратор?</div><div class="field-val">'+ans.why+'</div></div>' +
      reviewBox +
    '</div>';
  }).join('');
}
loadApps();
</script>
{% endblock %}
