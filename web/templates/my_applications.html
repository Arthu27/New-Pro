{% extends "base.html" %}
{% block title %}Мои заявки — Aether{% endblock %}
{% block page_title %}<i class="fas fa-clipboard-list" style="color:var(--ac);"></i> Мои заявки{% endblock %}
{% block content %}
<style>
.app-card{
  background:var(--surface) !important;
  border:1px solid var(--line) !important;
  border-radius:var(--r-lg) !important;
  padding:22px 24px !important;
  margin-bottom:14px !important;
  transition:all 0.25s var(--ease) !important;
  position:relative;
  overflow:hidden;
}
.app-card:hover{border-color:var(--ac-line) !important;transform:translateY(-2px);box-shadow:var(--shadow-md);}
.app-card.approved{border-color:rgba(52,211,153,0.40) !important;background:var(--surface-2) !important;}
.app-card.rejected{border-color:rgba(248,113,113,0.35) !important;background:var(--surface-2) !important;}
.app-card.approved::before{content:'';position:absolute;top:0;left:0;width:3px;height:100%;background:linear-gradient(180deg, var(--ok), #10b981);}
.app-card.rejected::before{content:'';position:absolute;top:0;left:0;width:3px;height:100%;background:linear-gradient(180deg, var(--err), #dc2626);}

.app-header{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:16px;flex-wrap:wrap;gap:10px;}
.app-title{color:var(--text);font-weight:700;font-size:16px;letter-spacing:-0.01em;}
.app-id{color:var(--text-3);font-size:11.5px;font-family:'JetBrains Mono', monospace;margin-top:3px;}
.status-badge{padding:5px 14px;border-radius:99px;font-size:11px;font-weight:700;letter-spacing:0.06em;text-transform:uppercase;}
.status-pending{background:rgba(212,168,67,0.12);color:var(--ac);border:1px solid var(--ac-line);}
.status-approved{background:rgba(52,211,153,0.12);color:var(--ok);border:1px solid rgba(52,211,153,0.30);}
.status-rejected{background:rgba(248,113,113,0.12);color:var(--err);border:1px solid rgba(248,113,113,0.30);}

.app-fields{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:10px;margin-bottom:14px;}
.field-box{
  background:rgba(0,0,0,0.30);
  border:1px solid var(--line);
  border-radius:10px;
  padding:10px 14px;
  transition:border-color 0.18s var(--ease);
}
.field-box:hover{border-color:var(--ac-line);}
.field-label{color:var(--ac);font-size:10.5px;text-transform:uppercase;letter-spacing:0.10em;margin-bottom:4px;font-weight:700;}
.field-val{color:rgba(245,236,210,0.75);font-size:13px;line-height:1.5;}

.review-note{
  background:rgba(248,113,113,0.10);
  border:1px solid rgba(248,113,113,0.30);
  border-radius:10px;
  padding:12px 16px;
  margin-top:12px;
  color:#fca5a5;
  font-size:13px;
  display:flex;
  align-items:flex-start;
  gap:10px;
}
.review-note i{color:var(--err);font-size:14px;margin-top:1px;flex-shrink:0;}
.review-note.approved{background:rgba(52,211,153,0.10);border-color:rgba(52,211,153,0.30);color:#6ee7b7;}
.review-note.approved i{color:var(--ok);}

.empty-state{padding:60px 20px;text-align:center;color:var(--text-3);}
.empty-state i{font-size:48px;color:var(--ac);opacity:0.4;margin-bottom:15px;display:block;}
.empty-state p{margin:0 0 16px 0;font-size:13px;}
.empty-state a{display:inline-flex;align-items:center;gap:6px;color:var(--ac);text-decoration:none;font-weight:600;padding:8px 16px;border:1px solid var(--ac-line);border-radius:99px;background:var(--ac-soft);transition:all 0.18s var(--ease);}
.empty-state a:hover{background:rgba(212,168,67,0.20);transform:translateY(-1px);}
</style>

<div id="apps-container"><div class="empty-state"><i class="fas fa-spinner fa-spin"></i><p>Загрузка...</p></div></div>

<script>
function timeAgo(iso) {
  var d = new Date(iso);
  var diff = Math.floor((Date.now()-d.getTime())/1000);
  if(diff<60) return diff+' сек назад';
  if(diff<3600) return Math.floor(diff/60)+' мин назад';
  if(diff<86400) return Math.floor(diff/3600)+' ч назад';
  return d.toLocaleDateString('ru-RU');
}
function esc(s) { return String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;'); }

async function loadApps() {
  var r = await fetch('/api/my-applications');
  var apps = await r.json();
  var box = document.getElementById('apps-container');
  if (!apps.length) {
    box.innerHTML = '<div class="empty-state"><i class="fas fa-clipboard-list"></i><p>Пока заявок нет</p><a href="/member-apply"><i class="fas fa-plus"></i> Подать заявку</a></div>';
    return;
  }
  box.innerHTML = apps.map(function(app) {
    var sc = app.status==='approved'?'status-approved':app.status==='rejected'?'status-rejected':'status-pending';
    var st = app.status==='approved'?'✓ Подтверждено':app.status==='rejected'?'✗ Отклонено':'⏳ Ожидание';
    var cc = app.status==='approved'?'approved':app.status==='rejected'?'rejected':'';
    var ans = app.answers||{};
    var reviewBox = '';
    if (app.status==='approved') {
      reviewBox = '<div class="review-note approved"><i class="fas fa-check-circle"></i><div>Заявка подтверждена!'+(app.review_note?'<br>Примечание: '+esc(app.review_note):'')+'</div></div>';
    } else if (app.status==='rejected') {
      reviewBox = '<div class="review-note"><i class="fas fa-times-circle"></i><div>Причина отказа: '+(app.review_note||'Не указана')+'</div></div>';
    }
    return '<div class="app-card '+cc+'">' +
      '<div class="app-header"><div><div class="app-title">'+esc(app.guild_name)+'</div><div class="app-id">'+esc(app.app_id)+' • '+timeAgo(app.timestamp)+'</div></div><span class="status-badge '+sc+'">'+st+'</span></div>' +
      '<div class="app-fields">' +
        '<div class="field-box"><div class="field-label">Возраст</div><div class="field-val">'+esc(ans.yas||'—')+'</div></div>' +
        '<div class="field-box"><div class="field-label">Активность</div><div class="field-val">'+esc(ans.activity||'—')+'</div></div>' +
      '</div>' +
      '<div class="field-box" style="margin-bottom:10px;"><div class="field-label">Опыт</div><div class="field-val">'+esc(ans.tecrube||'—')+'</div></div>' +
      '<div class="field-box"><div class="field-label">Почему администратор?</div><div class="field-val">'+esc(ans.why||'—')+'</div></div>' +
      reviewBox +
    '</div>';
  }).join('');
}
loadApps();
</script>
{% endblock %}
