{% extends "base.html" %}
{% block title %}Мои заявки — Aether{% endblock %}
{% block page_title %}<i class="fas fa-clipboard-list" ></i> Мои заявки{% endblock %}
{% block content %}
{% block page_hero %}
<div class="page-hero compact">
  <div class="page-hero-content">
    <div class="page-hero-greeting">
      <span class="dot"></span>
      <span>Мои заявки</span>
    </div>
    <h1>Мои заявки</h1>
    <p>Твои заявки и их текущий статус.</p>
  </div>
</div>
{% endblock %}



<div id="apps-container"><div class="empty-state"><i class="fas fa-spinner fa-spin"></i><p>Загрузка...</p></div></div>

<script>
function timeAgo(iso) {
  var d = new Date(iso);
  var diff = Math.floor((Date.now()-d.getTime())/1000);
  if(diff<60) return diff+' сек назад';
  if(diff<3600) return Math.floor(diff/60)+' мин назад';
  if(diff<86400) return Math.floor(diff/3600)+' ч назад';
  return d.toLocaleDateString('ru-RU');
}
function esc(s) { return String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;'); }

async function loadApps() {
  var r = await fetch('/api/my-applications');
  var apps = await r.json();
  var box = document.getElementById('apps-container');
  if (!apps.length) {
    box.innerHTML = '<div class="empty-state"><i class="fas fa-clipboard-list"></i><p>Пока заявок нет</p><a href="/member-apply"><i class="fas fa-plus"></i> Подать заявку</a></div>';
    return;
  }
  box.innerHTML = apps.map(function(app) {
    var sc = app.status==='approved'?'status-approved':app.status==='rejected'?'status-rejected':'status-pending';
    var st = app.status==='approved'?'✓ Подтверждено':app.status==='rejected'?'✗ Отклонено':'⏳ Ожидание';
    var cc = app.status==='approved'?'approved':app.status==='rejected'?'rejected':'';
    var ans = app.answers||{};
    var reviewBox = '';
    if (app.status==='approved') {
      reviewBox = '<div class="review-note approved"><i class="fas fa-check-circle"></i><div>Заявка подтверждена!'+(app.review_note?'<br>Примечание: '+esc(app.review_note):'')+'</div></div>';
    } else if (app.status==='rejected') {
      reviewBox = '<div class="review-note"><i class="fas fa-times-circle"></i><div>Причина отказа: '+(app.review_note||'Не указана')+'</div></div>';
    }
    return '<div class="app-card '+cc+'">' +
      '<div class="app-header"><div><div class="app-title">'+esc(app.guild_name)+'</div><div class="app-id">'+esc(app.app_id)+' • '+timeAgo(app.timestamp)+'</div></div><span class="status-badge '+sc+'">'+st+'</span></div>' +
      '<div class="app-fields">' +
        '<div class="field-box"><div class="field-label">Возраст</div><div class="field-val">'+esc(ans.yas||'—')+'</div></div>' +
        '<div class="field-box"><div class="field-label">Активность</div><div class="field-val">'+esc(ans.activity||'—')+'</div></div>' +
      '</div>' +
      '<div class="field-box"   style="margin-bottom: 10px;"><div class="field-label">Опыт</div><div class="field-val">'+esc(ans.tecrube||'—')+'</div></div>' +
      '<div class="field-box"><div class="field-label">Почему администратор?</div><div class="field-val">'+esc(ans.why||'—')+'</div></div>' +
      reviewBox +
    '</div>';
  }).join('');
}
loadApps();
</script>
{% endblock %}
