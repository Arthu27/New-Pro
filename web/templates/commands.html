{% extends "base.html" %}
{% block title %}Командаlar - Aether{% endblock %}
{% block page_title %}KOMUT MERKEZİ{% endblock %}
{% block content %}
<style>
.cmd-tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:20px;}
.cmd-tab{padding:7px 16px;border:1px solid rgba(200,160,80,0.25);background:transparent;color:rgba(240,232,208,0.5);border-radius:99px;cursor:pointer;font-size:12px;font-weight:600;transition:all 0.2s;font-family:Inter,sans-serif;}
.cmd-tab.active,.cmd-tab:hover{background:rgba(200,160,80,0.12);border-color:#c8922a;color:#f0e8d0;}
.cmd-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:12px;margin-bottom:24px;}
.cmd-card{background:rgba(26,22,16,0.7);border:1px solid rgba(200,160,80,0.2);border-radius:12px;padding:18px;cursor:pointer;transition:all 0.25s;position:relative;}
.cmd-card:hover{transform:translateY(-4px);border-color:#c8922a;box-shadow:0 8px 24px rgba(200,160,80,0.2);}
.cmd-card.locked{opacity:0.35;cursor:not-allowed;}
.cmd-card.locked:hover{transform:none;border-color:rgba(200,160,80,0.2);box-shadow:none;}
.cmd-icon{font-size:28px;margin-bottom:10px;}
.cmd-name{color:#c8922a;font-size:14px;font-weight:700;margin-bottom:4px;}
.cmd-desc{color:rgba(240,232,208,0.4);font-size:11px;line-height:1.4;}
.cmd-perm{position:absolute;top:10px;right:10px;font-size:10px;padding:2px 7px;border-radius:99px;font-weight:700;}
.perm-mod{background:rgba(46,204,113,0.15);color:#2ecc71;border:1px solid rgba(46,204,113,0.3);}
.perm-admin{background:rgba(200,146,42,0.15);color:#c8922a;border:1px solid rgba(200,146,42,0.3);}
.perm-owner{background:rgba(231,76,60,0.15);color:#e05555;border:1px solid rgba(231,76,60,0.3);}
.modal-overlay{display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.85);z-index:9999;justify-content:center;align-items:center;}
.modal-box{background:linear-gradient(135deg,#1a1610,#100e08);border:2px solid #c8922a;border-radius:20px;padding:32px;max-width:480px;width:92%;position:relative;box-shadow:0 20px 60px rgba(200,160,80,0.4);max-height:90vh;overflow-y:auto;}
.modal-box h2{color:#c8922a;margin-bottom:20px;font-size:18px;}
.form-group{margin-bottom:14px;}
.form-group label{display:block;color:rgba(240,232,208,0.55);margin-bottom:5px;font-size:11px;text-transform:uppercase;letter-spacing:1px;}
.form-group input,.form-group select,.form-group textarea{width:100%;padding:10px 13px;background:#100e08;border:2px solid rgba(200,160,80,0.3);border-radius:8px;color:#f0e8d0;font-size:13px;transition:border-color 0.2s;box-sizing:border-box;font-family:Inter,sans-serif;}
.form-group input:focus,.form-group select:focus,.form-group textarea:focus{outline:none;border-color:#c8922a;}
.dur-row{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
.btn-exec{background:#c8922a;color:#100e08;padding:11px 24px;border:none;border-radius:8px;cursor:pointer;font-size:14px;font-weight:700;margin-right:8px;transition:all 0.2s;font-family:Inter,sans-serif;}
.btn-exec:hover{background:#e0a830;transform:translateY(-1px);}
.btn-cancel{background:rgba(255,255,255,0.06);color:rgba(240,232,208,0.55);padding:11px 24px;border:none;border-radius:8px;cursor:pointer;font-size:14px;font-family:Inter,sans-serif;}
#result-msg{margin-top:14px;padding:11px;border-radius:8px;display:none;font-size:13px;}
.warn-dm-box{background:rgba(26,22,16,0.7);border:1px solid rgba(200,160,80,0.2);border-radius:14px;padding:22px;margin-top:8px;}
.warn-dm-title{color:#c8922a;font-size:12px;text-transform:uppercase;letter-spacing:2px;margin-bottom:14px;padding-ботtom:10px;border-ботtom:1px solid rgba(200,160,80,0.15);}
.section-title{color:rgba(240,232,208,0.35);font-size:10px;text-transform:uppercase;letter-spacing:2px;margin:20px 0 10px;font-weight:700;}
</style>

<div class="cmd-tabs" id="cmd-tabs">
  <button class="cmd-tab active" onclick="filterCat('all',this)">🔷 Все</button>
  <button class="cmd-tab" onclick="filterCat('mod',this)">🔨 Модерация</button>
  <button class="cmd-tab" onclick="filterCat('warn',this)">⚠️ Warning</button>
  <button class="cmd-tab" onclick="filterCat('util',this)">🛠️ Yardımcı</button>
  <button class="cmd-tab" onclick="filterCat('fun',this)">🎮 Развлечение</button>
  <button class="cmd-tab" onclick="filterCat('economy',this)">💰 Экономика</button>
  <button class="cmd-tab" onclick="filterCat('ticket',this)">🎫 Тикет</button>
  <button class="cmd-tab" onclick="filterCat('jail',this)">🔒 Jail</button>
</div>

<div class="cmd-grid" id="cmd-grid"></div>

<!-- Warning DM Ayarı -->
<div class="warn-dm-box" id="warn-dm-section" style="display:none;">
  <div class="warn-dm-title"><i class="fas fa-envelope"></i> Warning DM Сообщение Ayarı</div>
  <div class="form-group">
    <label>Warning atıldığında участнику отправляется пользовательский DM сообщениеı</label>
    <textarea id="warn-dm-text" rows="4" placeholder="Örn: Серверmuzda правилоlara aykırı davranış tespit edildi.&#10;&#10;Değişkenler: {user}, {reason}, {mod}, {server}"></textarea>
  </div>
  <button onclick="saveWarningDM()" class="btn-exec" style="width:auto;">Сохранить</button>
  <span id="warn-dm-result" style="margin-left:10px;font-size:12px;"></span>
</div>

<div id="cmdModal" class="modal-overlay">
  <div class="modal-box">
    <button onclick="closeCmd()" style="position:absolute;top:14px;right:18px;background:none;border:none;color:#c8922a;font-size:24px;cursor:pointer;">&times;</button>
    <h2 id="cmdTitle">Команда</h2>
    <div id="cmdForm"></div>
    <div id="result-msg"></div>
  </div>
</div>

<script>
var GUILD_ID = '1421244140359909513';
var USER_ROLE = '{{ role }}';
var currentCmd = '';
var members = [], channels = [], roles = [];

// Роль уровеньsi
var ROLE_LEVEL = {uye:0, mod:1, admin:2, owner:3};
var userLevel = ROLE_LEVEL[USER_ROLE] || 0;

// Tüm командаlar tanımı
var COMMANDS = [
  // MODERASYON
  {id:'ban',      cat:'mod',     icon:'🔨', name:'Бан',           desc:'Пользовательyı kalıcı yasakla',       perm:'admin', fields:['member','reason']},
  {id:'kick',     cat:'mod',     icon:'👢', name:'Кик',          desc:'Пользовательyı серверdan at',          perm:'admin', fields:['member','reason']},
  {id:'timeout',  cat:'mod',     icon:'⏱️', name:'Мут',       desc:'Geçici sustur (dk/sa/gün)',         perm:'admin', fields:['member','duration','reason']},
  {id:'untimeout',cat:'mod',     icon:'🔊', name:'Мут Убрать',desc:'Susturmayı убрать',                 perm:'admin', fields:['member']},
  {id:'unban',    cat:'mod',     icon:'🔓', name:'Unban',         desc:'Банı убрать (ID ile)',              perm:'admin', fields:['userid','reason']},
  {id:'lock',     cat:'mod',     icon:'🔒', name:'Канал Kilitle', desc:'Канал kilitle',                    perm:'mod',   fields:['channel']},
  {id:'unlock',   cat:'mod',     icon:'🔓', name:'Канал Открыть',      desc:'Канал kilidini убрать',             perm:'mod',   fields:['channel']},
  {id:'очистить',  cat:'mod',     icon:'🗑️', name:'Сообщение Очистить', desc:'Каналdan toplu сообщение sil',          perm:'admin', fields:['channel','amount']},
  // UYARI
  {id:'warn',     cat:'warn',    icon:'⚠️', name:'Warning',          desc:'Пользовательya warning ver',             perm:'mod',   fields:['member','reason']},
  {id:'clearwarns',cat:'warn',   icon:'🧹', name:'Warning Очистить', desc:'Tüm предупрежденияı очистить',             perm:'admin', fields:['member']},
  // YARDIMCI
  {id:'role_add', cat:'util',    icon:'🏷️', name:'Роль Ver',       desc:'Пользовательya роль добавить',              perm:'admin', fields:['member','role']},
  {id:'role_remove',cat:'util',  icon:'🔖', name:'Роль Al',        desc:'Пользовательdan роль çıkar',            perm:'admin', fields:['member','role']},
  // JAIL
  {id:'jail',     cat:'jail',    icon:'🔒', name:'Jail',          desc:'Пользовательyı jail odasına al',       perm:'admin', fields:['member','duration','reason']},
  {id:'unjail',   cat:'jail',    icon:'🔓', name:'Unjail',        desc:'Пользовательyı jail\'den çıkar',       perm:'admin', fields:['member']},
  {id:'setup_jail',cat:'jail',   icon:'🏗️', name:'Jail Kur',      desc:'Jail sistemi kur (категория+канал)', perm:'owner', fields:[]},
  // EĞLENCEe
  {id:'yazitura', cat:'fun',     icon:'🪙', name:'Текст Tura',     desc:'Текст tura at',                      perm:'mod',   fields:[]},
  {id:'zar',      cat:'fun',     icon:'🎲', name:'Zar At',        desc:'Zar at',                            perm:'mod',   fields:[]},
  {id:'rastgele', cat:'fun',     icon:'🎯', name:'Rastgele Участник',  desc:'Rastgele участник выбрать',                  perm:'mod',   fields:[]},
  // EKONOMİ
  {id:'баланс',   cat:'economy', icon:'💰', name:'Баланс',        desc:'Участник балансsini gör',                perm:'mod',   fields:['member']},
  {id:'деньги_ver', cat:'economy', icon:'💸', name:'Деньги Ver',      desc:'Участникye деньги ver',                    perm:'admin', fields:['member','amount']},
  // TİCKET
  {id:'ticket_panel',cat:'ticket',icon:'🎫',name:'Тикет Панель',  desc:'Тикет panelni отправить',            perm:'admin', fields:['channel']},
];

function permLevel(p) {
  return ROLE_LEVEL[p] || 0;
}

function canUse(cmd) {
  return userLevel >= permLevel(cmd.perm);
}

function permBadge(p) {
  var cls = p === 'owner' ? 'perm-owner' : p === 'admin' ? 'perm-admin' : 'perm-mod';
  return '<span class="cmd-perm '+cls+'">'+p.toUpperCase()+'</span>';
}

var currentCat = 'all';

function filterCat(cat, btn) {
  currentCat = cat;
  document.querySelectorAll('.cmd-tab').forEach(function(b){b.classList.remove('active');});
  btn.classList.add('active');
  renderGrid();
  // Warning DM bölümünü sadece warn категорияsinde göster
  document.getElementById('warn-dm-section').style.display = (cat === 'warn' || cat === 'all') ? 'block' : 'none';
}

function renderGrid() {
  var filtered = COMMANDS.filter(function(c){ return currentCat === 'all' || c.cat === currentCat; });
  document.getElementById('cmd-grid').innerHTML = filtered.map(function(c) {
    var locked = !canUse(c);
    return '<div class="cmd-card'+(locked?' locked':'')+'" onclick="'+(locked?'showLocked()':'openCmd(\''+c.id+'\')')+'">' +
      permBadge(c.perm) +
      '<div class="cmd-icon">'+c.icon+'</div>' +
      '<div class="cmd-name">'+c.name+'</div>' +
      '<div class="cmd-desc">'+c.desc+'</div>' +
    '</div>';
  }).join('');
}

function showLocked() {
  alert('⛔ Bu командаu kullanmak için yeterli правоn yok.');
}

async function loadData() {
  try {
    var [mr, cr, rr] = await Promise.all([
      fetch('/api/guild/'+GUILD_ID+'/members').then(function(r){return r.json();}),
      fetch('/api/guild/'+GUILD_ID+'/channels').then(function(r){return r.json();}),
      fetch('/api/guild/'+GUILD_ID+'/roles').then(function(r){return r.json();})
    ]);
    members = Array.isArray(mr) ? mr.filter(function(m){return !m.bot;}) : [];
    channels = Array.isArray(cr) ? cr.filter(function(c){return c.type==='text';}) : [];
    roles = Array.isArray(rr) ? rr : [];
  } catch(e) {}
}

function memberOpts() { return members.map(function(m){return '<option value="'+m.id+'">'+m.display_name+'</option>';}).join(''); }
function channelOpts() { return channels.map(function(c){return '<option value="'+c.id+'">#'+c.name+'</option>';}).join(''); }
function roleOpts()    { return roles.map(function(r){return '<option value="'+r.id+'">'+r.name+'</option>';}).join(''); }

function durField() {
  return '<div class="form-group"><label>Длительность</label><div class="dur-row">'+
    '<input type="number" id="dur-val" value="10" min="1">'+
    '<select id="dur-unit"><option value="minute">Dakika</option><option value="hour">Время</option><option value="day">Gün</option></select>'+
  '</div></div>';
}

function getDurMinutes() {
  var val = parseInt(document.getElementById('dur-val').value) || 1;
  var unit = document.getElementById('dur-unit').value;
  if (unit === 'hour') return val * 60;
  if (unit === 'day') return val * 1440;
  return val;
}

function openCmd(cmdId) {
  var cmd = COMMANDS.find(function(c){return c.id===cmdId;});
  if (!cmd || !canUse(cmd)) { showLocked(); return; }
  currentCmd = cmdId;
  document.getElementById('result-msg').style.display = 'none';
  document.getElementById('cmdTitle').textContent = cmd.icon + ' ' + cmd.name;

  var f = '';
  var fields = cmd.fields;
  if (fields.includes('member'))   f += '<div class="form-group"><label>Пользователь</label><select id="member-sel">'+memberOpts()+'</select></div>';
  if (fields.includes('userid'))   f += '<div class="form-group"><label>Пользователь ID</label><input type="text" id="user-id-inp" placeholder="123456789012345678"></div>';
  if (fields.includes('channel'))  f += '<div class="form-group"><label>Канал</label><select id="channel-sel">'+channelOpts()+'</select></div>';
  if (fields.includes('role'))     f += '<div class="form-group"><label>Роль</label><select id="role-sel">'+roleOpts()+'</select></div>';
  if (fields.includes('duration')) f += durField();
  if (fields.includes('amount'))   f += '<div class="form-group"><label>Miktar / Количество</label><input type="number" id="amount-inp" value="10" min="1"></div>';
  if (fields.includes('reason'))   f += '<div class="form-group"><label>Причина</label><input type="text" id="reason-inp" placeholder="Причина..."></div>';
  if (fields.length === 0)         f += '<p style="color:rgba(240,232,208,0.4);font-size:13px;margin-bottom:16px;">'+cmd.desc+'</p>';

  f += '<div style="margin-top:18px;"><button class="btn-exec" onclick="execCmd()">Uygula</button><button class="btn-cancel" onclick="closeCmd()">Отмена</button></div>';
  document.getElementById('cmdForm').innerHTML = f;
  document.getElementById('cmdModal').style.display = 'flex';
}

function closeCmd() { document.getElementById('cmdModal').style.display = 'none'; }

async function execCmd() {
  var data = { command: currentCmd, guild_id: GUILD_ID };
  var ms = document.getElementById('member-sel');    if (ms) data.user_id = ms.value;
  var ui = document.getElementById('user-id-inp');   if (ui) data.user_id = ui.value;
  var rs = document.getElementById('reason-inp');    if (rs) data.reason = rs.value;
  var cs = document.getElementById('channel-sel');   if (cs) data.channel_id = cs.value;
  var am = document.getElementById('amount-inp');    if (am) data.amount = am.value;
  var ro = document.getElementById('role-sel');      if (ro) data.role_id = ro.value;
  if (document.getElementById('dur-val')) data.duration = getDurMinutes();

  // Команда eşlemeleri
  if (currentCmd === 'role_add')    { data.command = 'role'; data.action = 'add'; }
  if (currentCmd === 'role_remove') { data.command = 'role'; data.action = 'remove'; }
  if (currentCmd === 'lock')        { data.command = 'lock'; }
  if (currentCmd === 'unlock')      { data.command = 'unlock'; }
  if (currentCmd === 'clearwarns')  { data.command = 'clearwarns'; }
  if (currentCmd === 'untimeout')   { data.command = 'untimeout'; }
  if (currentCmd === 'unban')       { data.command = 'unban'; }
  if (currentCmd === 'ticket_panel'){ data.command = 'ticket_panel'; }
  if (currentCmd === 'баланс')      { data.command = 'баланс'; }
  if (currentCmd === 'деньги_ver')    { data.command = 'деньги_ver'; }
  if (currentCmd === 'yazitura')    { data.command = 'yazitura'; }
  if (currentCmd === 'zar')         { data.command = 'zar'; }
  if (currentCmd === 'rastgele')    { data.command = 'rastgele'; }

  var r = await fetch('/api/execute-command', {method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(data)});
  var res = await r.json();
  var msg = document.getElementById('result-msg');
  msg.style.display = 'block';
  if (res.success) {
    msg.style.cssText = 'display:block;background:rgba(46,204,113,0.15);border:1px solid #2ecc71;color:#2ecc71;padding:11px;border-radius:8px;';
    msg.textContent = '✅ ' + (res.message || 'Успешно!');
    setМут(closeCmd, 2000);
  } else {
    msg.style.cssText = 'display:block;background:rgba(231,76,60,0.15);border:1px solid #e74c3c;color:#e74c3c;padding:11px;border-radius:8px;';
    msg.textContent = '❌ ' + (res.error || 'Ошибка');
  }
}

async function loadWarningDM() {
  try {
    var r = await fetch('/api/guild/'+GUILD_ID+'/warn-dm');
    var d = await r.json();
    if (d.message) document.getElementById('warn-dm-text').value = d.message;
  } catch(e) {}
}

async function saveWarningDM() {
  var msg = document.getElementById('warn-dm-text').value.trim();
  var r = await fetch('/api/guild/'+GUILD_ID+'/warn-dm', {method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({message:msg})});
  var d = await r.json();
  var el = document.getElementById('warn-dm-result');
  el.textContent = d.success ? '✅ Сохранено' : '❌ Ошибка';
  el.style.color = d.success ? '#2ecc71' : '#e74c3c';
  setМут(function(){el.textContent='';}, 3000);
}

document.getElementById('cmdModal').addEventListener('click', function(e){if(e.target===this)closeCmd();});

// Başlangıç
loadData();
loadWarningDM();
renderGrid();
document.getElementById('warn-dm-section').style.display = 'block';
</script>
{% endblock %}
