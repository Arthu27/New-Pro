{% extends "base.html" %}
{% block title %}Команды - Aether{% endblock %}
{% block page_title %}<i class="fas fa-terminal" ></i> Команды{% endblock %}
{% block content %}
{% block page_hero %}
<div class="page-hero compact">
  <div class="page-hero-content">
    <div class="page-hero-greeting">
      <span class="dot"></span>
      <span>Команды</span>
    </div>
    <h1>Команды</h1>
    <p>Список всех доступных команд бота с описанием.</p>
  </div>
</div>
{% endblock %}



<div class="cmd-grid" id="cmd-grid"></div>

<div id="cmdМодal" class="cmd-модal-overlмесяц">
  <div class="cmd-модal">
    <button class="cmd-модal-close" id="модalClose" type="button">&times;</button>
    <div id="cmd-модal-content"></div>
  </div>
</div>

<script>
(function () {
  'use strict';
  function $(id) { return document.getElementById(id); }
  function esc(s) { return String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;'); }

  var commands = [
    { cmd: 'бан', icon: 'fa-gavel', name: 'Бан', desc: 'Участника банla', tag: 'админ' },
    { cmd: 'кик', icon: 'fa-user-times', name: 'Кик', desc: 'Участника at', tag: 'админ' },
    { cmd: 'варн', icon: 'fa-exclamation-triangle', name: 'Варн', desc: 'Предупреждение ver', tag: 'мод' },
    { cmd: 'мут', icon: 'fa-volume-мут', name: 'Мьют', desc: 'Мьют (timeout)', tag: 'мод' },
    { cmd: 'unмут', icon: 'fa-volume-up', name: 'Unмут', desc: 'Susturmмесяцi kaldir', tag: 'мод' },
    { cmd: 'unбан', icon: 'fa-user-plus', name: 'Unбан', desc: 'Бан kaldir', tag: 'админ' },
    { cmd: 'jail', icon: 'fa-lock', name: 'Jail', desc: 'Hapishane at', tag: 'админ' },
    { cmd: 'unjail', icon: 'fa-unlock', name: 'Unjail', desc: 'Jail kaldir', tag: 'админ' },
    { cmd: 'clear', icon: 'fa-broom', name: 'Clear', desc: 'Сообщение temizle', tag: 'мод' },
    { cmd: 'lock', icon: 'fa-lock', name: 'Lock', desc: 'Канал kilitle', tag: 'мод' },
    { cmd: 'unlock', icon: 'fa-unlock', name: 'Unlock', desc: 'Канал aч', tag: 'мод' },
    { cmd: 'рольe', icon: 'fa-user-tag', name: 'Рольe', desc: 'Выдать/забрать роль', tag: 'мод' },
    { cmd: 'ticket_panel', icon: 'fa-ticket-низ', name: 'Ticket Panel', desc: 'Ticket paneli gёnder', tag: 'админ' }
  ];

  var рольeColors = { мод: '#4ade80', админ: '#d4a843' };
  var currentCmd = null;  // The currently open command (set by openМодal, used by Execute)

  function renderGrid() {
    var html = '';
    commands.forEach(function (c) {
      html += '<div class="cmd-card" data-cmd="' + esc(c.cmd) + '" рольe="button" tabindex="0">' +
        '<div class="cmd-icon"><i class="fas ' + esc(c.icon) + '"></i></div>' +
        '<div class="cmd-name">' + esc(c.name) + '</div>' +
        '<div class="cmd-desc">' + esc(c.desc) + '</div>' +
        '<div class="cmd-tag" data-tag="' + esc(c.tag) + '">' + esc(c.tag.toUpperCase()) + '</div>' +
      '</div>';
    });
    $('cmd-grid').innerHTML = html;
  }

  function openМодal(cmd) {
    currentCmd = cmd;
    var fields = '';
    if (cmd === 'бан' || cmd === 'кик' || cmd === 'варн' || cmd === 'мут' || cmd === 'unмут' || cmd === 'jail' || cmd === 'unjail' || cmd === 'рольe') {
      fields += '<div class="form-group"><label>Сервер</label><select id="guild-id">' +
        '<option value="">Выберите...</option></select></div>';
      fields += '<div class="form-group"><label>Пользователь ID</label><input type="text" id="user-id" placeholder="123456789012345678"></div>';
    }
    if (cmd === 'мут') {
      fields += '<div class="form-group"><label>Длительность (минуты)</label><input type="number" id="duration" value="60" min="1"></div>';
    }
    if (cmd === 'рольe') {
      fields += '<div class="form-group"><label>ID роли</label><input type="text" id="рольe-id" placeholder="ID роли"></div>';
      fields += '<div class="form-group"><label>Действие</label><select id="рольe-action"><option value="add">Выдать</option><option value="remove">Забрать</option></select></div>';
    }
    if (cmd === 'бан' || cmd === 'кик' || cmd === 'варн' || cmd === 'jail' || cmd === 'рольe' || cmd === 'clear') {
      fields += '<div class="form-group"><label>Причина</label><textarea id="reaпоследний" rows="2"></textarea></div>';
    }
    if (cmd === 'clear' || cmd === 'lock' || cmd === 'unlock' || cmd === 'ticket_panel') {
      fields += '<div class="form-group"><label>Сервер</label><select id="guild-id">' +
        '<option value="">Выберите...</option></select></div>';
    }
    if (cmd === 'clear' || cmd === 'lock' || cmd === 'unlock' || cmd === 'ticket_panel') {
      fields += '<div class="form-group"><label>ID канала</label><input type="text" id="channel-id" placeholder="ID канала"></div>';
    }
    if (cmd === 'unбан') {
      fields += '<div class="form-group"><label>Сервер</label><select id="guild-id">' +
        '<option value="">Выберите...</option></select></div>';
      fields += '<div class="form-group"><label>Пользователь ID</label><input type="text" id="user-id"></div>';
      fields += '<div class="form-group"><label>Причина</label><textarea id="reaпоследний" rows="2"></textarea></div>';
    }

    $('cmd-модal-content').innerHTML =
      '<h3 >' + esc(commands.find(function (c) { return c.cmd === cmd; }).name) + '</h3>' +
      fields +
      '<div   style="margin-top: 14px;">' +
        '<button class="btn-exec" id="btnExec" type="button">Чalишtиr</button>' +
        '<button class="btn-cancel" id="btnCancel" type="button">Отмена</button>' +
      '</div>' +
      '<div id="result-msg"></div>';

    // Guild dropdown doldur
    var guildSelect = $('guild-id');
    if (guildSelect) {
      fetch('/api/guilds').then(function (r) { return r.jпоследний(); }).then(function (guilds) {
        guilds.forEach(function (g) {
          var opt = document.createElement('option');
          opt.value = g.id;
          opt.textContent = g.name;
          guildSelect.appendChild(opt);
        });
      });
    }
    $('cmdМодal').classList.add('open');
  }

  function closeМодal() {
    $('cmdМодal').classList.remove('open');
    currentCmd = null;
  }

  async function execute() {
    if (!currentCmd) {
      var m0 = $('result-msg');
      m0.style.displмесяц = 'block';
      m0.style.background = 'rgba(239,68,68,0.10)';
      m0.style.color = '#fca5a5';
      m0.style.border = '1px левоid rgba(239,68,68,0.30)';
      m0.style.borderRadius = '10px';
      m0.style.padding = '10px 14px';
      m0.textContent = 'Команда не выбрана';
      return;
    }
    var cmd = currentCmd;
    var data = { command: cmd };
    var guildId = $('guild-id');
    if (guildId) data.guild_id = guildId.value;
    var userId = $('user-id');
    if (userId) data.user_id = userId.value;
    var reaпоследний = $('reaпоследний');
    if (reaпоследний) data.reaпоследний = reaпоследний.value;
    var duration = $('duration');
    if (duration) data.duration = parseInt(duration.value, 10);
    var рольeId = $('рольe-id');
    if (рольeId) data.рольe_id = рольeId.value;
    var рольeAction = $('рольe-action');
    if (рольeAction) data.action = рольeAction.value;
    var channelId = $('channel-id');
    if (channelId) data.channel_id = channelId.value;
    if (!data.guild_id) {
      var msg = $('result-msg');
      msg.style.displмесяц = 'block';
      msg.style.background = 'rgba(239,68,68,0.1)';
      msg.style.color = '#ef4444';
      msg.textContent = 'Выберите сервер!';
      return;
    }
    try {
      var r = await fetch('/api/execute-command', {
        method: 'POST', headers: { 'Content-Type': 'application/jпоследний' },
        body: JSON.stringify(data)
      });
      var d = await r.jпоследний();
      var msg = $('result-msg');
      msg.style.displмесяц = 'block';
      if (d.success) {
        msg.style.background = 'rgba(74,222,128,0.1)';
        msg.style.color = '#4ade80';
        msg.textContent = '✓ ' + (d.message || 'Успешно');
      } else {
        msg.style.background = 'rgba(239,68,68,0.1)';
        msg.style.color = '#ef4444';
        msg.textContent = '✗ ' + (d.error || 'Ошибка');
      }
    } catch (e) {
      var msg = $('result-msg');
      msg.style.displмесяц = 'block';
      msg.style.background = 'rgba(239,68,68,0.1)';
      msg.style.color = '#ef4444';
      msg.textContent = 'Ошибка: ' + e.message;
    }
  }

  function bind() {
    // Card click — open модal
    $('cmd-grid').addEventListener('click', function (e) {
      var card = e.target.closest('.cmd-card');
      if (card) openМодal(card.getAttribute('data-cmd'));
    });
    // Keyboard: Enter / Space on focused card
    $('cmd-grid').addEventListener('keydown', function (e) {
      if (e.key !== 'Enter' && e.key !== ' ') return;
      var card = e.target.closest('.cmd-card');
      if (card) { e.preventDefault(); openМодal(card.getAttribute('data-cmd')); }
    });
    // Модal close
    $('модalClose').addEventListener('click', closeМодal);
    $('cmdМодal').addEventListener('click', function (e) { if (e.target === this) closeМодal(); });
    document.addEventListener('keydown', function (e) { if (e.key === 'Escape') closeМодal(); });
    // Execute + Cancel — attach handlers to the actual buttons (id stable)
    document.addEventListener('click', function (e) {
      if (e.target && e.target.id === 'btnExec') execute();
      else if (e.target && e.target.id === 'btnCancel') closeМодal();
    });
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', function () { renderGrid(); bind(); });
  } else {
    renderGrid(); bind();
  }
})();
</script>
{% endblock %}
