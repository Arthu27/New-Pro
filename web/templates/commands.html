{% extends "base.html" %}
{% block title %}Команды - Aether{% endblock %}
{% block page_title %}Команды{% endblock %}
{% block content %}
<style>
.cmd-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:10px;max-height:520px;overflow-y:auto;overflow-anchor:none;padding:4px;}
.cmd-card{background:rgba(26,22,16,0.7);border:1px solid rgba(212,168,67,0.1);border-radius:12px;padding:14px;cursor:pointer;transition:all 0.2s;position:relative;overflow:hidden;animation:fadeUp 0.3s ease-out both;text-align:center;}
.cmd-card:hover{transform:translateY(-3px);border-color:rgba(200,146,42,0.4);box-shadow:0 8px 24px rgba(200,146,42,0.15);}
.cmd-card::before{content:'';position:absolute;top:0;left:0;right:0;height:2px;background:linear-gradient(90deg,transparent,#c8922a,transparent);}
@keyframes fadeUp{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
.cmd-icon{width:42px;height:42px;border-radius:10px;background:rgba(212,168,67,0.12);display:flex;align-items:center;justify-content:center;margin:0 auto 8px;font-size:18px;color:#c8922a;transition:all 0.2s;}
.cmd-card:hover .cmd-icon{background:rgba(200,146,42,0.25);transform:scale(1.05);}
.cmd-name{font-size:12px;font-weight:700;color:#f0e8d0;margin-bottom:3px;}
.cmd-desc{font-size:10px;color:#5a5040;line-height:1.3;min-height:24px;}
.cmd-tag{display:inline-block;background:rgba(212,168,67,0.1);color:#c8922a;padding:1px 6px;border-radius:99px;font-size:8px;margin-top:4px;letter-spacing:0.04em;}

.cmd-modal-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,0.8);backdrop-filter:blur(6px);z-index:9999;align-items:center;justify-content:center;}
.cmd-modal-overlay.open{display:flex;}
.cmd-modal{background:rgba(26,22,16,0.95);border:1px solid rgba(212,168,67,0.25);border-radius:14px;padding:22px;max-width:460px;width:92vw;max-height:85vh;overflow-y:auto;position:relative;}
.cmd-modal-close{position:absolute;top:10px;right:10px;background:transparent;border:1px solid rgba(212,168,67,0.15);color:#5a5040;width:28px;height:28px;border-radius:6px;cursor:pointer;font-size:14px;}
.cmd-modal-close:hover{background:rgba(212,168,67,0.08);color:#f0e8d0;}
.form-group{margin-bottom:10px;}
.form-group label{display:block;color:rgba(240,232,208,0.55);font-size:10px;text-transform:uppercase;letter-spacing:0.05em;margin-bottom:4px;}
.form-group input,.form-group select,.form-group textarea{width:100%;padding:8px 11px;background:rgba(255,255,255,0.04);border:1px solid rgba(212,168,67,0.16);border-radius:7px;color:#f0e8d0;font-size:12px;font-family:Inter,sans-serif;box-sizing:border-box;}
.form-group input:focus,.form-group select:focus,.form-group textarea:focus{outline:none;border-color:rgba(212,168,67,0.45);}
.btn-exec{flex:1;padding:9px;background:#c8922a;color:#100e08;border:none;border-radius:99px;cursor:pointer;font-weight:700;font-size:12px;font-family:Inter,sans-serif;transition:all 0.15s;}
.btn-exec:hover{background:#e0a830;}
.btn-cancel{flex:1;padding:9px;background:transparent;color:rgba(240,232,208,0.55);border:1px solid rgba(212,168,67,0.08);border-radius:99px;cursor:pointer;font-weight:600;font-size:12px;font-family:Inter,sans-serif;}
.btn-cancel:hover{background:rgba(212,168,67,0.04);color:#f0e8d0;}
#result-msg{margin-top:10px;padding:10px;border-radius:7px;display:none;font-size:11px;}

@media (max-width:600px){
  .cmd-grid{grid-template-columns:repeat(auto-fill,minmax(140px,1fr));}
}
</style>

<div class="cmd-grid" id="cmd-grid"></div>

<div id="cmdModal" class="cmd-modal-overlay">
  <div class="cmd-modal">
    <button class="cmd-modal-close" id="modalClose" type="button">&times;</button>
    <div id="cmd-modal-content"></div>
  </div>
</div>

<script>
(function () {
  'use strict';
  function $(id) { return document.getElementById(id); }
  function esc(s) { return String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;'); }

  var commands = [
    { cmd: 'ban', icon: 'fa-gavel', name: 'Ban', desc: 'Участника banla', tag: 'admin' },
    { cmd: 'kick', icon: 'fa-user-times', name: 'Kick', desc: 'Участника at', tag: 'admin' },
    { cmd: 'warn', icon: 'fa-exclamation-triangle', name: 'Warn', desc: 'Предупреждение ver', tag: 'mod' },
    { cmd: 'mute', icon: 'fa-volume-mute', name: 'Mute', desc: 'Sustur (timeout)', tag: 'mod' },
    { cmd: 'unmute', icon: 'fa-volume-up', name: 'Unmute', desc: 'Susturmayi kaldir', tag: 'mod' },
    { cmd: 'unban', icon: 'fa-user-plus', name: 'Unban', desc: 'Ban kaldir', tag: 'admin' },
    { cmd: 'jail', icon: 'fa-lock', name: 'Jail', desc: 'Hapishane at', tag: 'admin' },
    { cmd: 'unjail', icon: 'fa-unlock', name: 'Unjail', desc: 'Jail kaldir', tag: 'admin' },
    { cmd: 'clear', icon: 'fa-broom', name: 'Clear', desc: 'Mesaj temizle', tag: 'mod' },
    { cmd: 'lock', icon: 'fa-lock', name: 'Lock', desc: 'Kanal kilitle', tag: 'mod' },
    { cmd: 'unlock', icon: 'fa-unlock', name: 'Unlock', desc: 'Kanal aç', tag: 'mod' },
    { cmd: 'role', icon: 'fa-user-tag', name: 'Role', desc: 'Rol ver/al', tag: 'mod' },
    { cmd: 'ticket_panel', icon: 'fa-ticket-alt', name: 'Ticket Panel', desc: 'Ticket paneli gönder', tag: 'admin' }
  ];

  var roleColors = { mod: '#2ecc71', admin: '#c8922a' };

  function renderGrid() {
    var html = '';
    commands.forEach(function (c, i) {
      html += '<div class="cmd-card" data-cmd="' + esc(c.cmd) + '" style="animation-delay:' + (i * 0.02) + 's">' +
        '<div class="cmd-icon"><i class="fas ' + esc(c.icon) + '"></i></div>' +
        '<div class="cmd-name">' + esc(c.name) + '</div>' +
        '<div class="cmd-desc">' + esc(c.desc) + '</div>' +
        '<div class="cmd-tag" style="color:' + (roleColors[c.tag] || '#5a5040') + ';">' + esc(c.tag.toUpperCase()) + '</div>' +
      '</div>';
    });
    $('cmd-grid').innerHTML = html;
  }

  function openModal(cmd) {
    var fields = '';
    if (cmd === 'ban' || cmd === 'kick' || cmd === 'warn' || cmd === 'mute' || cmd === 'unmute' || cmd === 'jail' || cmd === 'unjail' || cmd === 'role') {
      fields += '<div class="form-group"><label>Sunucu</label><select id="guild-id">' +
        '<option value="">Seçin...</option></select></div>';
      fields += '<div class="form-group"><label>Kullanıcı ID</label><input type="text" id="user-id" placeholder="123456789012345678"></div>';
    }
    if (cmd === 'mute') {
      fields += '<div class="form-group"><label>Süre (dakika)</label><input type="number" id="duration" value="60" min="1"></div>';
    }
    if (cmd === 'role') {
      fields += '<div class="form-group"><label>Rol ID</label><input type="text" id="role-id" placeholder="Rol ID"></div>';
      fields += '<div class="form-group"><label>Aksiyon</label><select id="role-action"><option value="add">Ekle</option><option value="remove">Kaldır</option></select></div>';
    }
    if (cmd === 'ban' || cmd === 'kick' || cmd === 'warn' || cmd === 'jail' || cmd === 'role' || cmd === 'clear') {
      fields += '<div class="form-group"><label>Sebep</label><textarea id="reason" rows="2"></textarea></div>';
    }
    if (cmd === 'clear' || cmd === 'lock' || cmd === 'unlock' || cmd === 'ticket_panel') {
      fields += '<div class="form-group"><label>Sunucu</label><select id="guild-id">' +
        '<option value="">Seçin...</option></select></div>';
    }
    if (cmd === 'clear' || cmd === 'lock' || cmd === 'unlock' || cmd === 'ticket_panel') {
      fields += '<div class="form-group"><label>Kanal ID</label><input type="text" id="channel-id" placeholder="Kanal ID"></div>';
    }
    if (cmd === 'unban') {
      fields += '<div class="form-group"><label>Sunucu</label><select id="guild-id">' +
        '<option value="">Seçin...</option></select></div>';
      fields += '<div class="form-group"><label>Kullanıcı ID</label><input type="text" id="user-id"></div>';
      fields += '<div class="form-group"><label>Sebep</label><textarea id="reason" rows="2"></textarea></div>';
    }

    $('cmd-modal-content').innerHTML =
      '<h3 style="font-size:15px;font-weight:700;color:#f0e8d0;margin-bottom:14px;letter-spacing:-0.02em;">' + esc(commands.find(function (c) { return c.cmd === cmd; }).name) + '</h3>' +
      fields +
      '<div style="display:flex;gap:8px;margin-top:14px;">' +
        '<button class="btn-exec" id="btnExec" type="button">Çalıştır</button>' +
        '<button class="btn-cancel" id="btnCancel" type="button">İptal</button>' +
      '</div>' +
      '<div id="result-msg"></div>';

    // Guild dropdown doldur
    var guildSelect = $('guild-id');
    if (guildSelect) {
      fetch('/api/guilds').then(function (r) { return r.json(); }).then(function (guilds) {
        guilds.forEach(function (g) {
          var opt = document.createElement('option');
          opt.value = g.id;
          opt.textContent = g.name;
          guildSelect.appendChild(opt);
        });
      });
    }
    $('cmdModal').classList.add('open');
  }

  function closeModal() { $('cmdModal').classList.remove('open'); }

  async function execute(cmd) {
    var data = { command: cmd };
    var guildId = $('guild-id');
    if (guildId) data.guild_id = guildId.value;
    var userId = $('user-id');
    if (userId) data.user_id = userId.value;
    var reason = $('reason');
    if (reason) data.reason = reason.value;
    var duration = $('duration');
    if (duration) data.duration = parseInt(duration.value, 10);
    var roleId = $('role-id');
    if (roleId) data.role_id = roleId.value;
    var roleAction = $('role-action');
    if (roleAction) data.action = roleAction.value;
    var channelId = $('channel-id');
    if (channelId) data.channel_id = channelId.value;
    if (!data.guild_id) {
      var msg = $('result-msg');
      msg.style.display = 'block';
      msg.style.background = 'rgba(239,68,68,0.1)';
      msg.style.color = '#ef4444';
      msg.textContent = 'Sunucu seçin!';
      return;
    }
    try {
      var r = await fetch('/api/execute-command', {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(data)
      });
      var d = await r.json();
      var msg = $('result-msg');
      msg.style.display = 'block';
      if (d.success) {
        msg.style.background = 'rgba(74,222,128,0.1)';
        msg.style.color = '#4ade80';
        msg.textContent = '✓ ' + (d.message || 'Başarılı');
      } else {
        msg.style.background = 'rgba(239,68,68,0.1)';
        msg.style.color = '#ef4444';
        msg.textContent = '✗ ' + (d.error || 'Hata');
      }
    } catch (e) {
      var msg = $('result-msg');
      msg.style.display = 'block';
      msg.style.background = 'rgba(239,68,68,0.1)';
      msg.style.color = '#ef4444';
      msg.textContent = 'Hata: ' + e.message;
    }
  }

  function bind() {
    $('cmd-grid').addEventListener('click', function (e) {
      var card = e.target.closest('.cmd-card');
      if (card) openModal(card.getAttribute('data-cmd'));
    });
    $('modalClose').addEventListener('click', closeModal);
    $('cmdModal').addEventListener('click', function (e) { if (e.target === this) closeModal(); });
    document.addEventListener('click', function (e) {
      if (e.target.id === 'btnExec') {
        var cmd = $('cmd-grid').querySelector('.cmd-card[style*="border-color: rgb(200, 146, 42)"]');
        if (cmd) execute(cmd.getAttribute('data-cmd'));
      }
      if (e.target.id === 'btnCancel') closeModal();
    });
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', function () { renderGrid(); bind(); });
  } else {
    renderGrid(); bind();
  }
})();
</script>
{% endblock %}
