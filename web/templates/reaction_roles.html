{% extends "base.html" %}
{% block title %}Reaction Роли - Aether{% endblock %}
{% block page_title %}<i class="fas fa-smile" style="color:var(--ac);"></i> 🎭 РЕАКЦИЯ ROLES{% endblock %}
{% block content %}

<div class="rr-hero">
  <div style="font-size:32px;margin-bottom:10px;">🎭</div>
  <div class="hero-title">🎭 Роли по реакциям</div>
  <div class="hero-sub">Автоматически выдавать роль по клику на эмодзи</div>
</div>

<div class="controls-bar">
  <select  id="guild-select" class="guild-sel" onchange="loadRR()">
    <option value="">🏠 Выберите сервер...</option>
  </select>
  <button class="btn-new" onclick="openModal()"><span>➕</span> Новая панель</button>
</div>

<div id="rr-list" class="rr-grid"></div>

<div id="modal" class="modal-overlay">
  <div class="modal-box">
    <div class="modal-title">🎭 Роль по реакции Создать</div>
    <div class="form-group">
      <label class="form-label">📺 Канал</label>
      <select id="rr-channel" class="form-input"></select>
    </div>
    <div class="form-group">
      <label class="form-label">📝 Заголовок</label>
      <input type="text" id="rr-title" class="form-input" placeholder="Роль выбор сообщение заголовок...">
    </div>
    <label class="form-label" style="margin-bottom:10px;">🎭 Emoji → Роль Совпадениеы</label>
    <div id="rr-entries"></div>
    <button class="btn-add-entry" onclick="addEntry()">➕ Совпадение Добавить</button>
    <div class="modal-actions">
      <button class="btn-submit" onclick="createRR()">🎭 Создать ve Отправить</button>
      <button class="btn-cancel" onclick="closeModal()">Отмена</button>
    </div>
  </div>
</div>

<script>
var selectedGuild = '{{ main_guild_id }}';
var allRoles = [];

async function loadGuilds() {
  // Sabit сервер ID
  var gid = '{{ main_guild_id }}';
  if (typeof selectedGuild !== 'undefined') selectedGuild = gid;
  if (document.getElementById('guild-select')) document.getElementById('guild-select').value = gid;
  if (document.getElementById('guild-sel')) document.getElementById('guild-sel').value = gid;
  if (document.getElementById('guildSelect')) document.getElementById('guildSelect').value = gid;
  if (typeof loadData === 'function') { loadData(gid); return; }
  if (typeof loadAll === 'function') { loadAll(gid); return; }
  if (typeof loadRoles === 'function') { loadRoles(gid); return; }
  if (typeof loadChannels === 'function') { loadChannels(gid); return; }
  if (typeof loadMembers === 'function') { loadMembers(gid); return; }
  if (typeof loadHistory === 'function') { loadHistory(gid); return; }
  if (typeof loadLogs === 'function') { loadLogs(gid); return; }
  if (typeof loadVoiceStats === 'function') { loadVoiceStats(gid); return; }
  if (typeof loadSettings === 'function') { loadSettings(gid); return; }
  if (typeof loadGiveaways === 'function') { loadGiveaways(gid); return; }
  if (typeof loadPolls === 'function') { loadPolls(gid); return; }
  if (typeof loadEconomy === 'function') { loadEconomy(gid); return; }
  if (typeof loadSuggestions === 'function') { loadSuggestions(gid); return; }
  if (typeof loadInvites === 'function') { loadInvites(gid); return; }
  if (typeof loadHealth === 'function') { loadHealth(gid); return; }
  if (typeof loadAnalytics === 'function') { loadAnalytics(gid); return; }

}

async function loadRR() {
  selectedGuild = document.getElementById('guild-select').value;
  if (!selectedGuild) return;
  var [rrs, chRes, roles] = await Promise.all([
    fetch('/api/guild/'+selectedGuild+'/reaction-roles').then(r=>r.json()),
    fetch('/api/guild/'+selectedGuild+'/channels').then(r=>r.json()),
    fetch('/api/guild/'+selectedGuild+'/roles').then(r=>r.json())
  ]);
  var channels = Array.isArray(chRes) ? chRes : (chRes.channels || []);
  allRoles = roles;
  document.getElementById('rr-channel').innerHTML = channels.filter(c=>c.type==='text').map(c=>'<option value="'+c.id+'">#'+c.name+'</option>').join('');

  var box = document.getElementById('rr-list');
  if (!rrs.length) { box.innerHTML='<div class="empty-state"><div style="font-size:32px;margin-bottom:16px;">🎭</div><p>Пока reaksiyon роль yok.</p></div>'; return; }
  box.innerHTML = rrs.map(function(rr, i) {
    var entries = (rr.entries||[]).map(function(e) {
      return '<div class="rr-entry"><span class="rr-emoji">'+e.emoji+'</span><span class="rr-arrow">→</span><span class="rr-role">@'+e.role_name+'</span></div>';
    }).join('');
    return '<div class="rr-card" style="animation-delay:'+(i*0.08)+'s">'+
      '<div class="rr-title">🎭 '+rr.title+'</div>'+entries+
      '<div class="rr-footer"><span style="color:var(--text-3);font-size:11px;">'+rr.entries.length+' роль</span>'+
      '<button class="btn-del" onclick="deleteRR(\''+rr.id+'\')">🗑 Удалить</button></div></div>';
  }).join('');
}

function addEntry() {
  var div = document.createElement('div');
  div.className = 'entry-row';
  var roles = allRoles.map(r=>'<option value="'+r.id+'">@'+r.name+'</option>').join('');
  div.innerHTML = '<input type="text" class="entry-emoji" value="🎭" maxlength="2">'+
    '<select class="entry-role form-input" style="flex:1;">'+roles+'</select>'+
    '<button class="entry-del" onclick="this.parentElement.remove()">×</button>';
  document.getElementById('rr-entries').appendChild(div);
}

function openModal() {
  if (!selectedGuild) { alert('Сервер выбрать!'); return; }
  document.getElementById('rr-entries').innerHTML = '';
  document.getElementById('rr-title').value = '';
  addEntry(); addEntry();
  document.getElementById('modal').style.display = 'flex';
}
function closeModal() { document.getElementById('modal').style.display = 'none'; }

async function createRR() {
  var title = document.getElementById('rr-title').value.trim();
  var channel_id = document.getElementById('rr-channel').value;
  var entries = [];
  document.querySelectorAll('.entry-row').forEach(function(row) {
    var emoji = row.querySelector('.entry-emoji').value.trim();
    var sel = row.querySelector('.entry-role');
    if (emoji && sel.value) entries.push({ emoji, role_id: sel.value });
  });
  if (!title || entries.length < 1) { alert('Заголовок ve en az 1 совпадение gir!'); return; }
  var btn = document.querySelector('.btn-submit');
  btn.textContent = '⏳ Создан...'; btn.disabled = true;
  var r = await fetch('/api/guild/'+selectedGuild+'/reaction-roles/create', {
    method:'POST', headers:{'Content-Type':'application/json'},
    body: JSON.stringify({ title, channel_id, entries })
  });
  var d = await r.json();
  btn.textContent = '🎭 Создать ve Отправить'; btn.disabled = false;
  if (d.success) { closeModal(); loadRR(); } else alert(d.error||'Ошибка!');
}

async function deleteRR(id) {
  if (!confirm('Удалитьmek если хотите emin misiniz ? siz?')) return;
  await fetch('/api/guild/'+selectedGuild+'/reaction-roles/'+id+'/delete', {method:'POST'});
  loadRR();
}

loadGuilds();
</script>
{% endblock %}
