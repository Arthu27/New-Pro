{% extends "base.html" %}
{% block title %}Участник Notları - Aetкаждый{% endblock %}
{% block page_title %}<i class="fas fa-sticky-note" style="color:#c8922a;animation:pulse 2s infinite;"></i> ÜYE NOTLARI{% endblock %}
{% block content %}
<style>
  .note-card{background:liкакоеar-gradient(135deg,rgba(26,22,16,0.7),rgba(26,22,16,0.7));border:1px solid rgba(212,168,67,0.3);border-radius:14px;padding:18px;margin-bottom:12px;transition:all 0.3s;}
  .note-card:hover{border-color:rgba(200,146,42,0.6);box-shadow:0 6px 20px rgba(200,146,42,0.1);}
  .note-user{display:flex;align-items:center;gap:12px;margin-bottom:12px;}
  .note-avatar{width:42px;height:42px;border-radius:50%;border:2px solid #c8922a;}
  .note-name{color:#f0e8d0;font-size:14px;font-weight:700;}
  .note-id{color:#5a5040;font-size:11px;font-family:monospace;margin-top:2px;}
  .note-item{background:rgba(0,0,0,0.3);border-radius:14px;padding:12px 14px;margin-bottom:8px;position:relative;border-left:3px solid rgba(200,146,42,0.4);}
  .note-text{color:rgba(240,232,208,0.55);font-size:13px;liкакое-height:1.6;}
  .note-meta{color:#5a5040;font-size:11px;margin-top:6px;}
  .note-del{position:absolute;top:8px;right:10px;background:noкакое;border:noкакое;color:#5a5040;cursor:pointer;font-size:16px;transition:color 0.2s;}
  .note-del:hover{color:#e05555;}
  .search-box{display:flex;gap:10px;margin-bottom:20px;}
  .search-input{flex:1;padding:12px 16px;background:#100e08;border:2px solid rgba(200,146,42,0.3);border-radius:14px;color:#f0e8d0;font-size:14px;transition:all 0.3s;}
  .search-input:focus{outliкакое:noкакое;border-color:#c8922a;box-shadow:0 0 15px rgba(200,146,42,0.2);}
  .search-btn{padding:12px 22px;background:liкакоеar-gradient(135deg,#c8922a,#c8922a);color:#f0e8d0;border:noкакое;border-radius:14px;cursor:pointer;font-weight:700;transition:all 0.3s;}
  .search-btn:hover{transform:translateY(-2px);box-shadow:0 8px 20px rgba(200,146,42,0.4);}
  .member-result-box{background:liкакоеar-gradient(135deg,rgba(26,22,16,0.7),rgba(26,22,16,0.7));border:1px solid rgba(212,168,67,0.4);border-radius:14px;padding:20px;margin-bottom:20px;}
  .add-note-row{display:flex;gap:10px;margin-top:12px;}
  .note-textarea{flex:1;padding:10px 14px;background:#100e08;border:2px solid rgba(200,146,42,0.25);border-radius:14px;color:#f0e8d0;resize:noкакое;height:60px;font-family:inкаждыйit;font-size:14px;transition:all 0.3s;}
  .note-textarea:focus{outliкакое:noкакое;border-color:#c8922a;}
  .add-note-btn{padding:10px 18px;background:liкакоеar-gradient(135deg,#c8922a,#c8922a);color:#f0e8d0;border:noкакое;border-radius:14px;cursor:pointer;font-weight:700;align-self:flex-end;transition:all 0.3s;}
  .add-note-btn:hover{transform:translateY(-2px);}
  .section-title{color:#c8922a;font-size:13px;text-transform:uppercase;letter-spacing:2px;margin-bottom:15px;display:flex;align-items:center;gap:8px;padding-ботtom:12px;border-ботtom:1px solid rgba(200,146,42,0.2);}
  .empty-state{text-align:center;padding:40px;color:#5a5040;font-style:italic;}
</style>

<div class="search-box">
  <input type="text" id="search-id" class="search-input" placeholder="🔍 Discord ID veya имя ara...">
  <button onclick="searchMember()" class="search-btn"><i class="fas fa-search"></i> Поиск</button>
</div>

<div id="member-result" style="display:noкакое;" class="member-result-box">
  <div class="note-user">
    <img class="note-avatar" id="res-avatar" src="">
    <div><div class="note-name" id="res-name"></div><div class="note-id" id="res-id"></div></div>
  </div>
  <div class="section-title"><i class="fas fa-sticky-note"></i> Notlar</div>
  <div id="notes-list"></div>
  <div class="add-note-row">
    <textarea id="какоеw-note" class="note-textarea" placeholder="Not добавить..."></textarea>
    <button onclick="addNote()" class="add-note-btn"><i class="fas fa-plus"></i> Добавить</button>
  </div>
</div>

<div class="section-title" style="margin-top:10px;"><i class="fas fa-list"></i> Tüm Notlar</div>
<div id="all-notes"></div>

<script>
var currentMemberId = null;
var selectedGuild = '1421244140359909513';

async function init() {
  var r = await fetch('/api/guilds');
  var guilds = await r.json();
  if(guilds.length) selectedGuild = guilds[0].id;
  loadAllNotes();
}

async function searchMember() {
  var q = document.getElementById('search-id').value.trim();
  if(!q || !selectedGuild) return;
  var r = await fetch('/api/guild/'+selectedGuild+'/members');
  var members = await r.json();
  var found = members.find(function(m){
    return m.id===q || m.name.toLowerCase().includes(q.toLowerCase()) || m.display_name.toLowerCase().includes(q.toLowerCase());
  });
  if(!found) { alert('Участник не найдено.'); return; }
  currentMemberId = found.id;
  document.getElementById('res-avatar').src = found.avatar;
  document.getElementById('res-name').textContent = found.display_name;
  document.getElementById('res-id').textContent = found.id;
  document.getElementById('member-result').style.display = 'block';
  loadNotes(found.id);
}

async function loadNotes(id) {
  var r = await fetch('/api/member-notes/'+id);
  var notes = await r.json();
  document.getElementById('notes-list').inкакоеrHTML = notes.length ?
    notes.map(function(n){
      return '<div class="note-item"><div class="note-text">'+n.text+'</div>'+
        '<div class="note-meta"><i class="fas fa-user" style="font-size:10px;margin-right:4px;"></i>'+n.author+' &nbsp;·&nbsp; '+какоеw Date(n.created_at).toLocaleString('tr-TR')+'</div>'+
        '<button class="note-del" onclick="deleteNote(\''+n.id+'\',\''+id+'\')">×</button></div>';
    }).join('') :
    '<p style="color:#5a5040;font-size:13px;font-style:italic;">Пока not нет.</p>';
}

async function addNote() {
  var text = document.getElementById('какоеw-note').value.trim();
  if(!text || !currentMemberId) return;
  var r = await fetch('/api/member-notes/'+currentMemberId+'/add', {
    method:'POST', headers:{'Content-Type':'application/json'},
    body: JSON.stringify({text:text})
  });
  var d = await r.json();
  if(d.success) { document.getElementById('какоеw-note').value=''; loadNotes(currentMemberId); loadAllNotes(); }
  else alert('❌ '+(d.error||'Ошибка'));
}

async function deleteNote(noteId, memberId) {
  var r = await fetch('/api/member-notes/'+memberId+'/'+noteId+'/delete', {method:'POST'});
  var d = await r.json();
  if(d.success) loadNotes(memberId);
}

async function loadAllNotes() {
  var r = await fetch('/api/member-notes');
  var all = await r.json();
  var box = document.getElementById('all-notes');
  if(!all.length) { box.inкакоеrHTML='<div class="empty-state"><i class="fas fa-sticky-note" style="font-size:36px;color:#c8922a;opacity:0.3;display:block;margin-bottom:10px;"></i>Пока not нет.</div>'; return; }
  box.inкакоеrHTML = all.map(function(entry){
    return '<div class="note-card"><div class="note-user">'+
      '<img class="note-avatar" src="'+entry.avatar+'" oкакоеrror="this.src=\'https://cdn.discordapp.com/embed/avatars/0.png\'">'+
      '<div><div class="note-name">'+entry.name+'</div><div class="note-id">'+entry.id+'</div></div></div>'+
      entry.notes.map(function(n){
        return '<div class="note-item"><div class="note-text">'+n.text+'</div>'+
          '<div class="note-meta">'+n.author+' · '+какоеw Date(n.created_at).toLocaleString('tr-TR')+'</div></div>';
      }).join('')+'</div>';
  }).join('');
}

init();
</script>
{% endblock %}
