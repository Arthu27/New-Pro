{% extends "base.html" %}
{% block title %}Заметки участников - Hakumo{% endblock %}
{% block page_title %}<i class="fas fa-sticky-note"></i> Заметки участников{% endblock %}
{% block content %}
<style>
.search-box { display: flex; gap: 8px; margin-bottom: 14px; }
.search-input { flex: 1; background: var(--surface); border: 1px solid var(--line-2); border-radius: var(--r-sm); padding: 10px 14px; color: var(--text); font-size: 13px; outline: none; }
.search-input:focus { border-color: var(--ac); box-shadow: 0 0 0 3px var(--ac-soft); }
.search-btn { background: var(--ac-grad); color: #fff; border: none; border-radius: var(--r-sm); padding: 0 18px; font-weight: var(--fw-bold); cursor: pointer; }
.member-result-box { display: none; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-md); padding: 16px; margin-bottom: 14px; }
.note-user { display: flex; align-items: center; gap: 12px; margin-bottom: 12px; }
.note-avatar { width: 44px; height: 44px; border-radius: 50%; object-fit: cover; background: var(--ac-soft); }
.note-name { font-weight: var(--fw-bold); font-size: 15px; }
.note-id { font-size: 12px; color: var(--text-3); }
.section-title { font-weight: var(--fw-bold); font-size: 14px; margin: 14px 0 10px; display: flex; align-items: center; gap: 8px; }
.section-title i { color: var(--ac); }
.note-item { background: color-mix(in srgb, var(--text) 2%, transparent); border: 1px solid var(--line); border-radius: var(--r-sm); padding: 10px 12px; margin-bottom: 8px; position: relative; }
.note-text { font-size: 13px; line-height: 1.5; }
.note-meta { font-size: 11px; color: var(--text-3); margin-top: 6px; }
.note-del { position: absolute; top: 8px; right: 8px; background: transparent; border: none; color: var(--err); cursor: pointer; font-size: 16px; opacity: 0; transition: opacity .15s; }
.note-item:hover .note-del { opacity: 1; }
.note-textarea { width: 100%; background: var(--surface); border: 1px solid var(--line-2); border-radius: var(--r-sm); padding: 10px 12px; color: var(--text); font-size: 13px; resize: vertical; min-height: 60px; outline: none; }
.note-textarea:focus { border-color: var(--ac); }
.add-note-row { margin-top: 10px; }
.add-note-btn { background: var(--ac-soft); color: var(--ac); border: 1px solid var(--ac-line); border-radius: var(--r-sm); padding: 9px 16px; font-weight: var(--fw-medium); cursor: pointer; margin-top: 8px; }
.add-note-btn:hover { background: var(--ac-glow); }
.note-card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-md); padding: 14px; margin-bottom: 12px; }
.note-card .note-user { margin-bottom: 8px; }
.empty-state { text-align: center; color: var(--text-3); padding: 30px; }
</style>
<div class="page-head">
  <div class="page-head-copy">
    <div class="eyebrow">Участники <span class="sep">·</span> Заметки</div>
    <h1>Заметки участников</h1>
    <p class="lead">Заметки модераторов об участниках сервера.</p>
  </div>
</div>




<div class="search-box">
  <input type="text" id="search-id" class="search-input" placeholder="Discord ID или имя..." aria-label="Discord ID или имя...">
  <button type="button" onclick="searchMember()" class="search-btn"><i class="fas fa-search"></i> Поиск</button>
</div>

<div id="member-result"  class="member-result-box">
  <div class="note-user">
    <img alt="" class="note-avatar" id="res-avatar">
    <div><div class="note-name" id="res-name"></div><div class="note-id" id="res-id"></div></div>
  </div>
  <div class="section-title"><i class="fas fa-sticky-note"></i> Заметки</div>
  <div id="notes-list"></div>
  <div class="add-note-row">
    <textarea id="new-note" class="note-textarea" placeholder="Добавить заметку..." aria-label="Добавить заметку..."></textarea>
    <button type="button" onclick="addNote()" class="add-note-btn"><i class="fas fa-plus"></i> Добавить</button>
  </div>
</div>

<div class="section-title"   style="margin-top: 10px;"><i class="fas fa-list"></i> Все Заметки</div>
<div id="all-notes"></div>

<script>
function esc(s) {
  return String(s == null ? '' : s)
    .replace(/&/g, '&amp;').replace(/</g, '&lt;')
    .replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&#39;');
}
var currentMemberId = null;
var selectedGuild = '{{ main_guild_id }}';

async function init() {
  var r = await fetch('/api/guilds');
  var guilds = await r.json();
  if(guilds.length) selectedGuild = guilds[0].id;
  loadAllNotes();
}

async function searchMember() {
  var q = document.getElementById('search-id').value.trim();
  if(!q || !selectedGuild) return;
  var r = await fetch('/api/guild/'+selectedGuild+'/members');
  var members = await r.json();
  var found = members.find(function(m){
    return m.id===q || m.name.toLowerCase().includes(q.toLowerCase()) || m.display_name.toLowerCase().includes(q.toLowerCase());
  });
  if(!found) { showToast('Участник не найден.', false); return; }
  currentMemberId = found.id;
  var _av = document.getElementById('res-avatar');
  if (found.avatar) { _av.removeAttribute('src'); _av.src = found.avatar; }
  else { _av.removeAttribute('src'); }
  document.getElementById('res-name').textContent = found.display_name;
  document.getElementById('res-id').textContent = found.id;
  document.getElementById('member-result').style.display = 'block';
  loadNotes(found.id);
}

async function loadNotes(id) {
  var r = await fetch('/api/member-notes/'+id);
  var notes = await r.json();
  document.getElementById('notes-list').innerHTML = notes.length ?
    notes.map(function(n){
      return '<div class="note-item"><div class="note-text">'+esc(n.text || n.note || '')+'</div>'+
        '<div class="note-meta"><i class="fas fa-user"   style="margin-right: 4px;"></i>'+esc(n.author || '—')+' &nbsp;·&nbsp; '+(n.created_at || n.timestamp ? new Date(n.created_at || n.timestamp).toLocaleString('ru-RU') : '—')+'</div>'+
        '<button type="button" class="note-del" aria-label="Удалить заметку" title="Удалить" onclick="deleteNote(\''+n.id+'\',\''+id+'\')"><i class="fas fa-xmark"></i></button></div>';
    }).join('') :
    '<p >Пока нет заметок.</p>';
}

async function addNote() {
  var text = document.getElementById('new-note').value.trim();
  if(!text || !currentMemberId) return;
  var r = await fetch('/api/member-notes/'+currentMemberId+'/add', {
    method:'POST', headers:{'Content-Type':'application/json'},
    body: JSON.stringify({text:text})
  });
  var d = await r.json();
  if(d.success) { document.getElementById('new-note').value=''; loadNotes(currentMemberId); loadAllNotes(); }
  else showToast(''+(d.error||'Ошибка'), false);
}

async function deleteNote(noteId, memberId) {
  var r = await fetch('/api/member-notes/'+memberId+'/'+noteId+'/delete', {method:'POST'});
  var d = await r.json();
  if(d.success) loadNotes(memberId);
}

async function loadAllNotes() {
  var r = await fetch('/api/member-notes');
  var all = await r.json();
  var box = document.getElementById('all-notes');
  if(!all.length) { box.innerHTML='<div class="empty-state"><i class="fas fa-sticky-note"   style="opacity: 0.3; margin-bottom: 10px;"></i>Пока нет заметок.</div>'; return; }
  box.innerHTML = all.map(function(entry){
    return '<div class="note-card"><div class="note-user">'+
      '<img alt="" class="note-avatar"'+(entry.avatar ? ' src="'+esc(entry.avatar)+'" onerror="this.src=\'https://cdn.discordapp.com/embed/avatars/0.png\'"' : '')+'>'+
      '<div><div class="note-name">'+entry.name+'</div><div class="note-id">'+entry.id+'</div></div></div>'+
      entry.notes.map(function(n){
        return '<div class="note-item"><div class="note-text">'+n.text+'</div>'+
          '<div class="note-meta">'+n.author+' · '+new Date(n.created_at).toLocaleString('tr-TR')+'</div></div>';
      }).join('')+'</div>';
  }).join('');
}

init();
</script>
{% endblock %}
