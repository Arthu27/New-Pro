<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Ответ принят · Administration</title>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@600;800&family=Syne:wght@800&display=swap" rel="stylesheet">
  <style>
    :root { --bg:#07080a; --ink:#f2f4f8; --muted:#7f8798; --ok:#4fd18b; --font:"Manrope",system-ui,sans-serif; --display:"Syne",system-ui,sans-serif; }
    *{box-sizing:border-box} html,body{margin:0;min-height:100%;font:15px/1.5 var(--font);color:var(--ink);background:var(--bg)}
    body{display:grid;place-items:center;padding:24px;
      background:radial-gradient(40vw 30vw at 80% 10%,rgba(79,209,139,.12),transparent 55%),#07080a}
    .box{width:min(520px,100%);padding:32px 28px;border-radius:18px;border:1px solid rgba(255,255,255,.1);
      background:rgba(18,19,24,.92);text-align:center;box-shadow:0 24px 60px rgba(0,0,0,.45)}
    .mark{width:54px;height:54px;margin:0 auto 14px;border-radius:50%;display:grid;place-items:center;
      background:rgba(79,209,139,.14);color:var(--ok);font-size:1.5rem;font-weight:800}
    h1{margin:0 0 8px;font-family:var(--display);font-size:1.7rem}
    p{margin:0;color:var(--muted)}
  </style>
</head>
<body>
  <div class="box">
    <div class="mark">✓</div>
    <h1>Ответ принят</h1>
    <p>Спасибо, {{ nick }}. Мы свяжемся после проверки.</p>
  </div>
</body>
</html>
