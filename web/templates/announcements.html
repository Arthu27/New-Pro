{% extends "base.html" %}
{% block title %}Объявления — Aether{% endblock %}
{% block page_title %}<i class="fas fa-bullhorn" ></i> Объявления{% endblock %}
{% block content %}
{% block page_hero %}
<style>
.ann-hero-title{
  background:linear-gradient(120deg,var(--ac-2) 10%,#fff3d6 35%,var(--ac) 55%,var(--ac-3) 90%);
  background-size:200% 100%;
  -webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;
  animation:annShimmer 5.5s ease-in-out infinite;
}
@keyframes annShimmer{0%,100%{background-position:0% 0}50%{background-position:100% 0}}
.ann-hero-av{animation:annAvFloat 4s ease-in-out infinite}
@keyframes annAvFloat{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
</style>
<div class="page-hero welcome-hero" data-reveal="up">
  <div class="page-hero-content">
    <div class="page-hero-greeting">
      <span class="dot"></span>
      <span>Объявления сервера</span>
    </div>
    <div class="hero-guild-row">
      <div class="hero-guild-av ann-hero-av"><i class="fas fa-bullhorn"></i></div>
      <div>
        <h1 class="ann-hero-title">Объявления</h1>
        <p>Все важные новости и объявления сервера в одном месте.</p>
      </div>
    </div>
  </div>
</div>
{% endblock %}

<style>

.ann-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px}
.ann-card{background:linear-gradient(165deg,rgba(224,176,74,.04),rgba(20,18,14,.7));border:1px solid var(--line-2);border-radius:14px;padding:18px;backdrop-filter:blur(14px)}
.ann-header{display:flex;align-items:center;gap:12px;margin-bottom:12px}
.ann-icon{width:44px;height:44px;border-radius:12px;background:linear-gradient(135deg,var(--ac-2),var(--ac-3));display:flex;align-items:center;justify-content:center;font-size:18px;color:#1a1a1a}
.ann-meta{font-size:12px;color:var(--text-3)}
.ann-body{font-size:13.5px;color:var(--text-2);line-height:1.6}

</style>



<div id="ann-list"><div class="empty-state"><i class="fas fa-spinner fa-spin"></i><p>Загрузка...</p></div></div>

<script>
function esc(s) { return String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;'); }

async function loadAnns() {
  var r = await fetch('/api/announcements');
  var anns = await r.json();
  var box = document.getElementById('ann-list');
  if (!anns.length) {
    box.innerHTML = '<div class="empty-state"><i class="fas fa-bullhorn"></i><p>Пока объявлений нет</p></div>';
    return;
  }
  box.innerHTML = anns.map(function(a) {
    var d = new Date(a.created_at);
    return '<div class="ann-card">' +
      '<div class="ann-header">' +
        '<div class="ann-icon"><i class="fas fa-bullhorn"></i></div>' +
        '<div><div class="ann-title">'+esc(a.title)+'</div><div class="ann-meta"><i class="fas fa-user"></i> '+esc(a.from)+' <span >•</span> <i class="fas fa-clock"></i> '+d.toLocaleString('ru-RU')+'</div></div>' +
      '</div>' +
      '<div class="ann-body">'+esc(a.message).replace(/\n/g,'<br>')+'</div>' +
    '</div>';
  }).join('');
}
loadAnns();
</script>
{% endblock %}
