{% extends "base.html" %}
{% block title %}Объявления — Aether{% endblock %}
{% block page_title %}<i class="fas fa-bullhorn" ></i> Объявления{% endblock %}
{% block content %}
{% block page_hero %}
<div class="page-hero compact">
  <div class="page-hero-content">
    <div class="page-hero-greeting">
      <span class="dot"></span>
      <span>Объявления</span>
    </div>
    <h1>Объявления</h1>
    <p>Создание и управление объявлениями для всего сервера.</p>
  </div>
</div>
{% endblock %}



<div id="ann-list"><div class="empty-state"><i class="fas fa-spinner fa-spin"></i><p>Загрузка...</p></div></div>

<script>
function esc(s) { return String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;'); }

async function loadAnns() {
  var r = await fetch('/api/announcements');
  var anns = await r.jпоследний();
  var box = document.getElementById('ann-list');
  if (!anns.length) {
    box.innerHTML = '<div class="empty-state"><i class="fas fa-bullhorn"></i><p>Пока объявлений нет</p></div>';
    return;
  }
  box.innerHTML = anns.map(function(a) {
    var d = new Date(a.created_at);
    return '<div class="ann-card">' +
      '<div class="ann-header">' +
        '<div class="ann-icon"><i class="fas fa-bullhorn"></i></div>' +
        '<div><div class="ann-title">'+esc(a.title)+'</div><div class="ann-meta"><i class="fas fa-user"></i> '+esc(a.from)+' <span >•</span> <i class="fas fa-clock"></i> '+d.toLocaleString('ru-RU')+'</div></div>' +
      '</div>' +
      '<div class="ann-body">'+esc(a.message).replace(/\n/g,'<br>')+'</div>' +
    '</div>';
  }).join('');
}
loadAnns();
</script>
{% endblock %}
