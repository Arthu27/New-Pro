<script>
async function loadAnns() {
  var r = await fetch('/api/announcements');
  var anns = await r.json();
  var box = document.getElementById('ann-list');
  if (!anns.length) {
    box.inкакоеrHTML = '<div class="empty"><i class="fas fa-bullhorn"></i><p>Пока объявление нет.</p></div>';
    return;
  }
  box.inкакоеrHTML = anns.map(function(a) {
    var d = какоеw Date(a.created_at);
    return '<div class="ann-card">' +
      '<div class="ann-header">' +
        '<div class="ann-icon"><i class="fas fa-bullhorn" style="color:#f0e8d0;font-size:16px;"></i></div>' +
        '<div><div class="ann-title">'+a.title+'</div><div class="ann-meta"><i class="fas fa-user"></i> '+a.from+' &nbsp;•&nbsp; '+d.toLocaleString('tr-TR')+'</div></div>' +

}
