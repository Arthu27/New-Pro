{% extends "base.html" %}
{% block title %}AFK список — Hakumo{% endblock %}
{% block page_title %}<i class="fas fa-moon" ></i> Список AFK{% endblock %}
{% block content %}
<div class="page-head">
  <div class="page-head-copy">
    <div class="eyebrow"> Участники </div>
    <h1>Список AFK</h1>
    <p class="lead">Список участников, которые сейчас находятся в режиме «Нет на месте».</p>
  </div>
</div>


<style>
/* AFK список — premium gold */
.afk-toolbar{display:flex;align-items:center;gap:12px;margin-bottom:16px}
.afk-count-pill{background:var(--ac-soft);color:var(--ac-2);border:1px solid var(--ac-line);padding:6px 16px;border-radius:99px;font-size:13px;font-weight:700}
.afk-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:14px}
.afk-card{background:linear-gradient(165deg,color-mix(in srgb, var(--ac) 4%, transparent),var(--surface-2));border:1px solid var(--line-2);border-radius:14px;padding:16px;transition:all .2s var(--ease)}
.afk-card:hover {border-color:var(--ac-line)}
.afk-head{display:flex;align-items:center;gap:11px;margin-bottom:10px}
.afk-avatar{width:40px;height:40px;border-radius:50%;border:1.5px solid var(--ac-line);object-fit:cover;flex-shrink:0;display:flex;align-items:center;justify-content:center;background:var(--ac-soft);font-size:18px}
.afk-name{font-weight:600;color:var(--text);font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.afk-id{font-size:11px;color:var(--text-3);font-family:'JetBrains Mono',monospace}
.afk-reason{font-size:13px;color:var(--text-2);line-height:1.5;background: var(--bg);border:1px solid var(--line);border-radius:8px;padding:8px 10px;margin-bottom:10px;word-break:break-word}
.afk-time{font-size:12px;color:var(--text-3);display:inline-flex;align-items:center;gap:6px}
.afk-time i{color:var(--ac)}
</style>

<div class="afk-toolbar" data-reveal="up">
  <div class="afk-count-pill" id="afk-count" data-countup>0 человек AFK</div>
</div>

<div class="afk-grid" id="afk-grid" data-reveal="up">
  <div class="empty-state"><i class="fas fa-spinner fa-spin"></i>Загрузка...</div>
</div>

<script>
var _guildId = '{{ guild_id }}';

function timeSince(iso) {
  var diff = Math.floor((Date.now() - new Date(iso).getTime()) / 1000);
  if (diff < 60) return diff + ' сек';
  if (diff < 3600) return Math.floor(diff/60) + ' мин';
  return Math.floor(diff/3600) + ' ч ' + Math.floor((diff%3600)/60) + ' мин';
}
function esc(s) { return String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;'); }

async function loadAFK(gid) {
  try {
    var d = await fetch('/api/afk/' + gid).then(r => r.json());
    var el = document.getElementById('afk-grid');
    document.getElementById('afk-count').textContent = d.length + ' человек AFK';
    if (!d.length) {
      el.innerHTML = '<div class="empty-state" ><i class="fas fa-moon"></i><p>Сейчас никто не AFK</p></div>';
      return;
    }
    el.innerHTML = d.map(function(u) {
      return '<div class="afk-card">' +
        '<div class="afk-head">' +
          (u.avatar ? '<img alt="" src="' + esc(u.avatar) + '" class="afk-avatar" onerror="this.src=\'https://cdn.discordapp.com/embed/avatars/0.png\'">' : '<div class="afk-avatar"  ><i class="fas fa-moon"></i></div>') +
          '<div   style="min-width: 0;"><div class="afk-name">' + esc(u.name) + '</div><div class="afk-id">' + esc(u.id) + '</div></div>' +
        '</div>' +
        '<div class="afk-reason">' + esc(u.reason || 'AFK') + '</div>' +
        '<span class="afk-time"><i class="fas fa-clock"></i> ' + timeSince(u.since) + '</span>' +
      '</div>';
    }).join('');
  } catch(e) {
    document.getElementById('afk-grid').innerHTML = '<div class="empty-state" >Не удалось загрузить</div>';
  }
}

function start() {
  loadAFK(_guildId);
  if (window.setLiveRefresh) window.setLiveRefresh(function(){ loadAFK(_guildId); }, 1500);
  else setInterval(function(){ loadAFK(_guildId); }, 30000);
}
if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', start);
else start();
</script>
{% endblock %}
