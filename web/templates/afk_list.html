{% extends "base.html" %}
{% block title %}AFK список — Aether{% endblock %}
{% block page_title %}<i class="fas fa-moon" ></i> Список AFK{% endblock %}
{% block content %}

<div class="afk-toolbar">
  <div class="afk-count-pill" id="afk-count">0 человек AFK</div>
</div>

<div class="afk-grid" id="afk-grid">
  <div class="empty-state"><i class="fas fa-spinner fa-spin"></i>Загрузка...</div>
</div>

<script>
var _guildId = '{{ guild_id }}';

function timeSince(iso) {
  var diff = Math.floor((Date.now() - new Date(iso).getTime()) / 1000);
  if (diff < 60) return diff + ' сек';
  if (diff < 3600) return Math.floor(diff/60) + ' мин';
  return Math.floor(diff/3600) + ' ч ' + Math.floor((diff%3600)/60) + ' мин';
}
function esc(s) { return String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;'); }

async function loadAFK(gid) {
  try {
    var d = await fetch('/api/afk/' + gid).then(r => r.json());
    var el = document.getElementById('afk-grid');
    document.getElementById('afk-count').textContent = d.length + ' человек AFK';
    if (!d.length) {
      el.innerHTML = '<div class="empty-state" ><i class="fas fa-moon"></i><p>Сейчас никто не AFK</p></div>';
      return;
    }
    el.innerHTML = d.map(function(u) {
      return '<div class="afk-card">' +
        '<div class="afk-head">' +
          (u.avatar ? '<img src="' + esc(u.avatar) + '" class="afk-avatar" onerror="this.src=\'https://cdn.discordapp.com/embed/avatars/0.png\'">' : '<div class="afk-avatar" style="display: flex">💤</div>') +
          '<div style="flex: 1; min-width: 0"><div class="afk-name">💤 ' + esc(u.name) + '</div><div class="afk-id">' + esc(u.id) + '</div></div>' +
        '</div>' +
        '<div class="afk-reason">' + esc(u.reason || 'AFK') + '</div>' +
        '<span class="afk-time"><i class="fas fa-clock"></i> ' + timeSince(u.since) + '</span>' +
      '</div>';
    }).join('');
  } catch(e) {
    document.getElementById('afk-grid').innerHTML = '<div class="empty-state" >Не удалось загрузить</div>';
  }
}

setInterval(function(){ loadAFK(_guildId); }, 30000);
loadAFK(_guildId);
</script>
{% endblock %}
