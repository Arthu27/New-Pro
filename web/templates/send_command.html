{% extends "base.html" %}
{% block title %}Отправить сообщение — Aether{% endblock %}
{% block page_title %}<i class="fas fa-paper-plane" style="color:var(--ac);"></i> Отправить сообщение{% endblock %}
{% block content %}
<style>
.sc-wrap{max-width:620px;margin:0 auto;}
.sc-card{
  background:var(--surface) !important;
  border:1px solid var(--line) !important;
  border-radius:var(--r-lg) !important;
  padding:28px !important;
  transition:border-color 0.2s var(--ease);
}
.sc-card:hover{border-color:var(--ac-line) !important;}
.sc-card h2{font-size:11.5px !important;font-weight:700 !important;color:var(--text-2) !important;text-transform:uppercase !important;letter-spacing:0.10em !important;margin-bottom:18px !important;padding-bottom:12px !important;border-bottom:1px solid var(--line) !important;display:flex;align-items:center;gap:8px;}
.sc-card h2 i{color:var(--ac);font-size:14px;}
.field-input:disabled{opacity:0.45;cursor:not-allowed;}
.send-btn{width:100%;padding:12px;background:linear-gradient(135deg, var(--ac), var(--ac-3));color:var(--bg);border:none;border-radius:10px;cursor:pointer;font-weight:700;font-size:13px;font-family:Inter,sans-serif;transition:all 0.18s var(--ease);margin-top:8px;box-shadow:0 4px 14px var(--ac-glow);}
.send-btn:hover{transform:translateY(-1px);box-shadow:0 6px 22px rgba(212,168,67,0.40);filter:brightness(1.05);}
.send-btn:disabled{opacity:0.5;cursor:not-allowed;transform:none;}
.result-box{margin-top:14px;padding:12px 16px;border-radius:10px;display:none;font-size:13px;font-weight:600;animation:fadeUp 0.3s var(--ease-out) both;}
</style>

<div class="sc-wrap">
  <div class="sc-card">
    <h2><i class="fas fa-paper-plane"></i> Новое сообщение</h2>
    <div class="form-group">
      <label>Сервер</label>
      <select id="guild-select" class="field-input" onchange="loadChannels()">
        <option value="">Загрузка...</option>
      </select>
    </div>
    <div class="form-group">
      <label>Канал</label>
      <select id="channel-select" class="field-input" disabled>
        <option value="">Сначала выберите сервер</option>
      </select>
    </div>
    <div class="form-group">
      <label>Сообщение</label>
      <textarea id="message-input" class="field-input" rows="5" placeholder="Напишите сообщение..." style="resize:vertical;"></textarea>
    </div>
    <button id="send-btn" class="send-btn" onclick="sendMessage()">
      <i class="fas fa-paper-plane"></i> Отправить
    </button>
    <div id="result" class="result-box"></div>
  </div>
</div>

<script>
const GUILD_ID = '{{ main_guild_id }}';

async function loadChannels() {
  var cs = document.getElementById('channel-select');
  cs.innerHTML = '<option value="">Загрузка...</option>';
  try {
    var r = await fetch('/api/guild/' + GUILD_ID + '/channels');
    var data = await r.json();
    var channels = Array.isArray(data) ? data : (data.channels || []);
    cs.innerHTML = '<option value="">Выберите канал...</option>';
    channels.filter(function(c) { return c.type === 'text'; }).forEach(function(c) {
      var o = document.createElement('option');
      o.value = c.id; o.textContent = '#' + c.name;
      cs.appendChild(o);
    });
  } catch(e) { cs.innerHTML = '<option value="">Ошибка загрузки</option>'; }
}

async function sendMessage() {
  var cid = document.getElementById('channel-select').value;
  var msg = document.getElementById('message-input').value.trim();
  if (!cid || !msg) { showResult('Заполните поля канала и сообщения!', false); return; }
  var btn = document.getElementById('send-btn');
  btn.disabled = true; btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Отправка...';
  try {
    var r = await fetch('/api/send-message', {
      method: 'POST', headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({guild_id: GUILD_ID, channel_id: cid, message: msg})
    });
    var d = await r.json();
    btn.disabled = false; btn.innerHTML = '<i class="fas fa-paper-plane"></i> Отправить';
    if (d.success) { showResult('✓ Сообщение отправлено!', true); document.getElementById('message-input').value = ''; }
    else showResult('✗ ' + (d.error || 'Неизвестная ошибка'), false);
  } catch(e) {
    btn.disabled = false; btn.innerHTML = '<i class="fas fa-paper-plane"></i> Отправить';
    showResult('✗ Ошибка соединения', false);
  }
}

function showResult(msg, ok) {
  var box = document.getElementById('result');
  box.style.display = 'block';
  box.style.background = ok ? 'rgba(52,211,153,0.10)' : 'rgba(248,113,113,0.10)';
  box.style.border = '1px solid ' + (ok ? 'rgba(52,211,153,0.30)' : 'rgba(248,113,113,0.30)');
  box.style.color = ok ? 'var(--ok)' : 'var(--err)';
  box.textContent = msg;
  setTimeout(function() { box.style.display = 'none'; }, 5000);
}

loadChannels();
</script>
{% endblock %}
