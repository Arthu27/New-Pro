{% extends "base.html" %}
{% block title %}Поиск участников — Aether{% endblock %}
{% block page_title %}<i class="fas fa-search" ></i> Поиск участников{% endblock %}
{% block content %}
<style>
.ms-bar { display: flex; gap: 8px; margin-bottom: 16px; max-width: 560px; }
.ms-bar input[type="text"] { flex: 1; background: rgba(0,0,0,0.3); border: 1px solid var(--line); border-radius: var(--r-sm); padding: 10px 14px; color: var(--text); font-size: 13px; outline: none; }
.ms-bar input[type="text"]:focus { border-color: var(--ac); box-shadow: 0 0 0 3px var(--ac-soft); }
.ms-bar .btn { background: linear-gradient(135deg, var(--ac), #c8972f); color: #1a1405; border: none; border-radius: var(--r-sm); padding: 0 18px; font-weight: var(--fw-bold); cursor: pointer; }
.ms-results { display: flex; flex-direction: column; gap: 8px; margin-bottom: 16px; }
.ms-result-card { display: flex; align-items: center; gap: 12px; padding: 12px 14px; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-md); cursor: pointer; transition: all .15s var(--ease); }
.ms-result-card:hover { border-color: var(--ac); background: rgba(224,176,74,0.05); }
.ms-result-card img { width: 40px; height: 40px; border-radius: 50%; object-fit: cover; background: var(--ac-soft); }
.ms-result-card .name { font-weight: var(--fw-semibold); font-size: 14px; }
.ms-result-card .id { font-size: 11px; color: #8a8374; margin-top: 2px; }
.ms-profile { display: none; grid-template-columns: 1fr 1fr; gap: 12px; }
.ms-profile > div { display: flex; flex-direction: column; gap: 12px; }
.ms-card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-md); padding: 16px; }
.ms-card h2 { font-size: 13px; font-weight: var(--fw-bold); margin-bottom: 12px; display: flex; align-items: center; gap: 8px; }
.ms-card h2 i { color: var(--ac); }
.ms-row { display: flex; justify-content: space-between; padding: 8px 0; border-bottom: 1px solid var(--line); font-size: 12.5px; }
.ms-row:last-child { border-bottom: none; }
.ms-key { color: #8a8374; }
.ms-val.ok { color: var(--ok); font-weight: var(--fw-semibold); }
.ms-val.danger { color: var(--err); font-weight: var(--fw-bold); }
.ms-val { color: var(--text); font-weight: var(--fw-semibold); }
.ms-val.id { font-family: 'JetBrains Mono',monospace; font-size: 11.5px; }
.ms-head { display: flex; align-items: center; gap: 12px; margin-bottom: 10px; }
.ms-head img { width: 64px; height: 64px; border-radius: 50%; object-fit: cover; border: 2px solid var(--ac-line); }
.ms-head .nm { font-weight: 700; font-size: 15.5px; color: var(--text); }
.ms-head .un { font-size: 12px; color: var(--text-3); font-family: 'JetBrains Mono',monospace; }
.ms-meta { color: var(--text-3); font-size: 11.5px; }
.ms-note { padding: 22px; text-align: center; color: var(--text-3); font-size: 13px; background: var(--surface); border: 1px dashed var(--line); border-radius: var(--r-md); }
.ms-av-fb { display: flex; align-items: center; justify-content: center; background: var(--ac-soft); border-radius: 50%; color: var(--ac); flex-shrink: 0; }
.ms-roles { display: flex; flex-wrap: wrap; gap: 2px; justify-content: flex-end; }
.warn-item, .case-item { font-size: 12.5px; padding: 7px 0; border-bottom: 1px solid var(--line); }
.warn-item:last-child, .case-item:last-child { border-bottom: none; }
@media (max-width: 720px) { .ms-profile { grid-template-columns: 1fr; } }
</style>
{% block page_hero %}
<div class="page-hero compact">
  <div class="page-hero-content">
    <div class="page-hero-greeting">
      <span class="dot"></span>
      <span>Поиск участников</span>
    </div>
    <h1>Поиск участников</h1>
    <p>Быстрый поиск участников по имени или ID.</p>
  </div>
</div>
{% endblock %}



<div class="ms-bar">
  <input type="text" id="ms-query" placeholder="Имя пользователя или ID..." onkeydown="if(event.key==='Enter')search()" aria-label="Имя пользователя или ID...">
  <button class="btn btn-primary" onclick="search()"><i class="fas fa-search"></i> Поиск</button>
</div>

<div id="ms-results" class="ms-results"></div>
<div id="ms-profile" class="ms-profile"  ></div>

<script>
var GUILD_ID = '{{ guild_id }}';
function esc(s) { return String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;'); }

function roleChips(roles) {
  roles = roles || [];
  if (!roles.length) return '—';
  return roles.map(function (r) {
    var name = (typeof r === 'string') ? r : (r && r.name) || '';
    var c = (typeof r === 'object' && r) ? String(r.color || '') : '';
    if (c && c.charAt(0) !== '#') c = '#' + c;
    if (!/^#[0-9a-fA-F]{6}$/.test(c) || c.toLowerCase() === '#000000') c = '';
    var acc = c ? ' style="border-color:' + c + ';color:' + c + ';"' : '';
    return '<span class="role-chip"' + acc + '>' + esc(name) + '</span>';
  }).join('');
}

async function search() {
  var q = document.getElementById('ms-query').value.trim();
  if (!q) return;
  document.getElementById('ms-results').innerHTML = '<div class="ms-note">Поиск...</div>';
  document.getElementById('ms-profile').style.display = 'none';
  try {
    var d = await fetch('/api/member-search/' + GUILD_ID + '?q=' + encodeURIComponent(q)).then(r => r.json());
    if (!d.length) {
      document.getElementById('ms-results').innerHTML = '<div class="ms-note">Ничего не найдено</div>';
      return;
    }
    document.getElementById('ms-results').innerHTML = d.map(function(m) {
      return '<div class="ms-result-card" onclick="loadProfile(\'' + esc(m.id) + '\')">' +
        (m.avatar ? '<img src="' + esc(m.avatar) + '" onerror="this.src=\'https://cdn.discordapp.com/embed/avatars/0.png\'">' : '<div class="ms-av-fb" style="width:40px;height:40px;font-size:17px;">👤</div>') +
        '<div><div class="name">' + esc(m.display_name) + '</div>' +
        '<div class="id">' + esc(m.id) + '</div></div>' +
      '</div>';
    }).join('');
  } catch(e) {
    document.getElementById('ms-results').innerHTML = '<div class="ms-note">Ошибка: ' + esc(e.message) + '</div>';
  }
}

async function loadProfile(userId) {
  document.getElementById('ms-profile').style.display = 'none';
  try {
    var d = await fetch('/api/member-profile/' + GUILD_ID + '/' + userId).then(r => r.json());
    var el = document.getElementById('ms-profile');
    el.style.display = 'grid';

    var warns = d.warnings || [];
    var cases = d.cases || d.case || [];

    var leftHtml = '<div>' +
      '<div class="ms-card">' +
        '<div class="ms-head">' +
          (d.avatar ? '<img src="' + esc(d.avatar) + '" onerror="this.src=\'https://cdn.discordapp.com/embed/avatars/0.png\'">' : '<div class="ms-av-fb" style="width:64px;height:64px;font-size:26px;">👤</div>') +
          '<div><div class="nm">' + esc(d.display_name||d.name||userId) + '</div>' +
          '<div class="un">@' + esc(d.name||userId) + '</div></div>' +
        '</div>' +
        '<div class="ms-row"><span class="ms-key">ID</span><span class="ms-val id">' + esc(d.id) + '</span></div>' +
        (d.joined_at ? '<div class="ms-row"><span class="ms-key">Дата входа</span><span class="ms-val">' + new Date(d.joined_at).toLocaleDateString('ru-RU') + '</span></div>' : '') +
        (d.created_at ? '<div class="ms-row"><span class="ms-key">Аккаунт создан</span><span class="ms-val">' + new Date(d.created_at).toLocaleDateString('ru-RU') + '</span></div>' : '') +
        '<div class="ms-row"><span class="ms-key">Роли</span><span class="ms-val ms-roles">' + roleChips(d.roles) + '</span></div>' +
        '<div class="ms-row"><span class="ms-key">Предупреждения</span><span class="ms-val ' + (warns.length>0?'danger':'ok') + '">' + warns.length + '</span></div>' +
        '<div class="ms-row"><span class="ms-key">Записей модерации</span><span class="ms-val">' + cases.length + '</span></div>' +
      '</div>' +
    '</div>';

    var rightHtml = '<div>' +
      '<div class="ms-card">' +
        '<h2><i class="fas fa-exclamation-triangle"></i> Предупреждения (' + warns.length + ')</h2>' +
        (warns.length ? warns.slice(-5).map(function(w, wi){
          return '<div class="warn-item"><div class="ms-meta">#' + esc(w.id == null ? wi + 1 : w.id) + ' — ' + esc((w.timestamp||'').slice(0,10)) + '</div><div style="margin-top: 3px;">' + esc(w.reason||'?') + '</div></div>';
        }).join('') : '<div >✓ Предупреждений нет</div>') +
      '</div>' +
      '<div class="ms-card">' +
        '<h2><i class="fas fa-clipboard-list"></i> История модерации (' + cases.length + ')</h2>' +
        (cases.length ? cases.slice(-5).map(function(c, ci){
          return '<div class="case-item"><div class="ms-meta">#' + esc(c.id == null ? ci + 1 : c.id) + ' ' + esc((c.action||'').toUpperCase()) + ' — ' + esc((c.timestamp||'').slice(0,10)) + '</div><div style="margin-top: 3px;">' + esc(c.reason||'?') + '</div></div>';
        }).join('') : '<div >✓ Записей нет</div>') +
      '</div>' +
    '</div>';

    el.innerHTML = leftHtml + rightHtml;
  } catch(e) {
    document.getElementById('ms-profile').innerHTML = '<div class="ms-note">Ошибка загрузки: ' + esc(e.message) + '</div>';
    document.getElementById('ms-profile').style.display = 'block';
  }
}
</script>
{% endblock %}
