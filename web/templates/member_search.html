{% extends "base.html" %}
{% block title %}Поиск участников — Aether{% endblock %}
{% block page_title %}<i class="fas fa-search" style="color:var(--ac);"></i> Поиск участников{% endblock %}
{% block content %}
<style>
.ms-bar{display:flex;gap:10px;margin-bottom:18px;flex-wrap:wrap;}
.ms-bar input{flex:1;min-width:240px;}
.ms-results{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:18px;}
.ms-result-card{
  display:flex;align-items:center;gap:10px;
  padding:10px 14px;
  background:var(--surface);
  border:1px solid var(--line);
  border-radius:10px;
  cursor:pointer;
  transition:all 0.18s var(--ease);
}
.ms-result-card:hover{border-color:var(--ac-line);transform:translateY(-2px);box-shadow:var(--shadow-md);}
.ms-result-card img{width:32px;height:32px;border-radius:50%;border:2px solid var(--ac);object-fit:cover;}
.ms-result-card .name{font-size:13px;font-weight:600;color:var(--text);}
.ms-result-card .id{font-size:10.5px;color:var(--text-3);font-family:'JetBrains Mono', monospace;}
.ms-profile{display:grid;grid-template-columns:280px 1fr;gap:14px;}
.ms-card{
  background:var(--surface) !important;
  border:1px solid var(--line) !important;
  border-radius:var(--r-lg) !important;
  padding:20px !important;
  margin-bottom:14px !important;
  transition:border-color 0.2s var(--ease);
}
.ms-card:hover{border-color:var(--ac-line) !important;}
.ms-card h2{font-size:11.5px !important;font-weight:700 !important;color:var(--text-2) !important;text-transform:uppercase !important;letter-spacing:0.10em !important;margin-bottom:14px !important;padding-bottom:10px !important;border-bottom:1px solid var(--line) !important;display:flex;align-items:center;gap:8px;}
.ms-card h2 i{color:var(--ac);font-size:14px;}
.ms-row{display:flex;justify-content:space-between;padding:9px 0;border-bottom:1px solid var(--line);font-size:12.5px;align-items:center;}
.ms-row:last-child{border-bottom:none;}
.ms-key{color:var(--text-3);font-size:11px;text-transform:uppercase;letter-spacing:0.06em;font-weight:600;}
.ms-val{color:var(--text);font-weight:600;text-align:right;max-width:200px;overflow:hidden;text-overflow:ellipsis;}
.ms-val.id{font-family:'JetBrains Mono', monospace;font-size:11px;color:var(--ac);}
.ms-val.danger{color:var(--err);}
.ms-val.ok{color:var(--ok);}
.warn-item{padding:10px 14px;background:rgba(251,191,36,0.06);border:1px solid rgba(251,191,36,0.18);border-radius:8px;margin-bottom:6px;font-size:12.5px;transition:all 0.18s var(--ease);}
.warn-item:hover{background:rgba(251,191,36,0.10);transform:translateX(3px);}
.case-item{padding:10px 14px;background:var(--ac-soft);border:1px solid var(--ac-line);border-radius:8px;margin-bottom:6px;font-size:12.5px;transition:all 0.18s var(--ease);}
.case-item:hover{background:rgba(212,168,67,0.10);transform:translateX(3px);}
@media(max-width:768px){.ms-profile{grid-template-columns:1fr;}}
</style>

<div class="ms-bar">
  <input type="text" id="ms-query" placeholder="Имя пользователя или ID..." onkeydown="if(event.key==='Enter')search()">
  <button class="btn btn-primary" onclick="search()"><i class="fas fa-search"></i> Поиск</button>
</div>

<div id="ms-results" class="ms-results"></div>
<div id="ms-profile" class="ms-profile" style="display:none;"></div>

<script>
var GUILD_ID = '{{ guild_id }}';
function esc(s) { return String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;'); }

async function search() {
  var q = document.getElementById('ms-query').value.trim();
  if (!q) return;
  document.getElementById('ms-results').innerHTML = '<div style="color:var(--text-3);font-size:13px;padding:10px;">Поиск...</div>';
  document.getElementById('ms-profile').style.display = 'none';
  try {
    var d = await fetch('/api/member-search/' + GUILD_ID + '?q=' + encodeURIComponent(q)).then(r => r.json());
    if (!d.length) {
      document.getElementById('ms-results').innerHTML = '<div style="color:var(--text-3);font-size:13px;padding:10px;">Ничего не найдено</div>';
      return;
    }
    document.getElementById('ms-results').innerHTML = d.map(function(m) {
      return '<div class="ms-result-card" onclick="loadProfile(' + m.id + ')">' +
        (m.avatar ? '<img src="' + esc(m.avatar) + '" onerror="this.src=\'https://cdn.discordapp.com/embed/avatars/0.png\'">' : '<div style="width:32px;height:32px;border-radius:50%;background:var(--ac-soft);display:flex;align-items:center;justify-content:center;">👤</div>') +
        '<div><div class="name">' + esc(m.display_name) + '</div>' +
        '<div class="id">' + esc(m.id) + '</div></div>' +
      '</div>';
    }).join('');
  } catch(e) {
    document.getElementById('ms-results').innerHTML = '<div style="color:var(--err);padding:10px;">Ошибка: ' + esc(e.message) + '</div>';
  }
}

async function loadProfile(userId) {
  document.getElementById('ms-profile').style.display = 'none';
  try {
    var d = await fetch('/api/member-profile/' + GUILD_ID + '/' + userId).then(r => r.json());
    var el = document.getElementById('ms-profile');
    el.style.display = 'grid';

    var warns = d.warnings || [];
    var cases = d.cases || [];

    var leftHtml = '<div>' +
      '<div class="ms-card">' +
        '<div style="display:flex;align-items:center;gap:14px;margin-bottom:18px;">' +
          (d.avatar ? '<img src="' + esc(d.avatar) + '" style="width:64px;height:64px;border-radius:50%;border:2px solid var(--ac);box-shadow:0 0 0 3px rgba(0,0,0,0.4);" onerror="this.src=\'https://cdn.discordapp.com/embed/avatars/0.png\'">' : '<div style="width:64px;height:64px;border-radius:50%;background:var(--ac-soft);display:flex;align-items:center;justify-content:center;font-size:28px;">👤</div>') +
          '<div><div style="font-size:16px;font-weight:700;color:var(--text);">' + esc(d.display_name||d.name||userId) + '</div>' +
          '<div style="font-size:12px;color:var(--text-3);">@' + esc(d.name||userId) + '</div></div>' +
        '</div>' +
        '<div class="ms-row"><span class="ms-key">ID</span><span class="ms-val id">' + esc(d.id) + '</span></div>' +
        (d.joined_at ? '<div class="ms-row"><span class="ms-key">Дата входа</span><span class="ms-val">' + new Date(d.joined_at).toLocaleDateString('ru-RU') + '</span></div>' : '') +
        (d.created_at ? '<div class="ms-row"><span class="ms-key">Аккаунт создан</span><span class="ms-val">' + new Date(d.created_at).toLocaleDateString('ru-RU') + '</span></div>' : '') +
        '<div class="ms-row"><span class="ms-key">Роли</span><span class="ms-val">' + esc((d.roles||[]).slice(0,4).join(', ') || '—') + '</span></div>' +
        '<div class="ms-row"><span class="ms-key">Предупреждения</span><span class="ms-val ' + (warns.length>0?'danger':'ok') + '">' + warns.length + '</span></div>' +
        '<div class="ms-row"><span class="ms-key">Записей модерации</span><span class="ms-val">' + cases.length + '</span></div>' +
      '</div>' +
    '</div>';

    var rightHtml = '<div>' +
      '<div class="ms-card">' +
        '<h2><i class="fas fa-exclamation-triangle"></i> Предупреждения (' + warns.length + ')</h2>' +
        (warns.length ? warns.slice(-5).map(function(w){
          return '<div class="warn-item"><div style="font-weight:700;color:var(--warn);">#' + esc(w.id) + ' — ' + esc((w.timestamp||'').slice(0,10)) + '</div><div style="color:var(--text-2);margin-top:3px;">' + esc(w.reason||'?') + '</div></div>';
        }).join('') : '<div style="text-align:center;padding:18px;color:var(--text-3);font-size:12.5px;">✓ Предупреждений нет</div>') +
      '</div>' +
      '<div class="ms-card">' +
        '<h2><i class="fas fa-clipboard-list"></i> История модерации (' + cases.length + ')</h2>' +
        (cases.length ? cases.slice(-5).map(function(c){
          return '<div class="case-item"><div style="font-weight:700;color:var(--ac);">#' + esc(c.id) + ' ' + esc((c.action||'').toUpperCase()) + ' — ' + esc((c.timestamp||'').slice(0,10)) + '</div><div style="color:var(--text-2);margin-top:3px;">' + esc(c.reason||'?') + '</div></div>';
        }).join('') : '<div style="text-align:center;padding:18px;color:var(--text-3);font-size:12.5px;">✓ Записей нет</div>') +
      '</div>' +
    '</div>';

    el.innerHTML = leftHtml + rightHtml;
  } catch(e) {
    document.getElementById('ms-profile').innerHTML = '<div style="color:var(--err);">Ошибка загрузки: ' + esc(e.message) + '</div>';
    document.getElementById('ms-profile').style.display = 'block';
  }
}
</script>
{% endblock %}
