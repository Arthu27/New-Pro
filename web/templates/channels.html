{% extends "base.html" %}
{% block title %}Канал Управление — Aether{% endblock %}
{% block page_title %}Канал Управление{% endblock %}
{% block content %}
<style>
/* ── Toolbar ── */
.ch-toolbar{display:flex;align-items:center;gap:10px;margin-bottom:18px;flex-wrap:wrap;}
.ch-select{flex:1;min-width:200px;padding:9px 12px;background:rgba(255,255,255,0.03);border:1px solid rgba(212,168,67,0.16);border-radius:8px;color:#f0e8d0;font-size:13px;font-family:Inter,sans-serif;}
.ch-select:focus{outline:none;border-color:#c8922a;box-shadow:0 0 0 3px var(--accent-dim);}
.btn-new{display:inline-flex;align-items:center;gap:7px;padding:9px 18px;background:#c8922a;color:#100e08;border:none;border-radius:99px;cursor:pointer;font-weight:700;font-size:13px;font-family:Inter,sans-serif;transition:all 0.15s;white-space:nowrap;}
.btn-new:hover{background:#e0a830;transform:translateY(-1px);box-shadow:0 4px 16px var(--accent-glow);}

/* ── Stats row ── */
.ch-stats{display:flex;gap:10px;margin-bottom:18px;flex-wrap:wrap;}
.ch-stat{background:rgba(26,22,16,0.7);border:1px solid rgba(212,168,67,0.08);border-radius:14px;padding:10px 16px;display:flex;align-items:center;gap:10px;flex:1;min-width:110px;}
.ch-stat-icon{width:30px;height:30px;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:12px;flex-shrink:0;}
.ch-stat-val{font-size:18px;font-weight:800;color:#f0e8d0;letter-spacing:-0.02em;line-height:1;}
.ch-stat-lbl{font-size:10px;color:#5a5040;font-weight:500;text-transform:uppercase;letter-spacing:0.06em;}

/* ── Ana kanal kutusu — kisa, scroll'suz ── */
.ch-box{background:rgba(26,22,16,0.7);border:1px solid rgba(212,168,67,0.08);border-radius:14px;overflow:hidden;margin-bottom:16px;}
.ch-box-header{padding:12px 18px;border-bottom:1px solid rgba(212,168,67,0.07);display:flex;align-items:center;justify-content:space-between;}
.ch-box-title{font-size:11px;font-weight:700;color:rgba(240,232,208,0.55);text-transform:uppercase;letter-spacing:0.08em;display:flex;align-items:center;gap:7px;}
.ch-box-count{font-size:10px;color:#5a5040;background:rgba(212,168,67,0.04);padding:2px 8px;border-radius:99px;}

/* ── Kategoriler (accordion, kapali baslar) ── */
.cat-group{border-bottom:1px solid rgba(212,168,67,0.06);}
/* Son kategori veya root kanallardan sonra border kaldir */
.cat-group:last-child{border-bottom:none;}
.cat-header{padding:10px 18px;background:transparent;display:flex;align-items:center;gap:9px;cursor:pointer;user-select:none;transition:background 0.1s;}
.cat-header:hover{background:rgba(212,168,67,0.05);}
.cat-icon{color:#c8922a;font-size:11px;width:14px;text-align:center;flex-shrink:0;transition:transform 0.15s;}
.cat-group.collapsed .cat-icon{transform:rotate(-90deg);}
.cat-name{font-size:10px;font-weight:700;color:rgba(240,232,208,0.5);text-transform:uppercase;letter-spacing:0.1em;flex:1;}
.cat-count{font-size:10px;color:#5a5040;background:rgba(212,168,67,0.06);padding:1px 7px;border-radius:99px;}
.cat-channels{display:block;padding:2px 0 6px;}
.cat-group.collapsed .cat-channels{display:none;}

/* ── Kanal satiri (kanal her zaman gorunur, sadece kategorinin altinda) ── */
.ch-row{display:flex;align-items:center;justify-content:space-between;padding:7px 18px 7px 38px;transition:background 0.1s;cursor:default;}
.ch-row:hover{background:rgba(212,168,67,0.06);}
.ch-row-left{display:flex;align-items:center;gap:9px;flex:1;min-width:0;}
.ch-type-icon{width:24px;height:24px;border-radius:6px;display:flex;align-items:center;justify-content:center;font-size:10px;flex-shrink:0;}
.icon-text{background:rgba(106,176,224,0.1);color:var(--blue);}
.icon-voice{background:rgba(94,196,122,0.1);color:var(--green);}
.icon-forum{background:rgba(212,168,67,0.1);color:#c8922a;}
.ch-name{font-size:13px;font-weight:500;color:#f0e8d0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.ch-badge{font-size:9px;font-weight:600;padding:1px 6px;border-radius:99px;text-transform:uppercase;letter-spacing:0.04em;flex-shrink:0;}
.badge-text{background:rgba(106,176,224,0.08);color:var(--blue);border:1px solid rgba(106,176,224,0.15);}
.badge-voice{background:rgba(94,196,122,0.08);color:var(--green);border:1px solid rgba(94,196,122,0.15);}
.badge-forum{background:rgba(212,168,67,0.08);color:#c8922a;border:1px solid rgba(212,168,67,0.15);}

/* Silme butonu — her zaman gorunur, kucuk */
.del-btn{width:22px;height:22px;display:flex;align-items:center;justify-content:center;background:transparent;border:1px solid transparent;border-radius:5px;cursor:pointer;color:#5a5040;font-size:9px;transition:all 0.15s;flex-shrink:0;margin-left:6px;}
.del-btn:hover{background:rgba(224,85,85,0.12);border-color:rgba(224,85,85,0.25);color:var(--red);}

/* Kategorisiz kanallar (root) */
.ch-row-root{padding-left:18px;}

/* Empty */
.ch-empty{padding:30px;text-align:center;color:#5a5040;font-size:12px;}

/* ── Modal ── */
.modal-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,0.8);backdrop-filter:blur(6px);z-index:9999;align-items:center;justify-content:center;}
.modal-overlay.open{display:flex;}
.modal-card{background:rgba(26,22,16,0.7);border:1px solid rgba(212,168,67,0.16);border-radius:14px;padding:28px;width:420px;max-width:92vw;box-shadow:0 24px 80px rgba(0,0,0,0.6);}
.modal-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:22px;}
.modal-head h3{font-size:16px;font-weight:700;color:#f0e8d0;letter-spacing:-0.02em;}
.modal-close{width:28px;height:28px;display:flex;align-items:center;justify-content:center;background:transparent;border:1px solid rgba(212,168,67,0.08);border-radius:7px;cursor:pointer;color:#5a5040;font-size:13px;transition:all 0.15s;}
.modal-close:hover{background:rgba(212,168,67,0.04);color:#f0e8d0;}
.field-label{font-size:11px;font-weight:600;color:rgba(240,232,208,0.55);text-transform:uppercase;letter-spacing:0.06em;display:block;margin-bottom:6px;}
.field-input{width:100%;padding:9px 12px;background:rgba(255,255,255,0.03);border:1px solid rgba(212,168,67,0.16);border-radius:8px;color:#f0e8d0;font-size:13px;font-family:Inter,sans-serif;margin-bottom:14px;box-sizing:border-box;transition:border-color 0.15s;}
.field-input:focus{outline:none;border-color:#c8922a;box-shadow:0 0 0 3px var(--accent-dim);}
.type-grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-bottom:18px;}
.type-opt{padding:10px 8px;background:rgba(255,255,255,0.03);border:1px solid rgba(212,168,67,0.16);border-radius:9px;cursor:pointer;text-align:center;transition:all 0.15s;}
.type-opt:hover{border-color:rgba(212,168,67,0.2);background:rgba(212,168,67,0.04);}
.type-opt.selected{border-color:#c8922a;background:rgba(212,168,67,0.1);}
.type-opt-icon{font-size:18px;margin-bottom:5px;}
.type-opt-lbl{font-size:11px;font-weight:600;color:rgba(240,232,208,0.55);}
.type-opt.selected .type-opt-lbl{color:#e0a830;}
.modal-actions{display:flex;gap:8px;}
.btn-confirm{flex:1;padding:10px;background:#c8922a;color:#100e08;border:none;border-radius:99px;cursor:pointer;font-weight:700;font-size:13px;font-family:Inter,sans-serif;transition:all 0.15s;}
.btn-confirm:hover{background:#e0a830;}
.btn-cancel{flex:1;padding:10px;background:transparent;color:rgba(240,232,208,0.55);border:1px solid rgba(212,168,67,0.08);border-radius:99px;cursor:pointer;font-weight:600;font-size:13px;font-family:Inter,sans-serif;transition:all 0.15s;}
.btn-cancel:hover{background:rgba(212,168,67,0.04);color:#f0e8d0;}
</style>

<!-- Toolbar -->
<div class="ch-toolbar">
  <select id="guild-select" class="ch-select">
    <option value="">Выберите сервер...</option>
  </select>
  <button class="btn-new" id="btnNewChannel" type="button">
    <i class="fas fa-plus"></i> Новый Канал
  </button>
</div>

<!-- Stats -->
<div class="ch-stats" id="ch-stats">
  <div class="ch-stat">
    <div class="ch-stat-icon icon-text"><i class="fas fa-hashtag"></i></div>
    <div><div class="ch-stat-val" id="stat-text">0</div><div class="ch-stat-lbl">Текст</div></div>
  </div>
  <div class="ch-stat">
    <div class="ch-stat-icon icon-voice"><i class="fas fa-volume-up"></i></div>
    <div><div class="ch-stat-val" id="stat-voice">0</div><div class="ch-stat-lbl">Голос</div></div>
  </div>
  <div class="ch-stat">
    <div class="ch-stat-icon" style="background:rgba(212,168,67,0.12);color:#c8922a;"><i class="fas fa-folder"></i></div>
    <div><div class="ch-stat-val" id="stat-cat">0</div><div class="ch-stat-lbl">Категория</div></div>
  </div>
  <div class="ch-stat">
    <div class="ch-stat-icon" style="background:rgba(212,168,67,0.1);color:#e0a830;"><i class="fas fa-layer-group"></i></div>
    <div><div class="ch-stat-val" id="stat-total">0</div><div class="ch-stat-lbl">Всего</div></div>
  </div>
</div>

<!-- Kanal listesi — kitap gibi, kategoriler collapsed, scroll'suz -->
<div class="ch-box" id="ch-box">
  <div class="ch-box-header">
    <div class="ch-box-title"><i class="fas fa-list"></i> Список каналов</div>
    <span class="ch-box-count" id="ch-count">—</span>
  </div>
  <div id="channel-list">
    <div class="ch-empty"><i class="fas fa-hashtag"></i><p>Выберите сервер</p></div>
  </div>
</div>

<!-- Modal pencere -->
<div id="modal" class="modal-overlay">
  <div class="modal-card">
    <div class="modal-head">
      <h3><i class="fas fa-plus-circle" style="color:#c8922a;margin-right:8px;"></i>Новый Канал</h3>
      <button class="modal-close" id="btnCloseModal" type="button"><i class="fas fa-times"></i></button>
    </div>
    <label class="field-label">Название канала</label>
    <input type="text" id="ch-name" placeholder="канал-имя" class="field-input">
    <label class="field-label">Тип канала</label>
    <div class="type-grid">
      <div class="type-opt selected" data-type="text">
        <div class="type-opt-icon">#</div>
        <div class="type-opt-lbl">Текст</div>
      </div>
      <div class="type-opt" data-type="voice">
        <div class="type-opt-icon">🔊</div>
        <div class="type-opt-lbl">Голос</div>
      </div>
      <div class="type-opt" data-type="category">
        <div class="type-opt-icon">📁</div>
        <div class="type-opt-lbl">Категория</div>
      </div>
    </div>
    <input type="hidden" id="ch-type" value="text">
    <div class="modal-actions">
      <button class="btn-confirm" id="btnCreateChannel" type="button">Создать</button>
      <button class="btn-cancel" id="btnCancelChannel" type="button">Отмена</button>
    </div>
  </div>
</div>

<script>
(function () {
  'use strict';

  var MAIN_GID = '{{ main_guild_id }}';
  var selectedGuild = MAIN_GID;

  function $(id) { return document.getElementById(id); }

  function escapeAttr(s) {
    return String(s).replace(/&/g, '&amp;').replace(/'/g, '&#39;').replace(/"/g, '&quot;');
  }

  function escapeHtml(s) {
    return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
  }

  function selectType(val, el) {
    document.querySelectorAll('.type-opt').forEach(function (o) { o.classList.remove('selected'); });
    if (el) el.classList.add('selected');
    $('ch-type').value = val;
  }

  function renderRow(ch, isRoot) {
    var icon, iconClass, badgeClass, badgeLabel;
    if (ch.type === 'text') {
      icon = 'fa-hashtag'; iconClass = 'icon-text'; badgeClass = 'badge-text'; badgeLabel = 'Текст';
    } else if (ch.type === 'voice') {
      icon = 'fa-volume-up'; iconClass = 'icon-voice'; badgeClass = 'badge-voice'; badgeLabel = 'Голос';
    } else {
      icon = 'fa-comments'; iconClass = 'icon-forum'; badgeClass = 'badge-forum'; badgeLabel = 'Forum';
    }
    var rootClass = isRoot ? ' ch-row-root' : '';
    return '<div class="ch-row' + rootClass + '">' +
      '<div class="ch-row-left">' +
        '<div class="ch-type-icon ' + iconClass + '"><i class="fas ' + icon + '"></i></div>' +
        '<span class="ch-name">' + escapeHtml(ch.name) + '</span>' +
        '<span class="ch-badge ' + badgeClass + '">' + badgeLabel + '</span>' +
      '</div>' +
      '<button class="del-btn" data-action="delete-ch" data-id="' + ch.id + '" data-name="' + escapeAttr(ch.name) + '" type="button"><i class="fas fa-trash"></i></button>' +
    '</div>';
  }

  async function loadChannels() {
    if (!selectedGuild) return;

    var list = $('channel-list');
    list.innerHTML = '<div class="ch-empty"><i class="fas fa-spinner fa-spin"></i><p>Загрузка...</p></div>';

    try {
      var r = await fetch('/api/guild/' + selectedGuild + '/channels');
      var chData = await r.json();
      var channels = Array.isArray(chData) ? chData : (chData.channels || []);

      // Stats
      var textCount  = channels.filter(function (c) { return c.type === 'text'; }).length;
      var voiceCount = channels.filter(function (c) { return c.type === 'voice'; }).length;
      var catCount   = channels.filter(function (c) { return c.type === 'category'; }).length;
      $('stat-text').textContent  = textCount;
      $('stat-voice').textContent = voiceCount;
      $('stat-cat').textContent   = catCount;
      $('stat-total').textContent = channels.length;
      $('ch-count').textContent   = channels.length + ' канал';
      $('ch-stats').style.display = 'flex';

      if (!channels.length) {
        list.innerHTML = '<div class="ch-empty"><i class="fas fa-hashtag"></i><p>Канал не найдено.</p></div>';
        return;
      }

      // Kategorilere gore grupla
      var cats = channels.filter(function (c) { return c.type === 'category'; });
      var grouped = {};
      cats.forEach(function (c) { grouped[c.name] = []; });
      var uncategorized = [];

      channels.forEach(function (c) {
        if (c.type === 'category') return;
        if (c.category) {
          if (!grouped[c.category]) grouped[c.category] = [];
          grouped[c.category].push(c);
        } else {
          uncategorized.push(c);
        }
      });

      // Hangi kategorinin acik olacagini localStorage'dan hatirla
      var openState = {};
      try {
        var saved = localStorage.getItem('ch_open_cats_' + selectedGuild);
        if (saved) openState = JSON.parse(saved) || {};
      } catch (e) {}

      var html = '';

      // Kategorisiz kanallar (root)
      if (uncategorized.length) {
        uncategorized.forEach(function (ch) { html += renderRow(ch, true); });
      }

      // Kategoriler
      cats.forEach(function (cat) {
        var children = grouped[cat.name] || [];
        var isOpen = openState[cat.name] !== false; // default acik
        var collapsed = isOpen ? '' : ' collapsed';
        html += '<div class="cat-group' + collapsed + '" data-cat-name="' + escapeAttr(cat.name) + '">';
        html += '<div class="cat-header" data-toggle-cat>';
        html += '<i class="fas fa-chevron-down cat-icon"></i>';
        html += '<span class="cat-name">' + escapeHtml(cat.name) + '</span>';
        html += '<span class="cat-count">' + children.length + '</span>';
        html += '<button class="del-btn" data-action="delete-cat" data-id="' + cat.id + '" data-name="' + escapeAttr(cat.name) + '" type="button" onclick="event.stopPropagation()"><i class="fas fa-trash"></i></button>';
        html += '</div>';
        html += '<div class="cat-channels">';
        if (children.length) {
          children.forEach(function (ch) { html += renderRow(ch, false); });
        } else {
          html += '<div style="padding:6px 18px 6px 38px;font-size:11px;color:#5a5040;font-style:italic;">Пустая категория</div>';
        }
        html += '</div></div>';
      });

      // Tek seferde DOM'a bas (layout titremesi olmasin)
      var frag = document.createDocumentFragment();
      var tmp = document.createElement('div');
      tmp.innerHTML = html;
      while (tmp.firstChild) frag.appendChild(tmp.firstChild);
      list.innerHTML = '';
      list.appendChild(frag);
    } catch (e) {
      list.innerHTML = '<div class="ch-empty"><i class="fas fa-exclamation-triangle"></i><p>Ошибка: ' + escapeHtml(e.message) + '</p></div>';
    }
  }

  function toggleCat(header) {
    var group = header.closest('.cat-group');
    if (!group) return;
    group.classList.toggle('collapsed');
    // State'i kaydet
    try {
      var key = 'ch_open_cats_' + selectedGuild;
      var state = {};
      var saved = localStorage.getItem(key);
      if (saved) state = JSON.parse(saved) || {};
      var name = group.getAttribute('data-cat-name');
      if (name) {
        state[name] = !group.classList.contains('collapsed');
        localStorage.setItem(key, JSON.stringify(state));
      }
    } catch (e) {}
  }

  function openNameModal() {
    $('ch-name').value = '';
    $('modal').classList.add('open');
    setTimeout(function () { $('ch-name').focus(); }, 50);
  }
  function closeModal() { $('modal').classList.remove('open'); }

  async function createChannel() {
    var name = $('ch-name').value.trim();
    var type = $('ch-type').value;
    if (!name) { alert('Введите имя канала!'); return; }
    try {
      var r = await fetch('/api/guild/' + selectedGuild + '/channels/create', {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ name: name, type: type })
      });
      var d = await r.json();
      if (d.success) { closeModal(); loadChannels(); }
      else alert('Ошибка: ' + (d.error || 'Неизвестно'));
    } catch (e) { alert('Ошибка запроса: ' + e.message); }
  }

  async function deleteChannel(id, name) {
    if (!confirm('"' + name + '" канал будет удалён. Продолжить?')) return;
    try {
      var r = await fetch('/api/guild/' + selectedGuild + '/channels/' + id + '/delete', { method: 'POST' });
      var d = await r.json();
      if (d.success) loadChannels();
      else alert('Ошибка: ' + (d.error || 'Неизвестно'));
    } catch (e) { alert('Ошибка запроса: ' + e.message); }
  }

  function bindEvents() {
    // Tur secimi
    document.querySelectorAll('.type-opt').forEach(function (el) {
      el.addEventListener('click', function () {
        selectType(el.getAttribute('data-type'), el);
      });
    });

    // Modal butonlari
    var btnNew = $('btnNewChannel');
    if (btnNew) btnNew.addEventListener('click', openNameModal);
    var btnClose = $('btnCloseModal');
    if (btnClose) btnClose.addEventListener('click', closeModal);
    var btnCancel = $('btnCancelChannel');
    if (btnCancel) btnCancel.addEventListener('click', closeModal);
    var btnCreate = $('btnCreateChannel');
    if (btnCreate) btnCreate.addEventListener('click', createChannel);

    // Guild degisince kanallari yeniden yukle
    var gs = $('guild-select');
    if (gs) gs.addEventListener('change', function () {
      var nextGuild = gs.value || MAIN_GID;
      if (nextGuild === selectedGuild) return;
      selectedGuild = nextGuild;
      loadChannels();
    });

    // Modal backdrop tiklaninca kapat
    var modal = $('modal');
    if (modal) modal.addEventListener('click', function (e) { if (e.target === modal) closeModal(); });

    // Kanal listesi: kategori toggle + silme
    var list = $('channel-list');
    if (list) {
      list.addEventListener('click', function (e) {
        // Once silme butonunu kontrol et (event.stopPropagation ile)
        var btn = e.target.closest('button[data-action]');
        if (btn) {
          e.stopPropagation();
          var action = btn.getAttribute('data-action');
          var id = btn.getAttribute('data-id');
          var name = btn.getAttribute('data-name');
          if (action === 'delete-ch' || action === 'delete-cat') {
            deleteChannel(id, name);
          }
          return;
        }
        // Sonra kategori basligini kontrol et
        var hdr = e.target.closest('[data-toggle-cat]');
        if (hdr) toggleCat(hdr);
      });
    }
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', init);
  } else {
    init();
  }
  function init() {
    bindEvents();
    loadChannels();
  }
})();
</script>
{% endblock %}
