{% extends "base.html" %}
{% block title %}Резервные копии - Aether{% endblock %}
{% block page_title %}<i class="fas fa-database" style="color:var(--ac);"></i> Резервное копирование{% endblock %}
{% block content %}

<div class="bk-grid">
  <div class="bk-card"><div class="bk-icon"><i class="fas fa-database"></i></div><div class="bk-val" id="stat-total">-</div><div class="bk-lbl">Всего копий</div></div>
  <div class="bk-card"><div class="bk-icon"><i class="fas fa-hdd"></i></div><div class="bk-val" id="stat-size">-</div><div class="bk-lbl">Размер</div></div>
  <div class="bk-card"><div class="bk-icon"><i class="fas fa-clock"></i></div><div class="bk-val" id="stat-last">-</div><div class="bk-lbl">Последняя</div></div>
</div>

<div class="bk-actions">
  <button class="btn btn-primary" id="btn-create" type="button"><i class="fas fa-plus"></i> Создать копию</button>
  <button class="btn btn-warn" id="btn-restore" type="button"><i class="fas fa-history"></i> Восстановить</button>
  <button class="btn btn-danger" id="btn-clean" type="button"><i class="fas fa-trash"></i> Очистить старые</button>
</div>

<div class="bk-box">
  <div class="bk-head">
    <div class="bk-title"><i class="fas fa-list"></i> Список резервных копий</div>
    <span class="bk-count" id="bk-count">-</span>
  </div>
  <div class="bk-body" id="bk-body">
    <p style="text-align:center;color:var(--text-3);padding:30px;font-size:12px;"><i class="fas fa-spinner fa-spin"></i> Загрузка...</p>
  </div>
</div>

<script>
(function () {
  'use strict';
  function $(id) { return document.getElementById(id); }
  function esc(s) { return String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;'); }
  function showToast(msg, ok) {
    var t = document.createElement('div');
    t.textContent = msg;
    t.style.cssText = 'position:fixed;top:14px;right:14px;padding:9px 16px;border-radius:8px;font-weight:600;z-index:99999;font-size:12px;background:' + (ok ? 'linear-gradient(135deg,var(--ok),var(--ok))' : 'linear-gradient(135deg,var(--err),var(--err))') + ';color:#fff;';
    document.body.appendChild(t);
    setTimeout(function () { t.remove(); }, 1800);
  }

  var backups = [
    { name: 'backup_2026-07-30_02-00.zip', size: '12.4 MB', date: '2 saat ёnce' },
    { name: 'backup_2026-07-29_02-00.zip', size: '12.1 MB', date: '1 gюn ёnce' },
    { name: 'backup_2026-07-28_02-00.zip', size: '11.8 MB', date: '2 gюn ёnce' },
    { name: 'backup_2026-07-27_02-00.zip', size: '11.5 MB', date: '3 gюn ёnce' }
  ];

  function render() {
    $('bk-count').textContent = backups.length;
    $('stat-total').textContent = backups.length;
    $('stat-size').textContent = '47.8 MB';
    $('stat-last').textContent = '2s';
    var html = '';
    backups.forEach(function (b, i) {
      html += '<div class="bk-file">' +
        '<div class="bk-file-icon"><i class="fas fa-file-archive"></i></div>' +
        '<div class="bk-file-info"><div class="bk-file-name">' + esc(b.name) + '</div><div class="bk-file-meta">' + esc(b.date) + '</div></div>' +
        '<div class="bk-file-size">' + esc(b.size) + '</div>' +
        '<div class="bk-file-actions"><button class="btn btn-warn" data-i="' + i + '" data-act="restore" type="button" style="padding:4px 8px;font-size:10px;"><i class="fas fa-undo"></i></button><button class="btn btn-danger" data-i="' + i + '" data-act="del" type="button" style="padding:4px 8px;font-size:10px;"><i class="fas fa-trash"></i></button></div>' +
      '</div>';
    });
    $('bk-body').innerHTML = html;
  }

  function bind() {
    $('btn-create').addEventListener('click', function () { showToast('Резервная копия создана', true); backups.unshift({name:'backup_now.zip',size:'12.5 MB',date:'сейчас'}); render(); });
    $('btn-restore').addEventListener('click', function () { showToast('Выберите копию для восстановления', true); });
    $('btn-clean').addEventListener('click', function () { if (confirm('Удалить старые копии?')) { backups = backups.slice(0, 2); render(); } });
    $('bk-body').addEventListener('click', function (e) {
      var b = e.target.closest('button[data-act]');
      if (!b) return;
      var i = parseInt(b.getAttribute('data-i'), 10);
      if (b.getAttribute('data-act') === 'del') { if (confirm('Удалить копию?')) { backups.splice(i, 1); render(); } }
      else { showToast('Восстановление запущено', true); }
    });
  }

  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', function () { bind(); render(); });
  else { bind(); render(); }
})();
</script>
{% endblock %}
