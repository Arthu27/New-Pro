{% extends "base.html" %}
{% block title %}Опросы - Aether{% endblock %}
{% block page_title %}Опросы{% endblock %}
{% block content %}
<style>
.poll-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:10px;max-height:520px;overflow-y:auto;overflow-anchor:none;padding:4px;}
.poll-card{background:rgba(26,22,16,0.7);border:1px solid rgba(212,168,67,0.1);border-radius:12px;padding:14px;animation:fadeUp 0.3s ease-out both;position:relative;overflow:hidden;}
@keyframes fadeUp{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
.poll-card:hover{border-color:rgba(212,168,67,0.25);}
.poll-card::before{content:'';position:absolute;top:0;left:0;right:0;height:2px;background:linear-gradient(90deg,transparent,#c8922a,transparent);}
.poll-q{font-size:13px;font-weight:700;color:#f0e8d0;margin-bottom:10px;line-height:1.3;}
.poll-opt{display:flex;align-items:center;gap:6px;padding:6px 10px;background:rgba(255,255,255,0.04);border-radius:6px;margin-bottom:4px;font-size:11px;}
.poll-bar{flex:1;height:5px;background:rgba(255,255,255,0.06);border-radius:99px;overflow:hidden;}
.poll-bar-fill{height:100%;background:linear-gradient(90deg,#c8922a,#e0a830);border-radius:99px;transition:width 0.3s;}
.poll-votes{font-size:10px;color:#5a5040;min-width:36px;text-align:right;}
.poll-foot{display:flex;justify-content:space-between;align-items:center;margin-top:8px;padding-top:8px;border-top:1px solid rgba(212,168,67,0.06);font-size:10px;color:#5a5040;}
.poll-badge{padding:2px 7px;border-radius:99px;background:rgba(94,196,122,0.12);color:#5ec47a;font-size:9px;font-weight:700;letter-spacing:0.04em;}
.poll-badge.ended{background:rgba(90,80,64,0.18);color:#5a5040;}

.btn{padding:8px 14px;border:none;border-radius:99px;cursor:pointer;font-weight:600;font-size:12px;font-family:Inter,sans-serif;display:inline-flex;align-items:center;gap:5px;}
.btn-primary{background:#c8922a;color:#100e08;}
.btn-primary:hover{background:#e0a830;}
.btn-warn{background:rgba(232,144,58,0.15);color:#e8903a;border:1px solid rgba(232,144,58,0.3);}
</style>

<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;flex-wrap:wrap;gap:8px;">
  <div style="display:flex;gap:8px;">
    <div class="poll-badge" id="active-count">0 aktifных</div>
    <div class="poll-badge ended" id="ended-count">0 завершённых</div>
  </div>
  <button class="btn btn-primary" id="btn-new" type="button"><i class="fas fa-plus"></i> Новый опрос</button>
</div>

<div class="poll-grid" id="poll-grid">
  <p style="text-align:center;color:#5a5040;padding:30px;font-size:12px;grid-column:1/-1;">Опросов нет</p>
</div>

<script>
(function () {
  'use strict';
  function $(id) { return document.getElementById(id); }
  function esc(s) { return String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;'); }

  var polls = [
    { q: 'Hangi oyun en sevdiğiniz?', opts: [{t:'Minecraft',v:120},{t:'LOL',v:85},{t:'Valorant',v:64}], active: true, voters: 269 },
    { q: 'Yeni özellik önerisi?', opts: [{t:'Müzik sistemi',v:45},{t:'Mini oyunlar',v:32}], active: true, voters: 77 },
    { q: 'Eski anket', opts: [{t:'A',v:10}], active: false, voters: 10 }
  ];

  function render() {
    var act = polls.filter(function (p) { return p.active; }).length;
    var end = polls.filter(function (p) { return !p.active; }).length;
    $('active-count').textContent = act + ' aktif';
    $('ended-count').textContent = end + ' завершённых';
    if (!polls.length) {
      $('poll-grid').innerHTML = '<p style="text-align:center;color:#5a5040;padding:30px;font-size:12px;grid-column:1/-1;">Опросов нет</p>';
      return;
    }
    var html = '';
    polls.forEach(function (p, i) {
      var total = p.opts.reduce(function (a, b) { return a + b.v; }, 0);
      html += '<div class="poll-card" style="animation-delay:' + (i * 0.05) + 's;">' +
        '<div class="poll-q">' + esc(p.q) + '</div>';
      p.opts.forEach(function (o) {
        var pct = total ? Math.round(o.v / total * 100) : 0;
        html += '<div class="poll-opt"><span style="flex:0 0 90px;font-size:11px;color:#f0e8d0;">' + esc(o.t) + '</span><div class="poll-bar"><div class="poll-bar-fill" style="width:' + pct + '%;"></div></div><span class="poll-votes">' + pct + '%</span></div>';
      });
      html += '<div class="poll-foot"><span>' + p.voters + ' голосов</span><span class="poll-badge ' + (p.active ? '' : 'ended') + '">' + (p.active ? 'Активен' : 'Завершён') + '</span></div></div>';
    });
    $('poll-grid').innerHTML = html;
  }

  function bind() {
    var b = $('btn-new');
    if (b) b.addEventListener('click', function () { alert('Новый опрос — форма burada olacak'); });
  }

  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', function () { bind(); render(); });
  else { bind(); render(); }
})();
</script>
{% endblock %}
