{% extends "base.html" %}
{% block title %}День рождения — Aether{% endblock %}
{% block page_title %}<i class="fas fa-birthday-cake" style="color:var(--ac);"></i> День рождения{% endblock %}
{% block content %}
<style>
.bd-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px;max-width:820px;}
.bd-card{
  background:var(--surface) !important;
  border:1px solid var(--line) !important;
  border-radius:var(--r-lg) !important;
  padding:24px !important;
  transition:border-color 0.2s var(--ease);
}
.bd-card:hover{border-color:var(--ac-line) !important;}
.bd-card h2{font-size:11.5px !important;font-weight:700 !important;color:var(--text-2) !important;text-transform:uppercase !important;letter-spacing:0.10em !important;margin-bottom:18px !important;padding-bottom:12px !important;border-bottom:1px solid var(--line) !important;display:flex;align-items:center;gap:8px;}
.bd-card h2 i{color:var(--ac);font-size:14px;}
.bd-current{
  background:rgba(244,114,182,0.08);
  border:1px solid rgba(244,114,182,0.25);
  border-radius:10px;
  padding:12px 16px;
  margin-bottom:16px;
  font-size:13px;
  color:rgba(245,236,210,0.75);
  display:none;
}
.bd-current strong{color:var(--pink);font-weight:700;}
.bd-grid-3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;}
.bd-item{
  display:flex;align-items:center;justify-content:space-between;
  padding:10px 14px;
  background:var(--ac-soft);
  border:1px solid var(--ac-line);
  border-radius:10px;
  margin-bottom:8px;
  transition:all 0.18s var(--ease);
}
.bd-item:hover{transform:translateX(3px);}
.bd-item-name{font-size:13px;font-weight:600;color:var(--text);}
.bd-item-time{font-size:10.5px;color:var(--ac);font-weight:700;text-transform:uppercase;letter-spacing:0.06em;padding:2px 9px;border-radius:99px;background:rgba(212,168,67,0.10);border:1px solid var(--ac-line);}
.bd-item-time.today{background:rgba(244,114,182,0.10);color:var(--pink);border-color:rgba(244,114,182,0.30);}
.bd-empty{text-align:center;padding:30px 20px;color:var(--text-3);font-size:13px;}
.bd-empty i{display:block;font-size:32px;margin-bottom:10px;opacity:0.4;color:var(--ac);}
@media(max-width:768px){.bd-grid{grid-template-columns:1fr;}}
</style>

<div class="bd-grid">
  <div class="bd-card">
    <h2><i class="fas fa-birthday-cake"></i> Сохранить дату рождения</h2>
    <div id="bd-current" class="bd-current"></div>
    <div class="bd-grid-3">
      <div class="form-group"><label>День</label><input type="number" id="bd-day" placeholder="15" min="1" max="31"></div>
      <div class="form-group"><label>Месяц</label><input type="number" id="bd-month" placeholder="3" min="1" max="12"></div>
      <div class="form-group"><label>Год (опц.)</label><input type="number" id="bd-year" placeholder="2000" min="1900" max="2020"></div>
    </div>
    <button class="btn btn-primary" onclick="saveBirthday()"><i class="fas fa-save"></i> Сохранить</button>
    <span id="bd-msg" style="margin-left:12px;font-size:12px;color:var(--text-3);"></span>
  </div>

  <div class="bd-card">
    <h2><i class="fas fa-party-horn"></i> Ближайшие дни рождения</h2>
    <div id="bd-upcoming" class="bd-empty"><i class="fas fa-spinner fa-spin"></i>Загрузка...</div>
  </div>
</div>

<script>
var GUILD_ID = '{{ guild_id }}';

async function init() {
  try {
    var d = await fetch('/api/my-birthday/' + GUILD_ID).then(r => r.json());
    if (d.date) {
      var el = document.getElementById('bd-current');
      el.style.display = 'block';
      var parts = d.date.split('-');
      el.innerHTML = '🎂 Запись: <strong>' + parts[1] + '/' + parts[0] + (d.year ? '/' + d.year : '') + '</strong>';
      document.getElementById('bd-month').value = parseInt(parts[0]);
      document.getElementById('bd-day').value = parseInt(parts[1]);
      if (d.year) document.getElementById('bd-year').value = d.year;
    }
  } catch(e) {}
  loadUpcoming();
}

async function loadUpcoming() {
  try {
    var d = await fetch('/api/birthdays/' + GUILD_ID).then(r => r.json());
    var el = document.getElementById('bd-upcoming');
    if (!d.length) { el.innerHTML = '<div class="bd-empty"><i class="fas fa-calendar-xmark"></i>Записей нет</div>'; return; }
    el.innerHTML = d.slice(0,10).map(function(b) {
      var isToday = b.diff === 0;
      return '<div class="bd-item">' +
        '<span class="bd-item-name">' + (isToday?'🎉 ':'🎂 ') + b.name + '</span>' +
        '<span class="bd-item-time ' + (isToday?'today':'') + '">' + (isToday ? 'СЕГОДНЯ!' : b.diff + ' дн.') + '</span>' +
      '</div>';
    }).join('');
  } catch(e) {}
}

async function saveBirthday() {
  var msg = document.getElementById('bd-msg');
  var day   = parseInt(document.getElementById('bd-day').value);
  var month = parseInt(document.getElementById('bd-month').value);
  var year  = parseInt(document.getElementById('bd-year').value) || null;
  if (!day || !month) { msg.innerHTML = '<span style="color:var(--err);">❌ День и месяц обязательны</span>'; return; }
  if (day < 1 || day > 31 || month < 1 || month > 12) { msg.innerHTML = '<span style="color:var(--err);">❌ Неверная дата</span>'; return; }
  try {
    var r = await fetch('/api/my-birthday/' + GUILD_ID, {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({day, month, year})
    }).then(r => r.json());
    if (r.ok) { msg.innerHTML = '<span style="color:var(--ok);">✅ Сохранено!</span>'; init(); }
    else msg.innerHTML = '<span style="color:var(--err);">❌ ' + (r.error || 'Ошибка') + '</span>';
  } catch(e) { msg.innerHTML = '<span style="color:var(--err);">❌ Ошибка соединения</span>'; }
}

init();
</script>
{% endblock %}
