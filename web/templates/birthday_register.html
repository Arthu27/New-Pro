{% extends "base.html" %}
{% block title %}День рождение{% endblock %}
{% block page_title %}🎂 День рождениеm{% endblock %}
{% block content %}
<style>
.bd-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px;max-width:800px;}
.bd-card{background:rgba(26,22,16,0.7);border:1px solid rgba(212,168,67,0.1);border-radius:14px;padding:22px;}
.bd-card h2{font-size:11px;font-weight:700;color:rgba(240,232,208,0.4);text-transform:uppercase;letter-spacing:0.1em;margin-bottom:16px;padding-bottom:10px;border-bottom:1px solid rgba(212,168,67,0.08);}
label{font-size:11px;color:rgba(240,232,208,0.45);display:block;margin-bottom:4px;text-transform:uppercase;letter-spacing:0.06em;}
.field{margin-bottom:14px;}
.bd-current{background:rgba(255,105,129,0.08);border:1px solid rgba(255,105,129,0.2);border-radius:10px;padding:12px 16px;margin-bottom:16px;font-size:13px;color:rgba(240,232,208,0.7);}
.bd-item{display:flex;align-items:center;justify-content:space-between;padding:10px 12px;background:rgba(212,168,67,0.04);border:1px solid rgba(212,168,67,0.08);border-radius:8px;margin-bottom:6px;}
@media(max-width:768px){.bd-grid{grid-template-columns:1fr;}}
</style>

<div class="bd-grid">
  <div class="bd-card">
    <h2>🎂 Сохранить мою дату рождения</h2>
    <div id="bd-current" style="display:none;" class="bd-current"></div>
    <div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;">
      <div class="field"><label>день</label><input type="number" id="bd-day" placeholder="15" min="1" max="31"></div>
      <div class="field"><label>Месяц</label><input type="number" id="bd-month" placeholder="3" min="1" max="12"></div>
      <div class="field"><label>Год (opsiyonel)</label><input type="number" id="bd-year" placeholder="2000" min="1900" max="2020"></div>
    </div>
    <button class="btn btn-primary" onclick="saveBirthday()">🎂 Сохранить</button>
    <span id="bd-msg" style="margin-left:10px;font-size:12px;color:rgba(240,232,208,0.4);"></span>
  </div>

  <div class="bd-card">
    <h2>🎉 Ближайшие дни рождения</h2>
    <div id="bd-upcoming" style="color:rgba(240,232,208,0.3);font-size:13px;">Загрузка...</div>
  </div>
</div>

<script>
var GUILD_ID = '{{ guild_id }}';

async function init() {
  try {
    var d = await fetch('/api/my-birthday/' + GUILD_ID).then(r => r.json());
    if (d.date) {
      var el = document.getElementById('bd-current');
      el.style.display = 'block';
      var parts = d.date.split('-');
      el.innerHTML = '🎂 Запись: <strong style="color:#ff6b81;">' + parts[1] + '/' + parts[0] + (d.year ? '/' + d.year : '') + '</strong>';
      document.getElementById('bd-month').value = parseInt(parts[0]);
      document.getElementById('bd-day').value = parseInt(parts[1]);
      if (d.year) document.getElementById('bd-year').value = d.year;
    }
  } catch(e) {}
  loadUpcoming();
}

async function loadUpcoming() {
  try {
    var d = await fetch('/api/birthdays/' + GUILD_ID).then(r => r.json());
    var el = document.getElementById('bd-upcoming');
    if (!d.length) { el.innerHTML = '<div style="color:rgba(240,232,208,0.25);">Запись день рождение yok.</div>'; return; }
    el.innerHTML = d.slice(0,10).map(function(b) {
      var isToday = b.diff === 0;
      return '<div class="bd-item">' +
        '<span style="font-size:13px;font-weight:600;color:#f0e8d0;">' + (isToday?'🎉 ':'🎂 ') + b.name + '</span>' +
        '<span style="font-size:11px;color:' + (isToday?'#ff6b81':'rgba(240,232,208,0.4)') + ';">' + (isToday ? 'СЕГОДНЯ!' : b.diff + ' день') + '</span>' +
      '</div>';
    }).join('');
  } catch(e) {}
}

async function saveBirthday() {
  var msg = document.getElementById('bd-msg');
  var day   = parseInt(document.getElementById('bd-day').value);
  var month = parseInt(document.getElementById('bd-month').value);
  var year  = parseInt(document.getElementById('bd-year').value) || null;
  if (!day || !month) { msg.textContent = '❌ день ve ay zorunlu'; return; }
  if (day < 1 || day > 31 || month < 1 || month > 12) { msg.textContent = '❌ Неверный дата'; return; }
  try {
    var r = await fetch('/api/my-birthday/' + GUILD_ID, {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({day, month, year})
    }).then(r => r.json());
    if (r.ok) { msg.textContent = '✅ Сохранено!'; init(); }
    else msg.textContent = '❌ ' + (r.error || 'Ошибка');
  } catch(e) { msg.textContent = '❌ Ссылка ошибки'; }
}

init();
</script>
{% endblock %}
