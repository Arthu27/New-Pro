{% extends "base.html" %}
{% block title %}Bot Статистика - Aether{% endblock %}
{% block page_title %}📊 BOT СТАТИСТИКА{% endblock %}
{% block content %}
<style>
.bs-box{background:rgba(26,22,16,0.7);border:1px solid rgba(212,168,67,0.3);border-radius:15px;padding:25px;margin-bottom:20px;position:relative;overflow:hidden;}
.bs-title{color:#c8922a;font-size:13px;text-transform:uppercase;letter-spacing:2px;margin-bottom:18px;font-family:Inter,sans-serif;}
.stat-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:15px;margin-bottom:25px;}
.stat-box{background:linear-gradient(135deg,#100e08,rgba(26,22,16,0.7));border:1px solid rgba(212,168,67,0.25);border-radius:14px;padding:20px;text-align:center;transition:all 0.3s;}
.stat-box:hover{border-color:#c8922a;transform:translateY(-4px);box-shadow:0 8px 20px rgba(200,146,42,0.2);}
.stat-icon{font-size:30px;color:#c8922a;margin-bottom:10px;}
.stat-value{font-size:26px;font-weight:700;color:#f0e8d0;margin-bottom:5px;}
.stat-label{font-size:11px;color:rgba(240,232,208,0.55);text-transform:uppercase;letter-spacing:1px;}
@keyframes pulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:0.6;transform:scale(1.2)}}
</style>

<div class="stat-grid" id="stats">
  <div class="stat-box"><div class="stat-icon"><i class="fas fa-spinner fa-spin"></i></div><div class="stat-value">-</div><div class="stat-label">Загрузка</div></div>
</div>

<div class="bs-box">
  <div class="bs-title"><i class="fas fa-chart-line"></i> Использование системы</div>
  <canvas id="sysChart" height="80"></canvas>
</div>

{% if role == 'owner' or role == 'admin' %}
<div class="bs-box" style="border-color:rgba(231,76,60,0.4);">
  <div class="bs-title" style="color:#e05555;"><i class="fas fa-power-off"></i> Bot Контроль</div>
  <div style="display:flex;gap:12px;flex-wrap:wrap;">
    <button onclick="restartBot()" style="padding:12px 24px;background:rgba(224,85,85,0.8);color:#f0e8d0;border:none;border-radius:14px;cursor:pointer;font-weight:700;font-size:13px;transition:all .2s;">
      <i class="fas fa-redo"></i> Botu Перезапустить
    </button>
    <button onclick="syncCommands()" style="padding:12px 24px;background:#c8922a;color:#f0e8d0;border:none;border-radius:14px;cursor:pointer;font-weight:700;font-size:13px;transition:all .2s;">
      <i class="fas fa-sync"></i> Slash Команды Senkronize Et
    </button>
  </div>
  <div id="restart-status" style="margin-top:12px;font-size:13px;"></div>
</div>
{% endif %}

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script>
var sysChart;

async function loadStats() {
  var r = await fetch('/api/bot-stats');
  var d = await r.json();
  if (d.error) return;

  document.getElementById('stats').innerHTML =
    '<div class="stat-box"><div class="stat-icon"><i class="fas fa-server"></i></div><div class="stat-value">'+d.guilds+'</div><div class="stat-label">Сервер</div></div>' +
    '<div class="stat-box"><div class="stat-icon"><i class="fas fa-users"></i></div><div class="stat-value">'+d.users+'</div><div class="stat-label">Пользователей</div></div>' +
    '<div class="stat-box"><div class="stat-icon"><i class="fas fa-signal"></i></div><div class="stat-value">'+d.latency+'<span style="font-size:14px;">ms</span></div><div class="stat-label">Ping</div></div>' +
    '<div class="stat-box"><div class="stat-icon"><i class="fas fa-clock"></i></div><div class="stat-value" style="font-size:18px;">'+d.uptime+'</div><div class="stat-label">Uptime</div></div>' +
    '<div class="stat-box"><div class="stat-icon"><i class="fas fa-microchip"></i></div><div class="stat-value">'+d.cpu+'<span style="font-size:14px;">%</span></div><div class="stat-label">CPU</div></div>' +
    '<div class="stat-box"><div class="stat-icon"><i class="fas fa-memory"></i></div><div class="stat-value">'+d.ram+'<span style="font-size:14px;">MB</span></div><div class="stat-label">RAM</div></div>';

  if (sysChart) sysChart.destroy();
  sysChart = new Chart(document.getElementById('sysChart'), {
    type: 'line',
    data: {
      labels: (d.history||[]).map(function(h){return h.time;}),
      datasets: [
        {label:'CPU %', data:(d.history||[]).map(function(h){return h.cpu;}), borderColor:'#c8922a', backgroundColor:'rgba(200,146,42,0.1)', tension:0.4, fill:true},
        {label:'RAM MB', data:(d.history||[]).map(function(h){return h.ram;}), borderColor:'#e05555', backgroundColor:'rgba(224,85,85,0.1)', tension:0.4, fill:true}
      ]
    },
    options:{
      responsive:true,
      plugins:{legend:{labels:{color:'#ccc'}}},
      scales:{
        y:{ticks:{color:'#888'}, grid:{color:'rgba(255,255,255,0.05)'}},
        x:{ticks:{color:'#888'}, grid:{color:'rgba(255,255,255,0.05)'}}
      }
    }
  });
}

loadStats();
setInterval(loadStats, 5000);

async function restartBot() {
  if (!confirm('Botu перезапуск если хотите emin misiniz ? siz?')) return;
  var btn = event.target.closest('button');
  btn.disabled = true;
  btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Yeniden запуск...';
  var r = await fetch('/api/bot/restart', {method: 'POST'});
  var d = await r.json();
  document.getElementById('restart-status').innerHTML = d.success
    ? '<span style="color:#5ec47a;">✅ Бот перезапускается... 10-15 секунд.</span>'
    : '<span style="color:#e05555;">❌ ' + (d.error || 'Ошибка') + '</span>';
  setTimeout(function() { btn.disabled = false; btn.innerHTML = '<i class="fas fa-redo"></i> Botu Перезапустить'; }, 15000);
}

async function syncCommands() {
  var btn = event.target.closest('button');
  btn.disabled = true;
  btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Senkronize ediliyor...';
  var r = await fetch('/api/bot/sync', {method: 'POST'});
  var d = await r.json();
  document.getElementById('restart-status').innerHTML = d.success
    ? '<span style="color:#5ec47a;">✅ Slash команды senkronize edildi!</span>'
    : '<span style="color:#e05555;">❌ ' + (d.error || 'Ошибка') + '</span>';
  btn.disabled = false;
  btn.innerHTML = '<i class="fas fa-sync"></i> Slash Команды Senkronize Et';
}
</script>
{% endblock %}
