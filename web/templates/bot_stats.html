{% extends "base.html" %}
{% block title %}Bot Статистика - Aether{% endblock %}
{% block page_title %}<i class="fas fa-chart-bar" style="color:var(--ac);"></i> Статистика бота{% endblock %}
{% block content %}
<style>
.bs-title{color:var(--ac);font-size:11.5px;text-transform:uppercase;letter-spacing:0.10em;margin-bottom:18px;font-family:Inter,sans-serif;font-weight:700;display:flex;align-items:center;gap:8px;padding-bottom:12px;border-bottom:1px solid var(--line);}
.stat-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:14px;margin-bottom:18px;}
.stat-box{background:var(--surface) !important;border:1px solid var(--line) !important;border-radius:var(--r-lg) !important;padding:22px 18px;text-align:center;transition:all 0.25s var(--ease);position:relative;overflow:hidden;}
.stat-box::after{content:'';position:absolute;top:-50%;right:-30%;width:160px;height:160px;background:radial-gradient(circle, var(--ac-soft), transparent 70%);border-radius:50%;pointer-events:none;}
.stat-box:hover{border-color:var(--ac-line) !important;transform:translateY(-3px);box-shadow:var(--shadow-md), 0 0 30px rgba(212,168,67,0.10) !important;}
.stat-icon{font-size:24px;color:var(--ac);margin-bottom:12px;width:42px;height:42px;display:inline-flex;align-items:center;justify-content:center;border-radius:12px;background:var(--ac-soft);border:1px solid var(--ac-line);position:relative;z-index:1;}
.stat-value{font-size:24px;font-weight:800;color:var(--text);margin-bottom:6px;letter-spacing:-0.025em;font-variant-numeric:tabular-nums;position:relative;z-index:1;}
.stat-label{font-size:10.5px;color:var(--text-3);text-transform:uppercase;letter-spacing:0.08em;font-weight:700;position:relative;z-index:1;}
.stat-box.purple .stat-icon{background:rgba(139,92,246,0.15);color:#a78bfa;border-color:rgba(139,92,246,0.30);}
.stat-box.pink .stat-icon{background:rgba(236,72,153,0.15);color:#f472b6;border-color:rgba(236,72,153,0.30);}
.stat-box.cyan .stat-icon{background:rgba(6,182,212,0.15);color:#67e8f9;border-color:rgba(6,182,212,0.30);}
.stat-box.green .stat-icon{background:rgba(16,185,129,0.15);color:#6ee7b7;border-color:rgba(16,185,129,0.30);}
.stat-box.red .stat-icon{background:rgba(248,113,113,0.15);color:#fca5a5;border-color:rgba(248,113,113,0.30);}
.stat-box.gold .stat-icon{background:var(--ac-soft);color:var(--ac);border-color:var(--ac-line);}

.control-btn{padding:11px 22px;border:none;border-radius:10px;cursor:pointer;font-weight:700;font-size:13px;transition:all 0.2s var(--ease);display:inline-flex;align-items:center;gap:8px;font-family:Inter,sans-serif;}
.control-btn.danger{background:linear-gradient(135deg, #f87171, #dc2626);color:#fff;box-shadow:0 4px 14px rgba(248,113,113,0.25);}
.control-btn.danger:hover{transform:translateY(-1px);box-shadow:0 6px 22px rgba(248,113,113,0.40);filter:brightness(1.05);}
.control-btn.primary{background:linear-gradient(135deg, var(--ac), var(--ac-3));color:var(--bg);box-shadow:0 4px 14px rgba(212,168,67,0.25);}
.control-btn.primary:hover{transform:translateY(-1px);box-shadow:0 6px 22px rgba(212,168,67,0.45);filter:brightness(1.05);}
</style>

<div class="stat-grid" id="stats">
  <div class="stat-box"><div class="stat-icon"><i class="fas fa-spinner fa-spin"></i></div><div class="stat-value">-</div><div class="stat-label">Загрузка</div></div>
</div>

<div class="section">
  <div class="bs-title"><i class="fas fa-chart-line"></i> Использование системы (в реальном времени)</div>
  <canvas id="sysChart" height="80"></canvas>
</div>

{% if role == 'owner' or role == 'admin' %}
<div class="section" style="border-color:rgba(248,113,113,0.25) !important;">
  <div class="bs-title" style="color:var(--err);"><i class="fas fa-power-off"></i> Управление ботом</div>
  <div style="display:flex;gap:12px;flex-wrap:wrap;">
    <button onclick="restartBot()" class="control-btn danger">
      <i class="fas fa-redo"></i> Перезапустить бот
    </button>
    <button onclick="syncCommands()" class="control-btn primary">
      <i class="fas fa-sync"></i> Синхронизировать команды
    </button>
  </div>
  <div id="restart-status" style="margin-top:14px;font-size:12.5px;padding:10px 14px;border-radius:10px;display:none;"></div>
</div>
{% endif %}

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script>
var sysChart;

async function loadStats() {
  var r = await fetch('/api/bot-stats');
  var d = await r.json();
  if (d.error) return;

  document.getElementById('stats').innerHTML =
    '<div class="stat-box purple"><div class="stat-icon"><i class="fas fa-server"></i></div><div class="stat-value">'+d.guilds+'</div><div class="stat-label">Серверов</div></div>' +
    '<div class="stat-box pink"><div class="stat-icon"><i class="fas fa-users"></i></div><div class="stat-value">'+d.users+'</div><div class="stat-label">Пользователей</div></div>' +
    '<div class="stat-box cyan"><div class="stat-icon"><i class="fas fa-signal"></i></div><div class="stat-value">'+d.latency+'<small style="font-size:13px;color:var(--text-3);">ms</small></div><div class="stat-label">Ping</div></div>' +
    '<div class="stat-box green"><div class="stat-icon"><i class="fas fa-clock"></i></div><div class="stat-value" style="font-size:18px;">'+d.uptime+'</div><div class="stat-label">Uptime</div></div>' +
    '<div class="stat-box gold"><div class="stat-icon"><i class="fas fa-microchip"></i></div><div class="stat-value">'+d.cpu+'<small style="font-size:13px;color:var(--text-3);">%</small></div><div class="stat-label">CPU</div></div>' +
    '<div class="stat-box red"><div class="stat-icon"><i class="fas fa-memory"></i></div><div class="stat-value">'+d.ram+'<small style="font-size:13px;color:var(--text-3);">MB</small></div><div class="stat-label">RAM</div></div>';

  if (sysChart) sysChart.destroy();
  sysChart = new Chart(document.getElementById('sysChart'), {
    type: 'line',
    data: {
      labels: (d.history||[]).map(function(h){return h.time;}),
      datasets: [
        {label:'CPU %', data:(d.history||[]).map(function(h){return h.cpu;}), borderColor:'#d4a843', backgroundColor:'rgba(212,168,67,0.10)', tension:0.4, fill:true, pointRadius:3, pointBackgroundColor:'#d4a843', pointBorderColor:'#0a0907', pointBorderWidth:2, borderWidth:2.5},
        {label:'RAM MB', data:(d.history||[]).map(function(h){return h.ram;}), borderColor:'#f472b6', backgroundColor:'rgba(244,114,182,0.08)', tension:0.4, fill:true, pointRadius:3, pointBackgroundColor:'#f472b6', pointBorderColor:'#0a0907', pointBorderWidth:2, borderWidth:2.5}
      ]
    },
    options:{
      responsive:true,
      plugins:{
        legend:{labels:{color:'#b6a47b', font:{size:12, family:'Inter'}}}
      },
      scales:{
        y:{ticks:{color:'#7a6a48', font:{size:11}}, grid:{color:'rgba(212,168,67,0.06)'}},
        x:{ticks:{color:'#7a6a48', font:{size:11}}, grid:{color:'rgba(212,168,67,0.06)'}}
      }
    }
  });
}

loadStats();
setInterval(loadStats, 5000);

function showStatus(msg, ok) {
  var el = document.getElementById('restart-status');
  el.style.display = 'block';
  el.style.background = ok ? 'rgba(52,211,153,0.10)' : 'rgba(248,113,113,0.10)';
  el.style.border = '1px solid ' + (ok ? 'rgba(52,211,153,0.30)' : 'rgba(248,113,113,0.30)');
  el.style.color = ok ? '#6ee7b7' : '#fca5a5';
  el.innerHTML = (ok ? '✓ ' : '✗ ') + msg;
}

async function restartBot() {
  if (!confirm('Вы уверены, что хотите перезапустить бота?')) return;
  var btn = event.target.closest('button');
  btn.disabled = true;
  btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Перезапуск...';
  var r = await fetch('/api/bot/restart', {method: 'POST'});
  var d = await r.json();
  showStatus(d.success ? 'Бот перезапускается... 10-15 секунд.' : (d.error || 'Ошибка'), d.success);
  setTimeout(function() { btn.disabled = false; btn.innerHTML = '<i class="fas fa-redo"></i> Перезапустить бот'; }, 15000);
}

async function syncCommands() {
  var btn = event.target.closest('button');
  btn.disabled = true;
  btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Синхронизация...';
  var r = await fetch('/api/bot/sync', {method: 'POST'});
  var d = await r.json();
  showStatus(d.success ? 'Команды синхронизированы!' : (d.error || 'Ошибка'), d.success);
  btn.disabled = false;
  btn.innerHTML = '<i class="fas fa-sync"></i> Синхронизировать команды';
}
</script>
{% endblock %}
