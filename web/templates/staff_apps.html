{% extends "base.html" %}
{% block title %}Заявки в модераторы - Aether{% endblock %}
{% block page_title %}📋 АДМИНИСТРАТОР ЗАЯВКА{% endblock %}
{% block content %}
<style>
@import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&display=swap');
.sa-box{background:rgba(26,22,16,0.7);border:1px solid rgba(200,160,80,0.3);border-radius:15px;padding:25px;margin-bottom:20px;position:relative;overflow:hidden;}
.sa-box::before{content:'';position:absolute;top:0;left:-100%;width:100%;height:2px;background:linear-gradient(90deg,transparent,var(--accent),transparent);;}
@keyframes scan{0%{left:-100%}100%{left:100%}}
.filter-bar{display:flex;gap:10px;margin-bottom:20px;flex-wrap:wrap;}
.filter-btn{padding:8px 20px;border:2px solid rgba(200,160,80,0.4);background:transparent;color:rgba(240,232,208,0.55);border-radius:20px;cursor:pointer;transition:all 0.3s;font-size:13px;font-family:Inter,sans-serif;}
.filter-btn.active,.filter-btn:hover{background:#c8922a;border-color:#c8922a;color:#f0e8d0;}
.app-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:20px;}
.app-card{background:linear-gradient(135deg,var(--bg),var(--bg2));border:1px solid rgba(200,160,80,0.25);border-radius:15px;padding:20px;transition:all 0.3s;position:relative;overflow:hidden;}
.app-card::before{content:'';position:absolute;top:0;left:-100%;width:100%;height:2px;background:linear-gradient(90deg,transparent,var(--accent),transparent);animation:scan 4s infinite;}
.app-card:hover{border-color:#c8922a;box-shadow:0 8px 30px rgba(200,160,80,0.2);}
.app-card.approved{border-color:rgba(46,204,113,0.5);}
.app-card.rejected{border-color:rgba(231,76,60,0.3);opacity:0.7;}
.app-header{display:flex;align-items:center;gap:12px;margin-bottom:15px;}
.app-avatar{width:50px;height:50px;border-radius:50%;border:2px solid var(--accent);}
.app-name{font-size:15px;font-weight:700;color:#f0e8d0;font-family:Inter,sans-serif;}
.app-tag{font-size:11px;color:rgba(240,232,208,0.55);margin-top:2px;}
.status-badge{padding:3px 10px;border-radius:14px;font-size:11px;font-weight:700;margin-left:auto;white-space:nowrap;}
.status-pending{background:rgba(212,168,67,0.2);color:#c8922a;border:1px solid #c8922a;}
.status-approved{background:rgba(46,204,113,0.2);color:#5ec47a;border:1px solid #2ecc71;}
.status-rejected{background:rgba(231,76,60,0.2);color:#e05555;border:1px solid #e74c3c;}
.app-field{margin-bottom:10px;}
.app-field label{display:block;color:#c8922a;font-size:11px;text-transform:uppercase;letter-spacing:1px;margin-bottom:3px;font-family:Inter,sans-serif;}
.app-field p{color:rgba(240,232,208,0.55);font-size:13px;background:rgba(0,0,0,0.3);padding:8px 10px;border-radius:6px;margin:0;line-height:1.5;}
.app-actions{display:flex;gap:8px;margin-top:15px;}
.btn-approve{flex:1;padding:9px;background:rgba(94,196,122,0.8);color:#f0e8d0;border:none;border-radius:8px;cursor:pointer;font-weight:700;font-size:13px;transition:all 0.3s;}
.btn-approve:hover{box-shadow:0 4px 15px rgba(46,204,113,0.4);transform:translateY(-2px);}
.btn-reject{flex:1;padding:9px;background:rgba(224,85,85,0.15);color:#f0e8d0;border:none;border-radius:8px;cursor:pointer;font-weight:700;font-size:13px;transition:all 0.3s;}
.btn-reject:hover{box-shadow:0 4px 15px rgba(231,76,60,0.4);transform:translateY(-2px);}
.empty-state{text-align:center;padding:60px;color:#5a5040;}
.empty-state i{font-size:48px;margin-bottom:15px;color:#c8922a;opacity:0.3;}
.modal-overlay{display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.88);z-index:9999;justify-content:center;align-items:center;}
.modal-box{background:linear-gradient(135deg,var(--bg2),var(--surface));border:2px solid var(--accent);border-radius:20px;padding:30px;max-width:420px;width:90%;}
.modal-box h3{color:#c8922a;margin-bottom:15px;font-family:Inter,sans-serif;}
.modal-box textarea{width:100%;padding:10px;background:#100e08;border:2px solid rgba(200,160,80,0.3);border-radius:8px;color:#f0e8d0;font-size:14px;resize:vertical;min-height:80px;box-sizing:border-box;}
.modal-box textarea:focus{outline:none;border-color:#c8922a;}
.stats-bar{display:flex;gap:15px;margin-bottom:20px;flex-wrap:wrap;}
.stat-chip{background:rgba(200,160,80,0.08);border:1px solid rgba(200,160,80,0.2);border-radius:14px;padding:10px 18px;text-align:center;}
.stat-chip .num{font-size:22px;font-weight:700;color:#c8922a;font-family:Inter,sans-serif;}
.stat-chip .lbl{font-size:11px;color:rgba(240,232,208,0.55);}
</style>

<div class="stats-bar" id="stats-bar"></div>
<div class="filter-bar">
  <button class="filter-btn active" onclick="setFilter('pending',this)">⏳ Bekleyenler</button>
  <button class="filter-btn" onclick="setFilter('approved',this)">✅ Onaylanan</button>
  <button class="filter-btn" onclick="setFilter('rejected',this)">❌ Reddedilenler</button>
  <button class="filter-btn" onclick="setFilter('all',this)">📋 Все</button>
</div>

<div class="app-grid" id="app-grid">
  <div class="empty-state"><i class="fas fa-spinner fa-spin"></i><p>Загрузка...</p></div>
</div>

<div id="rejectModal" class="modal-overlay">
  <div class="modal-box">
    <h3>❌ Red Причина</h3>
    <textarea id="reject-reason" placeholder="Red причина напишите..."></textarea>
    <div style="display:flex;gap:10px;margin-top:15px;">
      <button onclick="confirmReject()" style="flex:1;padding:10px;background:rgba(224,85,85,0.15);color:#f0e8d0;border:none;border-radius:8px;cursor:pointer;font-weight:700;">Reddet</button>
      <button onclick="closeReject()" style="flex:1;padding:10px;background:#333;color:rgba(240,232,208,0.55);border:none;border-radius:8px;cursor:pointer;">Отмена</button>
    </div>
  </div>
</div>

<script>
var allApps = [], currentFilter = 'pending', pendingRejectId = null;

async function loadApps() {
  var r = await fetch('/api/staff-apps');
  allApps = await r.json();
  updateStats(); renderApps();
}

function updateStats() {
  var pending = allApps.filter(function(a){return a.status==='pending';}).length;
  var approved = allApps.filter(function(a){return a.status==='approved';}).length;
  var rejected = allApps.filter(function(a){return a.status==='rejected';}).length;
  document.getElementById('stats-bar').innerHTML =
    '<div class="stat-chip"><div class="num">'+allApps.length+'</div><div class="lbl">Всего</div></div>' +
    '<div class="stat-chip"><div class="num" style="color:#c8922a;">'+pending+'</div><div class="lbl">⏳ Bekleyenler</div></div>' +
    '<div class="stat-chip"><div class="num" style="color:#5ec47a;">'+approved+'</div><div class="lbl">✅ Onaylanan</div></div>' +
    '<div class="stat-chip"><div class="num" style="color:#e05555;">'+rejected+'</div><div class="lbl">❌ Reddedilenler</div></div>';
}

function setFilter(f, btn) {
  currentFilter = f;
  document.querySelectorAll('.filter-btn').forEach(function(b){b.classList.remove('active');});
  btn.classList.add('active');
  renderApps();
}

function timeAgo(iso) {
  var d = new Date(iso), diff = Math.floor((Date.now()-d.getTime())/1000);
  if(diff<60) return diff+'sn до';
  if(diff<3600) return Math.floor(diff/60)+'dk до';
  if(diff<86400) return Math.floor(diff/3600)+'sa до';
  return Math.floor(diff/86400)+'день до';
}

function renderApps() {
  var filtered = currentFilter==='all' ? allApps : allApps.filter(function(a){return a.status===currentFilter;});
  var grid = document.getElementById('app-grid');
  if (!filtered.length) {
    grid.innerHTML = '<div class="empty-state"><i class="fas fa-inbox"></i><p style="color:#5a5040;margin-top:10px;">Bu kategoride заявка yok.</p></div>';
    return;
  }
  grid.innerHTML = filtered.map(function(app) {
    var sc = app.status==='approved'?'status-approved':app.status==='rejected'?'status-rejected':'status-pending';
    var st = app.status==='approved'?'✅ Onaylandı':app.status==='rejected'?'❌ Reddedildi':'⏳ Bekleme';
    var cc = app.status==='approved'?'app-card approved':app.status==='rejected'?'app-card rejected':'app-card';
    var ans = app.answers || {};
    var actions = app.status==='pending'
      ? '<div class="app-actions"><button class="btn-approve" onclick="approveApp(\''+app.app_id+'\')">✅ Onayla</button><button class="btn-reject" onclick="openReject(\''+app.app_id+'\')">❌ Reddet</button></div>'
      : (app.reviewed_by ? '<div style="color:#666;font-size:12px;margin-top:10px;">İnceleyen: '+app.reviewed_by+(app.review_note?' • '+app.review_note:'')+'</div>' : '');
    return '<div class="'+cc+'">' +
      '<div class="app-header">' +
        '<img class="app-avatar" src="'+app.avatar+'" onerror="this.src=\'https://cdn.discordapp.com/embed/avatars/0.png\'">' +
        '<div><div class="app-name">'+app.display_name+'</div><div class="app-tag">'+app.user_name+' • '+timeAgo(app.timestamp)+'</div></div>' +
        '<span class="status-badge '+sc+'">'+st+'</span>' +
      '</div>' +
      '<div class="app-field"><label>🎂 Yaş</label><p>'+(ans.yas||'-')+'</p></div>' +
      '<div class="app-field"><label>⏰ Активен</label><p>'+(ans.активен||'-')+'</p></div>' +
      '<div class="app-field"><label>🏆 Tecrübe</label><p>'+(ans.tecrube||'-')+'</p></div>' +
      '<div class="app-field"><label>💬 Почему Администратор?</label><p>'+(ans.почему||'-')+'</p></div>' +
      (ans.ekstra&&ans.ekstra!=='—' ? '<div class="app-field"><label>📝 Ekstra</label><p>'+ans.ekstra+'</p></div>' : '') +
      actions +
    '</div>';
  }).join('');
}

async function approveApp(appId) {
  var r = await fetch('/api/staff-apps/'+appId+'/review', {
    method:'POST', headers:{'Content-Type':'application/json'},
    body: JSON.stringify({action:'approve'})
  });
  var res = await r.json();
  if (res.success) loadApps();
}

function openReject(appId) {
  pendingRejectId = appId;
  document.getElementById('reject-reason').value = '';
  document.getElementById('rejectModal').style.display = 'flex';
}

function closeReject() {
  document.getElementById('rejectModal').style.display = 'none';
  pendingRejectId = null;
}

async function confirmReject() {
  if (!pendingRejectId) return;
  var note = document.getElementById('reject-reason').value;
  var r = await fetch('/api/staff-apps/'+pendingRejectId+'/review', {
    method:'POST', headers:{'Content-Type':'application/json'},
    body: JSON.stringify({action:'reject', note:note})
  });
  var res = await r.json();
  if (res.success) { closeReject(); loadApps(); }
}

document.getElementById('rejectModal').addEventListener('click', function(e){ if(e.target===this) closeReject(); });
loadApps();
setInterval(loadApps, 1000);
</script>
{% endblock %}
