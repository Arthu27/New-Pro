<!DOCTYPE html>
<html lang="ru" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex">
  <title>Статус — Aether</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&family=JetBrains+Mono:wght@600&display=swap');
    :root {
      --bg: #0a0907; --text: #f0e6d0; --text-2: #c4b48c; --text-3: #8a7d5f;
      --ac: #e0b04a; --ac-2: #f4cc6a; --ac-line: rgba(224,176,74,.22); --ac-soft: rgba(224,176,74,.12);
      --ok: #2ecc71; --bad: #e74c3c; --mid: #f39c12;
    }
    * { margin: 0; box-sizing: border-box; }
    body {
      min-height: 100vh; display: flex; align-items: center; justify-content: center;
      font-family: 'Inter', system-ui, sans-serif; color: var(--text); padding: 28px 16px;
      background:
        radial-gradient(ellipse 70% 40% at 50% -5%, var(--ac-soft), transparent 70%),
        radial-gradient(ellipse 50% 35% at 85% 110%, rgba(139,92,246,.07), transparent 70%),
        var(--bg);
    }
    .st { width: 100%; max-width: 560px; }

    .brand { display: flex; align-items: center; gap: 12px; margin-bottom: 26px; }
    .brand-mark {
      width: 42px; height: 42px; border-radius: 13px; display: grid; place-items: center;
      background: linear-gradient(135deg, var(--ac), #b88a2e); color: #1a1206; font-size: 18px;
      box-shadow: 0 6px 22px rgba(224,176,74,.35), inset 0 1px 0 rgba(255,255,255,.25);
    }
    .brand-name { font-weight: 800; letter-spacing: .14em; font-size: 15px; }
    .brand-sub { font-size: 11px; color: var(--text-3); font-weight: 600; letter-spacing: .08em; }

    .hero {
      position: relative; border-radius: 22px; padding: 30px 28px 26px; overflow: hidden;
      border: 1px solid rgba(255,255,255,.09);
      background: linear-gradient(160deg, rgba(255,255,255,.05), rgba(255,255,255,.015));
      box-shadow: 0 20px 60px rgba(0,0,0,.45), inset 0 1px 0 rgba(255,255,255,.06);
      text-align: center;
    }
    .hero::before {
      content: ''; position: absolute; top: -80px; left: 50%; transform: translateX(-50%);
      width: 300px; height: 200px; border-radius: 50%; pointer-events: none;
      background: radial-gradient(circle, rgba(46,204,113,.14), transparent 65%); transition: .4s;
    }
    .hero[data-state="off"]::before { background: radial-gradient(circle, rgba(231,76,60,.16), transparent 65%); }

    .ring-wrap { width: 108px; height: 108px; margin: 0 auto 18px; position: relative; }
    .ring, .ring::after {
      content: ''; position: absolute; inset: 0; border-radius: 50%;
      border: 2px solid rgba(46,204,113,.5);
      animation: ringPulse 2.4s ease-out infinite;
    }
    .ring::after { animation-delay: 1.2s; }
    .hero[data-state="off"] .ring, .hero[data-state="off"] .ring::after { border-color: rgba(231,76,60,.5); animation: none; }
    @keyframes ringPulse { 0% { transform: scale(.72); opacity: 0; } 30% { opacity: .85; } 100% { transform: scale(1.25); opacity: 0; } }
    .core {
      position: absolute; inset: 22px; border-radius: 50%; display: grid; place-items: center;
      font-size: 30px; color: var(--ok);
      background: rgba(46,204,113,.12); border: 1px solid rgba(46,204,113,.35);
      transition: .3s;
    }
    .hero[data-state="off"] .core { color: var(--bad); background: rgba(231,76,60,.12); border-color: rgba(231,76,60,.35); }

    .state { font-size: 26px; font-weight: 800; letter-spacing: -.01em; }
    .hero[data-state="on"] .state { color: var(--ok); }
    .hero[data-state="off"] .state { color: var(--bad); }
    .state-sub { font-size: 12.5px; color: var(--text-3); font-weight: 600; margin-top: 6px; }

    .metrics { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin-top: 26px; }
    .m {
      border-radius: 16px; padding: 14px 10px 12px;
      border: 1px solid rgba(255,255,255,.09);
      background: rgba(255,255,255,.03);
    }
    .m i { color: var(--ac); font-size: 13px; }
    .m-val { font-size: 19px; font-weight: 800; font-variant-numeric: tabular-nums; margin-top: 7px; letter-spacing: -.02em; }
    .m-val small { font-size: 11px; color: var(--text-3); font-weight: 700; }
    .m-lbl { font-size: 10px; color: var(--text-3); text-transform: uppercase; letter-spacing: .08em; margin-top: 3px; }
    .m.warn .m-val { color: var(--mid); }

    .foot { text-align: center; margin-top: 18px; font-size: 11.5px; color: var(--text-3); font-weight: 600; }
    .foot .dot { display: inline-block; width: 7px; height: 7px; border-radius: 50%; background: var(--ok);
      margin-right: 7px; animation: livePulse 2s infinite; }
    @keyframes livePulse { 0% { box-shadow: 0 0 0 0 rgba(46,204,113,.45); } 100% { box-shadow: 0 0 0 8px rgba(46,204,113,0); } }
    .foot a { color: var(--ac-2); text-decoration: none; }
    @media (prefers-reduced-motion: reduce) { .ring, .ring::after, .foot .dot { animation: none !important; } }
  </style>
</head>
<body>
  <div class="st">
    <div class="brand">
      <div class="brand-mark"><i class="fas fa-bolt"></i></div>
      <div>
        <div class="brand-name">AETHER</div>
        <div class="brand-sub">СТАТУС БОТА · LIVE</div>
      </div>
    </div>

    <div class="hero" id="hero" data-state="on">
      <div class="ring-wrap">
        <span class="ring"></span>
        <div class="core"><i class="fas fa-bolt"></i></div>
      </div>
      <div class="state" id="st-state">Проверяем…</div>
      <div class="state-sub" id="st-sub">загрузка телеметрии</div>

      <div class="metrics">
        <div class="m"><i class="fas fa-signal"></i><div class="m-val" id="m-ping">—</div><div class="m-lbl">Пинг</div></div>
        <div class="m"><i class="fas fa-clock"></i><div class="m-val" id="m-uptime">—</div><div class="m-lbl">Аптайм</div></div>
        <div class="m"><i class="fas fa-server"></i><div class="m-val" id="m-guilds">—</div><div class="m-lbl">Серверов</div></div>
      </div>
    </div>

    <div class="foot"><span class="dot"></span>обновлено <span id="st-upd">—</span> · обновление каждые 5 сек · <a href="/login">вход в панель</a></div>
  </div>

<script>
const $ = id => document.getElementById(id);
function pingWord(ms){
  if (ms <= 0) return ['', ''];
  if (ms < 120) return ['отличный', ''];
  if (ms < 250) return ['нормальный', ''];
  return ['высокий', 'warn'];
}
async function tick(){
  try{
    const r = await fetch('/api/status-public');
    const d = await r.json();
    const on = !!d.online;
    $('hero').dataset.state = on ? 'on' : 'off';
    $('st-state').textContent = on ? 'Бот онлайн' : 'Бот офлайн';
    $('st-sub').textContent = on
      ? `всё работает · v${d.version} · в кэше ${d.users_cached} юзеров`
      : 'бот не отвечает — уже чиним';
    const [w, cls] = pingWord(d.latency_ms);
    $('m-ping').innerHTML = `${d.latency_ms} <small>мс${w ? ' · ' + w : ''}</small>`;
    $('m-ping').closest('.m').classList.toggle('warn', cls === 'warn');
    $('m-uptime').textContent = d.uptime_human;
    $('m-guilds').textContent = d.guilds;
    $('st-upd').textContent = new Date().toLocaleTimeString('ru-RU');
  }catch(e){
    $('hero').dataset.state = 'off';
    $('st-state').textContent = 'Нет связи';
    $('st-sub').textContent = 'панель не отвечает';
  }
}
tick();
setInterval(() => { if (!document.hidden) tick(); }, 5000);
document.addEventListener('visibilitychange', () => { if (!document.hidden) tick(); });
</script>
</body>
</html>
