<!DOCTYPE html>
<html lang="ru" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex">
  <title>Статус — Aether</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="/static/style.css?v=88">
  <style>
    body { display: flex; align-items: center; justify-content: center; min-height: 100vh; padding: 28px 16px; }
    .st { width: 100%; max-width: 560px; }
    .st-brand { display: flex; align-items: center; gap: 12px; margin-bottom: 22px; }
    .st-brand .brand-icon { width: 42px; height: 42px; font-size: 16px; border-radius: 12px; }
    .st-brand b { display: block; font-family: var(--font-display); font-size: 14px; font-weight: 700; letter-spacing: .1em; }
    .st-brand span { font-size: 11px; color: var(--text-3); font-weight: 700; letter-spacing: .08em; text-transform: uppercase; }

    .st-hero {
      position: relative; overflow: hidden;
      border-radius: 20px; padding: 30px 28px 24px; text-align: center;
      background: linear-gradient(160deg, var(--ac-soft), transparent 55%), var(--surface);
      border: 1px solid var(--line);
      box-shadow: var(--shadow-2);
    }
    .st-hero::after {
      content: ''; position: absolute; top: -70px; left: 50%; transform: translateX(-50%);
      width: 300px; height: 190px; border-radius: 50%; pointer-events: none;
      background: radial-gradient(circle, var(--ok-soft), transparent 65%);
    }
    .st-hero[data-state="off"]::after { background: radial-gradient(circle, var(--err-soft), transparent 65%); }

    .st-ring { width: 108px; height: 108px; margin: 0 auto 18px; position: relative; }
    .st-pulse, .st-pulse::after {
      content: ''; position: absolute; inset: 0; border-radius: 50%;
      border: 2px solid var(--ok);
      animation: stPulse 2.4s ease-out infinite;
    }
    .st-pulse::after { animation-delay: 1.2s; }
    .st-hero[data-state="off"] .st-pulse, .st-hero[data-state="off"] .st-pulse::after { border-color: var(--err); animation: none; opacity: .5; }
    @keyframes stPulse { 0% { transform: scale(.72); opacity: 0; } 30% { opacity: .8; } 100% { transform: scale(1.25); opacity: 0; } }
    .st-core {
      position: absolute; inset: 22px; border-radius: 50%; display: grid; place-items: center;
      font-size: 28px; color: var(--ok);
      background: var(--ok-soft); border: 1px solid color-mix(in srgb, var(--ok) 35%, transparent);
    }
    .st-hero[data-state="off"] .st-core { color: var(--err); background: var(--err-soft); border-color: color-mix(in srgb, var(--err) 35%, transparent); }

    .st-state { font-size: 26px; font-weight: 800; letter-spacing: -.01em; position: relative; z-index: 1; }
    .st-hero[data-state="on"] .st-state { color: var(--ok); }
    .st-hero[data-state="off"] .st-state { color: var(--err); }
    .st-sub { font-size: 12.5px; color: var(--text-3); font-weight: 600; margin-top: 6px; position: relative; z-index: 1; }

    .st-metrics { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin-top: 26px; position: relative; z-index: 1; }
    .st-m {
      border-radius: 14px; padding: 14px 10px 12px;
      border: 1px solid var(--line);
      background: var(--surface-2);
      transition: transform .15s var(--ease), box-shadow .15s var(--ease);
    }
    .st-m:hover { transform: translateY(-2px); box-shadow: var(--shadow-2); }
    .st-m i { color: var(--ac); font-size: 13px; }
    .st-m-val { font-size: 19px; font-weight: 800; font-variant-numeric: tabular-nums; margin-top: 7px; letter-spacing: -.02em; }
    .st-m-val small { font-size: 11px; color: var(--text-3); font-weight: 700; }
    .st-m-lbl { font-size: 10px; color: var(--text-3); text-transform: uppercase; letter-spacing: .08em; margin-top: 3px; }
    .st-m.warn .st-m-val { color: var(--warn); }

    .st-foot { text-align: center; margin-top: 18px; font-size: 11.5px; color: var(--text-3); font-weight: 600; }
    .st-foot .dot { display: inline-block; width: 7px; height: 7px; border-radius: 50%; background: var(--ok); margin-right: 7px; animation: pulse 2s infinite; }
    .st-foot a { color: var(--ac); text-decoration: none; font-weight: 700; }
    @media (prefers-reduced-motion: reduce) { .st-pulse, .st-pulse::after, .st-foot .dot { animation: none !important; } }
  </style>
</head>
<body>
  <div class="bg-aurora" aria-hidden="true"><i></i><i></i><i></i></div>

  <div class="st">
    <div class="st-brand">
      <div class="brand-icon"><i class="fas fa-bolt"></i></div>
      <div>
        <b>AETHER</b>
        <span>Статус бота · Live</span>
      </div>
    </div>

    <div class="st-hero" id="hero" data-state="on">
      <div class="st-ring">
        <span class="st-pulse"></span>
        <div class="st-core"><i class="fas fa-bolt"></i></div>
      </div>
      <div class="st-state" id="st-state">Проверяем…</div>
      <div class="st-sub" id="st-sub">загрузка телеметрии</div>

      <div class="st-metrics">
        <div class="st-m"><i class="fas fa-signal"></i><div class="st-m-val" id="m-ping">—</div><div class="st-m-lbl">Пинг</div></div>
        <div class="st-m"><i class="fas fa-clock"></i><div class="st-m-val" id="m-uptime">—</div><div class="st-m-lbl">Аптайм</div></div>
        <div class="st-m"><i class="fas fa-server"></i><div class="st-m-val" id="m-guilds">—</div><div class="st-m-lbl">Серверов</div></div>
      </div>
    </div>

    <div class="st-foot"><span class="dot"></span>обновлено <span id="st-upd">—</span> · обновление каждые 5 сек · <a href="/login">вход в панель</a></div>
  </div>

<script>
const $ = id => document.getElementById(id);
function pingWord(ms){
  if (ms <= 0) return ['', ''];
  if (ms < 120) return ['отличный', ''];
  if (ms < 250) return ['нормальный', ''];
  return ['высокий', 'warn'];
}
async function tick(){
  try{
    const r = await fetch('/api/status-public');
    const d = await r.json();
    const on = !!d.online;
    $('hero').dataset.state = on ? 'on' : 'off';
    $('st-state').textContent = on ? 'Бот онлайн' : 'Бот офлайн';
    $('st-sub').textContent = on
      ? `всё работает · v${d.version} · в кэше ${d.users_cached} юзеров`
      : 'бот не отвечает — уже чиним';
    const [w, cls] = pingWord(d.latency_ms);
    $('m-ping').innerHTML = `${d.latency_ms} <small>мс${w ? ' · ' + w : ''}</small>`;
    $('m-ping').closest('.st-m').classList.toggle('warn', cls === 'warn');
    $('m-uptime').textContent = d.uptime_human;
    $('m-guilds').textContent = d.guilds;
    $('st-upd').textContent = new Date().toLocaleTimeString('ru-RU');
  }catch(e){
    $('hero').dataset.state = 'off';
    $('st-state').textContent = 'Нет связи';
    $('st-sub').textContent = 'панель не отвечает';
  }
}
tick();
setInterval(() => { if (!document.hidden) tick(); }, 5000);
document.addEventListener('visibilitychange', () => { if (!document.hidden) tick(); });
</script>
</body>
</html>
