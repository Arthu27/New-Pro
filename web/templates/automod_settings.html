{% extends "base.html" %}
{% block title %}Автомодерация — Aether{% endblock %}
{% block page_title %}<i class="fas fa-shield-alt" ></i> Автомодерация{% endblock %}
{% block content %}

<div class="automod-grid">
  <div class="am-card">
    <div class="am-head">
      <div class="am-icon"><i class="fas fa-ban"></i></div>
      <div class="am-title">Запрещённые слова</div>
      <div class="am-toggle on" id="tog-badwords"></div>
    </div>
    <div class="form-row">
      <label>Действие</label>
      <select id="action-badwords">
        <option value="warn">Warn</option>
        <option value="mute">Мьют</option>
        <option value="kick">Kick</option>
        <option value="ban">Ban</option>
      </select>
    </div>
    <label class="form-label" style="margin-top: 6px">Список слов (по одному в строке)</label>
    <textarea id="words-list" class="am-textarea" rows="6" placeholder="badword1&#10;badword2&#10;..."></textarea>
    <div class="am-actions">
      <button class="btn btn-primary" id="save-words" type="button"><i class="fas fa-save"></i> Сохранить</button>
    </div>
  </div>

  <div class="am-card">
    <div class="am-head">
      <div class="am-icon"><i class="fas fa-comment-slash"></i></div>
      <div class="am-title">Анти-спам</div>
      <div class="am-toggle on" id="tog-antispam"></div>
    </div>
    <div class="form-row"><label>Макс. сообщ.</label><input type="number" id="spam-count" value="5" min="2"></div>
    <div class="form-row"><label>За (сек)</label><input type="number" id="spam-window" value="10" min="1"></div>
    <div class="form-row"><label>Действие</label>
      <select id="spam-action">
        <option value="warn">Warn</option>
        <option value="mute">Мьют (10 min)</option>
        <option value="kick">Kick</option>
      </select>
    </div>
    <div class="am-actions">
      <button class="btn btn-primary" id="save-antispam" type="button"><i class="fas fa-save"></i> Сохранить</button>
    </div>
  </div>

  <div class="am-card">
    <div class="am-head">
      <div class="am-icon"><i class="fas fa-link"></i></div>
      <div class="am-title">Анти-ссылки</div>
      <div class="am-toggle" id="tog-antilink"></div>
    </div>
    <div class="form-row"><label>Действие</label>
      <select id="antilink-action">
        <option value="delete">Удалить + Warn</option>
        <option value="mute">Мьют</option>
        <option value="ban">Ban</option>
      </select>
    </div>
    <div class="form-row"><label>Whitelist</label>
      <input type="text" id="antilink-whitelist" placeholder="discord.gg, github.com" value="discord.gg">
    </div>
    <div class="am-actions">
      <button class="btn btn-primary" id="save-antilink" type="button"><i class="fas fa-save"></i> Сохранить</button>
    </div>
  </div>

  <div class="am-card">
    <div class="am-head">
      <div class="am-icon"><i class="fas fa-text-height"></i></div>
      <div class="am-title">Анти-КАПС</div>
      <div class="am-toggle" id="tog-anticaps"></div>
    </div>
    <div class="form-row"><label>Макс % caps</label><input type="number" id="caps-percent" value="70" min="20" max="100"></div>
    <div class="form-row"><label>Мин. длина</label><input type="number" id="caps-minlen" value="10" min="3"></div>
    <div class="form-row"><label>Действие</label>
      <select id="caps-action"><option value="warn">Warn</option><option value="mute">Мьют</option></select>
    </div>
    <div class="am-actions">
      <button class="btn btn-primary" id="save-anticaps" type="button"><i class="fas fa-save"></i> Сохранить</button>
    </div>
  </div>

  <div class="am-card">
    <div class="am-head">
      <div class="am-icon"><i class="fas fa-server"></i></div>
      <div class="am-title">Анти-инвайты</div>
      <div class="am-toggle" id="tog-antiinvite"></div>
    </div>
    <div class="form-row"><label>Действие</label>
      <select id="antiinvite-action">
        <option value="warn">Warn</option>
        <option value="mute">Мьют</option>
        <option value="ban">Ban</option>
      </select>
    </div>
    <div class="form-row"><label>Whitelist</label>
      <input type="text" id="antiinvite-whitelist" placeholder="ID серверов через запятую">
    </div>
    <div class="am-actions">
      <button class="btn btn-primary" id="save-antiinvite" type="button"><i class="fas fa-save"></i> Сохранить</button>
    </div>
  </div>
</div>

<script>
(function () {
  'use strict';
  function $(id) { return document.getElementById(id); }
  function showToast(msg, ok) {
    var t = document.createElement('div');
    t.className = 'toast ' + (ok ? 'ok' : 'err');
    t.textContent = msg;
    document.body.appendChild(t);
    setTimeout(function () { t.remove(); }, 2200);
  }

  function bindToggle(id) {
    var el = $(id);
    if (!el) return;
    el.addEventListener('click', function () { el.classList.toggle('on'); });
  }

  function bind() {
    ['tog-badwords','tog-antispam','tog-antilink','tog-anticaps','tog-antiinvite'].forEach(bindToggle);
    ['save-words','save-antispam','save-antilink','save-anticaps','save-antiinvite'].forEach(function (id) {
      var b = $(id);
      if (b) b.addEventListener('click', function () { showToast('✓ Настройки сохранены', true); });
    });
  }

  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', bind);
  else bind();
})();
</script>
{% endblock %}
