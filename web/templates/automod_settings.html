{% extends "base.html" %}
{% block title %}Автомодерация - Aether{% endblock %}
{% block page_title %}Автомодерация{% endblock %}
{% block content %}
<style>
.automod-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:12px;}
.am-card{background:rgba(26,22,16,0.7);border:1px solid rgba(212,168,67,0.1);border-radius:12px;padding:14px;animation:fadeUp 0.3s ease-out both;}
@keyframes fadeUp{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
.am-card:hover{border-color:rgba(212,168,67,0.25);}
.am-head{display:flex;align-items:center;gap:9px;margin-bottom:10px;padding-bottom:8px;border-bottom:1px solid rgba(212,168,67,0.08);}
.am-icon{width:32px;height:32px;border-radius:8px;background:rgba(212,168,67,0.12);color:#c8922a;display:flex;align-items:center;justify-content:center;font-size:13px;flex-shrink:0;}
.am-title{font-size:12px;font-weight:700;color:rgba(240,232,208,0.7);text-transform:uppercase;letter-spacing:0.05em;flex:1;}
.am-toggle{position:relative;width:36px;height:20px;background:rgba(255,255,255,0.08);border-radius:99px;cursor:pointer;transition:background 0.2s;flex-shrink:0;}
.am-toggle::after{content:'';position:absolute;top:2px;left:2px;width:16px;height:16px;background:#5a5040;border-radius:50%;transition:all 0.2s;}
.am-toggle.on{background:rgba(200,146,42,0.4);}
.am-toggle.on::after{left:18px;background:#c8922a;}
.form-row{display:flex;gap:8px;align-items:center;margin-bottom:8px;}
.form-row label{flex:0 0 110px;font-size:10px;color:#5a5040;text-transform:uppercase;letter-spacing:0.05em;}
.form-row select,.form-row input{flex:1;padding:6px 10px;background:rgba(255,255,255,0.04);border:1px solid rgba(212,168,67,0.16);border-radius:6px;color:#f0e8d0;font-size:12px;}
.btn{padding:7px 14px;border:none;border-radius:99px;cursor:pointer;font-weight:600;font-size:11px;font-family:Inter,sans-serif;transition:all 0.15s;}
.btn-primary{background:#c8922a;color:#100e08;}
.btn-primary:hover{background:#e0a830;}
.btn-warn{background:rgba(232,144,58,0.15);color:#e8903a;border:1px solid rgba(232,144,58,0.3);}
.btn-warn:hover{background:rgba(232,144,58,0.25);}
</style>

<div class="automod-grid">
  <!-- Ban kelimeler -->
  <div class="am-card">
    <div class="am-head">
      <div class="am-icon"><i class="fas fa-ban"></i></div>
      <div class="am-title">Запрещённые слова</div>
      <div class="am-toggle on" id="tog-badwords"></div>
    </div>
    <div class="form-row">
      <label>Действие</label>
      <select id="action-badwords">
        <option value="warn">Warn</option>
        <option value="mute">Mute</option>
        <option value="kick">Kick</option>
        <option value="ban">Ban</option>
      </select>
    </div>
    <label>Список слов (по одному в строке)</label>
    <textarea id="words-list" rows="6" placeholder="badword1&#10;badword2&#10;..." style="width:100%;padding:8px;background:rgba(255,255,255,0.04);border:1px solid rgba(212,168,67,0.16);border-radius:6px;color:#f0e8d0;font-size:12px;font-family:Inter,sans-serif;margin-top:4px;"></textarea>
    <div style="display:flex;gap:6px;margin-top:8px;">
      <button class="btn btn-primary" id="save-words" type="button"><i class="fas fa-save"></i> Сохранить</button>
    </div>
  </div>

  <!-- Anti-spam -->
  <div class="am-card">
    <div class="am-head">
      <div class="am-icon"><i class="fas fa-comment-slash"></i></div>
      <div class="am-title">Анти-спам</div>
      <div class="am-toggle on" id="tog-antispam"></div>
    </div>
    <div class="form-row"><label>Макс. сообщений</label><input type="number" id="spam-count" value="5" min="2"></div>
    <div class="form-row"><label>За (сек)</label><input type="number" id="spam-window" value="10" min="1"></div>
    <div class="form-row"><label>Действие</label>
      <select id="spam-action">
        <option value="warn">Warn</option>
        <option value="mute">Mute (10 min)</option>
        <option value="kick">Kick</option>
      </select>
    </div>
    <div style="display:flex;gap:6px;margin-top:8px;">
      <button class="btn btn-primary" id="save-antispam" type="button"><i class="fas fa-save"></i> Сохранить</button>
    </div>
  </div>

  <!-- Anti-link -->
  <div class="am-card">
    <div class="am-head">
      <div class="am-icon"><i class="fas fa-link"></i></div>
      <div class="am-title">Анти-ссылки</div>
      <div class="am-toggle" id="tog-antilink"></div>
    </div>
    <div class="form-row"><label>Действие</label>
      <select id="antilink-action">
        <option value="delete">Удалить + Warn</option>
        <option value="mute">Mute</option>
        <option value="ban">Ban</option>
      </select>
    </div>
    <div class="form-row"><label>Whitelist домены</label>
      <input type="text" id="antilink-whitelist" placeholder="discord.gg, github.com" value="discord.gg">
    </div>
    <div style="display:flex;gap:6px;margin-top:8px;">
      <button class="btn btn-primary" id="save-antilink" type="button"><i class="fas fa-save"></i> Сохранить</button>
    </div>
  </div>

  <!-- Caps lock -->
  <div class="am-card">
    <div class="am-head">
      <div class="am-icon"><i class="fas fa-text-height"></i></div>
      <div class="am-title">Анти-КАПС</div>
      <div class="am-toggle" id="tog-anticaps"></div>
    </div>
    <div class="form-row"><label>Макс % caps</label><input type="number" id="caps-percent" value="70" min="20" max="100"></div>
    <div class="form-row"><label>Мин. длина</label><input type="number" id="caps-minlen" value="10" min="3"></div>
    <div class="form-row"><label>Действие</label>
      <select id="caps-action"><option value="warn">Warn</option><option value="mute">Mute</option></select>
    </div>
    <div style="display:flex;gap:6px;margin-top:8px;">
      <button class="btn btn-primary" id="save-anticaps" type="button"><i class="fas fa-save"></i> Сохранить</button>
    </div>
  </div>

  <!-- Anti-invite -->
  <div class="am-card">
    <div class="am-head">
      <div class="am-icon"><i class="fas fa-server"></i></div>
      <div class="am-title">Анти-инвайты</div>
      <div class="am-toggle" id="tog-antiinvite"></div>
    </div>
    <div class="form-row"><label>Действие</label>
      <select id="antiinvite-action">
        <option value="warn">Warn</option>
        <option value="mute">Mute</option>
        <option value="ban">Ban</option>
      </select>
    </div>
    <div class="form-row"><label>Whitelist серверы</label>
      <input type="text" id="antiinvite-whitelist" placeholder="Сервер ID (через запятую)">
    </div>
    <div style="display:flex;gap:6px;margin-top:8px;">
      <button class="btn btn-primary" id="save-antiinvite" type="button"><i class="fas fa-save"></i> Сохранить</button>
    </div>
  </div>
</div>

<script>
(function () {
  'use strict';
  function $(id) { return document.getElementById(id); }
  function showToast(msg, ok) {
    var t = document.createElement('div');
    t.textContent = msg;
    t.style.cssText = 'position:fixed;top:14px;right:14px;padding:9px 16px;border-radius:8px;font-weight:600;z-index:99999;font-size:12px;background:' + (ok ? 'linear-gradient(135deg,#27ae60,#2ecc71)' : 'linear-gradient(135deg,#c0392b,#e74c3c)') + ';color:#fff;';
    document.body.appendChild(t);
    setTimeout(function () { t.remove(); }, 1800);
  }

  function bindToggle(id) {
    var el = $(id);
    if (!el) return;
    el.addEventListener('click', function () { el.classList.toggle('on'); });
  }

  function bind() {
    ['tog-badwords','tog-antispam','tog-antilink','tog-anticaps','tog-antiinvite'].forEach(bindToggle);
    // Save butonlari (placeholder)
    ['save-words','save-antispam','save-antilink','save-anticaps','save-antiinvite'].forEach(function (id) {
      var b = $(id);
      if (b) b.addEventListener('click', function () { showToast('Настройки сохранены', true); });
    });
  }

  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', bind);
  else bind();
})();
</script>
{% endblock %}
