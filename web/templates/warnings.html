{% extends "base.html" %}
{% block title %}Предупреждения - Aether{% endblock %}
{% block page_title %}<i class="fas fa-exclamation-triangle" style="color:#c8922a;animation:pulse 2s infinite;"></i> UYARI SİSTEMİ{% endblock %}
{% block content %}
<style>
@import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&display=swap');
.warn-box{background:linear-gradient(135deg,#100e08,rgba(26,22,16,0.7));border:1px solid rgba(212,168,67,0.3);border-radius:15px;padding:25px;margin-bottom:20px;position:relative;overflow:hidden;}
.warn-box::before{content:'';position:absolute;top:0;left:-100%;width:100%;height:2px;background:linear-gradient(90deg,transparent,#c8922a,transparent);;}
@keyframes scan{0%{left:-100%}100%{left:100%}}
.warn-title{color:#c8922a;font-size:13px;text-transform:uppercase;letter-spacing:2px;margin-bottom:18px;font-family:Inter,sans-serif;display:flex;align-items:center;gap:10px;padding-ботtom:12px;border-ботtom:1px solid rgba(200,146,42,0.2);}
.search-row{display:flex;gap:10px;margin-bottom:20px;flex-wrap:wrap;}
.search-input{flex:1;min-width:200px;padding:11px 16px;background:#100e08;border:2px solid rgba(200,146,42,0.3);border-radius:14px;color:#f0e8d0;font-size:14px;transition:all 0.3s;}
.search-input:focus{outline:none;border-color:#c8922a;box-shadow:0 0 12px rgba(200,146,42,0.2);}
.stats-row{display:flex;gap:12px;margin-bottom:20px;flex-wrap:wrap;}
.stat-chip{background:rgba(212,168,67,0.08);border:1px solid rgba(212,168,67,0.2);border-radius:14px;padding:10px 18px;text-align:center;min-width:90px;}
.stat-chip .num{font-size:22px;font-weight:700;color:#c8922a;font-family:Inter,sans-serif;}
.stat-chip .lbl{font-size:10px;color:rgba(240,232,208,0.55);text-transform:uppercase;letter-spacing:1px;}
.warn-table{width:100%;border-collapse:collapse;}
.warn-table th{padding:12px 15px;text-align:left;background:rgba(212,168,67,0.12);color:#c8922a;font-weight:700;text-transform:uppercase;letter-spacing:1px;font-size:11px;font-family:Inter,sans-serif;}
.warn-table th:first-child{border-radius:8px 0 0 8px;}
.warn-table th:last-child{border-radius:0 8px 8px 0;}
.warn-table td{padding:12px 15px;border-ботtom:1px solid rgba(200,146,42,0.07);color:rgba(240,232,208,0.55);font-size:13px;transition:all 0.2s;}
.warn-table tr:hover td{background:rgba(212,168,67,0.05);}
.warn-table tr:last-child td{border-ботtom:none;}
.user-id{color:#c8922a;font-family:Inter,sans-serif;font-size:11px;background:rgba(212,168,67,0.1);padding:3px 8px;border-radius:6px;}
.mod-name{color:#c8922a;font-weight:600;}
.reason-text{max-width:220px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:rgba(240,232,208,0.4);}
.date-text{color:#666;font-size:11px;font-family:Inter,sans-serif;}
.guild-id{color:#5a5040;font-size:11px;}
.empty-state{text-align:center;padding:60px;color:#5a5040;}
.empty-state i{font-size:48px;color:#c8922a;opacity:0.3;display:block;margin-bottom:15px;}
.empty-state p{font-size:14px;margin-top:10px;}
</style>

<div class="stats-row" id="stats-row">
  <div class="stat-chip"><div class="num" id="total-count">-</div><div class="lbl">Всего</div></div>
  <div class="stat-chip"><div class="num" id="today-count" style="color:#e05555;">-</div><div class="lbl">Сегодня</div></div>
  <div class="stat-chip"><div class="num" id="unique-users" style="color:#c8922a;">-</div><div class="lbl">Benzersiz Участник</div></div>
</div>

<div class="warn-box">
  <div class="warn-title"><i class="fas fa-exclamation-triangle"></i> Tüm Предупреждения</div>
  <div class="search-row">
    <input type="text" id="warn-filter" class="search-input" placeholder="🔍 Пользователь ID, модератор veya причина ara..." oninput="filterWarningings()">
  </div>
  <div id="warnings-list" style="color:rgba(240,232,208,0.4);text-align:center;padding:40px;">
    <i class="fas fa-spinner fa-spin" style="font-size:30px;color:#c8922a;"></i><br><br>
    <span style="font-family:Inter,sans-serif;font-size:12px;letter-spacing:2px;">YÜKLENİYOR...</span>
  </div>
</div>

<script>
var allWarningings = [];

async function loadWarningings() {
  try {
    var r = await fetch('/api/warnings');
    allWarningings = await r.json();
    updateStats();
    displayWarningings(allWarningings);
  } catch(e) {
    document.getElementById('warnings-list').innerHTML = '<p style="color:#e05555;"><i class="fas fa-exclamation-circle"></i> Загрузитьnemedi: ' + e.message + '</p>';
  }
}

function updateStats() {
  document.getElementById('total-count').textContent = allWarningings.length;
  var today = new Date().toISOString().slice(0,10);
  var todayCount = allWarningings.filter(function(w){ return (w.timestamp||'').startsWith(today); }).length;
  document.getElementById('today-count').textContent = todayCount;
  var unique = new Set(allWarningings.map(function(w){ return w.user_id; })).size;
  document.getElementById('unique-users').textContent = unique;
}

function displayWarningings(warns) {
  if (!warns || !warns.length) {
    document.getElementById('warnings-list').innerHTML =
      '<div class="empty-state"><i class="fas fa-shield-alt"></i><p>Hiç warning не найдено.— сервер temiz! 🎉</p></div>';
    return;
  }
  var rows = warns.slice(0, 100).map(function(w) {
    var date = w.timestamp ? new Date(w.timestamp).toLocaleString('tr-TR') : '-';
    return '<tr>' +
      '<td><span class="user-id">' + (w.user_id||'-') + '</span></td>' +
      '<td><span class="mod-name">' + (w.moderator||'-') + '</span></td>' +
      '<td><span class="reason-text" title="'+(w.reason||'')+'">' + (w.reason||'-') + '</span></td>' +
      '<td><span class="date-text">' + date + '</span></td>' +
      '<td><span class="guild-id">' + (w.guild_id||'-') + '</span></td>' +
    '</tr>';
  }).join('');

  document.getElementById('warnings-list').innerHTML =
    '<div style="overflow-x:auto;">' +
    '<table class="warn-table">' +
    '<thead><tr>' +
      '<th><i class="fas fa-user"></i> Пользователь ID</th>' +
      '<th><i class="fas fa-shield-alt"></i> Модератор</th>' +
      '<th><i class="fas fa-comment-alt"></i> Причина</th>' +
      '<th><i class="fas fa-clock"></i> Дата</th>' +
      '<th><i class="fas fa-server"></i> Сервер</th>' +
    '</tr></thead>' +
    '<tbody>' + rows + '</tbody>' +
    '</table></div>' +
    '<p style="margin-top:12px;color:#5a5040;font-size:12px;font-family:Inter,sans-serif;letter-spacing:1px;">TOPLAM ' + warns.length + ' UYARI GÖSTERİLİYOR</p>';
}

function filterWarningings() {
  var q = document.getElementById('warn-filter').value.toLowerCase();
  displayWarningings(allWarningings.filter(function(w) {
    return String(w.user_id||'').includes(q) ||
           (w.moderator||'').toLowerCase().includes(q) ||
           (w.reason||'').toLowerCase().includes(q);
  }));
}

loadWarningings();
</script>
{% endblock %}
