{% extends "base.html" %}
{% block title %}Предупреждения - Aether{% endblock %}
{% block page_title %}Предупреждения{% endblock %}
{% block content %}
<style>
.warn-toolbar{display:flex;gap:10px;margin-bottom:14px;flex-wrap:wrap;align-items:center;}
.warn-select,.warn-search{padding:7px 11px;background:rgba(255,255,255,0.03);border:1px solid rgba(212,168,67,0.16);border-radius:8px;color:#f0e8d0;font-size:12px;font-family:Inter,sans-serif;}
.warn-select{flex:0 0 auto;min-width:140px;}
.warn-search{flex:1;min-width:160px;}
.warn-select:focus,.warn-search:focus{outline:none;border-color:rgba(212,168,67,0.45);}

.warn-stats{display:flex;gap:8px;margin-bottom:12px;flex-wrap:wrap;}
.warn-stat{flex:1;min-width:80px;background:rgba(26,22,16,0.7);border:1px solid rgba(212,168,67,0.1);border-radius:10px;padding:8px 12px;text-align:center;}
.warn-stat-num{font-size:16px;font-weight:800;color:#c8922a;}
.warn-stat-lbl{font-size:9px;color:#5a5040;text-transform:uppercase;letter-spacing:0.05em;margin-top:1px;}

.warn-box{background:rgba(26,22,16,0.7);border:1px solid rgba(212,168,67,0.08);border-radius:12px;overflow:hidden;}
.warn-head{padding:10px 14px;border-bottom:1px solid rgba(212,168,67,0.07);display:flex;justify-content:space-between;align-items:center;}
.warn-title{font-size:10px;font-weight:700;color:rgba(240,232,208,0.55);text-transform:uppercase;letter-spacing:0.08em;display:flex;align-items:center;gap:7px;}
.warn-title i{color:#c8922a;font-size:11px;}
.warn-count{font-size:10px;color:#5a5040;background:rgba(212,168,67,0.06);padding:2px 8px;border-radius:99px;}

.warn-body{max-height:520px;overflow-y:auto;overflow-anchor:none;}
table{width:100%;border-collapse:collapse;}
th,td{padding:7px 12px;text-align:left;border-bottom:1px solid rgba(212,168,67,0.05);font-size:11px;}
th{background:rgba(212,168,67,0.04);color:rgba(240,232,208,0.35);font-weight:600;text-transform:uppercase;letter-spacing:0.06em;font-size:9px;position:sticky;top:0;z-index:1;}
tr:hover td{background:rgba(212,168,67,0.04);}
.warn-badge{display:inline-block;min-width:18px;padding:2px 6px;border-radius:99px;background:rgba(212,168,67,0.18);color:#c8922a;font-size:10px;font-weight:700;text-align:center;}
.empty{text-align:center;padding:30px;color:#5a5040;font-size:12px;}
</style>

<div class="warn-toolbar">
  <select id="guild-filter" class="warn-select"><option value="">Все серверы</option></select>
  <input type="text" id="search" class="warn-search" placeholder="Предупреждение ara... (kullanıcı, sebep)">
  <span id="warn-count" class="warn-count" style="margin-left:auto;">0</span>
</div>

<div class="warn-stats">
  <div class="warn-stat"><div class="warn-stat-num" id="stat-total">-</div><div class="warn-stat-lbl">Всего</div></div>
  <div class="warn-stat"><div class="warn-stat-num" id="stat-users" style="color:#ef4444;">-</div><div class="warn-stat-lbl">Участников</div></div>
  <div class="warn-stat"><div class="warn-stat-num" id="stat-top" style="color:#c8922a;">-</div><div class="warn-stat-lbl">Топ</div></div>
</div>

<div class="warn-box">
  <div class="warn-head">
    <div class="warn-title"><i class="fas fa-exclamation-triangle"></i> Предупреждения</div>
  </div>
  <div class="warn-body" id="warn-body">
    <p class="empty"><i class="fas fa-spinner fa-spin"></i> Yükleniyor...</p>
  </div>
</div>

<script>
(function () {
  'use strict';
  function $(id) { return document.getElementById(id); }
  function esc(s) { return String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;'); }
  function fmtDate(iso) {
    if (!iso) return '-';
    try { var d = new Date(iso); return d.toLocaleString('ru-RU', {day:'2-digit', month:'2-digit', hour:'2-digit', minute:'2-digit'}); } catch (e) { return '-'; }
  }

  var allWarnings = [];
  var guilds = [];

  async function loadGuilds() {
    try {
      guilds = await fetch('/api/guilds').then(function (r) { return r.json(); });
      var sel = $('guild-filter');
      guilds.forEach(function (g) {
        var opt = document.createElement('option');
        opt.value = g.id;
        opt.textContent = g.name;
        sel.appendChild(opt);
      });
    } catch (e) { /* sessiz */ }
  }

  async function loadWarnings() {
    $('warn-body').innerHTML = '<p class="empty"><i class="fas fa-spinner fa-spin"></i> Yükleniyor...</p>';
    try {
      allWarnings = await window.fetchCachedJSON('/api/warnings');
      render();
      updateStats();
    } catch (e) {
      $('warn-body').innerHTML = '<p class="empty">Не удалось загрузить</p>';
    }
  }

  function updateStats() {
    var users = {};
    var top = 0;
    allWarnings.forEach(function (w) { users[w.user_id] = (users[w.user_id] || 0) + 1; });
    Object.keys(users).forEach(function (k) { if (users[k] > top) top = users[k]; });
    $('stat-total').textContent = allWarnings.length;
    $('stat-users').textContent = Object.keys(users).length;
    $('stat-top').textContent = top;
  }

  function render() {
    var guildFilter = $('guild-filter').value;
    var q = ($('search').value || '').toLowerCase();
    var filtered = allWarnings.filter(function (w) {
      if (guildFilter && String(w.guild_id || '') !== guildFilter) return false;
      if (q) {
        var hay = ((w.user_id || '') + ' ' + (w.reason || '') + ' ' + (w.moderator || '')).toLowerCase();
        if (hay.indexOf(q) === -1) return false;
      }
      return true;
    });
    $('warn-count').textContent = filtered.length + ' / ' + allWarnings.length;
    if (!filtered.length) {
      $('warn-body').innerHTML = '<p class="empty">Предупреждения не найдено</p>';
      return;
    }
    var rows = filtered.slice(0, 200).map(function (w) {
      return '<tr><td><span class="warn-badge">' + esc(w.user_id || '-') + '</span></td>' +
        '<td style="color:rgba(240,232,208,0.55);font-size:10px;">' + esc(w.moderator || '-') + '</td>' +
        '<td style="color:#5a5040;max-width:160px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:10px;">' + esc(w.reason || '-') + '</td>' +
        '<td style="color:#5a5040;font-size:10px;white-space:nowrap;">' + esc(fmtDate(w.timestamp)) + '</td></tr>';
    }).join('');
    $('warn-body').innerHTML = '<table><thead><tr><th>User</th><th>Модер.</th><th>Причина</th><th>Время</th></tr></thead><tbody>' + rows + '</tbody></table>';
  }

  function bind() {
    $('guild-filter').addEventListener('change', render);
    $('search').addEventListener('input', render);
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', function () { bind(); loadGuilds(); loadWarnings(); });
  } else {
    bind(); loadGuilds(); loadWarnings();
  }
})();
</script>
{% endblock %}
