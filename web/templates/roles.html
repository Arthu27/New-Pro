{% extends "base.html" %}
{% block title %}Управление ролями — Aether{% endblock %}
{% block page_title %}<i class="fas fa-user-tag" style="color:var(--ac);"></i> Управление ролями{% endblock %}
{% block content %}
<style>
.hero-banner{
  background:linear-gradient(135deg, var(--bg-2), var(--bg-3), var(--bg-2)) !important;
  border:1px solid var(--ac-line) !important;
  border-radius:var(--r-xl) !important;
  padding:28px !important;
  margin-bottom:18px !important;
  text-align:center;
  position:relative;
  overflow:hidden;
}
.hero-banner::before{content:'';position:absolute;top:0;left:-100%;width:100%;height:2px;background:linear-gradient(90deg, transparent, var(--ac), transparent);animation:scan 3s ease-in-out infinite;}
.hero-banner::after{content:'';position:absolute;inset:0;background:radial-gradient(ellipse at 50% 0%, var(--ac-soft) 0%, transparent 70%);pointer-events:none;}
@keyframes scan{0%{left:-100%}100%{left:100%}}
.hero-emoji{font-size:48px;display:block;margin-bottom:10px;filter:drop-shadow(0 4px 12px var(--ac-glow));}
.hero-title{
  font-size:22px;font-weight:900;
  background:linear-gradient(135deg, var(--ac-2), var(--ac), var(--ac-3));
  -webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;
  letter-spacing:2px;margin-bottom:6px;
}
.hero-sub{color:var(--text-3);font-size:12px;letter-spacing:1px;}

.btn-add{
  padding:12px 24px;
  background:linear-gradient(135deg, var(--ac), var(--ac-3));
  color:var(--bg);
  border:none;
  border-radius:99px;
  cursor:pointer;
  font-weight:700;
  font-size:13px;
  font-family:Inter,sans-serif;
  display:inline-flex;align-items:center;gap:8px;
  margin-bottom:18px;
  box-shadow:0 4px 14px var(--ac-glow);
  transition:all 0.18s var(--ease);
}
.btn-add:hover{transform:translateY(-1px);box-shadow:0 6px 22px rgba(212,168,67,0.40);filter:brightness(1.05);}

.roles-card{
  background:var(--surface) !important;
  border:1px solid var(--line) !important;
  border-radius:var(--r-lg) !important;
  padding:16px 20px !important;
  margin-bottom:10px !important;
  display:flex;
  justify-content:space-between;
  align-items:center;
  transition:all 0.22s var(--ease);
}
.roles-card:hover{border-color:var(--ac-line) !important;transform:translateY(-2px);box-shadow:var(--shadow-md);}
.roles-color{
  width:40px;height:40px;border-radius:50%;
  border:2px solid rgba(255,255,255,0.20);
  flex-shrink:0;
  box-shadow:0 0 0 3px rgba(0,0,0,0.4);
}
.roles-name{font-size:14.5px;font-weight:700;color:var(--text);margin-bottom:3px;letter-spacing:-0.01em;}
.roles-members{font-size:11.5px;color:var(--text-3);display:flex;align-items:center;gap:5px;}
.roles-members i{color:var(--ac);font-size:10px;}

.roles-actions{display:flex;gap:8px;}
.btn-sm{
  padding:7px 12px;border:none;border-radius:8px;
  cursor:pointer;font-size:12px;font-weight:600;
  transition:all 0.18s var(--ease);
  display:inline-flex;align-items:center;gap:4px;
}
.btn-edit{background:var(--ac-soft);color:var(--ac);border:1px solid var(--ac-line);}
.btn-edit:hover{background:rgba(212,168,67,0.20);transform:translateY(-1px);}
.btn-delete{background:rgba(248,113,113,0.10);color:var(--err);border:1px solid rgba(248,113,113,0.25);}
.btn-delete:hover{background:rgba(248,113,113,0.22);transform:translateY(-1px);}

.modal-overlay{display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.65);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);z-index:9999;justify-content:center;align-items:center;animation:fadeIn 0.2s var(--ease-out) both;}
.modal-overlay.open{display:flex;}
.modal-box{
  background:var(--surface-3);
  border:1px solid var(--ac-line);
  border-radius:var(--r-xl);
  padding:28px;
  max-width:460px;width:90%;
  box-shadow:var(--shadow-lg), 0 0 60px rgba(212,168,67,0.15);
  animation:scaleIn 0.25s cubic-bezier(0.34, 1.56, 0.64, 1) both;
}
.modal-box h3{font-size:14px;font-weight:700;color:var(--text);margin-bottom:18px;display:flex;align-items:center;gap:8px;}
.modal-box h3 i{color:var(--ac);}
.modal-input{
  width:100%;padding:11px 14px;
  background:rgba(10,9,7,0.7);
  border:1px solid var(--line-2);
  border-radius:10px;color:var(--text);
  font-size:13px;margin-bottom:12px;
  box-sizing:border-box;
  font-family:Inter,sans-serif;
  transition:all 0.18s var(--ease);
}
.modal-input:focus{outline:none;border-color:var(--ac);box-shadow:0 0 0 3px rgba(212,168,67,0.12);}
.modal-color{
  width:100%;height:50px;
  border:1px solid var(--line-2);border-radius:10px;
  margin-bottom:16px;cursor:pointer;
  background:rgba(10,9,7,0.55);
  padding:3px;
}
.modal-actions{display:flex;gap:10px;}
.modal-btn{
  flex:1;padding:11px;border:none;border-radius:10px;
  cursor:pointer;font-weight:700;font-size:13px;
  font-family:Inter,sans-serif;transition:all 0.18s var(--ease);
}
.modal-btn.primary{background:linear-gradient(135deg, var(--ac), var(--ac-3));color:var(--bg);box-shadow:0 4px 14px var(--ac-glow);}
.modal-btn.primary:hover{transform:translateY(-1px);box-shadow:0 6px 22px rgba(212,168,67,0.40);filter:brightness(1.05);}
.modal-btn.secondary{background:var(--surface);color:var(--text);border:1px solid var(--line-2);}
.modal-btn.secondary:hover{border-color:var(--ac-line);}

.empty-msg{text-align:center;color:var(--text-3);padding:50px 20px;font-size:13px;}
.empty-msg i{font-size:36px;margin-bottom:12px;display:block;opacity:0.4;color:var(--ac);}
</style>

<div class="hero-banner">
  <span class="hero-emoji">🎭</span>
  <div class="hero-title">УПРАВЛЕНИЕ РОЛЯМИ</div>
  <div class="hero-sub">Просмотр, создание и удаление ролей на сервере</div>
</div>

<button class="btn-add" onclick="openNameModal()"><i class="fas fa-plus"></i> Создать новую роль</button>

<div style="margin-bottom:16px;">
  <select id="guild-select" style="display:none;width:100%;">
    <option value="">Выберите сервер...</option>
  </select>
</div>

<div id="roles-list"><div class="empty-msg"><i class="fas fa-spinner fa-spin"></i>Загрузка...</div></div>

<div id="modal" class="modal-overlay">
  <div class="modal-box">
    <h3><i class="fas fa-plus-circle"></i> Создать роль</h3>
    <input type="text" id="role-name" class="modal-input" placeholder="Название роли">
    <input type="color" id="role-color" class="modal-color" value="#d4a843">
    <div class="modal-actions">
      <button onclick="createRole()" class="modal-btn primary">Создать</button>
      <button onclick="closeModal()" class="modal-btn secondary">Отмена</button>
    </div>
  </div>
</div>

<script>
var MAIN_GID = '{{ main_guild_id }}';
var selectedGuild = MAIN_GID;
function esc(s) { return String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;'); }

async function loadRoles() {
  var box = document.getElementById('roles-list');
  if (!selectedGuild) { box.innerHTML = '<div class="empty-msg">Сервер не выбран</div>'; return; }
  try {
    var r = await fetch('/api/guild/' + selectedGuild + '/roles');
    var roles = await r.json();
    if (!Array.isArray(roles) || roles.length === 0) {
      box.innerHTML = '<div class="empty-msg"><i class="fas fa-user-tag"></i>На этом сервере ролей нет</div>';
      return;
    }
    box.innerHTML = roles.map(function(role) {
      return '<div class="roles-card">' +
        '<div style="display:flex;gap:14px;align-items:center;">' +
          '<div class="roles-color" style="background:' + esc(role.color || '#888') + ';"></div>' +
          '<div><div class="roles-name">' + esc(role.name) + '</div><div class="roles-members"><i class="fas fa-users"></i> ' + (role.members || 0) + ' участников</div></div>' +
        '</div>' +
        '<div class="roles-actions">' +
          '<button class="btn-sm btn-edit" onclick="editRole(\'' + role.id + '\')" title="Редактировать"><i class="fas fa-edit"></i></button>' +
          '<button class="btn-sm btn-delete" onclick="deleteRole(\'' + role.id + '\',\'' + esc(role.name).replace(/'/g, "\\'") + '\')" title="Удалить"><i class="fas fa-trash"></i></button>' +
        '</div>' +
      '</div>';
    }).join('');
  } catch (e) {
    box.innerHTML = '<div class="empty-msg"><i class="fas fa-exclamation-triangle" style="color:var(--err);"></i>Не удалось загрузить: ' + esc(e.message) + '</div>';
  }
}

function openNameModal() { document.getElementById('modal').classList.add('open'); }
function closeModal() { document.getElementById('modal').classList.remove('open'); }
document.getElementById('modal').addEventListener('click', function(e) { if (e.target === this) closeModal(); });

async function createRole() {
  var name = document.getElementById('role-name').value.trim();
  var color = document.getElementById('role-color').value;
  if (!name) { alert('Введите название роли!'); return; }
  try {
    var r = await fetch('/api/guild/' + selectedGuild + '/roles/create', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ name: name, color: color })
    });
    var d = await r.json();
    if (d.success) { closeModal(); document.getElementById('role-name').value = ''; loadRoles(); }
    else alert('Ошибка: ' + (d.error || 'Неизвестно'));
  } catch (e) { alert('Ошибка запроса: ' + e.message); }
}

async function deleteRole(id, name) {
  if (!confirm('Удалить роль "' + name + '"?')) return;
  try {
    var r = await fetch('/api/guild/' + selectedGuild + '/roles/' + id + '/delete', { method: 'POST' });
    var d = await r.json();
    if (d.success) loadRoles();
    else alert('Ошибка: ' + (d.error || 'Неизвестно'));
  } catch (e) { alert('Ошибка запроса: ' + e.message); }
}

function editRole(id) { alert('Редактирование ролей скоро будет добавлено (ID: ' + id + ')'); }

loadRoles();
</script>
{% endblock %}
