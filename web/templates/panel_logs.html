{% extends "base.html" %}
{% block title %}Panel Logs - Aether{% endblock %}
{% block page_title %}<i class="fas fa-list" ></i> Логи панели{% endblock %}
{% block content %}

<div class="pl-filters">
  <input type="text" id="search" class="pl-search" placeholder="Ara... (eylem, kullanиcи, IP)">
  <select id="filter" class="pl-select">
    <option value="">Все aksiyonlar</option>
    <option>POST</option>
    <option>DELETE</option>
    <option>GET</option>
  </select>
  <button class="btn-primary" id="btn-clear" type="button" style="cursor: pointer">Temizle</button>
</div>

<div class="pl-stats">
  <div class="pl-stat"><div class="pl-stat-num" id="stat-total">-</div><div class="pl-stat-lbl">Всего</div></div>
  <div class="pl-stat"><div class="pl-stat-num" id="stat-today" >-</div><div class="pl-stat-lbl">Сегодня</div></div>
  <div class="pl-stat"><div class="pl-stat-num" id="stat-post" >-</div><div class="pl-stat-lbl">POST</div></div>
  <div class="pl-stat"><div class="pl-stat-num" id="stat-delete" >-</div><div class="pl-stat-lbl">DELETE</div></div>
</div>

<div class="pl-box">
  <div class="pl-head">
    <div class="pl-title"><i class="fas fa-list"></i> Последний Panel Ишlemleri</div>
    <span class="pl-count" id="pl-count">-</span>
  </div>
  <div class="pl-body" id="pl-body">
    <p class="empty"><i class="fas fa-spinner fa-spin"></i></p>
  </div>
</div>

<script>
(function () {
  'use strict';
  function $(id) { return document.getElementById(id); }
  function esc(s) { return String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;'); }

  var logs = [
    { action: 'POST /api/guild/.../ticket-settings', user: 'Owner', role: 'owner', ip: '127.0.0.1', time: '2 min ёnce', method: 'POST' },
    { action: 'POST /api/command/ban', user: 'Администратор', role: 'admin', ip: '127.0.0.1', time: '5 min ёnce', method: 'POST' },
    { action: 'GET /api/guilds', user: 'Owner', role: 'owner', ip: '127.0.0.1', time: '10 min ёnce', method: 'GET' },
    { action: 'POST /api/warn', user: 'Mod', role: 'mod', ip: '127.0.0.1', time: '15 min ёnce', method: 'POST' },
    { action: 'DELETE /api/guild/.../channels/...', user: 'Администратор', role: 'admin', ip: '127.0.0.1', time: '1 saat ёnce', method: 'DELETE' }
  ];
  var roleColor = { owner: 'var(--err)', admin: '#c8922a', mod: 'var(--ok)' };

  function render() {
    var q = ($('search').value || '').toLowerCase();
    var f = $('filter').value;
    var list = logs.filter(function (l) {
      if (f && l.method !== f) return false;
      if (q && ((l.action + ' ' + l.user + ' ' + l.ip).toLowerCase().indexOf(q) === -1)) return false;
      return true;
    });
    $('pl-count').textContent = list.length + ' / ' + logs.length;
    $('stat-total').textContent = logs.length;
    $('stat-today').textContent = logs.length;
    $('stat-post').textContent = logs.filter(function (l) { return l.method === 'POST'; }).length;
    $('stat-delete').textContent = logs.filter(function (l) { return l.method === 'DELETE'; }).length;
    if (!list.length) { $('pl-body').innerHTML = '<p class="empty">Лог yok</p>'; return; }
    var html = '';
    list.forEach(function (l) {
      var icon = l.method === 'POST' ? 'fa-plus' : l.method === 'DELETE' ? 'fa-trash' : 'fa-eye';
      html += '<div class="pl-item"><div class="pl-icon"><i class="fas ' + icon + '"></i></div>' +
        '<div class="pl-action">' + esc(l.action) + '</div>' +
        '<div class="pl-user" >' + esc(l.user) + '</div>' +
        '<div class="pl-ip">' + esc(l.ip) + '</div>' +
        '<div class="pl-time">' + esc(l.time) + '</div></div>';
    });
    $('pl-body').innerHTML = html;
  }

  function bind() {
    $('search').addEventListener('input', render);
    $('filter').addEventListener('change', render);
    $('btn-clear').addEventListener('click', function () {
      if (confirm('Все panel loglarиnи temizle?')) { logs = []; render(); }
    });
  }

  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', function () { bind(); render(); });
  else { bind(); render(); }
})();
</script>
{% endblock %}
