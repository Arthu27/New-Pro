{% extends "base.html" %}
{% block title %}AI Тикеты - Aether{% endblock %}
{% block page_title %}AI Тикеты{% endblock %}
{% block content %}
<style>
.at-stats{display:flex;gap:10px;margin-bottom:14px;flex-wrap:wrap;}
.at-stat{flex:1;min-width:90px;background:rgba(26,22,16,0.7);border:1px solid rgba(212,168,67,0.1);border-radius:12px;padding:10px 14px;text-align:center;}
.at-stat-num{font-size:20px;font-weight:800;color:#c8922a;}
.at-stat-lbl{font-size:9px;color:#5a5040;text-transform:uppercase;letter-spacing:0.05em;margin-top:2px;}

.at-tabs{display:flex;gap:6px;margin-bottom:12px;}
.at-tab{padding:7px 14px;background:rgba(255,255,255,0.03);border:1px solid rgba(212,168,67,0.12);border-radius:99px;cursor:pointer;font-size:11px;font-weight:600;color:rgba(240,232,208,0.6);transition:all 0.15s;}
.at-tab.active{background:#c8922a;color:#100e08;border-color:#c8922a;}

.at-box{background:rgba(26,22,16,0.7);border:1px solid rgba(212,168,67,0.08);border-radius:12px;overflow:hidden;}
.at-head{padding:10px 14px;border-bottom:1px solid rgba(212,168,67,0.07);display:flex;justify-content:space-between;align-items:center;}
.at-title{font-size:10px;font-weight:700;color:rgba(240,232,208,0.55);text-transform:uppercase;letter-spacing:0.08em;display:flex;align-items:center;gap:7px;}
.at-title i{color:#c8922a;}
.at-count{font-size:10px;color:#5a5040;background:rgba(212,168,67,0.06);padding:2px 8px;border-radius:99px;}
.at-body{max-height:520px;overflow-y:auto;overflow-anchor:none;}

.tk-item{display:flex;align-items:center;gap:10px;padding:10px 14px;border-bottom:1px solid rgba(212,168,67,0.05);transition:background 0.1s;cursor:pointer;}
.tk-item:hover{background:rgba(212,168,67,0.04);}
.tk-av{width:34px;height:34px;border-radius:50%;border:2px solid var(--border2);object-fit:cover;flex-shrink:0;}
.tk-info{flex:1;min-width:0;}
.tk-name{font-weight:600;font-size:12px;color:#f0e8d0;margin-bottom:2px;}
.tk-topic{font-size:10px;color:#5a5040;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.tk-status{padding:2px 7px;border-radius:99px;font-size:9px;font-weight:700;letter-spacing:0.04em;flex-shrink:0;}
.tk-status.open{background:rgba(94,196,122,0.12);color:#5ec47a;}
.tk-status.closed{background:rgba(90,80,64,0.18);color:#5a5040;}
.tk-status.ai{background:rgba(200,146,42,0.15);color:#c8922a;}

.empty{text-align:center;padding:30px;color:#5a5040;font-size:12px;}
</style>

<div class="at-stats">
  <div class="at-stat"><div class="at-stat-num" id="stat-total">-</div><div class="at-stat-lbl">Всего</div></div>
  <div class="at-stat"><div class="at-stat-num" id="stat-open" style="color:#5ec47a;">-</div><div class="at-stat-lbl">Открытых</div></div>
  <div class="at-stat"><div class="at-stat-num" id="stat-ai" style="color:#c8922a;">-</div><div class="at-stat-lbl">AI Сечас</div></div>
  <div class="at-stat"><div class="at-stat-num" id="stat-closed">-</div><div class="at-stat-lbl">Закрытых</div></div>
</div>

<div class="at-tabs">
  <button class="at-tab active" data-tab="all">Tümü</button>
  <button class="at-tab" data-tab="open">Открытые</button>
  <button class="at-tab" data-tab="ai">AI активные</button>
  <button class="at-tab" data-tab="closed">Закрытые</button>
</div>

<div class="at-box">
  <div class="at-head">
    <div class="at-title"><i class="fas fa-ticket-alt"></i> Тикеты</div>
    <span class="at-count" id="at-count">-</span>
  </div>
  <div class="at-body" id="at-body">
    <p class="empty"><i class="fas fa-spinner fa-spin"></i> Yükleniyor...</p>
  </div>
</div>

<script>
(function () {
  'use strict';
  function $(id) { return document.getElementById(id); }
  function esc(s) { return String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;'); }

  var tickets = [
    { user: 'User1', topic: 'Hesabım çalındı', status: 'open', time: '5 мин' },
    { user: 'User2', topic: 'Ödeme sorunu', status: 'ai', time: '15 мин' },
    { user: 'User3', topic: 'Sunucu önerisi', status: 'closed', time: '2 saat' },
    { user: 'User4', topic: 'Şifre sıfırlama', status: 'open', time: '1 saat' }
  ];
  var currentTab = 'all';

  function render() {
    var list = currentTab === 'all' ? tickets : tickets.filter(function (t) { return t.status === currentTab; });
    $('at-count').textContent = list.length;
    $('stat-total').textContent = tickets.length;
    $('stat-open').textContent = tickets.filter(function (t) { return t.status === 'open'; }).length;
    $('stat-ai').textContent = tickets.filter(function (t) { return t.status === 'ai'; }).length;
    $('stat-closed').textContent = tickets.filter(function (t) { return t.status === 'closed'; }).length;
    if (!list.length) { $('at-body').innerHTML = '<p class="empty">Ticket yok</p>'; return; }
    var html = '';
    list.forEach(function (t) {
      var st = t.status === 'open' ? 'Открыт' : t.status === 'ai' ? 'AI' : 'Закрыт';
      html += '<div class="tk-item"><img class="tk-av" src="https://cdn.discordapp.com/embed/avatars/0.png" onerror="this.src=\'https://cdn.discordapp.com/embed/avatars/0.png\'">' +
        '<div class="tk-info"><div class="tk-name">' + esc(t.user) + '</div><div class="tk-topic">' + esc(t.topic) + ' • ' + esc(t.time) + '</div></div>' +
        '<span class="tk-status ' + t.status + '">' + st + '</span></div>';
    });
    $('at-body').innerHTML = html;
  }

  function bind() {
    document.querySelectorAll('.at-tab').forEach(function (t) {
      t.addEventListener('click', function () {
        document.querySelectorAll('.at-tab').forEach(function (x) { x.classList.remove('active'); });
        t.classList.add('active');
        currentTab = t.getAttribute('data-tab');
        render();
      });
    });
  }

  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', function () { bind(); render(); });
  else { bind(); render(); }
})();
</script>
{% endblock %}
