{% extends "base.html" %}
{% block title %}Пользователи - Aether{% endblock %}
{% block page_title %}Пользователи{% endblock %}
{% block content %}
<style>
/* ── Toolbar ── */
.users-toolbar{display:flex;gap:10px;margin-bottom:14px;flex-wrap:wrap;align-items:center;}
.guild-select,.search-input{padding:8px 12px;background:rgba(255,255,255,0.03);border:1px solid rgba(212,168,67,0.16);border-radius:8px;color:#f0e8d0;font-size:12px;font-family:Inter,sans-serif;transition:border-color 0.15s;}
.guild-select{flex:1;min-width:160px;}
.search-input{flex:2;min-width:200px;}
.guild-select:focus,.search-input:focus{outline:none;border-color:rgba(212,168,67,0.45);}
.users-count{font-size:11px;color:#5a5040;background:rgba(212,168,67,0.06);padding:4px 10px;border-radius:99px;letter-spacing:0.05em;}

/* ── Members grid ── */
.members-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:8px;max-height:520px;overflow-y:auto;overflow-anchor:none;padding:4px;}
.member-card{background:rgba(26,22,16,0.7);border:1px solid rgba(212,168,67,0.08);border-radius:10px;padding:12px 8px;cursor:pointer;text-align:center;transition:all 0.2s;animation:fadeUp 0.3s ease-out both;}
.member-card:hover{border-color:rgba(212,168,67,0.35);transform:translateY(-2px);box-shadow:0 6px 20px rgba(200,146,42,0.15);}
.member-card .av-wrap{position:relative;display:inline-block;margin-bottom:8px;}
.member-card .av{width:48px;height:48px;border-radius:50%;border:2px solid rgba(212,168,67,0.4);object-fit:cover;}
.status-dot{position:absolute;bottom:0;right:0;width:11px;height:11px;border-radius:50%;border:2px solid #1a1610;}
.status-online{background:#2ecc71;}
.status-idle{background:#f39c12;}
.status-dnd{background:#e74c3c;}
.status-offline{background:#555;}
.member-name{font-weight:600;font-size:12px;color:#f0e8d0;margin-bottom:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.member-username{font-size:10px;color:#5a5040;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.bot-badge{background:rgba(212,168,67,0.15);color:#c8922a;padding:1px 6px;border-radius:99px;font-size:8px;margin-top:4px;display:inline-block;letter-spacing:0.05em;}

/* ── Modal ── */
.member-modal-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,0.8);backdrop-filter:blur(6px);z-index:9999;align-items:center;justify-content:center;}
.member-modal-overlay.open{display:flex;}
.member-modal{background:rgba(26,22,16,0.95);border:1px solid rgba(212,168,67,0.25);border-radius:14px;padding:24px;max-width:480px;width:92vw;max-height:85vh;overflow-y:auto;position:relative;box-shadow:0 24px 80px rgba(0,0,0,0.6);}
.member-modal-close{position:absolute;top:12px;right:12px;background:transparent;border:1px solid rgba(212,168,67,0.15);color:#5a5040;width:30px;height:30px;border-radius:7px;cursor:pointer;font-size:16px;transition:all 0.15s;}
.member-modal-close:hover{background:rgba(212,168,67,0.08);color:#f0e8d0;}
.member-detail-info{display:flex;flex-direction:column;align-items:center;margin-bottom:16px;}
.member-detail-av{width:80px;height:80px;border-radius:50%;border:3px solid rgba(212,168,67,0.4);box-shadow:0 0 16px rgba(200,146,42,0.2);margin-bottom:10px;object-fit:cover;}
.member-detail-name{font-size:18px;font-weight:700;color:#f0e8d0;margin-bottom:2px;}
.member-detail-sub{font-size:11px;color:#5a5040;margin-bottom:8px;}
.detail-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:14px;}
.detail-cell{background:rgba(0,0,0,0.3);border:1px solid rgba(212,168,67,0.1);padding:10px;border-radius:8px;text-align:center;}
.detail-cell i{color:#c8922a;font-size:14px;margin-bottom:4px;display:block;}
.detail-cell-label{font-size:9px;color:#5a5040;text-transform:uppercase;letter-spacing:0.05em;margin-bottom:2px;}
.detail-cell-val{font-size:11px;color:#f0e8d0;font-weight:600;word-break:break-all;}
.role-chip{display:inline-block;background:rgba(212,168,67,0.1);border:1px solid rgba(212,168,67,0.25);padding:2px 8px;border-radius:99px;font-size:10px;margin:2px;}

@keyframes fadeUp{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}

@media (max-width:600px){
  .members-grid{grid-template-columns:repeat(auto-fill,minmax(110px,1fr));}
  .detail-grid{grid-template-columns:1fr;}
}
</style>

<div class="users-toolbar">
  <select id="guild-select" class="guild-select"><option value="">Сервер secin...</option></select>
  <input type="text" id="search" class="search-input" placeholder="Участник ara...">
  <span class="users-count" id="member-count">0</span>
</div>

<div id="members-section">
  <div id="members-list"><p style="text-align:center;color:#5a5040;padding:30px;font-size:12px;">Sunucu seçin veya yükleniyor...</p></div>
</div>

<!-- Modal -->
<div id="modal" class="member-modal-overlay">
  <div class="member-modal">
    <button class="member-modal-close" id="modalClose" type="button">&times;</button>
    <div id="modal-content"></div>
  </div>
</div>

<script>
(function () {
  'use strict';
  function $(id) { return document.getElementById(id); }
  function esc(s) { return String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;'); }

  var allMembers = [];
  var statusClass = { online: 'status-online', idle: 'status-idle', dnd: 'status-dnd' };
  var statusLabel = { online: 'В сети', idle: 'Неактивен', dnd: 'Не беспокоить', offline: 'Не в сети' };

  async function loadGuilds() {
    try {
      var guilds = await fetch('/api/guilds').then(function (r) { return r.json(); });
      var sel = $('guild-select');
      guilds.forEach(function (g) {
        var opt = document.createElement('option');
        opt.value = g.id;
        opt.textContent = g.name;
        sel.appendChild(opt);
      });
    } catch (e) { /* sessiz */ }
  }

  async function loadMembers() {
    var guildId = $('guild-select').value;
    if (!guildId) return;
    $('members-list').innerHTML = '<p style="text-align:center;color:#5a5040;padding:30px;font-size:12px;"><i class="fas fa-spinner fa-spin" style="color:#c8922a;"></i></p>';
    try {
      var res = await fetch('/api/guild/' + guildId + '/members?limit=500');
      allMembers = await res.json();
      $('member-count').textContent = allMembers.length + ' kisi';
      renderMembers(allMembers);
    } catch (e) {
      $('members-list').innerHTML = '<p style="text-align:center;color:#ef4444;padding:20px;">Yuklenemedi: ' + esc(e.message) + '</p>';
    }
  }

  function renderMembers(members) {
    if (!members.length) {
      $('members-list').innerHTML = '<p style="text-align:center;color:#5a5040;padding:30px;font-size:12px;">Участник yok</p>';
      return;
    }
    var html = '';
    members.forEach(function (m, i) {
      var sc = statusClass[m.status] || 'status-offline';
      html += '<div class="member-card" data-idx="' + i + '">' +
        '<div class="av-wrap">' +
          '<img class="av" src="' + esc(m.avatar) + '" onerror="this.src=\'https://cdn.discordapp.com/embed/avatars/0.png\'">' +
          '<span class="status-dot ' + sc + '"></span>' +
        '</div>' +
        '<div class="member-name">' + esc(m.display_name) + '</div>' +
        '<div class="member-username">' + esc(m.name) + '</div>' +
        (m.bot ? '<span class="bot-badge">BOT</span>' : '') +
      '</div>';
    });
    $('members-list').innerHTML = '<div class="members-grid">' + html + '</div>';
  }

  function showDetail(i) {
    var m = allMembers[i];
    if (!m) return;
    var cr = new Date(m.created_at);
    var jo = m.joined_at ? new Date(m.joined_at) : null;
    var st = statusLabel[m.status] || 'Не в сети';
    var sc = statusClass[m.status] || 'status-offline';
    var roles = (m.roles || []).map(function (r) { return '<span class="role-chip">' + esc(r.name) + '</span>'; }).join('');
    $('modal-content').innerHTML =
      '<div class="member-detail-info">' +
        '<img class="member-detail-av" src="' + esc(m.avatar) + '" onerror="this.src=\'https://cdn.discordapp.com/embed/avatars/0.png\'">' +
        '<div class="member-detail-name">' + esc(m.display_name) + '</div>' +
        (m.nick ? '<div class="member-detail-sub">Nick: ' + esc(m.nick) + '</div>' : '') +
        '<div class="member-detail-sub">@' + esc(m.name) + '</div>' +
        '<div><span class="status-dot ' + sc + '" style="display:inline-block;position:static;margin-right:6px;width:8px;height:8px;"></span> ' + st + (m.bot ? ' <span class="bot-badge" style="margin-left:6px;">BOT</span>' : '') + '</div>' +
      '</div>' +
      '<div class="detail-grid">' +
        '<div class="detail-cell"><i class="fas fa-id-card"></i><div class="detail-cell-label">ID</div><div class="detail-cell-val">' + esc(m.id) + '</div></div>' +
        '<div class="detail-cell"><i class="fas fa-crown"></i><div class="detail-cell-label">Роль</div><div class="detail-cell-val">' + esc(m.top_role || 'Yok') + '</div></div>' +
        '<div class="detail-cell"><i class="fas fa-calendar-plus"></i><div class="detail-cell-label">Hesap Acilis</div><div class="detail-cell-val">' + cr.toLocaleDateString('ru-RU') + '</div></div>' +
        '<div class="detail-cell"><i class="fas fa-sign-in-alt"></i><div class="detail-cell-label">Вход</div><div class="detail-cell-val">' + (jo ? jo.toLocaleDateString('ru-RU') : '—') + '</div></div>' +
      '</div>' +
      ((m.roles || []).length ? '<div><div class="detail-cell-label" style="margin-bottom:6px;">Роли (' + m.roles.length + ')</div>' + roles + '</div>' : '');
    $('modal').classList.add('open');
  }

  function closeModal() { $('modal').classList.remove('open'); }

  function filterMembers() {
    var q = $('search').value.toLowerCase();
    renderMembers(allMembers.filter(function (m) {
      return (m.name || '').toLowerCase().indexOf(q) !== -1 ||
             (m.display_name || '').toLowerCase().indexOf(q) !== -1 ||
             (m.id || '').toString().indexOf(q) !== -1;
    }));
  }

  function bind() {
    $('guild-select').addEventListener('change', loadMembers);
    $('search').addEventListener('input', filterMembers);
    $('modalClose').addEventListener('click', closeModal);
    $('modal').addEventListener('click', function (e) { if (e.target === this) closeModal(); });
    $('members-list').addEventListener('click', function (e) {
      var card = e.target.closest('.member-card');
      if (card) showDetail(parseInt(card.getAttribute('data-idx'), 10));
    });
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', function () { bind(); loadGuilds(); });
  } else {
    bind(); loadGuilds();
  }
})();
</script>
{% endblock %}
