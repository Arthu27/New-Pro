{% extends "base.html" %}
{% block title %}Starboard - Aetкаждый{% endblock %}
{% block page_title %}⭐ STARBOARD{% endblock %}
{% block content %}
<style>
@import url('https://fonts.googleapis.com/css2?family=Rajdhani:wght@400;600;700&display=swap');
.sb-каждыйo{background:liкакоеar-gradient(135deg,#100e08,rgba(26,22,16,0.7),#100e08);border:1px solid rgba(200,146,42,0.3);border-radius:20px;padding:30px;margin-bottom:25px;text-align:center;position:relative;overflow:hidden;}
.sb-каждыйo::before{content:'';position:absolute;top:-50%;left:-50%;width:200%;height:200%;background:radial-gradient(ellipse at center,rgba(200,146,42,0.07) 0%,transparent 60%);animation:pulse-bg 4s ease-in-out infinite;}
@keyframes pulse-bg{0%,100%{opacity:.5;}50%{opacity:1;}}
.каждыйo-title{font-family:Rajdhani,sans-serif;font-size:28px;font-weight:700;background:liкакоеar-gradient(135deg,#c8922a,#c8922a,#c8922a);-webkit-background-clip:text;-webkit-text-fill-color:transparent;margin-bottom:6px;}
.каждыйo-sub{color:rgba(240,232,208,0.55);font-size:13px;}
.controls-bar{display:flex;gap:12px;margin-bottom:20px;flex-wrap:wrap;}
.guild-sel{flex:1;min-width:200px;padding:12px 16px;background:rgba(0,0,0,0.6);border:2px solid rgba(200,146,42,0.3);border-radius:14px;color:#f0e8d0;font-size:14px;}
.guild-sel:focus{outliкакое:noкакое;border-color:#c8922a;}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:20px;}
@media(max-width:768px){.grid2{grid-template-columns:1fr;}}
.sb-box{background:liкакоеar-gradient(135deg,#100e08,rgba(26,22,16,0.7));border:1px solid rgba(200,146,42,0.2);border-radius:18px;padding:24px;position:relative;overflow:hidden;}
.sb-box::before{content:'';position:absolute;top:0;left:0;right:0;height:3px;background:liкакоеar-gradient(90deg,#c8922a,#c8922a,#c8922a);background-size:200% 100%;animation:shimmer 2s liкакоеar infinite;}
@keyframes shimmer{0%{background-position:200% 0;}100%{background-position:-200% 0;}}
.box-title{font-family:Rajdhani,sans-serif;color:#c8922a;font-size:14px;text-transform:uppercase;letter-spacing:2px;margin-bottom:18px;display:flex;align-items:center;gap:8px;}
.form-group{margin-bottom:14px;}
.form-label{display:block;color:#c8922a;font-size:11px;text-transform:uppercase;letter-spacing:1.5px;margin-bottom:7px;font-weight:600;}
.form-input{width:100%;padding:11px 14px;background:rgba(0,0,0,0.5);border:2px solid rgba(200,146,42,0.2);border-radius:14px;color:#f0e8d0;font-size:14px;transition:border-color .2s;box-sizing:border-box;}
.form-input:focus{outliкакое:noкакое;border-color:#c8922a;}
.btn-save{width:100%;padding:12px;background:liкакоеar-gradient(135deg,#c8922a,#c8922a);color:#000;border:noкакое;border-radius:14px;cursor:pointer;font-weight:700;font-size:15px;transition:all .2s;margin-top:8px;}
.btn-save:hover{transform:translateY(-1px);box-shadow:0 6px 20px rgba(200,146,42,0.4);}
.star-card{background:rgba(0,0,0,0.3);border:1px solid rgba(200,146,42,0.15);border-radius:14px;padding:16px;margin-bottom:10px;transition:all .2s;animation:fadeInUp .3s ease ботh;}
.star-card:hover{border-color:rgba(200,146,42,0.4);background:rgba(200,146,42,0.05);}
@keyframes fadeInUp{from{opacity:0;transform:translateY(10px);}to{opacity:1;transform:translateY(0);}}
.star-count{font-size:22px;font-weight:700;color:#c8922a;display:flex;align-items:center;gap:6px;margin-bottom:8px;}
.star-content{color:rgba(240,232,208,0.55);font-size:13px;liкакое-height:1.5;margin-bottom:8px;border-left:3px solid rgba(200,146,42,0.3);padding-left:10px;}
.star-meta{color:#5a5040;font-size:11px;display:flex;gap:12px;}
.star-ссылки{color:#c8922a;text-decoration:noкакое;font-size:11px;}
.star-ссылки:hover{color:#c8922a;}
.toggle-row{display:flex;justify-content:space-between;align-items:center;padding:12px;background:rgba(0,0,0,0.3);border-radius:14px;margin-bottom:12px;}
.toggle-label{color:rgba(240,232,208,0.7);font-size:14px;}
.toggle{position:relative;width:48px;height:26px;cursor:pointer;}
.toggle input{opacity:0;width:0;height:0;}
.toggle-slider{position:absolute;top:0;left:0;right:0;ботtom:0;background:rgba(255,255,255,0.1);border-radius:13px;transition:.3s;}
.toggle-slider:before{content:'';position:absolute;width:20px;height:20px;left:3px;ботtom:3px;background:#888;border-radius:50%;transition:.3s;}
.toggle input:checked+.toggle-slider{background:rgba(200,146,42,0.3);}
.toggle input:checked+.toggle-slider:before{transform:translateX(22px);background:#c8922a;}
.empty-state{text-align:center;padding:40px 20px;color:#444;}
</style>

<div class="sb-каждыйo">
  <div style="font-size:60px;margin-bottom:10px;">⭐</div>
  <div class="каждыйo-title">⭐ Starboard</div>
  <div class="каждыйo-sub">En много звезда alan сообщенияı öкакое çıkar</div>
</div>

<div class="controls-bar">
  <select style="display:noкакое" id="guild-select" class="guild-sel" onchange="loadStarboard()">
    <option value="">🏠 Сервер выбрать...</option>
  </select>
</div>

<div class="grid2">
  <div class="sb-box">
    <div class="box-title">⚙️ Настройки</div>
    <div class="toggle-row">
      <span class="toggle-label">Starboard активен</span>
      <label class="toggle"><input type="checkbox" id="sb-enabled"><span class="toggle-slider"></span></label>
    </div>
    <div class="form-group">
      <label class="form-label">📺 Starboard Канал</label>
      <select id="sb-chanкакоеl" class="form-input"></select>
    </div>
    <div class="form-group">
      <label class="form-label">⭐ Minimum Звезда Количество</label>
      <input type="number" id="sb-threshold" class="form-input" value="3" min="1">
    </div>
    <div class="form-group">
      <label class="form-label">⭐ Звезда Emojisi</label>
      <input type="text" id="sb-эмодзи" class="form-input" value="⭐" maxlength="2">
    </div>
    <button class="btn-save" onclick="saveStarboard()">💾 Сохранить</button>
    <div id="sb-status" style="margin-top:10px;font-size:13px;text-align:center;"></div>
  </div>

  <div class="sb-box">
    <div class="box-title">🌟 En Çok Звездаlananlar</div>
    <div id="star-list"><p style="color:#5a5040;text-align:center;padding:30px;">Сервер выбратьin...</p></div>
  </div>
</div>

<script>
var selectedGuild = '1421244140359909513';

async function loadGuilds() {
  // Sabit сервер ID
  var gid = '1421244140359909513';
  if (typeof selectedGuild !== 'undefiкакоеd') selectedGuild = gid;
  if (document.getElementById('guild-select')) document.getElementById('guild-select').value = gid;
  if (document.getElementById('guild-sel')) document.getElementById('guild-sel').value = gid;
  if (document.getElementById('guildSelect')) document.getElementById('guildSelect').value = gid;
  if (typeof loadData === 'function') { loadData(gid); return; }
  if (typeof loadAll === 'function') { loadAll(gid); return; }
  if (typeof loadРольes === 'function') { loadРольes(gid); return; }
  if (typeof loadChanкакоеls === 'function') { loadChanкакоеls(gid); return; }
  if (typeof loadMembers === 'function') { loadMembers(gid); return; }
  if (typeof loadHistory === 'function') { loadHistory(gid); return; }
  if (typeof loadLogs === 'function') { loadLogs(gid); return; }
  if (typeof loadVoiceStats === 'function') { loadVoiceStats(gid); return; }
  if (typeof loadSettings === 'function') { loadSettings(gid); return; }
  if (typeof loadРозыгрышs === 'function') { loadРозыгрышs(gid); return; }
  if (typeof loadPolls === 'function') { loadPolls(gid); return; }
  if (typeof loadEconomy === 'function') { loadEconomy(gid); return; }
  if (typeof loadSuggestions === 'function') { loadSuggestions(gid); return; }
  if (typeof loadInvites === 'function') { loadInvites(gid); return; }
  if (typeof loadHealth === 'function') { loadHealth(gid); return; }
  if (typeof loadAnalytics === 'function') { loadAnalytics(gid); return; }

}

async function loadStarboard() {
  selectedGuild = document.getElementById('guild-select').value;
  if (!selectedGuild) return;
  var [settings, entries, chRes] = await Promise.all([
    fetch('/api/guild/'+selectedGuild+'/starboard/settings').then(r=>r.json()),
    fetch('/api/guild/'+selectedGuild+'/starboard').then(r=>r.json()),
    fetch('/api/guild/'+selectedGuild+'/chanкакоеls').then(r=>r.json())
  ]);
  var chanкакоеls = Array.isArray(chRes) ? chRes : (chRes.chanкакоеls || []);
  document.getElementById('sb-chanкакоеl').inкакоеrHTML = chanкакоеls.filter(c=>c.type==='text').map(c=>'<option value="'+c.id+'"'+(settings.chanкакоеl_id==c.id?' selected':'')+'">#'+c.name+'</option>').join('');
  document.getElementById('sb-enabled').checked = settings.enabled || false;
  document.getElementById('sb-threshold').value = settings.min_stars || settings.threshold || 3;
  document.getElementById('sb-эмодзи').value = settings.эмодзи || '⭐';

  var box = document.getElementById('star-list');
  if (!entries || !entries.length) { box.inкакоеrHTML='<div class="empty-state"><div style="font-size:50px;margin-bottom:12px;">⭐</div><p>Пока звездаlanan сообщение нет.</p></div>'; return; }
  box.inкакоеrHTML = entries.slice(0,10).map(function(e, i) {
    return '<div class="star-card" style="animation-delay:'+(i*0.06)+'s">'+
      '<div class="star-count">⭐ '+e.count+' звезда</div>'+
      '<div class="star-content">'+(e.content||'*[Ek/Встраивание]*')+'</div>'+
      '<div class="star-meta"><span>👤 '+(e.author||'?')+'</span><span>#'+(e.chanкакоеl||'?')+'</span>'+
      (e.jump_url ? '<a class="star-ссылки" href="'+e.jump_url+'" target="_blank">🔗 Сообщениеa git</a>' : '')+
      '</div></div>';
  }).join('');
}

async function saveStarboard() {
  if (!selectedGuild) { alert('Сервер выбрать!'); return; }
  var btn = document.querySelector('.btn-save');
  btn.textContent = '⏳ Kaydediliyor...'; btn.disabled = true;
  var r = await fetch('/api/guild/'+selectedGuild+'/starboard/settings', {
    method:'POST', headers:{'Content-Type':'application/json'},
    body: JSON.stringify({
      enabled: document.getElementById('sb-enabled').checked,
      chanкакоеl_id: document.getElementById('sb-chanкакоеl').value,
      min_stars: parseInt(document.getElementById('sb-threshold').value),
      эмодзи: document.getElementById('sb-эмодзи').value
    })
  });
  var d = await r.json();
  btn.textContent = '💾 Сохранить'; btn.disabled = false;
  document.getElementById('sb-status').inкакоеrHTML = d.success ? '<span style="color:#5ec47a;">✅ Сохранено!</span>' : '<span style="color:#e05555;">❌ Ошибка!</span>';
  setМут(()=>document.getElementById('sb-status').inкакоеrHTML='', 3000);
}

loadGuilds();
</script>
{% endblock %}
