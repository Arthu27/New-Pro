{% extends "base.html" %}
{% block title %}Starboard - Aether{% endblock %}
{% block page_title %}<i class="fas fa-star" style="color:var(--ac);"></i> ⭐ STARBOARD{% endblock %}
{% block content %}


<div class="sb-hero">
  <div style="font-size:60px;margin-bottom:10px;">⭐</div>
  <div class="hero-title">⭐ Starboard</div>
  <div class="hero-sub">Самые звёздные сообщения поднимаются наверх</div>
</div>

<div class="controls-bar">
  <select  id="guild-select" class="guild-sel" onchange="loadStarboard()">
    <option value="">🏠 Выберите сервер...</option>
  </select>
</div>

<div class="grid2">
  <div class="sb-box">
    <div class="box-title">⚙️ Настройки</div>
    <div class="toggle-row">
      <span class="toggle-label">Starboard activity</span>
      <label class="toggle"><input type="checkbox" id="sb-enabled"><span class="toggle-slider"></span></label>
    </div>
    <div class="form-group">
      <label class="form-label">📺 Канал Starboard</label>
      <select id="sb-channel" class="form-input"></select>
    </div>
    <div class="form-group">
      <label class="form-label">⭐ Минимальное число звёзд</label>
      <input type="number" id="sb-threshold" class="form-input" value="3" min="1">
    </div>
    <div class="form-group">
      <label class="form-label">⭐ Звёзд Emojisi</label>
      <input type="text" id="sb-emoji" class="form-input" value="⭐" maxlength="2">
    </div>
    <button class="btn-save" onclick="saveStarboard()">💾 Сохранить</button>
    <div id="sb-status" style="margin-top:10px;font-size:13px;text-align:center;"></div>
  </div>

  <div class="sb-box">
    <div class="box-title">🌟 Самые звёздные</div>
    <div id="star-list"><p style="color:var(--text-3);text-align:center;padding:30px;">Выберите сервер...</p></div>
  </div>
</div>

<script>
var selectedGuild = '{{ main_guild_id }}';

async function loadGuilds() {
  // Sabit сервер ID
  var gid = '{{ main_guild_id }}';
  if (typeof selectedGuild !== 'undefined') selectedGuild = gid;
  if (document.getElementById('guild-select')) document.getElementById('guild-select').value = gid;
  if (document.getElementById('guild-sel')) document.getElementById('guild-sel').value = gid;
  if (document.getElementById('guildSelect')) document.getElementById('guildSelect').value = gid;
  if (typeof loadData === 'function') { loadData(gid); return; }
  if (typeof loadAll === 'function') { loadAll(gid); return; }
  if (typeof loadRoles === 'function') { loadRoles(gid); return; }
  if (typeof loadChannels === 'function') { loadChannels(gid); return; }
  if (typeof loadMembers === 'function') { loadMembers(gid); return; }
  if (typeof loadHistory === 'function') { loadHistory(gid); return; }
  if (typeof loadLogs === 'function') { loadLogs(gid); return; }
  if (typeof loadVoiceStats === 'function') { loadVoiceStats(gid); return; }
  if (typeof loadSettings === 'function') { loadSettings(gid); return; }
  if (typeof loadGiveaways === 'function') { loadGiveaways(gid); return; }
  if (typeof loadPolls === 'function') { loadPolls(gid); return; }
  if (typeof loadEconomy === 'function') { loadEconomy(gid); return; }
  if (typeof loadSuggestions === 'function') { loadSuggestions(gid); return; }
  if (typeof loadInvites === 'function') { loadInvites(gid); return; }
  if (typeof loadHealth === 'function') { loadHealth(gid); return; }
  if (typeof loadAnalytics === 'function') { loadAnalytics(gid); return; }

}

async function loadStarboard() {
  selectedGuild = document.getElementById('guild-select').value;
  if (!selectedGuild) return;
  var [settings, entries, chRes] = await Promise.all([
    fetch('/api/guild/'+selectedGuild+'/starboard/settings').then(r=>r.json()),
    fetch('/api/guild/'+selectedGuild+'/starboard').then(r=>r.json()),
    fetch('/api/guild/'+selectedGuild+'/channels').then(r=>r.json())
  ]);
  var channels = Array.isArray(chRes) ? chRes : (chRes.channels || []);
  document.getElementById('sb-channel').innerHTML = channels.filter(c=>c.type==='text').map(c=>'<option value="'+c.id+'"'+(settings.channel_id==c.id?' selected':'')+'">#'+c.name+'</option>').join('');
  document.getElementById('sb-enabled').checked = settings.enabled || false;
  document.getElementById('sb-threshold').value = settings.min_stars || settings.threshold || 3;
  document.getElementById('sb-emoji').value = settings.emoji || '⭐';

  var box = document.getElementById('star-list');
  if (!entries || !entries.length) { box.innerHTML='<div class="empty-state"><div style="font-size:50px;margin-bottom:12px;">⭐</div><p>Пока zvezdalanan сообщение yok.</p></div>'; return; }
  box.innerHTML = entries.slice(0,10).map(function(e, i) {
    return '<div class="star-card" style="animation-delay:'+(i*0.06)+'s">'+
      '<div class="star-count">⭐ '+e.count+' zvezda</div>'+
      '<div class="star-content">'+(e.content||'*[Ek/Эмбед]*')+'</div>'+
      '<div class="star-meta"><span>👤 '+(e.author||'?')+'</span><span>#'+(e.channel||'?')+'</span>'+
      (e.jump_url ? '<a class="star-link" href="'+e.jump_url+'" target="_blank">🔗 Сообщению git</a>' : '')+
      '</div></div>';
  }).join('');
}

async function saveStarboard() {
  if (!selectedGuild) { alert('Сервер выбрать!'); return; }
  var btn = document.querySelector('.btn-save');
  btn.textContent = '⏳ Сохран...'; btn.disabled = true;
  var r = await fetch('/api/guild/'+selectedGuild+'/starboard/settings', {
    method:'POST', headers:{'Content-Type':'application/json'},
    body: JSON.stringify({
      enabled: document.getElementById('sb-enabled').checked,
      channel_id: document.getElementById('sb-channel').value,
      min_stars: parseInt(document.getElementById('sb-threshold').value),
      emoji: document.getElementById('sb-emoji').value
    })
  });
  var d = await r.json();
  btn.textContent = '💾 Сохранить'; btn.disabled = false;
  document.getElementById('sb-status').innerHTML = d.success ? '<span style="color:var(--ok);">✅ Сохранено!</span>' : '<span style="color:var(--err);">❌ Ошибка!</span>';
  setTimeout(()=>document.getElementById('sb-status').innerHTML='', 3000);
}

loadGuilds();
</script>
{% endblock %}
