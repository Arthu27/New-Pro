<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Hakumo — шаблоны профилей</title>
  <style>
    :root { color-scheme: dark; }
    body {
      margin: 0; min-height: 100vh; font-family: "Segoe UI", system-ui, sans-serif;
      background: #0b0712 linear-gradient(160deg, #1a0b2e 0%, #0b0712 55%, #12081f 100%);
      color: #f3e9ff; padding: 32px 20px 64px;
    }
    h1 { font-weight: 650; letter-spacing: .02em; margin: 0 0 8px; font-size: 1.6rem; }
    p { opacity: .72; margin: 0 0 28px; max-width: 42rem; line-height: 1.45; }
    .grid { display: grid; gap: 28px; max-width: 1100px; }
    figure {
      margin: 0; background: rgba(255,255,255,.04); border: 1px solid rgba(196,160,255,.22);
      border-radius: 18px; overflow: hidden; backdrop-filter: blur(8px);
    }
    figcaption {
      display: flex; flex-wrap: wrap; gap: 10px 16px; align-items: baseline;
      justify-content: space-between; padding: 14px 16px 16px;
    }
    figcaption strong { font-size: 1.05rem; }
    a {
      color: #d7b6ff; text-decoration: none; font-size: .92rem;
      border-bottom: 1px solid rgba(215,182,255,.35);
    }
    a:hover { color: #fff; border-bottom-color: #fff; }
    img { display: block; width: 100%; height: auto; background: #000; }
  </style>
</head>
<body>
  <h1>Шаблоны профилей</h1>
  <p>Макеты от создателя сервера. Прямые ссылки на PNG — ниже. Лицензию подключаем отдельно.</p>
  <div class="grid">
    <figure>
      <img src="profile-card.png" alt="Карточка профиля">
      <figcaption>
        <strong>Карточка профиля</strong>
        <a href="profile-card.png" target="_blank" rel="noopener">profile-card.png</a>
      </figcaption>
    </figure>
    <figure>
      <img src="most-active.png" alt="Самый активный">
      <figcaption>
        <strong>Самый активный</strong>
        <a href="most-active.png" target="_blank" rel="noopener">most-active.png</a>
      </figcaption>
    </figure>
  </div>
</body>
</html>
