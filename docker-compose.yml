# ============================================================
#   HAKUMO BOT — Docker Compose
# ============================================================
# Запуск:  docker compose up -d
# Логи:    docker compose logs -f
# Останов:  docker compose down
# ============================================================
# Веб-панель снята (docs/PANEL-REMOVED.md) — порт 5001 больше не нужен.
# Поле "version:" специально убрано — в Docker Compose v2 оно объявлено
# устаревшим и каждый раз печатает warning.

services:
  bot:
    build: .
    container_name: hakumo-bot
    restart: unless-stopped
    
    # Переменные окружения из .env файла
    env_file:
      - .env
    environment:
      - DISABLE_TUNNEL=1
      - PYTHONUNBUFFERED=1
      - LOG_LEVEL=INFO
    
    # Томы для данных
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
      - ./backups:/app/backups
      - ./plugins:/app/plugins
      - ./.env:/app/.env:ro
    
    # Ресурсы (лимиты)
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: "1.0"
        reservations:
          memory: 256M
          cpus: "0.25"
    
    # Healthcheck: процесс бота жив (панели /health больше нет)
    healthcheck:
      test: ["CMD", "python", "-c", "import os,signal; os.kill(1, 0)"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 30s
    
    # Логирование
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "5"
