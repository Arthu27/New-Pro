{% extends "base.html" %}
{% block title %}Пользователи{% endblock %}
{% block content %}
<style>
:root{--ac:#9b59b6;--ac2:#6c3483;--gl:rgba(155,89,182,0.4)}
.ph{background:linear-gradient(135deg,#1a0a2e,#2d1b4e);border:1px solid var(--ac);border-radius:12px;padding:20px 28px;margin-bottom:24px;display:flex;align-items:center;gap:16px}
.ph h1{font-family:Orbitron,monospace;font-size:1.5rem;color:#fff;margin:0;text-shadow:0 0 20px var(--ac)}
.ctrl{display:flex;gap:12px;margin-bottom:20px;flex-wrap:wrap}
.gsel{background:#1a0a2e;border:1px solid var(--ac);color:#fff;padding:10px 16px;border-radius:8px;font-family:Orbitron,monospace;font-size:.8rem;min-width:220px}
.sbox{background:#1a0a2e;border:1px solid var(--ac);color:#fff;padding:10px 16px;border-radius:8px;font-family:Orbitron,monospace;font-size:.8rem;flex:1;min-width:180px}
.sbox:focus,.gsel:focus{outline:none;box-shadow:0 0 12px var(--gl)}
.sbar{display:flex;gap:12px;margin-bottom:20px;flex-wrap:wrap}
.chip{background:linear-gradient(135deg,#1a0a2e,#2d1b4e);border:1px solid var(--ac);border-radius:8px;padding:8px 16px;font-family:Orbitron,monospace;font-size:.75rem;color:var(--ac)}
.chip span{color:#fff;font-size:1rem;display:block}
.mgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:12px}
.mcard{background:linear-gradient(135deg,#1a0a2e,#2d1b4e);border:1px solid rgba(155,89,182,.3);border-radius:10px;padding:16px;cursor:pointer;transition:all .3s;text-align:center}
.mcard:hover{border-color:var(--ac);transform:translateY(-3px);box-shadow:0 8px 24px var(--gl)}
.mavt{width:56px;height:56px;border-radius:50%;border:2px solid var(--ac);margin:0 auto 10px;display:block}
.mname{font-family:Orbitron,monospace;font-size:.72rem;color:#fff;margin-bottom:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mtag{font-size:.65rem;color:rgba(155,89,182,.7);margin-bottom:8px}
.mroles{display:flex;flex-wrap:wrap;gap:4px;justify-content:center}
.rbadge{font-size:.58rem;padding:2px 5px;border-radius:4px;border:1px solid;font-family:Orbitron,monospace}
.sdot{width:9px;height:9px;border-radius:50%;display:inline-block;margin-right:3px}
.son{background:#2ecc71;box-shadow:0 0 5px #2ecc71}.sidle{background:#f39c12}.sdnd{background:#e74c3c}.soff{background:#636e72}
.bbadge{background:rgba(52,152,219,.2);border:1px solid #3498db;color:#3498db;font-size:.58rem;padding:1px 5px;border-radius:3px}
.empty{text-align:center;padding:60px 20px;color:rgba(155,89,182,.5);font-family:Orbitron,monospace;font-size:.8rem}
.ld{text-align:center;padding:40px;color:var(--ac);font-family:Orbitron,monospace;animation:pulse 1.5s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}
.mov{display:none;position:fixed;inset:0;background:rgba(0,0,0,.8);z-index:1000;align-items:center;justify-content:center}
.mov.on{display:flex}
.mdl{background:linear-gradient(135deg,#1a0a2e,#2d1b4e);border:1px solid var(--ac);border-radius:16px;padding:28px;width:90%;max-width:500px;max-height:85vh;overflow-y:auto;position:relative;box-shadow:0 0 40px var(--gl)}
.mclose{position:absolute;top:12px;right:16px;background:none;border:none;color:rgba(155,89,182,.6);font-size:1.4rem;cursor:pointer}
.mclose:hover{color:#fff}
.mavtl{width:80px;height:80px;border-radius:50%;border:3px solid var(--ac);display:block;margin:0 auto 12px;box-shadow:0 0 20px var(--gl)}
.mttl{font-family:Orbitron,monospace;font-size:1rem;color:#fff;text-align:center;margin-bottom:4px}
.mid{font-size:.72rem;color:rgba(155,89,182,.6);text-align:center;margin-bottom:16px}
.igrid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:16px}
.iitem{background:rgba(155,89,182,.1);border:1px solid rgba(155,89,182,.2);border-radius:8px;padding:10px}
.ilbl{font-size:.62rem;color:rgba(155,89,182,.6);font-family:Orbitron,monospace;margin-bottom:4px}
.ival{font-size:.78rem;color:#fff}
.rtitle{font-family:Orbitron,monospace;font-size:.72rem;color:var(--ac);margin-bottom:8px}
.rlist{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:16px}
.abts{display:flex;gap:8px;flex-wrap:wrap}
.btn{padding:8px 14px;border-radius:8px;border:none;font-family:Orbitron,monospace;font-size:.68rem;cursor:pointer;transition:all .3s}
.bwarn{background:rgba(243,156,18,.2);border:1px solid #f39c12;color:#f39c12}.bwarn:hover{background:rgba(243,156,18,.4)}
.bkick{background:rgba(231,76,60,.2);border:1px solid #e74c3c;color:#e74c3c}.bkick:hover{background:rgba(231,76,60,.4)}
.bban{background:rgba(192,57,43,.2);border:1px solid #c0392b;color:#c0392b}.bban:hover{background:rgba(192,57,43,.4)}
.bpnl{background:rgba(155,89,182,.2);border:1px solid var(--ac);color:var(--ac)}.bpnl:hover{background:rgba(155,89,182,.4)}
.pform{background:rgba(155,89,182,.05);border:1px solid rgba(155,89,182,.2);border-radius:8px;padding:14px;margin-top:12px;display:none}
.pform.on{display:block}
.finp{width:100%;background:#1a0a2e;border:1px solid rgba(155,89,182,.3);color:#fff;padding:8px 12px;border-radius:6px;font-family:Orbitron,monospace;font-size:.72rem;margin-bottom:8px;box-sizing:border-box}
.finp:focus{outline:none;border-color:var(--ac)}
.fsub{background:linear-gradient(135deg,var(--ac),var(--ac2));color:#fff;border:none;padding:8px 20px;border-radius:6px;font-family:Orbitron,monospace;font-size:.68rem;cursor:pointer;width:100%}
.toast{position:fixed;bottom:24px;right:24px;background:linear-gradient(135deg,#1a0a2e,#2d1b4e);border:1px solid var(--ac);border-radius:10px;padding:12px 20px;color:#fff;font-family:Orbitron,monospace;font-size:.72rem;z-index:9999;transform:translateY(100px);opacity:0;transition:all .4s}
.toast.on{transform:translateY(0);opacity:1}
</style>

<div class="ph">
  <span style="font-size:2rem">&#128101;</span>
  <div>
    <h1>ПОЛЬЗОВАТЕЛИ</h1>
    <div style="font-size:.72rem;color:rgba(155,89,182,.7);font-family:Orbitron,monospace">Сервер uyelerini yonet</div>
  </div>
</div>

<div class="ctrl">
  <select class="gsel" id="guildSelect" onchange="loadMembers()">
    <option value="">Сервер Sec...</option>
  </select>
  <input class="sbox" id="searchBox" type="text" placeholder="Isim или ID ara..." oninput="filterMembers()">
</div>

<div class="sbar" id="statsBar" style="display:none">
  <div class="chip">ВСЕГО<span id="stTotal">0</span></div>
  <div class="chip">BOT<span id="stBots">0</span></div>
  <div class="chip">INSAN<span id="stHumans">0</span></div>
</div>

<div id="membersContainer"><div class="empty">Bir сервер sec</div></div>

<div class="mov" id="modal">
  <div class="mdl">
    <button class="mclose" onclick="closeModal()">&#x2715;</button>
    <img class="mavtl" id="mAvt" src="" alt="">
    <div class="mttl" id="mNm"></div>
    <div class="mid" id="mId"></div>
    <div class="igrid">
      <div class="iitem"><div class="ilbl">СОСТОЯНИЕ</div><div class="ival" id="mSt"></div></div>
      <div class="iitem"><div class="ilbl">KATILMA</div><div class="ival" id="mJn"></div></div>
      <div class="iitem"><div class="ilbl">HESAP</div><div class="ival" id="mCr"></div></div>
      <div class="iitem"><div class="ilbl">EN YUK РОЛЬ</div><div class="ival" id="mTr"></div></div>
    </div>
    <div class="rtitle">ROLES</div>
    <div class="rlist" id="mRoles"></div>
    <div class="abts" id="mActs"></div>
    <div class="pform" id="pForm">
      <div style="font-family:Orbitron,monospace;font-size:.68rem;color:var(--ac);margin-bottom:10px">PANEL HESABI OLUSTUR</div>
      <input class="finp" id="pPwd" type="password" placeholder="Sifre (min 6 karakter)">
      <button class="fsub" onclick="createPanel()">OLUSTUR</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
var allM=[],curM=null,curG=null;

async function loadGuilds(){
  var r=await fetch('/api/guilds'),gs=await r.json(),s=document.getElementById('guildSelect');
  gs.forEach(function(g){var o=document.createElement('option');o.value=g.id;o.textContent=g.name+' ('+g.members+' uye)';s.appendChild(o);});
}

async function loadMembers(){
  var gid=document.getElementById('guildSelect').value;
  if(!gid)return;
  curG=gid;
  document.getElementById('membersContainer').innerHTML='<div class="ld">YUKLENIYOR...</div>';
  document.getElementById('statsBar').style.display='none';
  var r=await fetch('/api/guild/'+gid+'/members');
  allM=await r.json();
  var bots=allM.filter(function(m){return m.bot;}).length;
  document.getElementById('stTotal').textContent=allM.length;
  document.getElementById('stBots').textContent=bots;
  document.getElementById('stHumans').textContent=allM.length-bots;
  document.getElementById('statsBar').style.display='flex';
  renderM(allM);
}

function filterMembers(){
  var q=document.getElementById('searchBox').value.toLowerCase();
  renderM(allM.filter(function(m){return m.display_name.toLowerCase().includes(q)||m.name.toLowerCase().includes(q)||m.id.includes(q);}));
}

function renderM(members){
  var c=document.getElementById('membersContainer');
  if(!members.length){c.innerHTML='<div class="empty">В конецuч не найдено</div>';return;}
  var h='<div class="mgrid">';
  members.forEach(function(m){
    var sc=m.status==='online'?'son':m.status==='idle'?'sidle':m.status==='dnd'?'sdnd':'soff';
    var rh=m.roles.slice(0,3).map(function(r){
      var col=r.color==='#000000'?'#555':r.color;
      return '<span class="rbadge" style="border-color:'+col+';color:'+col+'">'+r.name+'</span>';
    }).join('');
    var mj=JSON.stringify(m).replace(/"/g,'&quot;');
    h+='<div class="mcard" onclick="openM('+mj+')">';
    h+='<img class="mavt" src="'+m.avatar+'" onerror="this.src='https://cdn.discordapp.com/embed/avatars/0.png'">';
    if(m.bot)h+='<div style="margin-bottom:4px"><span class="bbadge">BOT</span></div>';
    h+='<div class="mname">'+m.display_name+'</div>';
    h+='<div class="mtag"><span class="sdot '+sc+'"></span>'+m.name+'</div>';
    h+='<div class="mroles">'+rh+'</div></div>';
  });
  h+='</div>';
  c.innerHTML=h;
}

function openM(m){
  curM=m;
  document.getElementById('mAvt').src=m.avatar;
  document.getElementById('mNm').textContent=m.display_name+(m.bot?' BOT':'');
  document.getElementById('mId').textContent='ID: '+m.id;
  var sm={online:'Online',idle:'Bosta',dnd:'Rahatsiz Etme',offline:'Cevrimdisi'};
  document.getElementById('mSt').textContent=sm[m.status]||'Cevrimdisi';
  document.getElementById('mJn').textContent=m.joined_at?new Date(m.joined_at).toLocaleDateString('tr-TR'):'?';
  document.getElementById('mCr').textContent=new Date(m.created_at).toLocaleDateString('tr-TR');
  document.getElementById('mTr').textContent=m.top_role||'@everyone';
  document.getElementById('mRoles').innerHTML=m.roles.map(function(r){
    var col=r.color==='#000000'?'#555':r.color;
    return '<span class="rbadge" style="border-color:'+col+';color:'+col+'">'+r.name+'</span>';
  }).join('')||'<span style="color:rgba(155,89,182,.4);font-size:.7rem">Роль нет</span>';
  var role='{{ роли }}',acts='';
  if(role==='admin'||role==='owner'){
    acts+='<button class="btn bwarn" onclick="doAct(\'warn\')">UYAR</button>';
    acts+='<button class="btn bkick" onclick="doAct(\'kick\')">AT</button>';
    acts+='<button class="btn bban" onclick="doAct(\'ban\')">BAN</button>';
    if(!m.bot)acts+='<button class="btn bpnl" onclick="togglePF()">PANEL HESABI</button>';
  }
  document.getElementById('mActs').innerHTML=acts;
  document.getElementById('pForm').classList.remove('on');
  document.getElementById('pPwd').value='';
  document.getElementById('modal').classList.add('on');
}

function closeModal(){document.getElementById('modal').classList.remove('on');}
function togglePF(){document.getElementById('pForm').classList.toggle('on');}

async function doAct(action){
  if(!curM||!curG)return;
  var reason=prompt('Причина:')||'Web panel';
  var r=await fetch('/api/command/'+action,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({guild_id:curG,user_id:curM.id,reason:reason})});
  var d=await r.json();
  showToast(d.success?'ОК: '+(d.message||'Basarili'):'ОШИБКА: '+(d.error||'?'));
  if(d.success&&action!=='warn')closeModal();
}

async function createPanel(){
  var pwd=document.getElementById('pPwd').value.trim();
  if(!pwd||pwd.length<6){showToast('Sifre en az 6 karakter');return;}
  var r=await fetch('/api/add-member',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({discord_id:curM.id,password:pwd,display_name:curM.display_name,name:curM.name,avatar:curM.avatar})});
  var d=await r.json();
  showToast(d.success?'Panel hesabi olusturuldu':'ОШИБКА: '+(d.error||'?'));
  if(d.success)document.getElementById('pForm').classList.remove('on');
}

function showToast(msg){
  var t=document.getElementById('toast');
  t.textContent=msg;t.classList.add('on');
  setTimeout(function(){t.classList.remove('on');},3000);
}

document.getElementById('modal').addEventListener('click',function(e){if(e.target===this)closeModal();});
loadGuilds();
</script>
{% endblock %}
